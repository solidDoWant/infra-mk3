---
# Builds "container images/project-zomboid" with its Makefile, and with
# push=true pushes it to Harbor (infra-mk3/project-zomboid). The image holds a
# full Steam install of the game, so it only ever goes to the private Harbor.
# Run by project-zomboid-pull-request.yaml and project-zomboid-push.yaml.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: project-zomboid
spec:
  params:
    - name: repo_url
      type: string
    - name: revision
      type: string
    - name: push
      description: "true to push the image, anything else to only build it."
      type: string
      default: "false"
    - name: registry
      description: Registry and Harbor project the image goes to.
      type: string
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: ci-tekton
      params:
        - name: url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
    - name: build
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: docker
          - name: namespace
            value: ci-tekton
      params:
        - name: script
          value: |
            # The Makefile decides the image name and tag; the CLI image has
            # no make.
            apk add --no-cache make >/dev/null
            cd "container images/project-zomboid"
            if [ "$(params.push)" = true ]; then
              make push CONTAINER_REGISTRY="$(params.registry)"
            else
              make image CONTAINER_REGISTRY="$(params.registry)"
            fi
            echo "image: $(make print-image-name CONTAINER_REGISTRY="$(params.registry)")"
      workspaces:
        - name: source
          workspace: source
