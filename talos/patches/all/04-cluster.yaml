---
# No $schema: it requires KubeAPIServerConfig `image` (set by Talos) and rejects `$patch: delete`.
# Talos API SANs. Keep in sync with KubeAPIServerConfig below.
machine:
  certSANs:
    - 10.3.254.1 # Talos VIP address
    - 10.34.254.1 # Cilium service external IP
    # TODO add kube-vip address
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 10.3.254.1 # Talos VIP address
  - 10.34.254.1 # Cilium service external IP
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.32.0.0/16
serviceSubnets:
  - 10.33.0.0/16
---
# Cilium is the CNI, deployed separately.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
