---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.13/schemas/config.schema.json
machine:
  certSANs: &sans
    - 10.3.254.1 # Talos VIP address
    - 10.34.254.1 # Cilium service external IP
    # TODO add kube-vip address
cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    certSANs: *sans
  network:
    # Don't deploy a CNI by default
    cni:
      name: none
    podSubnets:
      - 10.32.0.0/16
    serviceSubnets:
      - 10.33.0.0/16
