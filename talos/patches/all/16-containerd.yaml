---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
# Configure containerd
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: images-and-cdi
content: |-
  [plugins]
    # Spegel setup
    [plugins.'io.containerd.cri.v1.images']
      discard_unpacked_layers = false
    # Enable the Container Device Interface
    # Talos defaults to ["/run/cdi"]: https://github.com/siderolabs/talos/blob/v1.14.2/hack/cri-plugin.part
    # See https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/images-container-runtime/containerd
    [plugins."io.containerd.cri.v1.runtime"]
      enable_cdi = true
      # Separate static/dynamic dirs are required by the Intel GPU DRA plugin.
      cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
