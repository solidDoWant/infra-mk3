---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
# Configure DNS resolution. Merges with the ResolverConfig in 02-network.
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  # This is broken with Cilium, see
  # * https://github.com/cilium/cilium/issues/35153
  # * https://github.com/siderolabs/talos/pull/9200
  forwardKubeDNSToHost: false
  resolveMemberNames: true
