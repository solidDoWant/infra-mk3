---
# containerd's base spec for kata containers. CRI normally builds each
# container's spec from containerd's defaults and removes their rlimits; with a
# base spec it starts from this file instead and keeps the rlimits in it. This
# is those defaults (`ctr oci spec` from containerd 2.3.7), matching the base
# spec Talos gives runc (/etc/cri/conf.d/base-spec.json), with one change: the
# rlimits.
#
# RLIMIT_NPROC (processes and threads per user, for users other than root) is
# copied from the guest kernel's boot-time threads-max/2, before the sysctls in
# kernel_params apply, so it stays at 864 however large the VM is. 65536
# matches threads-max above. The default's RLIMIT_NOFILE 1024 is left out on
# purpose: without it containers keep the guest's 1048576, as they did before
# this file existed.
#
# ⚠ On a containerd update, regenerate with `ctr oci spec` from the new version
# and reapply the rlimits change.
apiVersion: v1alpha1
kind: EtcFileConfig
name: kata-containers/base-runtime-spec.json
mode: 0o644
contents: |
    {
      "ociVersion": "1.3.0",
      "process": {
        "user": {
          "uid": 0,
          "gid": 0
        },
        "cwd": "/",
        "capabilities": {
          "bounding": [
            "CAP_CHOWN",
            "CAP_DAC_OVERRIDE",
            "CAP_FSETID",
            "CAP_FOWNER",
            "CAP_MKNOD",
            "CAP_NET_RAW",
            "CAP_SETGID",
            "CAP_SETUID",
            "CAP_SETFCAP",
            "CAP_SETPCAP",
            "CAP_NET_BIND_SERVICE",
            "CAP_SYS_CHROOT",
            "CAP_KILL",
            "CAP_AUDIT_WRITE"
          ],
          "effective": [
            "CAP_CHOWN",
            "CAP_DAC_OVERRIDE",
            "CAP_FSETID",
            "CAP_FOWNER",
            "CAP_MKNOD",
            "CAP_NET_RAW",
            "CAP_SETGID",
            "CAP_SETUID",
            "CAP_SETFCAP",
            "CAP_SETPCAP",
            "CAP_NET_BIND_SERVICE",
            "CAP_SYS_CHROOT",
            "CAP_KILL",
            "CAP_AUDIT_WRITE"
          ],
          "permitted": [
            "CAP_CHOWN",
            "CAP_DAC_OVERRIDE",
            "CAP_FSETID",
            "CAP_FOWNER",
            "CAP_MKNOD",
            "CAP_NET_RAW",
            "CAP_SETGID",
            "CAP_SETUID",
            "CAP_SETFCAP",
            "CAP_SETPCAP",
            "CAP_NET_BIND_SERVICE",
            "CAP_SYS_CHROOT",
            "CAP_KILL",
            "CAP_AUDIT_WRITE"
          ]
        },
        "rlimits": [
          {
            "type": "RLIMIT_NPROC",
            "hard": 65536,
            "soft": 65536
          }
        ],
        "noNewPrivileges": true
      },
      "root": {
        "path": "rootfs"
      },
      "mounts": [
        {
          "destination": "/proc",
          "type": "proc",
          "source": "proc",
          "options": [
            "nosuid",
            "noexec",
            "nodev"
          ]
        },
        {
          "destination": "/dev",
          "type": "tmpfs",
          "source": "tmpfs",
          "options": [
            "nosuid",
            "strictatime",
            "mode=755",
            "size=65536k"
          ]
        },
        {
          "destination": "/dev/pts",
          "type": "devpts",
          "source": "devpts",
          "options": [
            "nosuid",
            "noexec",
            "newinstance",
            "ptmxmode=0666",
            "mode=0620",
            "gid=5"
          ]
        },
        {
          "destination": "/dev/shm",
          "type": "tmpfs",
          "source": "shm",
          "options": [
            "nosuid",
            "noexec",
            "nodev",
            "mode=1777",
            "size=65536k"
          ]
        },
        {
          "destination": "/dev/mqueue",
          "type": "mqueue",
          "source": "mqueue",
          "options": [
            "nosuid",
            "noexec",
            "nodev"
          ]
        },
        {
          "destination": "/sys",
          "type": "sysfs",
          "source": "sysfs",
          "options": [
            "nosuid",
            "noexec",
            "nodev",
            "ro"
          ]
        },
        {
          "destination": "/run",
          "type": "tmpfs",
          "source": "tmpfs",
          "options": [
            "nosuid",
            "strictatime",
            "mode=755",
            "size=65536k"
          ]
        }
      ],
      "linux": {
        "resources": {
          "devices": [
            {
              "allow": false,
              "access": "rwm"
            }
          ]
        },
        "cgroupsPath": "/k8s.io",
        "namespaces": [
          {
            "type": "pid"
          },
          {
            "type": "ipc"
          },
          {
            "type": "uts"
          },
          {
            "type": "mount"
          },
          {
            "type": "network"
          }
        ],
        "maskedPaths": [
          "/proc/acpi",
          "/proc/asound",
          "/proc/interrupts",
          "/proc/kcore",
          "/proc/keys",
          "/proc/latency_stats",
          "/proc/timer_list",
          "/proc/timer_stats",
          "/proc/sched_debug",
          "/sys/firmware",
          "/sys/devices/virtual/powercap",
          "/proc/scsi"
        ],
        "readonlyPaths": [
          "/proc/bus",
          "/proc/fs",
          "/proc/irq",
          "/proc/sys",
          "/proc/sysrq-trigger"
        ]
      }
    }
---
# Points containerd's kata runtime at the config and base spec above instead of
# the extension's config and containerd's defaults. Talos restarts CRI when this changes; running kata VMs keep their
# shims and config, and new ones pick up the change.
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: 20-kata-config
content: |-
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata]
    base_runtime_spec = "/etc/kata-containers/base-runtime-spec.json"
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata.options]
    ConfigPath = "/etc/kata-containers/configuration.toml"
  # kata-nested: the same runtime with configuration-nested.toml (the guest
  # kernel with KVM). The extension defines only kata and kata-qemu, so this
  # one lists everything itself.
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata-nested]
    runtime_type = "io.containerd.kata.v2"
    privileged_without_host_devices = true
    pod_annotations = ["io.katacontainers.*"]
    base_runtime_spec = "/etc/kata-containers/base-runtime-spec.json"
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata-nested.options]
    ConfigPath = "/etc/kata-containers/configuration-nested.toml"
