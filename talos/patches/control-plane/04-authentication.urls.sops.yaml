# kube-apiserver authentication, replacing Talos's default
# KubeAuthenticationConfig (deleted in 03-authentication-default.yaml), so its
# anonymous health-check access is repeated here.
#
# Only the issuer URL is SOPS-encrypted (the .urls.sops.yaml rule in
# .sops.yaml), to keep the domain out of the repo; topf decrypts it.
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  # authentik's Kubernetes API provider
  # (cluster/gitops/security/authentik/configuration/kubernetes-api). Its
  # tokens come from toolgate's `kubernetes` token exchange, so MCP servers
  # act as the calling user. Identities are prefixed with "authentik:" so they
  # can't collide with built-in users and groups (system:*). Being
  # authenticated grants nothing on its own: RBAC binds the groups.
  #
  # The API server fetches the discovery document and keys through the
  # internal gateway (public Let's Encrypt certificate, so no CA is set). If
  # authentik is down, only these tokens stop working.
  jwt:
    - issuer:
        url: ENC[AES256_GCM,data:a3Mc4McrYi7SljB9gFjX3HFuWGuWoarfPsFX2IOKtTS1Qsa1FO/IU4Mk7gbN5DkjuSbA4bbYTwlpnlG2vWY=,iv:c6GcNzIcE9CIht7l4FUba30aCk82T73Z6d5D2+eVPw0=,tag:TpE7P6iVb7WI917A9YTP6A==,type:str]
        audiences:
          - kubernetes-api
      claimMappings:
        username:
          claim: preferred_username
          prefix: 'authentik:'
        groups:
          claim: groups
          prefix: 'authentik:'
sops:
  age:
    - enc: |
