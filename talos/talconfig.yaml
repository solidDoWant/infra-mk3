---
clusterName: infra-mk3
endpoint: https://10.34.254.1:6443
# -----------------------------------------------------------------------------
# All three nodes are identical Minisforum MS-A2 boxes (AMD Ryzen 9 9955HX), so
# node 01 below carries every shared anchor and nodes 02/03 reference them. The
# only genuinely per-node values are the hostname, the IP, the bond addresses,
# the chassis label and the `ip=` kernel arg.
#
# ⚠ The boot drive is NOT safe, and re-installing a node is destructive beyond
# the OS. EPHEMERAL lives on the install disk and holds /var/lib/rook -- the
# CephCluster's `dataDirHostPath`, including that node's mon store -- plus
# /var/lib/etcd. Recover a node by applying config to the running system over
# the network, not by booting the ISO: `-talos.halt_if_installed` is negated
# below, so the ISO runs the installer and wipes EPHEMERAL. `talosctl
# apply-config` never reinstalls, and `talosctl upgrade` preserves EPHEMERAL
# (Talos dropped `--preserve`; wiping now requires an explicit `talosctl reset`).
#
# ⚠ The slot holding the Samsung U.2 must be pinned to PCIe Gen3. At Gen4 the
# link threw ~17 correctable RxErr/sec while completely idle (with BadTLP 0 --
# pure signal-integrity marginality, no data loss) and flushed the kernel ring
# buffer. Gen3 took it to a clean 0, including under sustained Ceph backfill.
# This lives in BIOS only and is NOT in git, so a BIOS reset or reflash silently
# loses it.
# -----------------------------------------------------------------------------
nodes:
  - &talos-k8s-mixed
    hostname: talos-k8s-mixed-01
    ipAddress: 10.3.1.1
    installDiskSelector:
      # Selects the Inland QN322 boot drive, which reports its model as the
      # gloriously unhelpful "PCIe SSD". Unambiguous anyway: the only other two
      # drives in every one of these chassis are a KINGSTON SKC3000D2048G (ZFS
      # local-storage pool) and a SAMSUNG MZQL21T9HCJR (Ceph OSD).
      #
      # This deliberately does NOT match on `busPath`. A busPath looks stable
      # but only its root-port component is -- the segment after it is a
      # secondary bus number the firmware assigns while enumerating, and it
      # shifts whenever anything earlier in the walk consumes an extra bus (BIOS
      # revision, a hotplug port reserving a range for an empty slot, a bridge
      # behind an adapter). These boxes do not even agree with each other: the
      # boot drive has been seen at both `0000:0c:00.0` and `0000:0d:00.0`
      # behind the same root port, in identical chassis, with the drive in the
      # same physical slot.
      #
      # For reference, all three NVMe drives hang off separate root ports:
      #   0000:00:01.2  SAMSUNG MZQL21T9HCJR     (Ceph OSD, on an M.2->U.2 adapter)
      #   0000:00:01.3  "PCIe SSD"               (boot)
      #   0000:00:01.4  KINGSTON SKC3000D2048G   (ZFS local-storage pool)
      # The root ports are identical on every node; only the bus numbers behind
      # them differ, which is exactly what this selector does not depend on.
      #
      # Failure mode if this ever stops matching is safe -- the installer
      # errors out rather than picking a different drive -- but "safe" still
      # means a reinstall that dies partway, so keep it matching.
      model: PCIe SSD
    controlPlane: true
    machineSpec:
      secureboot: true
    # Previously, this used separate VLANs for Talos traffic and for
    # Kubernetes traffic. This worked well for traffic within the same subnet,
    # but caused problems with traffic from other subnets. Requests would come
    # in via the Kubernetes VLAN, and responses would be sent out via the
    # management VLAN. Normally this _could_ work, with the right firewall
    # rules, however the major issue was ICMP responses for fragmented packets.
    # With path MTU discovery enabled, ICMP responses would get sent back via
    # the wrong VLAN, and never make their way back to the correct interface.
    # This was likely in part due to how Cilium handles network traffic via
    # eBPF programs attached to specific interfaces.
    nameservers:
      - 10.3.0.254
    networkInterfaces:
      # If these names ever shift, the rename-proof alternative is a hardware
      # selector rather than a name:
      #
      #   - interface: bond0
      #     bond:
      #       deviceSelectors:
      #         - driver: i40e
      #           physical: true
      #       mode: 802.3ad
      #       ...
      #
      # It is deliberately NOT used yet: switching to it rewrites bond0 on every
      # node at once, and a network blip on two control plane nodes
      # simultaneously costs etcd quorum. Worth doing as its own change, one
      # node at a time, while all three are healthy.
      #
      # Copper RJ45 ports (Realtek RTL8125 + Intel I226-V), cabled to the
      # management VLAN. `ignore` keeps Talos from DHCPing on them, which would
      # install a competing default route.
      - &1g_1
        interface: enp3s0
        ignore: true
      - &1g_2
        interface: enp4s0
        ignore: true
      # SFP+ cages (Intel X710) -> the LACP bond
      - &10g_1
        interface: &10g_1_name enp5s0f0np0
        mtu: &jumbo_mtu 9000
      - &10g_2
        interface: &10g_2_name enp5s0f1np1
        mtu: *jumbo_mtu
      - &bond_0
        interface: bond0
        bond:
          interfaces:
            - *10g_1_name
            - *10g_2_name
          mode: 802.3ad
          lacpRate: fast
          xmitHashPolicy: layer3+4
          miimon: 100
        mtu: *jumbo_mtu
        addresses:
          - 10.3.1.1/16
          - 10.3.2.1/32
        # Non-LB VIP address managed by Talos instead of Cilium. Leaving this for now
        # in case swapping to Cilium-backed service doesn't work.
        vip:
          ip: 10.3.254.1
        routes:
          - network: 0.0.0.0/0
            gateway: 10.3.0.254
      # Creates a link-scoped route for the loopback interface, fixing Istio compatibility
      # with Cilium eBPF masquerading. This works by sending link-local traffic through
      # iptables, instead of eBPF, which is bugged. Not setting a gateway makes these routes
      # link-scoped.
      # For details, see https://github.com/istio/istio/issues/52208#issuecomment-2488755452
      # This attempts to solve the same issue with talos host DNS caching with the same
      # approach.
      - &loopback
        interface: lo
        routes:
          - network: 169.254.7.127/32
          - network: 169.254.116.108/32
    nodeLabels: &node_labels
      cilium.home.arpa/node.bgp-enabled: "true"
      root-ceph.flux.home.arpa/node.cluster-enabled: "true"
      katacontainers.io/kata-runtime: "true"
      # Topology labels should contain the label name in the value to ensure
      # that the value itself is unique
      topology.rook.io/chassis: chassis-talos-k8s-mixed-01
      zfs.home.arpa/node.local-storage-enabled: "true"
      cni-plugins.home.arpa/node.general-purpose-plugins-enabled: "true"
    nodeAnnotations:
      zfs.home.arpa/node.pool-drive-matcher: "/dev/disk/by-id/nvme-KINGSTON_SKC3000D2048G_*"
      talos.home.arpa/installer-image: >-
        {{
          .MachineConfig.MachineInstall.InstallImage |
          splitList ":" |
          first
        }}
    schematic:
      customization: &schematic_customization
        systemExtensions:
          officialExtensions:
            # amd-ucode does not change the running microcode revision: the
            # BIOS-loaded one is newer and the kernel will not downgrade. That
            # is expected, not a failed upgrade.
            - siderolabs/amd-ucode
            # Driver/firmware for the Ryzen's integrated Radeon graphics. The
            # base Talos kernel ships no amdgpu module at all (there is no
            # drivers/gpu/drm/amd directory), so without this the iGPU sits on
            # the PCI bus with nothing bound to it.
            - siderolabs/amdgpu
            # Firmware/driver extension for the discrete Intel Arc Pro card.
            # Without it that card does not come up and the node contributes
            # zero gpu.intel.com devices -- three cluster-wide, one per node.
            - siderolabs/i915
            # For virtualization/isolation
            - siderolabs/kata-containers
            # Local storage
            - siderolabs/zfs
        # TODO set the following args on the installer only (not ISO):
        # - amd_iommu=on
        # - iommu=pt
        extraKernelArgs:
          # Make ZFS flush to disk more frequently on async writes:
          # https://vadosware.io/post/everything-ive-seen-on-optimizing-postgres-on-zfs-on-linux/#controversial-zfs_txg_timeout1--synchronous_commitoff--logbiasthroughput
          - zfs.zfs_txg_timeout=1
          # Disable ipv6 via command line parameter
          # This one actually works
          - ipv6.disable=1
          # Log forwarding to the node agent
          - talos.logging.kernel=tcp://127.0.0.1:5171/
    imageSchematic:
      customization:
        <<: *schematic_customization
        extraKernelArgs:
          # A kernel command line cannot reference the anchors above, so these
          # names have to be kept in sync with `networkInterfaces` by hand.
          #
          # These args exist only so the node reaches maintenance mode on a
          # predictable static IP before it has a config; the bond that survives
          # the install is the one in the machine config. If the ISO ever comes
          # up with no network, drop both args and let it DHCP on enp3s0/enp4s0.
          - &bond bond=bond0:enp5s0f0np0,enp5s0f1np1:mode=802.3ad,xmit_hash_policy=layer3+4:9000
          - ip=10.3.1.1::10.3.0.254:255.255.0.0:talos-k8s-mixed-01:bond0:off:10.3.0.254::10.3.0.254
          - &halt_if_installed -talos.halt_if_installed # Negate this option to allow the installer to run. Needed for recovery
    kernelModules:
      - name: zfs
  - <<: *talos-k8s-mixed
    hostname: talos-k8s-mixed-02
    ipAddress: 10.3.1.2
    nodeLabels:
      <<: *node_labels
      topology.rook.io/chassis: chassis-talos-k8s-mixed-02
    networkInterfaces:
      - *1g_1
      - *1g_2
      - *10g_1
      - *10g_2
      - <<: *bond_0
        addresses:
          - 10.3.1.2/16
          - 10.3.2.2/32
      - *loopback
    imageSchematic:
      customization:
        <<: *schematic_customization
        extraKernelArgs:
          - *bond
          - ip=10.3.1.2::10.3.0.254:255.255.0.0:talos-k8s-mixed-02:bond0:off:10.3.0.254::10.3.0.254
          - *halt_if_installed
  - <<: *talos-k8s-mixed
    hostname: talos-k8s-mixed-03
    ipAddress: 10.3.1.3
    nodeLabels:
      <<: *node_labels
      topology.rook.io/chassis: chassis-talos-k8s-mixed-03
    networkInterfaces:
      - *1g_1
      - *1g_2
      - *10g_1
      - *10g_2
      - <<: *bond_0
        addresses:
          - 10.3.1.3/16
          - 10.3.2.3/32
      - *loopback
    imageSchematic:
      customization:
        <<: *schematic_customization
        extraKernelArgs:
          - *bond
          - ip=10.3.1.3::10.3.0.254:255.255.0.0:talos-k8s-mixed-03:bond0:off:10.3.0.254::10.3.0.254
          - *halt_if_installed
talosVersion: v1.13.2
kubernetesVersion: v1.36.1
allowSchedulingOnMasters: true
allowSchedulingOnControlPlanes: true
additionalApiServerCertSans: &sans
  - 10.3.254.1 # Talos VIP address
  - 10.34.254.1 # Cilium service external IP
# TODO add kube-vip address
additionalMachineCertSans: *sans
# Don't deploy a CNI by default
cniConfig:
  name: none
clusterPodNets:
  - 10.32.0.0/16
clusterSvcNets:
  - 10.33.0.0/16
patches:
  # Use NTP server running on the gateway
  - |-
    machine:
      time:
        servers:
          - 10.3.0.254
  # Root FS disk encryption
  # TODO: implement disk encryption. Use a HA KMS server implementation
  # for the first key, hosted in the cluster. If that isn't available
  # (such as the case when all nodes are offline), require a HSM to decrypt
  # the first disk.
  # - |-
  #   machine:
  #     systemDiskEncryption:
  #       state:
  #         provider: luks2
  #         keys:
  #           - slot: 0
  #             tpm:
  #               checkSecurebootStatusOnEnroll: true
  #           - slot: 1
  #             static:
  #               passphrase: ${luks_password}
  # Enable Talos API access from k8s pods
  # Needed for OS upgrades
  - |-
    machine:
      features:
        kubernetesTalosAPIAccess:
          enabled: true # Enable Talos API access from Kubernetes pods.
          allowedRoles:
            - os:reader
            - os:admin
          allowedKubernetesNamespaces:
            - system-controllers
  # Disable KubePrism which relies on the discovery service that Sidero forces through their SaaS
  - |-
    machine:
      features:
        kubePrism:
          enabled: false
  # Configure DNS resolution
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          # This is broken with Cilium, see 
          # * https://github.com/cilium/cilium/issues/35153
          # * https://github.com/siderolabs/talos/pull/9200
          forwardKubeDNSToHost: false
          resolveMemberNames: true
  # Configure kubelet
  - |-
    machine:
      kubelet:
        extraConfig:
          # Equivalent of `rotate-server-certificates` arg, but config instead
          serverTLSBootstrap: true
          imageMaximumGCAge: 168h # One week
          imageGCHighThresholdPercent: 50
          imageGCLowThresholdPercent: 20
          maxPods: 256
          serializeImagePulls: false
          allowedUnsafeSysctls:
            # These are needed for the VPN router pods
            # This is scoped wider than I'd like but it's needed until
            # https://github.com/kubernetes/kubernetes/issues/134003 is addressed
            - net.ipv4.conf.*
            - net.ipv4.fib_multipath_hash_seed
            - net.ipv4.fib_multipath_hash_policy
            - net.ipv4.vs.*
            # I'm not using these yet, but they might be useful in future
            # - net.ipv4.fib_multipath_hash_fields
            # - net.ipv4.ip_forward
          # Allow pinning CPUs for workloads when QoS is Guaranteed
          cpuManagerPolicy: static
        extraArgs:
          # Feature enablement
          feature-gates: DRAAdminAccess=true,ImageVolume=true,EnvFiles=true
        nodeIP:
          validSubnets:
            - 10.3.1.0/16
  # Set user namespace sysctls
  # See https://www.talos.dev/v1.9/kubernetes-guides/configuration/usernamespace/#enabling-usernamespaces
  - |-
    machine:
      sysctls:
        user.max_user_namespaces: "11255"
  # Configure containerd
  - |-
    machine:
      files:
        - op: create
          path: /etc/cri/conf.d/20-customization.part
          permissions: 0o644
          content: |
            [plugins]
              # Spegel setup
              [plugins.'io.containerd.cri.v1.images']
                discard_unpacked_layers = false
              # Enable the Container Device Interface
              # Important: this matches https://www.talos.dev/v1.10/talos-guides/configuration/containerd/#set-cdi-plugin-spec-dirs-to-writable-directories,
              # which differs https://github.com/cncf-tags/container-device-interface/blob/fc17f514320237420424663de905720e11b1668b/README.md#containerd-configuration
              [plugins."io.containerd.cri.v1.runtime"]
                enable_cdi = true
                # CDI is now enabled by default on Talos 1.13+, but these directories still need to be separate for the Intel GPU DRA plugin to work
                cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
  # Configure containerd metrics
  # Disabled for now, this destroyed my cluster somehow last time it was enabled
  # - |-
  #   machine:
  #     files:
  #       - op: create
  #         path: /etc/cri/conf.d/30-metrics.part
  #         permissions: 0o644
  #         content: |
  #           [metrics]
  #             address = '0.0.0.0:11234'
  # Configure etcd
  # TODO limit this to processes on the each. Will probably require a custom extension, see
  # https://github.com/siderolabs/talos/blob/3e16ab135e2be8c9b652d67f9e7eadbc3691c5ca/internal/app/machined/pkg/controllers/network/nftables_chain_config.go#L162
  # Or maybe just a new address resource + nftableschain resource
  - |-
    cluster:
      etcd:
        advertisedSubnets:
          - 10.3.1.0/16
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381
  # Configure the controller manager
  - |-
    cluster:
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
          # Feature enablement
          feature-gates: kube:DRAAdminAccess=true,kube:DRAPartitionableDevices=true
  # Configure the scheduler
  - |-
    cluster:
      scheduler:
        extraArgs:
         bind-address: 0.0.0.0
  # Configuration for Cilium
  - |-
    cluster:
      # Use Cilium's kube-proxy replacement
      proxy:
        disabled: true
  # Disable Talos-installed coredns, and instead install it manually
  - |-
    cluster:
      coreDNS:
        disabled: true
  # Disable discovery service completely
  # Sidero rug pulled in-cluster discovery, see https://github.com/siderolabs/talos/issues/9980
  - |-
    cluster:
      discovery:
        enabled: false
  # API server configuration
  - |-
    cluster:
      apiServer:
        extraArgs:
          # Load balance requests to metrics-server and other API server
          # services/extensions by sending traffic to each endpoint instead of the
          # service cluster IP
          enable-aggregator-routing: "true"
          # Feature enablement
          feature-gates: kube:DRAAdminAccess=true,kube:DRAPartitionableDevices=true,kube:ImageVolume=true,kube:MutatingAdmissionPolicy=true,kube:EnvFiles=true
          # Resource enablement
          # Enable everything but alpha and legacy features
          runtime-config: "api/all=true,api/legacy=false"
  # Scheduler configuration
  - |-
    cluster:
      scheduler:
        # Enable cluster-level topology spread constraints for supported controllers.
        #
        # `defaultingType: List` means these constraints are applied by the
        # scheduler to every pod that does NOT declare its own
        # topologySpreadConstraints -- 234 of 363 running pods at the time of
        # writing. That makes this block, not the per-workload TSCs, the widest
        # -reaching spread policy in the cluster.
        #
        # `nodeTaintsPolicy: Honor` is load-bearing and must not be dropped.
        #
        # It defaults to `Ignore`, which counts EVERY node as a topology domain
        # when computing skew -- including nodes the pod could never be placed on.
        # An unreachable node therefore contributes a domain holding 0 pods, which
        # drags `min` to zero and inflates the skew of every candidate placement:
        #
        #   3 nodes, one unreachable, a 2-replica workload already spread 1+1
        #     Ignore : domains {01:1, 02:0, 03:1}, surge -> {01:2, 02:0, 03:1}
        #              skew = 2 - 0 = 2 > maxSkew 1  -> REJECTED
        #     Honor  : node 02 excluded (untolerated NoSchedule taint)
        #              domains {01:1, 03:1}, surge -> {01:2, 03:1}
        #              skew = 2 - 1 = 1 <= maxSkew 1 -> admitted
        #
        # With the default `Ignore` this was the primary cause of the failed
        # failover during the talos-k8s-mixed-02 outage (2026-07-31): pods sat
        # Pending reporting "didn't match pod topology spread constraints" rather
        # than any resource message, on surviving nodes that were largely idle. It
        # also deadlocks rolling updates while a node is down, because the surge
        # pod has nowhere to land.
        #
        # DoNotSchedule is deliberate and correct once taints are honored: the
        # intent is a hard guarantee that replicas occupy separate nodes whenever
        # 2+ nodes are actually available. Honor makes "available" mean what it
        # says. When only one node remains, a second replica on it buys nothing,
        # so refusing to place it is the desired outcome rather than a bug.
        config:
          profiles:
            - schedulerName: default-scheduler
              pluginConfig:
                - name: PodTopologySpread
                  args:
                    defaultConstraints:
                      - maxSkew: 1 # Skew of 1 allows for rolling updates
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: DoNotSchedule
                        # See the note above -- without this, an unreachable node
                        # still counts as an empty domain and vetoes placements.
                        nodeTaintsPolicy: Honor
                    defaultingType: List
        extraArgs:
          # Feature enablement
          feature-gates: kube:DRAAdminAccess=true,kube:DRAPartitionableDevices=true
  # Ship logs to each node's agent
  - |-
    machine:
      logging:
        destinations:
          - endpoint: tcp://127.0.0.1:5170
            format: json_lines
