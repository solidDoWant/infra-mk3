---
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  force: false

repositories:
  - name: cilium
    url: quay.io/cilium/charts
    oci: true
  - name: coredns
    url: ghcr.io/coredns/charts
    oci: true
  - name: postfinance
    url: ghcr.io/postfinance/charts
    oci: true
  - name: spegel
    url: ghcr.io/spegel-org/helm-charts
    oci: true
  - name: controlplaneio-fluxcd
    url: ghcr.io/controlplaneio-fluxcd/charts
    oci: true

# These will all eventually be "adopted" by Flux once it is deployed.
releases:
  - name: cilium
    atomic: true
    # Cilium is in it's own namespace because it has security-critical secrets, and because the namespace must be privileged
    namespace: cilium
    createNamespace: false # Handled by hook
    chart: cilium/cilium
    version: 1.20.2
    values:
      - ../gitops/cilium/cilium/app/helm-bootstrap-values.yaml
    # Until https://github.com/helm/helm/issues/3503#issuecomment-696712443 is addressed this will be required
    # Unfortunately Helm maintainers are taking their typical approach of "ignore community, we know best"
    # Approach pulled from https://stackoverflow.com/a/72586030
    hooks:
      # Create the namespace and label it as privileged
      - events:
          - presync
        showlogs: true
        command: sh
        args:
          - -c
          - &ns_cmd >-
            kubectl create --dry-run=client -o yaml namespace $0 | kubectl apply -f -;
            kubectl label --dry-run=client -o yaml --overwrite namespace $0 pod-security.kubernetes.io/enforce=privileged | kubectl apply -f -
          - cilium

  - name: coredns-kube-dns
    atomic: true
    namespace: networking
    chart: coredns/coredns
    version: 1.48.2
    values:
      - ../gitops/networking/coredns/kube-dns/helm-bootstrap-values.yaml
    needs:
      - cilium/cilium

  # Pod logs, exec, and other debugging tools will not work until this is deployed
  - name: kubelet-csr-approver
    atomic: true
    namespace: system-controllers
    chart: postfinance/kubelet-csr-approver
    version: 1.2.15
    values:
      - ../gitops/system-controllers/kubelet-csr-approver/app/helm-bootstrap-values.yaml
    needs:
      - cilium/cilium
      - networking/coredns-kube-dns

  # This is deployed prior to Flux so that image registry load is reduced on initial install
  # Otherwise it is likely that dockerhub and ghcr limits will be quickly hit
  - name: spegel
    atomic: true
    namespace: system-controllers
    createNamespace: false # Handled by hook
    chart: spegel/spegel
    version: 0.8.0
    values:
      - ../gitops/system-controllers/spegel/app/helm-bootstrap-values.yaml
    hooks:
      # Create the namespace and label it as privileged
      - events:
          - presync
        showlogs: true
        command: sh
        args:
          - -c
          - *ns_cmd
          - spegel
    needs:
      - cilium/cilium
      - networking/coredns-kube-dns

  # Flux "adopts" these and itself via the flux Kustomization.
  - name: flux-operator
    atomic: true
    namespace: flux-system
    createNamespace: false # Handled by hook
    chart: controlplaneio-fluxcd/flux-operator
    version: 0.61.0
    values:
      - ../gitops/flux-system/flux/app/operator/helm-bootstrap-values.yaml
    hooks:
      # The cluster has a default deny policy, so the netpol must exist first
      - events:
          - presync
        showlogs: true
        command: sh
        args:
          - -c
          - >-
            kubectl create --dry-run=client -o yaml namespace flux-system | kubectl apply -f - &&
            kubectl apply -n flux-system -f ../gitops/flux-system/flux/app/netpol.yaml
    needs:
      - cilium/cilium
      - networking/coredns-kube-dns

  - name: flux-instance
    # Readiness is waited on by the flux:install-flux task instead
    wait: false
    namespace: flux-system
    chart: controlplaneio-fluxcd/flux-instance
    version: 0.61.0
    values:
      - ../gitops/flux-system/flux/app/instance/helm-bootstrap-values.yaml
    # Same as the HelmRelease postRenderer
    jsonPatches:
      - target:
          group: fluxcd.controlplane.io
          version: v1
          kind: FluxInstance
          name: flux
        patch:
          - op: remove
            path: /spec/distribution/artifact
    needs:
      - flux-system/flux-operator
