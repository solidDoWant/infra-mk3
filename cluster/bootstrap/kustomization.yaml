---
# This is for flux. Unfortunately, kustomize naming requirements won't allow for 'flux' in the file name.
#
# Flux is installed via remote manifests instead of Helm charts. While there is a community-managed Helm
# chart repo for flux, it is frequently out of date and/or has bugs that don't get patched frequently.
#
# Flux will later "adopt" this file via the root flux-system Kustomization, allowing flux to manage
# itself.
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/fluxcd/flux2//manifests/install/?timeout=120&ref=b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
  - ./netpol.yaml
# Tags must match the ones the manifests above ship.
images:
  - name: ghcr.io/fluxcd/helm-controller
    newTag: v1.6.5@sha256:0d52fff5c4d476277b8fcb6beb9041e269adb5db943fe69f5a806ea0c92b1511
  - name: ghcr.io/fluxcd/kustomize-controller
    newTag: v1.9.6@sha256:2ebeaa341da77d52b6abbbba5efcee0450d47f8b42f0e6f33b08f9020262d606
  - name: ghcr.io/fluxcd/notification-controller
    newTag: v1.9.4@sha256:840f318265ee26f0d2c48a158bf7896b22aa4e998e320a18646309f0e40b15da
  - name: ghcr.io/fluxcd/source-controller
    newTag: v1.9.6@sha256:6a6693172589f8ff26123a231d5fa6ceb194a6efb4dc647cdf057c959f76a2e3
patches:
  # Don't deploy the image automation controller, or the image reflector controller.
  # Updates will be handled by Renovate.
  - &delete_patch
    patch: |-
      $patch: delete
      apiVersion: placeholder-value-does-not-matter
      kind: placeholder-value-does-not-matter
      metadata:
        name: placeholder-value-does-not-matter
    target:
      labelSelector: app.kubernetes.io/component=image-automation-controller
  - <<: *delete_patch
    target:
      labelSelector: app.kubernetes.io/component=image-reflector-controller
  # Don't deploy the source-watcher controller (added by upstream in v2.7). Nothing in this
  # cluster uses the ArtifactGenerator/ExternalArtifact APIs it provides. Pulling the raw
  # manifests/install kustomization includes it by default, so it must be deleted explicitly.
  - <<: *delete_patch
    target:
      labelSelector: app.kubernetes.io/component=source-watcher
  # Flux performance tuning patches, see https://fluxcd.io/flux/installation/configuration/vertical-scaling/
  # Allow more jobs to run in parallel
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=24
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=5s
    target: &performance_controllers_target
      kind: Deployment
      name: "(kustomize-controller|helm-controller|source-controller)"
  # Increase resource limits
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 1Gi
                  requests:
                    memory: 1Gi
                    cpu: 100m
    target: *performance_controllers_target
  # Remove CPU resource limit
  - patch: |
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
    target: *performance_controllers_target
  # Run kustomize builds in-memory
  - patch: |
      - op: add
        path: /spec/template/spec/volumes/0/emptyDir
        value:
          medium: Memory
    target:
      kind: Deployment
      name: kustomize-controller
  # Cache Helm repo data
  # Probably not needed - TODO evaluate
  # - patch: |
  #     - op: add
  #       path: /spec/template/spec/containers/0/args/-
  #       value: --helm-cache-max-size=10
  #     - op: add
  #       path: /spec/template/spec/containers/0/args/-
  #       value: --helm-cache-ttl=60m
  #     - op: add
  #       path: /spec/template/spec/containers/0/args/-
  #       value: --helm-cache-purge-interval=5m
  #   target:
  #     kind: Deployment
  #     name: source-controller
  # Gracefully shut down when about to hit memory limit
  - patch: |
      # Enable OOM watch feature
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=OOMWatch=true
      # Threshold at which to trigger a graceful shutdown (optional, default 95%)
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --oom-watch-memory-threshold=95
      # Interval at which to check memory usage (optional, default 500ms)
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --oom-watch-interval=500ms
    target:
      kind: Deployment
      name: helm-controller
  # Allow the notification controller to received external webhook calls
  - patch: |
      - op: add
        path: /spec/template/metadata/labels/endpoints.netpols.home.arpa~1external-ingress-enabled
        value: "true"
    target:
      kind: Deployment
      name: notification-controller
