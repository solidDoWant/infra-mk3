---
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: victoria-logs-1
spec:
  # Needed until https://github.com/VictoriaMetrics/operator/pull/1305 merges and releases
  image:
    tag: v1.17.0-victorialogs
  priorityClassName: system-cluster-critical
  # Deliberately left at one pod per instance. VLSingle caps a single CR at one
  # replica, and VictoriaLogs' own cluster mode (VLCluster) shards rather than
  # replicates -- upstream is explicit that real HA is only achieved by sending
  # copies of the logs to *independent* instances. That is what the two CRs here
  # plus the fluentd `copy` fan-out provide, so this is the recommended shape and
  # not a limitation to design around.
  retentionPeriod: 1w
  podMetadata:
    labels:
      app.kubernetes.io/part-of: victoria-logs
  topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: victoria-logs
          app.kubernetes.io/name: vlsingle
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 30Gi # TODO I have no idea how big this should be
    # TODO this needs tuning and benchmarking.
    storageClassName: victoria-logs
    volumeMode: Filesystem
