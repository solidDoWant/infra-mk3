---
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: victoria-logs-1
spec:
  # Needed until https://github.com/VictoriaMetrics/operator/pull/1305 merges and releases
  image:
    repository: quay.io/victoriametrics/victoria-logs
    tag: v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
  priorityClassName: system-cluster-critical
  # Peak RSS ~470Mi over 60d (2026-11-05); the working set reaches ~1.2Gi only
  # from page cache. Memory request == limit. No CPU limit -- see
  # VM_VLSINGLEDEFAULT_USEDEFAULTRESOURCES in the k8s-stack operator env.
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      memory: 1Gi
  # Deliberately left at one pod per instance. VLSingle caps a single CR at one
  # replica, and VictoriaLogs' own cluster mode (VLCluster) shards rather than
  # replicates -- upstream is explicit that real HA is only achieved by sending
  # copies of the logs to *independent* instances. That is what the two CRs here
  # plus the fluentd `copy` fan-out provide, so this is the recommended shape and
  # not a limitation to design around.
  retentionPeriod: 1w
  # Drop the oldest per-day partitions before the 30Gi volume fills (80%; the
  # rest is headroom for merges). VL always keeps the last 2 days regardless.
  retentionMaxDiskSpaceUsageBytes: 24GiB
  podMetadata:
    labels:
      app.kubernetes.io/part-of: victoria-logs
  topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: victoria-logs
          app.kubernetes.io/name: vlsingle
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 30Gi # TODO I have no idea how big this should be
    # TODO this needs tuning and benchmarking.
    storageClassName: victoria-logs
    volumeMode: Filesystem
---
