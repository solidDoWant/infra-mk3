---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs
specs:
  - description: vlsingle
    endpointSelector: &vlsingle_selector
      matchLabels:
        app.kubernetes.io/part-of: victoria-logs
        app.kubernetes.io/name: vlsingle
    # egress:
    ingress:
      # Kubelet for healthcheck, and the apiserver service proxy for ad-hoc queries
      # (an apiserver on another node shows up as kube-apiserver, not host)
      - fromEntities:
          - host
          - kube-apiserver
        toPorts:
          - ports:
              - port: "9428"
                protocol: TCP
      - fromEndpoints:
          # Metrics
          - matchLabels:
              endpoints.netpols.home.arpa/metrics-scraper: "true"
          # Ingress from vmauth
          - &vmauth_selector
            matchLabels:
              app.kubernetes.io/part-of: victoria-logs
              app.kubernetes.io/name: vmauth
          # Ingress from fluentd aggregator
          # The aggregator should connect to each instance for data
          # durability and availability.
          - matchLabels:
              app.kubernetes.io/name: fluentd-aggregator
              app.kubernetes.io/component: fluentd
              app.kubernetes.io/instance: fluentd
        toPorts:
          - ports:
              - port: "9428"
                protocol: TCP
  - description: vmauth
    endpointSelector: *vmauth_selector
    egress:
      # DNS resolution
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      # To vlsingle
      - toEndpoints:
          - *vlsingle_selector
        toPorts:
          - ports:
              - port: "9428"
                protocol: TCP
      # SSO: OIDC discovery, JWKS and token exchange via the
      # openid-configuration-proxy (the canonical in-cluster OIDC origin).
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: security
              app.kubernetes.io/name: openid-configuration-proxy
              app.kubernetes.io/instance: openid-configuration-proxy
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
    ingress:
      # Kubelet for healthcheck, and the apiserver service proxy for ad-hoc queries
      - fromEntities:
          - host
          - kube-apiserver
        toPorts:
          - ports:
              - port: "9428"
                protocol: TCP
      - fromEndpoints:
          # Metrics
          - matchLabels:
              endpoints.netpols.home.arpa/metrics-scraper: "true"
          # Ingress from the internal gateway
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              app.kubernetes.io/name: ingress-gateways
              gateway.networking.k8s.io/gateway-name: internal-gateway
          # In-cluster queriers (Grafana, toolgate MCP, tape-archiver web).
          # Each still needs its own credential (vmauth-config.yaml).
          - matchExpressions:
              - key: io.kubernetes.pod.namespace
                operator: Exists
              - key: endpoints.netpols.home.arpa/logs-querier
                operator: In
                values:
                  - "true"
        toPorts:
          - ports:
              - port: "9428"
                protocol: TCP
