---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: victoria-logs
spec:
  port: "9428"
  # Pinned: without spec.license the operator would default to the community
  # image at its own default version.
  image:
    repository: quay.io/victoriametrics/vmauth
    tag: v1.156.0-enterprise@sha256:3642e74646d082b916e5ab5929a63f669032ff7da7e7aef42f36788861d93902
  extraArgs:
    # Accept the VictoriaMetrics Enterprise ESA (https://victoriametrics.com/legal/esa/).
    eula: "true"
    # Picks up changes to the mounted config Secret (see externalConfig).
    configCheckInterval: 1m
  podDisruptionBudget:
    minAvailable: 1
  priorityClassName: system-cluster-critical
  replicaCount: 2
  revisionHistoryLimitCount: 1
  podMetadata:
    labels:
      app.kubernetes.io/part-of: victoria-logs
      endpoints.netpols.home.arpa/logs-supplier: "true"
      # OIDC discovery, JWKS and token exchange via the
      # openid-configuration-proxy.
      endpoints.netpols.home.arpa/oidc-querier: "true"
  useStrictSecurity: true
  # Hand-written config (vmauth-config.yaml): the CRD can't express vmauth's
  # `sso` section. The operator mounts this Secret directly and runs no
  # config-reloader, so vmauth re-reads the file itself.
  externalConfig:
    secretRef:
      name: victoria-logs-vmauth-config
      key: config.yaml
  # The openid-configuration-proxy serves a cluster-CA-issued cert. Mounted as
  # one extra file in the system trust dir (Go reads every cert under
  # /etc/ssl/certs), so the image's public-CA bundle stays intact.
  volumes:
    - name: root-ca
      secret:
        secretName: root-ca-pub-cert
        defaultMode: 0444
        items:
          - key: ca.pem
            path: root-ca.pem
  volumeMounts:
    - name: root-ca
      mountPath: /etc/ssl/certs/root-ca.pem
      subPath: root-ca.pem
      readOnly: true
