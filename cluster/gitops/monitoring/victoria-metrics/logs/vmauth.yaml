---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: victoria-logs
spec:
  port: "9428"
  # Pinned: without spec.license the operator would default to the community
  # image at its own default version.
  image:
    repository: quay.io/victoriametrics/vmauth
    tag: v1.156.0-enterprise@sha256:3642e74646d082b916e5ab5929a63f669032ff7da7e7aef42f36788861d93902
  extraArgs:
    # Accept the VictoriaMetrics Enterprise ESA (https://victoriametrics.com/legal/esa/).
    eula: "true"
  podDisruptionBudget:
    minAvailable: 1
  priorityClassName: system-cluster-critical
  replicaCount: 2
  revisionHistoryLimitCount: 1
  podMetadata:
    labels:
      app.kubernetes.io/part-of: victoria-logs
      endpoints.netpols.home.arpa/logs-supplier: "true"
  useStrictSecurity: true
  # TODO figure out auth and ideally multitenancy
  unauthorizedUserAccessSpec:
    url_map:
      # Scoped queries, for queriers whose own users may only read some logs
      # (toolgate's victorialogs-ci MCP server, which agents use). A request
      # with this header only reads the CI project namespaces (ci-<project>,
      # not ci-tekton): VictoriaLogs ANDs extra_stream_filters into the query
      # and into every subquery in it (join, union, in()), so no query can
      # widen it. The first matching entry wins, so this one comes first.
      - src_paths:
          - ".*"
        src_headers:
          - "X-Log-Scope: ci"
        # extra_stream_filters={kubernetes.namespace.name=~"ci-.+",kubernetes.namespace.name!="ci-tekton"}
        url_prefix: "http://srv+victoria-logs.monitoring.svc.cluster.local:9428/?extra_stream_filters=%7Bkubernetes.namespace.name%3D~%22ci-.%2B%22%2Ckubernetes.namespace.name%21%3D%22ci-tekton%22%7D"
        discover_backend_ips: true
      - src_paths:
          - ".*"
        # Fully qualified on purpose: a literal url_prefix is passed through verbatim, so
        # VM_CLUSTERDOMAINNAME (set on the operator) does not reach it. Bare `.svc` cannot
        # resolve absolutely and only works via search-path fallback, costing NXDOMAINs.
        url_prefix: "http://srv+victoria-logs.monitoring.svc.cluster.local:9428"
        discover_backend_ips: true
