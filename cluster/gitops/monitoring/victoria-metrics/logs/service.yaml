---
# Aggregates both independent VLSingle instances behind one name so vmauth can
# fan queries across them. They are separate CRs on purpose -- see vmlogs.yaml.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  selector:
    app.kubernetes.io/part-of: victoria-logs
    app.kubernetes.io/name: vlsingle
  ports:
    - port: 9428
