---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
spec:
  hostnames:
    - vm-logs.${SECRET_PUBLIC_DOMAIN_NAME}
  parentRefs:
    - name: internal-gateway
      namespace: networking
  rules:
    - backendRefs:
        - name: vmauth-victoria-logs
          port: 9428
      matches:
        - path:
            type: PathPrefix
            value: /select/vmui
        - path:
            type: PathPrefix
            value: /select/logsql
        # vmauth's SSO login flow (login start and OIDC callback)
        - path:
            type: PathPrefix
            value: /_vmauth/sso
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
            path:
              type: ReplaceFullPath
              replaceFullPath: /select/vmui/?
