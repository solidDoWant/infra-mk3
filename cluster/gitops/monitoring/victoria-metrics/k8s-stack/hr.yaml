---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: victoria-metrics-charts
      version: 0.95.2
  values:
    global:
      cluster:
        dnsDomain: cluster.local
      license:
        keyRef:
          name: victoria-metrics-license-key
          key: licenseKey
    victoria-metrics-operator:
      fullnameOverride: victoria-metrics-operator
      crds:
        enabled: false
        plain: false
        # Pre-delete hook that runs `kubectl delete` on every VM CR kind in the
        # namespace (VMCluster included) when the release is uninstalled.
        cleanup:
          enabled: false
      operator:
        # Delete the VM version of prom resources if the prom resources are deleted
        enable_converter_ownership: true
      # Disable the operator's per-field default resource injection for VMAlert so we can
      # omit the CPU limit
      env:
        - name: VM_VMALERTDEFAULT_USEDEFAULTRESOURCES
          value: "false"
        # Same reason, for vmselect and vmagent: the operator fills in any resource
        # field left unset, so simply deleting `limits.cpu` from the values below
        # would be a silent no-op -- it would be re-injected as 500m (vmselect) /
        # 200m (vmagent), tighter than the limits being removed.
        #
        # These are the PER-COMPONENT variants deliberately. The cluster-wide
        # VM_VMCLUSTERDEFAULT_USEDEFAULTRESOURCES would also strip defaults from
        # vminsert and vmstorage. requestsLoadBalancer (vmclusterlb) takes the
        # VM_VMAUTHDEFAULT_* defaults instead.
        - name: VM_VMCLUSTERDEFAULT_VMSELECTDEFAULT_USEDEFAULTRESOURCES
          value: "false"
        - name: VM_VMAGENTDEFAULT_USEDEFAULTRESOURCES
          value: "false"
        # Without this the operator generates in-cluster addresses as the bare
        # `<svc>.<ns>.svc` (e.g. the `srv+vmselectinternal-...monitoring.svc` backends in
        # the vmclusterlb config), which cannot resolve absolutely -- the zone is
        # cluster.local, so `<svc>.<ns>.svc` is a dead end. It only ever resolves via the
        # LAST search path, where `.svc` + `cluster.local` happens to reconstruct the real
        # FQDN, after burning an NXDOMAIN on each earlier suffix. ndots cannot fix that; it
        # only reorders the attempts (at ndots:1 the futile absolute try goes first, adding
        # one more NXDOMAIN). The truncation is deliberate upstream -- it lets the search
        # list supply whatever cluster domain you run, per VictoriaMetrics/operator#354 --
        # so the domain has to be declared here to get fully-qualified names.
        #
        # Must match the cluster's actual DNS domain: the operator appends this blindly, so
        # a wrong value breaks every generated address rather than merely slowing it.
        - name: VM_CLUSTERDOMAINNAME
          value: cluster.local
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      admissionWebhooks:
        # The chart defaults to Ignore so that installs don't race the webhook
        # server. Fail keeps invalid CRs from being admitted.
        policy: Fail
        certManager:
          enabled: true
          issuer:
            name: monitoring-intermediary-ca
            kind: Issuer
            group: cert-manager.io
          cert:
            # cert-manager ca injector will handle updating the webhook
            # Kyverno will reload the actual deployment
            duration: 4h
            commonName: VictoriaMetrics operator
            subject:
              countries:
                - US
              provinces:
                - ${SECRET_STATE}
              organizations:
                - infra-mk3
            secretTemplate:
              labels:
                kyverno.home.arpa/reload: "true"
    # The sync job downloads the rules and dashboards from unpinned upstream
    # branches and applies them imperatively. ../sync-job/tool runs it offline
    # against these values and vendors the output instead. Rerun it after
    # changing defaultRules or defaultDashboards.
    syncJob:
      enabled: false
    defaultRules:
      rules:
        # Disabled - the upstream rule's `histogram_quantile(0.01, ...)` design
        # is incompatible with intentional short-lived cert rotation. Talos's
        # NodeApply controller mints 10-minute admin certs (hardcoded in
        # NewTemporaryClientFromPKI, see siderolabs/talos pkg/kubernetes/kubernetes.go),
        # which permanently keep the 1st percentile of cert lifetimes below
        # the 7d/24h thresholds. KubeletClient/ServerCertificateExpiration
        # cover the genuine "cert about to expire and not get renewed" case
        # via per-cert TTL gauges and remain enabled.
        KubeClientCertificateExpiration:
          create: false
        # Replaced by EtcdDatabaseHighFragmentation in etcd-alerts.yaml, which
        # also requires the DB to use >50% of its quota.
        etcdDatabaseHighFragmentationRatio:
          create: false
    defaultDashboards:
      dashboards:
        # Same UIDs as ../../grafana/kps-dashboards. Duplicates make
        # grafana-operator overwrite one with the other.
        apiserver: &disabled
          enabled: false
        cluster-total: *disabled
        k8s-resources-cluster: *disabled
        k8s-resources-namespace: *disabled
        k8s-resources-node: *disabled
        k8s-resources-nodes-overview: *disabled
        k8s-resources-pod: *disabled
        k8s-resources-workload: *disabled
        k8s-resources-workloads-namespace: *disabled
        namespace-by-pod: *disabled
        namespace-by-workload: *disabled
        persistentvolumesusage: *disabled
        pod-total: *disabled
        workload-total: *disabled
        # Windows/AIX/Darwin/multicluster/Prometheus, and USE-method dashboards
        # covered by node-exporter-full
        k8s-resources-multicluster: *disabled
        k8s-resources-windows-cluster: *disabled
        k8s-resources-windows-namespace: *disabled
        k8s-resources-windows-pod: *disabled
        k8s-windows-cluster-rsrc-use: *disabled
        k8s-windows-node-rsrc-use: *disabled
        nodes-aix: *disabled
        nodes-darwin: *disabled
        prometheus: *disabled
        prometheus-remote-write: *disabled
        node-cluster-rsrc-use: *disabled
        node-rsrc-use: *disabled
        nodes: *disabled
      grafanaOperator: &grafana_operator
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: null
              grafana.home.arpa/instance: grafana
    external:
      grafana:
        # This is passed to alert rules for links to the Grafana dashboard
        host: grafana.${SECRET_PUBLIC_DOMAIN_NAME}
    vmsingle:
      enabled: false
    vmcluster:
      enabled: true
      spec:
        # This can be large because downsampling is reducing the amount of data stored.
        # If this cluster actually lasts for more than a few years and I'm running out of space,
        # I'll either change the downsampling period or add more storage (which will be cheaper).
        retentionPeriod: 10y
        replicationFactor: &replication_factor 2
        # Non-root user, limited disk write access, drop capabilities, etc.
        useStrictSecurity: true
        # This is an application-aware load balancer which should better
        # determine the best backend to send traffic to than Cilium
        requestsLoadBalancer:
          enabled: true
          spec:
            hostAliases:
              - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
                hostnames:
                  - license.victoriametrics.com
            podMetadata:
              labels:
                endpoints.netpols.home.arpa/time-series-supplier: "true"
            podDisruptionBudget:
              minAvailable: 1
            replicaCount: 2
            useStrictSecurity: true
            # If these components fail then there will be no notification that something is going wrong
            priorityClassName: system-cluster-critical
            volumes:
              - name: victoria-metrics-license-service-serving-cert
                secret:
                  secretName: victoria-metrics-license-service-serving-cert
                  defaultMode: 0440
                  items:
                    - key: ca.crt
                      path: ca.crt
            volumeMounts:
              - name: victoria-metrics-license-service-serving-cert
                mountPath: /etc/ssl/certs/ca.crt
                subPath: ca.crt
        vmselect:
          revisionHistoryLimitCount: 1
          resources:
            # Right-sized 2026-08-01 from 14d of metrics: p95 CPU 378m / peak
            # working set 526Mi (was 1 core / 8Gi).
            # Memory request == limit deliberately: memory is incompressible, so
            # a request below the limit lets the node be scheduled to 100% of
            # requests while pods grow into their limits, and the kernel OOM
            # killer's victim is not necessarily the pod that overcommitted.
            # 3Gi is ~6x the observed peak. Note memory.allowedPercent below is
            # computed against the cgroup limit, so vmselect will size its caches
            # to 90% of 3Gi rather than 90% of 8Gi -- 14d shows the cache never
            # came close to filling even the old limit, so this is headroom, not
            # a regression. CPU keeps request < limit: CPU is compressible, so
            # over-committing it costs throttling rather than an OOM kill.
            requests:
              memory: &vmselect_memory 3Gi
              cpu: 500m
            limits:
              # No CPU limit: CPU is compressible, so the request already sets a
              # fair-share baseline and a limit only adds throttling. Requires the
              # VM_VMCLUSTERDEFAULT_VMSELECTDEFAULT_USEDEFAULTRESOURCES=false above,
              # or the operator re-injects one.
              memory: *vmselect_memory
          extraArgs:
            # Metrics from the last few weeks show a very low average memory usage (~5%). Increasing this
            # from the default of 60% should not increase the cache eviction rate, while allowing for
            # heavier queries.
            memory.allowedPercent: "90"
          hostAliases:
            - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
              hostnames:
                - license.victoriametrics.com
          podDisruptionBudget:
            minAvailable: 1
          replicaCount: 2
          useStrictSecurity: true
          # If these components fail then there will be no notification that something is going wrong
          priorityClassName: system-cluster-critical
          # TODO this will take som tuning and requires historic metrics to get right
          # Probably isn't needed at all given that two replicas min will be running
          # hpa:
          #   minReplicas: 2
          #   maxReplicas: 5
          # Cache storage. Not critical. Docs suggest a small (single-digit GB) amount.
          # Because it's small and needs to be fast, I'm putting it on a memory-backed
          # temporary volume.
          storage:
            emptyDir:
              # Important for resource sizing: the limit is counted gainst the pod's
              # memory limit.
              medium: Memory
              sizeLimit: 2Gi
          volumes:
            - name: victoria-metrics-license-service-serving-cert
              secret:
                secretName: victoria-metrics-license-service-serving-cert
                defaultMode: 0440
                items:
                  - key: ca.crt
                    path: ca.crt
          volumeMounts:
            - name: victoria-metrics-license-service-serving-cert
              mountPath: /etc/ssl/certs/ca.crt
              subPath: ca.crt
        vminsert:
          revisionHistoryLimitCount: 1
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1500m
          hostAliases:
            - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
              hostnames:
                - license.victoriametrics.com
          podDisruptionBudget:
            minAvailable: 1
          replicaCount: 2
          useStrictSecurity: true
          # If these components fail then there will be no notification that something is going wrong
          priorityClassName: system-cluster-critical
          volumes:
            - name: victoria-metrics-license-service-serving-cert
              secret:
                secretName: victoria-metrics-license-service-serving-cert
                defaultMode: 0440
                items:
                  - key: ca.crt
                    path: ca.crt
          volumeMounts:
            - name: victoria-metrics-license-service-serving-cert
              mountPath: /etc/ssl/certs/ca.crt
              subPath: ca.crt
          # This is outrageously high but I'd like to get the data in first so that I can
          # more easily tell which labels I can drop
          extraArgs:
            maxLabelsPerTimeseries: "150"
        vmstorage:
          revisionHistoryLimitCount: 1
          resources:
            requests:
              memory: 4Gi
              cpu: 1000m
            limits:
              memory: 4Gi
              cpu: 2000m
          hostAliases:
            - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
              hostnames:
                - license.victoriametrics.com
          useStrictSecurity: true
          # If these components fail then there will be no notification that something is going wrong
          priorityClassName: system-cluster-critical
          # This must be set to at least three for high availability. Data must always
          # be accessible, even when at most one replica is unavailable. This means that
          # new data must be recorded at least twice, otherwise, when the only replica
          # with a given piece of data is unavailable, that data is also unavailable.
          # With only two replicas and a replicationFactor of 2, this means that when
          # one replica is unavailable, current information is still available, but
          # new information will only be recorded once, making the once-recorded data
          # unavailable when the unavailable and available replicas are switched.
          # This can only be reduced to two when:
          # * VictoriaMetrics adds support for rebalancing data automatically (manual currently planned, automatic not)
          #   * https://github.com/VictoriaMetrics/VictoriaMetrics/issues/188
          #   * https://github.com/VictoriaMetrics/VictoriaMetrics/issues/2324
          # * vminsert instances (not vmagent) support caching data and later pushing
          #   it when a storage replica is temporarily unavailable
          replicaCount: 3 # 2 * replicationFactor - 1
          podDisruptionBudget:
            minAvailable: *replication_factor
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    # Initial testing shows that 10Gi lasts 2-3 weeks (wow).
                    # TODO work on downsampling when this starts filling up
                    storage: 392Gi
                # TODO this needs tuning and benchmarking.
                storageClassName: victoria-metrics-vmstorage
                volumeMode: Filesystem
          extraArgs:
            downsampling.period: 30d:1m,180d:30m,1y:1h,2y:4h,5y:12h,10y:1d
            # retentionFilter: # TODO set retention filters for specific low value, high volume metrics
          volumes:
            - name: victoria-metrics-license-service-serving-cert
              secret:
                secretName: victoria-metrics-license-service-serving-cert
                defaultMode: 0440
                items:
                  - key: ca.crt
                    path: ca.crt
          volumeMounts:
            - name: victoria-metrics-license-service-serving-cert
              mountPath: /etc/ssl/certs/ca.crt
              subPath: ca.crt
          # vmBackup: # TODO maybe. Metrics are not critical to back up.
    alertmanager:
      spec:
        hostAliases:
          - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
            hostnames:
              - license.victoriametrics.com
        podDisruptionBudget:
          minAvailable: 1
        replicaCount: 2
        revisionHistoryLimitCount: 1
        useStrictSecurity: true
        # If these components fail then there will be no notification that something is going wrong
        priorityClassName: system-cluster-critical
        externalURL: https://alertmanager.${SECRET_PUBLIC_DOMAIN_NAME}
        # Upstream alertmanager storage requirements and usage is really poorly documented.
        # Based on https://groups.google.com/g/prometheus-developers/c/KQ5UbAbaYnU, it looks
        # like storage is used for recording:
        # * Silences
        # * Notification states
        # These are propagated throughout the cluster via the gossip protocol.
        # Because performance is not critical, but availability is, I'm putting this on
        # a replicated storage backend. Using an emptyDir volume may be sufficient, if
        # restarted instances receive the state via the gossip protocol before actually
        # processing alerts. However, if the entire cluster is rebooted at once (such as
        # when power is lost and UPS runs out of energy), the state will be lost.
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi # Probably way larger than needed, but still pretty small.
              storageClassName: ssd-replicated-3x
              volumeMode: Filesystem
        podMetadata:
          labels:
            endpoints.netpols.home.arpa/alertmanager-server: "true"
      # config: # TODO
      # TODO discord receiver(s). Send different priority and/or labeled alerts to different channels, with different notification settings.
    # With requestsLoadBalancer enabled, the operator points the vminsert-* and vmselect-*
    # Services at vmclusterlb, so the chart's defaults already go through it. The explicit
    # vmclusterlb URLs below are equivalent.
    vmalert:
      spec:
        hostAliases:
          - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
            hostnames:
              - license.victoriametrics.com
        podDisruptionBudget:
          minAvailable: 1
        replicaCount: 2
        revisionHistoryLimitCount: 1
        useStrictSecurity: true
        # If these components fail then there will be no notification that something is going wrong
        priorityClassName: system-cluster-critical
        # Explicit resources (operator default injection is disabled via
        # VM_VMALERTDEFAULT_USEDEFAULTRESOURCES=false). No CPU limit on purpose: rule
        # evaluation is bursty and a CPU limit only causes CFS throttling. Requests and the
        # memory limit are kept; values mirror the operator's former defaults.
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            memory: 500Mi
        extraArgs:
          # This will be used in the "source" links in the alert messages.
          # This will add grafana links to alerts.
          external.url: https://grafana.${SECRET_PUBLIC_DOMAIN_NAME}
          # URLs do not contain anything sensitive, so they can be logged/displayed in UI
          remoteRead.showURL: "true"
          remoteWrite.showURL: "true"
        # Send alert persistence and read it back from the application-aware LB,
        # rather than the underlying r/w instances directly. This does not need
        # to target vmagent either, as multiple backing vmclusters are not used.
        remoteRead:
          url: http://vmclusterlb-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8427/select/0/prometheus
        remoteWrite:
          url: http://vmclusterlb-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8427/insert/0/prometheus
        volumes:
          - name: victoria-metrics-license-service-serving-cert
            secret:
              secretName: victoria-metrics-license-service-serving-cert
              defaultMode: 0440
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: victoria-metrics-license-service-serving-cert
            mountPath: /etc/ssl/certs/ca.crt
            subPath: ca.crt
    vmagent:
      # TODO check each instance to verify that they're all scraping the same targets
      spec:
        hostAliases:
          - ip: ${VICTORIA_METRICS_LICENSE_SERVICE_IP}
            hostnames:
              - license.victoriametrics.com
        podDisruptionBudget:
          minAvailable: 1
        replicaCount: 2
        revisionHistoryLimitCount: 1
        useStrictSecurity: true
        # If these components fail then there will be no notification that something is going wrong
        priorityClassName: system-cluster-critical
        resources:
          # Right-sized 2026-08-01 from 14d of metrics: p95 CPU 244m (p99 325m,
          # max 396m) / peak working set 273Mi. Limits left with headroom for
          # scrape bursts; only the reservation is reduced.
          #
          # 2026-08-28: 512Mi was too tight and OOMKilled continuously (60+
          # restarts, deployment stuck 1/2). Steady working set had grown to
          # ~396Mi -- the 273Mi figure above was measured before the scrape set
          # reached its current size (132 SD routines / 290 targets), and the
          # startup burst while all service discovery loads pushes past the cap
          # before the process ever goes Ready. Raised to 1Gi (~2.5x steady).
          requests:
            memory: &vmagent_memory 1Gi
            cpu: 400m
          limits:
            # No CPU limit -- see the vmselect block. Requires
            # VM_VMAGENTDEFAULT_USEDEFAULTRESOURCES=false above.
            memory: *vmagent_memory
        extraArgs:
          # This is because cilium is exporting a ton of metrics, largely due to some pods making IPv6 requests which are unsupported on my network.
          # TODO find the pods and fix them
          promscrape.maxScrapeSize: 32MiB
          # Keeps per-target original labels out of memory (only shown on /targets).
          # The chart doesn't set this, and the binary default is false.
          promscrape.dropOriginalLabels: "true"
        inlineRelabelConfig:
          # Adding the same label on every single metric doesn't add any information
          - action: labeldrop
            regex: prometheus
        remoteWrite:
          # The chart value does not match the architecture diagram here: https://docs.victoriametrics.com/cluster-victoriametrics/
          # or here: https://docs.victoriametrics.com/operator/resources/vmcluster/
          # Point this at the application-aware LB instead of the insert service directly.
          - url: http://vmclusterlb-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8427/insert/0/prometheus/api/v1/write
        statefulMode:
        statefulStorage:
          # Temporarily store queued data when the process or pod is restarted.
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  # Not much storage is needed - just enough to store a few minutes of data.
                  # 1Gi is _way_ more than is actually needed, but is still small enough to
                  # not care about the overhead of overprovisioning.
                  storage: 1Gi
              # Avoid tying the pods to specific nodes with node-specific storage.
              storageClassName: ssd-replicated-3x
        podMetadata:
          labels:
            endpoints.netpols.home.arpa/metrics-scraper: "true"
            # This is a workaround for the hubble UI, which requires "prometheus" scrapers to be
            # labeled like this, for filtering.
            app: prometheus
        volumes:
          - name: victoria-metrics-license-service-serving-cert
            secret:
              secretName: victoria-metrics-license-service-serving-cert
              defaultMode: 0440
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: victoria-metrics-license-service-serving-cert
            mountPath: /etc/ssl/certs/ca.crt
            subPath: ca.crt
    defaultDatasources:
      grafanaOperator: *grafana_operator
      victoriametrics:
        # Replicates the chart default list to pin the plugin version (the chart
        # installs "latest"). 0.25.2 is the first release that fixes a Grafana 13
        # variable-editor crash, see
        # https://github.com/VictoriaMetrics/victoriametrics-datasource/issues/532
        # The chart default also sets `uid`s; they are left unset so the existing
        # datasources keep their UIDs. Keep in sync with the chart default when
        # bumping the chart.
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            isDefault: true
          - name: VictoriaMetrics (DS)
            isDefault: false
            access: proxy
            type: victoriametrics-metrics-datasource
            # Without this the chart doesn't add the plugin to the GrafanaDatasource,
            # and grafana-operator uninstalls it.
            plugin: true
            version: "0.25.2"
    grafana:
      enabled: false
      forceDeployDatasource: true
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      revisionHistoryLimit: 1
      # Needed for VPA.
      # This is probably an _awful_ idea - will need to watch churn rate and cardinality.
      # This can be decreased significantly, and I'll need to do so if performance tanks
      # or storage goes through the roof.
      metricLabelsAllowlist:
        - pods=[*]
        - nodes=[kubevirt.io/schedulable]
      replicas: 2
      podDisruptionBudget:
        minAvailable: 1
      # The chart does not currently support loading these from a pre-existing
      # configmap. The args and volumes are explicitly set instead.
      # customResourceState:
      #   enabled: true
      volumes:
        - name: &ksm_custom_resource_config ksm-custom-resource-config
          configMap:
            name: ksm-custom-resource-config
      volumeMounts:
        - name: *ksm_custom_resource_config
          mountPath: /etc/kube-state-metrics/custom-resource-state-metrics/
      extraArgs:
        - --custom-resource-state-config-file=/etc/kube-state-metrics/custom-resource-state-metrics/config.yaml
      rbac:
        extraRules:
          # This is needed when custom resource state metrics are enabled but the
          # chart option for them is disabled
          - apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            verbs:
              - list
              - watch
      vmScrape:
        spec:
          # This is a special case because multiple replicas (should)
          # report the same metrics. Telling VM to scrape the service
          # rather than the underlying pods prevents duplicate metrics.
          discoveryRole: service
          # Setting this replaces the chart default endpoint, so it is repeated here.
          endpoints:
            - port: http
              honorLabels: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
                # In-repo charts (GitRepository source) get chartVersion
                # `<version>+<commit>`, so every push minted a new series per
                # HelmRelease. Strip the build metadata.
                - action: replace
                  source_labels: [__name__, revision]
                  regex: gotk_resource_info;([^+]*)\+.+
                  target_label: revision
                  replacement: $1
    prometheus-node-exporter:
      fullnameOverride: prometheus-node-exporter
      revisionHistoryLimit: 1
      # NVMe drives report WCTEMP/CCTEMP via Identify Controller (NVMe spec
      # bytes 266-269), which smartmontools prints in `-x` text output but does
      # not currently serialize to JSON. smartctl-exporter only reads JSON, so
      # the thresholds are unreachable through it. This sidecar parses the
      # text output and publishes the values via node-exporter's textfile
      # collector so they can be joined against smartctl_device_temperature
      # in alerting expressions. See ../../exporters/smartctl/hr.yaml for the
      # main exporter.
      extraArgs:
        - --collector.textfile.directory=/textfile
        # No NFS server or tape drives on the nodes. RAPL's energy_uj is
        # root-only (0400), which the exporter (uid 65534) can't read.
        - --no-collector.nfsd
        - --no-collector.rapl
        - --no-collector.tapestats
      sidecarVolumeMount:
        # Auto-creates an in-memory emptyDir volume named "textfile" and mounts
        # it readOnly on node-exporter; the sidecar writes to it below.
        - name: textfile
          mountPath: /textfile
          readOnly: false
      sidecarHostVolumeMounts:
        # /dev for smartctl to access NVMe character devices. Mounted only on
        # sidecars by the chart, not on node-exporter itself.
        - name: dev
          mountPath: /dev
          hostPath: /dev
          readOnly: false
      extraVolumes:
        - name: smartctl-thresholds-script
          configMap:
            name: smartctl-thresholds-script
            defaultMode: 0755
      sidecars:
        # Needed until https://github.com/smartmontools/smartmontools/issues/583 is both fixed and
        # used by smartctl-exporter. Exports NVMe drive warning and critical temperature thresholds
        # for use in alerting rules.
        - name: smartctl-thresholds
          # Reuses the smartctl-exporter image because it already bundles
          # smartmontools. Pin matches the app version in
          # ../../exporters/smartctl/hr.yaml.
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.14.0
          command:
            - /script/write-smartctl-thresholds.sh
          securityContext:
            # Needed for raw NVMe ioctl access via /dev/nvmeN.
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: smartctl-thresholds-script
              mountPath: /script
              readOnly: true
          # Detect a stuck loop (e.g. kernel ioctl wedge across all drives)
          # and restart. mtime check uses 10 min = 2x the script's sleep
          # interval, so a single slow iteration won't false-alarm.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - find /textfile/smartctl_nvme_thresholds.prom -mmin -10 | grep -q .
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 32Mi
      vmScrape:
        spec:
          endpoints:
            - port: metrics
              relabelConfigs:
                # These is set at the target level rather than the metric level,
                # so it should be replaced once here instead of on every single metric.
                # Replace the instance name (something like 10.3.1.1:9100) with the node name
                # (something like talos-k8s-mixed-01).
                - source_labels:
                    - __meta_kubernetes_pod_node_name
                  action: replace
                  target_label: instance
                # Rename the pod label metrics. This causes churn every time the pods are restarted.
                # There should always be a 1:1 mapping between a pod and a node, so this label is redundant.
                # However, it could still be useful for "meta" queries, like the number of metrics exported
                # by each pod.
                - action: replace
                  target_label: pod
                  # This is uses VM-specific features.
                  # Helm is templating this which is why `printf` is needed
                  replacement: '{{ printf "{{service}}-{{__meta_kubernetes_pod_node_name}}" }}'
              # Chart default values
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: "/var/lib/kubelet/pods.+"
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            # Chart default endpoint
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                # Allowlist: only metrics read by a rule or dashboard (incl.
                # apiserver-alerts.yaml). The apiserver exports ~440 metrics; the rest
                # were ~56k unused series. A new rule/dashboard on another apiserver
                # metric must be added here.
                - action: keep
                  source_labels: [__name__]
                  regex: (apiserver_request_sli_duration_seconds_(bucket|sum|count)|apiserver_request_duration_seconds_(sum|count)|apiserver_request_total|apiserver_admission_webhook_fail_open_count|apiserver_admission_webhook_rejection_count|apiserver_admission_webhook_admission_duration_seconds_(sum|count)|apiserver_flowcontrol_rejected_requests_total|apiserver_request_terminations_total|apiserver_requested_deprecated_apis|apiserver_storage_objects|aggregator_unavailable_apiservice(_total)?|workqueue_queue_duration_seconds_bucket|workqueue_adds_total|workqueue_depth|rest_client_request_duration_seconds_bucket|rest_client_requests_total|kubernetes_build_info|go_.+|process_.+)
                # SLO rules read le 1/5/30/+Inf; 0.05-0.4 keep the p99 quantile rule meaningful.
                - action: drop
                  source_labels: [__name__, le]
                  regex: apiserver_request_sli_duration_seconds_bucket;(0\.6|0\.8|1\.25|1\.5|2|3|4|6|8|10|15|20|45|60)
    kubeControllerManager:
      service:
        selector:
          k8s-app: kube-controller-manager
          component: ~
      vmScrape: &control_plane_scrape_config
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                # TODO pin these certs or generate them all from the same root CA.
                # These appear to be generated for each separate node, and aren't
                # rooted by the talsecret values.
                insecureSkipVerify: true
    kubelet:
      vmScrapes:
        kubelet:
          enabled: true
        # Same container_* names as /metrics/cadvisor (double-counts unpinned
        # queries) and nothing reads it. metrics-server scrapes it directly.
        resources:
          enabled: false
      vmScrape:
        spec:
          relabelConfigs:
            # This is the same as the chart default, but it explicitly excludes NFD node labels,
            # and talos extension labels, and some others. These don't really provide any value,
            # and they cause cardinality to explode.
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: (feature_node|extensions_talos_dev|beta_kubernetes|plan_upgrade_cattle_io|openebs_io|katacontainers_io|topology_rook_io_).*
            - action: labeldrop
              regex: .*kubevirt_io.*
            - action: labeldrop
              regex: .*home_arpa.*
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
          # Shared by all kubelet endpoints (cadvisor, probes, resource, kubelet).
          # Setting this replaces the chart default, so its rules are repeated first.
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            # Per-endpoint allowlists: only metrics read by a rule or dashboard
            # (including dashboards in Grafana's DB). A new rule/dashboard on another
            # kubelet metric must be added here. Two-step because VM relabeling is RE2.
            - action: replace
              source_labels: [metrics_path, __name__]
              regex: /metrics/cadvisor;(container_cpu_usage_seconds_total|container_cpu_cfs_(throttled_seconds|throttled_periods|periods)_total|container_memory_(rss|swap|cache|working_set_bytes)|container_pressure_(io|memory)_stalled_seconds_total|container_oom_events_total|container_fs_(reads|writes)(_bytes)?_total|container_fs_usage_bytes|container_network_.+|machine_cpu_cores|machine_memory_bytes|container_scrape_error|machine_scrape_error)
              target_label: __keep
              replacement: "1"
            - action: replace
              source_labels: [metrics_path, __name__]
              regex: /metrics;(kubelet_volume_stats_.+|volume_manager_total_volumes|storage_operation_duration_seconds_.+|kubelet_runtime_operations_.+|kubelet_pod_(worker|start)_duration_seconds_.+|kubelet_cgroup_manager_duration_seconds_.+|kubelet_pleg_relist_(duration|interval)_seconds_.+|kubelet_running_(pods|containers)|kubelet_node_name|kubelet_node_config_error|kubelet_evictions|kubelet_certificate_manager_.+|kubelet_server_expiration_renew_errors|rest_client_requests_total|kubernetes_build_info|go_.+|process_.+)
              target_label: __keep
              replacement: "1"
            # Failed-probe history for debugging flaky probes; successes are noise.
            - action: replace
              source_labels: [metrics_path, __name__, result]
              regex: /metrics/probes;prober_probe_total;(failed|unknown)
              target_label: __keep
              replacement: "1"
            - action: drop
              source_labels: [metrics_path, __keep]
              regex: /metrics(/cadvisor|/probes)?;
            # Pod- and system-level cgroup totals (container=""). Nothing reads them;
            # unpinned sums double-count them, and with `id` dropped the system
            # cgroups collapse into one garbage series per node. Network metrics
            # exist only at pod level, so they stay.
            - action: drop
              source_labels: [metrics_path, container, __name__]
              regex: /metrics/cadvisor;;container_(cpu|memory|pressure|oom|fs)_.+
            # Host-network pods report every node interface; node-exporter covers
            # those. A denylist so unknown pod interfaces (tun0, vpn-*-veth0,
            # tap0_kata, k6t-eth0, ...) are kept.
            - action: drop
              source_labels: [__name__, interface]
              regex: container_network_.+;(bond0.*|enp.+|cilium_.+|lxc.+|dummy0|sit0|tunl0|teql0|tmp.+|vpn-(gw|r)-(bridge|vxlan)0)
    coreDns:
      # This is handled by the coredns deployments
      enabled: false
    kubeEtcd:
      service:
        selector:
          # This is a workaround for targeting etcd instance on all control planes.
          # Because etcd does not run in a pod, it cannot be directly targeted via a service.
          # Instead, the service must select pods that run on the same nodes as the etcd instances,
          # and also have host networking enabled. The controller manager and scheduler are good
          # choices because they meet these requirements.
          k8s-app: kube-controller-manager
          component: ~
        # This port does not require authentication, and only serves metrics. TODO build automation
        # to pull in the etcd certs via talosctl, which can be called via pods with a Talos service account.
        # Then the normal, authenticated 2379 port can be used. Or even better, move the root CA out
        # of the cluster (probably into a HSM), and issue these certs with it.
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
          component: ~
      vmScrape: *control_plane_scrape_config
  postRenderers:
    # Drop the webhook certificate's DNS names that lack the svc or
    # svc.cluster.local domains. The chart has no value for these.
    - kustomize:
        patches:
          - patch: |
              - op: test
                path: /spec/dnsNames/0
                value: victoria-metrics-operator
              - op: remove
                path: /spec/dnsNames/0
              - op: test
                path: /spec/dnsNames/0
                value: victoria-metrics-operator.monitoring
              - op: remove
                path: /spec/dnsNames/0
            target:
              group: cert-manager.io
              version: v1
              kind: Certificate
              name: victoria-metrics-operator-validation
