---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name victoria-metrics-crds
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/monitoring/victoria-metrics/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name victoria-metrics-storage-classes
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/monitoring/victoria-metrics/storage-classes
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: zfs-pool-provisioner
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name victoria-metrics-k8s-stack
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/monitoring/victoria-metrics/k8s-stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: victoria-metrics-crds
    - name: victoria-metrics-storage-classes
    - name: monitoring-namespace-issuer
    - name: grafana-crds
    - name: prometheus-crds
    - name: cert-manager
    - name: approver-policy
    - name: rook-ceph-cluster
    - name: openebs
    - name: fluent-crds
---
# The k8s-stack chart's default rules and dashboards, vendored from its sync
# job by sync-job/tool.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name victoria-metrics-sync-job
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/monitoring/victoria-metrics/sync-job/generated
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: victoria-metrics-crds
    - name: grafana-crds
