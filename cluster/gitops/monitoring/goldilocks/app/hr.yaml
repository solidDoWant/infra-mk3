---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: goldilocks
spec:
  interval: 1h
  # Stop-gap mirror, pruned 6 months after upstream publishes an OCI chart.
  # Switch to the official chart once https://github.com/FairwindsOps/charts/issues/1817 lands.
  url: oci://ghcr.io/home-operations/charts-mirror/goldilocks
  ref:
    tag: 11.3.1
    digest: sha256:1cff83c0fd215e8a135f533b531c7289348e54eaba322ea555e6a52bebcf924c
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: goldilocks
  values:
    image:
      repository: us-docker.pkg.dev/fairwinds-ops/oss/goldilocks
      tag: v4.16.4@sha256:ff73581db746ef005df77fc2c28c49635a39d36bb32f0a3ede717bc7904e6e2d
    controller:
      flags:
        on-by-default: true
      rbac:
        enableArgoproj: false
        # These are needed so that goldilocks can access the top-level controller for each pod
        # This can be regenerated with:
        # kubectl logs -n monitoring deployments/goldilocks-controller -c goldilocks | \
        #   grep "Error retrieving parent object" | \
        #   sed -r 's/.+cannot ([^ ]+?) resource \\"([^ ]+)\\" in API group \\"([^ ]+)\\".*/{"apiGroups": ["\3"],"resources":["\2"],"verbs":["\1"]}/' | \
        #   sort -u \
        #   jq -s \
        #   yq -P
        extraRules:
          - apiGroups:
              - ceph.rook.io
            resources:
              - cephclusters
              - cephfilesystems
              - cephobjectstores
            verbs:
              - list
          - apiGroups:
              - dragonflydb.io
            resources:
              - dragonflies
            verbs:
              - list
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - gateways
            verbs:
              - list
          - apiGroups:
              - grafana.integreatly.org
            resources:
              - grafanas
            verbs:
              - list
          - apiGroups:
              - operator.victoriametrics.com
            resources:
              - vmagents
              - vmalertmanagers
              - vmalerts
              - vmclusters
            verbs:
              - list
          - apiGroups:
              - postgresql.cnpg.io
            resources:
              - clusters
            verbs:
              - list
    dashboard:
      flags:
        on-by-default: true
        enable-cost: false
      excludeContainers: ""
      rbac:
        enableArgoproj: false
