---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Sets `log` (VictoriaLogs `_msg`) on CNPG pods to the human-readable message
# instead of the raw JSON envelope. All fields stay under `log_fields.*`.
#
# Precedence:
#   record.message - postgres log lines (envelope `msg` is the literal "record")
#   record.msg     - pgbouncer log lines (same wrapping)
#   msg            - everything else (instance manager, barman plugin, pg_ctl)
#
# Named to sort after the `kubernetes` filter, which populates `log_fields`.
# Scoped by container name: `Use_Tag_For_Meta` means pod labels are not
# available. Lines without a CNPG envelope pass through untouched.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: promote-cnpg-message
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.[^.]+\.[^.]+\.(postgres|pgbouncer|plugin-barman-cloud|bootstrap-controller)\.
  filters:
    - lua:
        call: promote_message
        code: |
          local function str(v)
            if type(v) == "string" and v ~= "" then return v end
          end

          function promote_message(tag, ts, record)
            local fields = record["log_fields"]
            if type(fields) ~= "table" or not str(fields["msg"]) then
              return 0, ts, record
            end
            local inner = fields["record"]
            local msg
            if type(inner) == "table" then
              msg = str(inner["message"]) or str(inner["msg"])
            end
            record["log"] = msg or fields["msg"]
            return 2, ts, record
          end
