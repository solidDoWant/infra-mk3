---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-operator
spec:
  interval: 1h
  url: oci://ghcr.io/fluent/helm-charts/fluent-operator
  ref:
    tag: 4.3.0
    digest: sha256:5dea2238286b91724aaefed4d04ca92df8fc31f680bf3581853c067209d342ed
  # Signed by a shared reusable workflow; the identity does not pin the fluent repo.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@[0-9a-f]{40}$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fluent-operator
  values:
    containerRuntime: containerd
    Kubernetes: false # Don't deploy the built-in k8s pipeline
    operator:
      image:
        registry: ghcr.io
        repository: fluent/fluent-operator/fluent-operator
        tag: 3.10.1@sha256:be978534f9fc1b998dc822c5eaa95b4e88e6a853a9739fd84fe10b44fcb9a97b
      extraArgs:
        - --leader-elect=true
        # Operator 3.9.0 defaults --metrics-bind-address to "0" (metrics disabled)
        # and --metrics-secure to true (HTTPS). The chart still ships an HTTP
        # metrics Service + ServiceMonitor on 8080, so enable HTTP metrics there
        # explicitly, otherwise the scrape gets connection-refused.
        - --metrics-bind-address=:8080
        - --metrics-secure=false
      # Leave resources unbounded so actual usage can be measured (the chart's
      # default caps are low). `null` clears the chart's default requests/limits.
      resources: null
      serviceMonitor:
        enable: true
    fluentbit:
      crdsEnable: false
    fluentd:
      crdsEnable: false
  postRenderers:
    # The chart exposes no value for the operator Deployment replica count, so
    # patch it in.
    - kustomize:
        patches:
          - patch: |
              - op: add
                path: /spec/replicas
                value: 2
            target:
              group: apps
              version: v1
              kind: Deployment
