---
# This dashboard isn't great but it's better than nothing.
# TODO rewrite this and include storage metrics
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluentbit
spec:
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  url: https://raw.githubusercontent.com/fluent/fluent-bit-docs/75f6d7a27fa7b3b77cd67e2b42c5690562884bbb/monitoring/dashboard.json # branch=master
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
