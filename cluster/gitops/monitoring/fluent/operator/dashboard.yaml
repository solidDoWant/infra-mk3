---
# This dashboard isn't great but it's better than nothing.
# TODO rewrite this and include storage metrics
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluentbit
spec:
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  url: https://raw.githubusercontent.com/fluent/fluent-bit-docs/bd1aaa9f145910ec7af5a3bfee60d4e929ed5236/monitoring/dashboard.json # branch=master
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
