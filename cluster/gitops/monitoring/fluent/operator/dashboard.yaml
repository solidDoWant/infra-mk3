---
# This dashboard isn't great but it's better than nothing.
# TODO rewrite this and include storage metrics
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluentbit
spec:
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  url: https://raw.githubusercontent.com/fluent/fluent-bit-docs/307c97f33485c74259f4c3be2dff2db695e1754b/monitoring/dashboard.json # branch=master
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
