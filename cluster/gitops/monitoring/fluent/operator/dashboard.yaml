---
# This dashboard isn't great but it's better than nothing.
# TODO rewrite this and include storage metrics
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluentbit
spec:
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  url: https://raw.githubusercontent.com/fluent/fluent-bit-docs/f9c28a97839be180c07630ed73f16a376f857b6d/monitoring/dashboard.json # branch=master
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
