---
# This dashboard isn't great but it's better than nothing.
# TODO rewrite this and include storage metrics
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluentbit
spec:
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  url: https://raw.githubusercontent.com/fluent/fluent-bit-docs/9dbae87a9a274d4a78b82accdc84f64971ad8387/monitoring/dashboard.json # branch=master
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
