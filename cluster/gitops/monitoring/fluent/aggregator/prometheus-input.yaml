---
apiVersion: fluentd.fluent.io/v1alpha1
kind: ClusterInput
metadata:
  name: prometheus
  labels:
    config.fluentd.fluent.io/enabled: "true"
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  inputs:
    - customPlugin:
        config: |
          <source>
            @type prometheus
            port 2021 # This must match what the operator deploys (not configurable)
            # fluent-plugin-prometheus 2.3.0 changed the default bind to 127.0.0.1,
            # which makes the endpoint unreachable for vmagent
            bind 0.0.0.0
            metrics_path /worker_metrics
            aggregated_metrics_path /metrics
          </source>
          <source>
            @type prometheus_monitor
            <labels>
              hostname ${hostname}
              worker_id ${worker_id}
            </labels>
          </source>
          <source>
            @type prometheus_output_monitor
            <labels>
              hostname ${hostname}
              worker_id ${worker_id}
            </labels>
          </source>
