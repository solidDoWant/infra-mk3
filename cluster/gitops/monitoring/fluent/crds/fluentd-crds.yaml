---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-operator-fluentd-crds
spec:
  interval: 1h
  url: oci://ghcr.io/fluent/helm-charts/fluent-operator-fluentd-crds
  ref:
    tag: 4.4.0
    digest: sha256:5a05db38ed54310f7fb847f8d7c4186d7866e320f82c5183389ac2f7613f4821
  # Signed by a shared reusable workflow; the identity does not pin the fluent repo.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@[0-9a-f]{40}$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator-fluentd-crds
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fluent-operator-fluentd-crds
