---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-operator-fluentd-crds
spec:
  interval: 1h
  url: oci://ghcr.io/fluent/helm-charts/fluent-operator-fluentd-crds
  ref:
    tag: 4.3.0
    digest: sha256:8b010d419894eac412fa6a77b520cfa7a799d9b6c11ab4bec0f1e616fc14b7dc
  # Signed by a shared reusable workflow; the identity does not pin the fluent repo.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@[0-9a-f]{40}$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator-fluentd-crds
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fluent-operator-fluentd-crds
