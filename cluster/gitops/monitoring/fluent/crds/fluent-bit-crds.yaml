---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-operator-fluent-bit-crds
spec:
  interval: 1h
  url: oci://ghcr.io/fluent/helm-charts/fluent-operator-fluent-bit-crds
  ref:
    tag: 4.4.0
    digest: sha256:bc4d70adca4eeecfc6528b1f9e2b6d402645601f73b6686b994b4db036077553
  # Signed by a shared reusable workflow; the identity does not pin the fluent repo.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@[0-9a-f]{40}$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator-fluent-bit-crds
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fluent-operator-fluent-bit-crds
