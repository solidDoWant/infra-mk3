---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-image-renderer
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s-charts
      version: 5.3.0
  values:
    controllers:
      grafana-image-renderer:
        replicas: 2
        containers:
          app:
            image:
              repository: grafana/grafana-image-renderer
              tag: v5.12.5
            env:
              LOG_FORMAT: json
              API_SILENCE_REQUEST_LOG_PATH: /healthz,/metrics
              AUTH_TOKEN:
                secretKeyRef:
                  name: grafana-image-renderer-auth-token
                  key: authToken
            ports:
              - containerPort: &process_port 8081
                name: http
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                port: *process_port
                path: /healthz
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        pod:
          securityContext:
            # Matches the image's nonroot user
            runAsUser: &uid 65532
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: grafana-image-renderer
        ports:
          http:
            port: 80
            targetPort: http
            protocol: HTTP
    serviceMonitor:
      grafana-image-renderer:
        enabled: true
        serviceName: "{{ .Release.Name }}"
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
            # Upstream dashboard 12203 hardcodes this job name
            relabelings:
              - targetLabel: job
                replacement: image-renderer
    persistence:
      # Browser profile and XDG dirs are created under the temp dir
      tmp:
        type: emptyDir
        advancedMounts:
          grafana-image-renderer:
            app:
              - path: /tmp
