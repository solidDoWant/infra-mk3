---
# Grafana's own account for the `grafana` MCP server in the toolgate catalog
# (cluster/gitops/ai/toolgate/catalog/grafana.yaml).
# Viewer only: it can read dashboards, alert rules and datasources, and change
# nothing. The operator creates the account and a token in Grafana, and writes
# the token to the Secret `grafana-mcp-token` (key `token`) next to this
# resource. It must live in Grafana's namespace: `instanceName` has no
# namespace field.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: toolgate-mcp
spec:
  instanceName: grafana
  name: toolgate-mcp
  role: Viewer
  tokens:
    - name: toolgate-mcp
      secretName: grafana-mcp-token
