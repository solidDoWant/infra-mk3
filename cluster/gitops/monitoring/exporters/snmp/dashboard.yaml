---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ups
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  # Fork of grafana.com 25293 rev 1: ups_mib already scales upsBatteryVoltage
  # to volts, so the battery voltage panels drop their unit conversions.
  configMapRef:
    key: dashboard.json
    name: ups-dashboard
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
