---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: smartctl-exporter
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/prometheus-smartctl-exporter
  ref:
    tag: 0.19.0
    digest: sha256:47545ec362fd0e29d8a91ed8f014a2a7b58c1b8584dab787770736d911292e5d
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  values:
    fullnameOverride: smartctl-exporter
    serviceMonitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (service|endpoint|pod|container)
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
    prometheusRules:
      enabled: true
      rules:
        # Replaced by the per-drive trip-based alert in alerts.yaml, which
        # joins against smartctl_nvme_warning_temp_celsius from the
        # node-exporter sidecar in ../../victoria-metrics/k8s-stack/.
        # The chart's default fires at a fixed 60°C with `for: 1m`, which is
        # noisy and well below most NVMe drives' manufacturer-defined WCTEMP.
        smartCTLDDeviceTemperature:
          enabled: false
