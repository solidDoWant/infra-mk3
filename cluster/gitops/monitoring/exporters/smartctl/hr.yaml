---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: prometheus-community-charts
      version: 0.17.1
  values:
    fullnameOverride: smartctl-exporter
    image:
      # Ahead of the chart's appVersion (v0.14.0). v0.15.0 passes
      # `--capabilities`, which exports NVMe WCTEMP/CCTEMP as
      # smartctl_device_temperature{temperature_type="op_limit_max"/"critical_limit_max"}
      # (requires the image's smartctl >= 7.5). Drop once the chart catches up.
      repository: quay.io/prometheuscommunity/smartctl-exporter
      tag: v0.15.0
    serviceMonitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (service|endpoint|pod|container)
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
    prometheusRules:
      enabled: true
      rules:
        # Replaced by the per-drive threshold alerts in alerts.yaml.
        # The chart's default fires at a fixed 60°C with `for: 1m`, which is
        # noisy and well below most NVMe drives' manufacturer-defined WCTEMP.
        smartCTLDDeviceTemperature:
          enabled: false
