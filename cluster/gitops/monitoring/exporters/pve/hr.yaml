---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: pve-exporter
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-exporter
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: pve-exporter
  values:
    controllers:
      pve-exporter:
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        containers:
          app:
            image:
              repository: ghcr.io/prometheus-pve/prometheus-pve-exporter
              tag: 3.10.1
            args:
              - --web.listen-address=:9221 # No IPv6
            env:
              # Proxmox is not currently integrated with infra PKI
              # TODO switch this to Teleport with openssh backend
              PVE_VERIFY_SSL: "false"
            envFrom:
              - secretRef:
                  name: pve-exporter-credentials
            ports:
              - name: metrics
                containerPort: 9221
            probes:
              liveness: &probe
                enabled: true
                port: metrics
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
    persistence:
      # Make /tmp RW for HTTP webserver (gunicorn) heartbeat file
      tmp:
        type: emptyDir
        sizeLimit: 32Mi
        globalMounts:
          - path: /tmp
    service:
      pve-exporter:
        controller: pve-exporter
        ports:
          metrics:
            port: 9221
    serviceMonitor:
      # These expose metrics for the exporter itself,
      # not the proxmox nodes. All pods are scraped
      # by this config, but only one pod is scraped for
      # actual proxmox metrics.
      pve-exporter-self:
        # Default name collides with the VMServiceScrape in service-scrape.yaml
        forceRename: pve-exporter-self
        service:
          identifier: pve-exporter
        endpoints:
          - interval: 1m
            scrapeTimeout: 10s
