---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-crds
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
  ref:
    tag: 32.0.1
    digest: sha256:6a5f0e0d7e53f0c9336d6ff56fbf4ff506a1a0d8251a26567b11cbbdef2c01b2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-crds
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: prometheus-crds
  # Only the types the VM operator converts are needed. Each served CRD costs
  # apiserver memory (OpenAPI specs, schemas, watch cache).
  values:
    crds:
      prometheuses:
        enabled: false
      prometheusagents:
        enabled: false
      alertmanagers:
        enabled: false
      thanosrulers:
        enabled: false
