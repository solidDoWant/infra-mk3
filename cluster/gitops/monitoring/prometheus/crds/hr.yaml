---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-crds
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
  ref:
    tag: 32.0.2
    digest: sha256:c6f0462f6834e509597bb3b1d5fed432292fc7e23d6dfc660f26b75e8142f9aa
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-crds
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: prometheus-crds
  # Only the types the VM operator converts are needed. Each served CRD costs
  # apiserver memory (OpenAPI specs, schemas, watch cache).
  values:
    crds:
      prometheuses:
        enabled: false
      prometheusagents:
        enabled: false
      alertmanagers:
        enabled: false
      thanosrulers:
        enabled: false
