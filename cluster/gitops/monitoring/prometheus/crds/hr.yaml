---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-crds
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-operator-crds
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: prometheus-community-charts
      version: 32.0.1
  # Only the types the VM operator converts are needed. Each served CRD costs
  # apiserver memory (OpenAPI specs, schemas, watch cache).
  values:
    crds:
      prometheuses:
        enabled: false
      prometheusagents:
        enabled: false
      alertmanagers:
        enabled: false
      thanosrulers:
        enabled: false
