---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minecraft-ftb-stoneblock-3
spec:
  interval: 1h
  url: oci://ghcr.io/itzg/minecraft-server-charts/minecraft
  ref:
    tag: 5.2.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-ftb-stoneblock-3
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: minecraft-ftb-stoneblock-3
  values:
    resources:
      requests:
        memory: &memory 8Gi
        cpu: 4
      limits:
        memory: *memory
    readinessProbe: &probe
      initialDelaySeconds: 120
    livenessProbe: *probe
    # Ensure that the old pod is completely terminated before the new one is started
    workloadAsStatefulSet: true
    strategyType: OnDelete
    minecraftServer:
      eula: "TRUE"
      type: AUTO_CURSEFORGE
      difficulty: normal
      ops: solidDoWant
      motd: "FTB Stoneblock 3"
      pvp: true
      # Heap size settings
      memory: 6G
      autoCurseForge:
        apiKey:
          existingSecret: minecraft-curseforge-credentials
        slug: ftb-stoneblock-3
      rcon:
        enabled: true
        existingSecret: minecraft-rcon-credentials
    persistence:
      storageClass: ssd-replicated-3x
      dataDir:
        enabled: true
        Size: 20Gi
    podLabels:
      endpoints.netpols.home.arpa/minecraft-server: "true"
    serviceAnnotations:
      mc-router.itzg.me/externalServerName: ftb-stoneblock-3.minecraft.${SECRET_PUBLIC_DOMAIN_NAME}
    mcbackup:
      enabled: true
      # TODO send this somewhere; probably should add support to backup-tool
      pauseIfNoPlayers: "true"
      compressMethod: zstd
      initialDelay: 5m
      persistence:
        storageClass: zfs-generic-nfs
        backupDir:
          enabled: true
          Size: 20Gi
    dnsConfig:
      options:
        - name: ndots
          value: "1"
