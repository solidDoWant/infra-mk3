---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minecraft-router
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-router
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: minecraft-router
  values:
    controllers:
      minecraft-router:
        replicas: 2
        strategy: RollingUpdate
        podDisruptionBudget:
          minAvailable: 1
        serviceAccount:
          identifier: minecraft-router
        containers:
          app:
            image:
              # Needed until https://github.com/itzg/mc-router/pull/422, https://github.com/itzg/mc-router/pull/421 merges and are released
              repository: ghcr.io/soliddowant/mc-router
              tag: 1.32.0-next@sha256:1c21cce19544e4d87f5df6fb2ff0dbf3e2cd9e6c6affa07ff99c7c64a1528acb
            env:
              API_BINDING: 0.0.0.0:8080
              CONNECTION_RATE_LIMIT: "10"
              IN_KUBE_CLUSTER: "true"
              METRICS_BACKEND: prometheus
              RECORD_LOGINS: "true"
              WEBHOOK_URL: http://localhost/webhook
              WEBHOOK_REQUIRE_USER: "true"
            securityContext: &security_context
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
            ports:
              - name: web
                containerPort: 8080
              - name: game-server
                containerPort: 25565
            probes: &probes
              startup:
                enabled: true
              readiness:
                enabled: true
              liveness:
                enabled: true
          discord-notifier:
            image:
              repository: public.ecr.aws/docker/library/python
              tag: 3.15.1-slim@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51
            envFrom:
              - secretRef:
                  name: minecraft-router-discord-notifier-webhook
            command:
              - /scripts/webhook.py
            securityContext: *security_context
            ports:
              - name: web
                containerPort: 80
            probes: *probes
        pod:
          # Watches Services via the k8s API
          automountServiceAccountToken: true
          labels:
            endpoints.netpols.home.arpa/minecraft-router: "true"
            endpoints.netpols.home.arpa/external-ingress-enabled: "true"
          securityContext:
            fsGroup: 1000
          dnsConfig:
            options:
              - name: ndots
                value: "1"
    serviceAccount:
      minecraft-router: {}
    rbac:
      roles:
        minecraft-router:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - services
              verbs:
                - list
                - watch
      bindings:
        minecraft-router:
          type: ClusterRoleBinding
          roleRef:
            identifier: minecraft-router
          subjects:
            - identifier: minecraft-router
    persistence:
      scripts:
        type: configMap
        name: minecraft-router-scripts
        defaultMode: 0755
        globalMounts:
          - path: /scripts
    service:
      minecraft-router:
        controller: minecraft-router
        ports:
          web:
            port: 80
            targetPort: 8080
            primary: true
          game-server:
            port: 25565
    serviceMonitor:
      minecraft-router:
        enabled: true
        serviceName: "{{ .Release.Name }}"
        endpoints:
          - port: web
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      minecraft-router:
        hostnames:
          - minecraft-router.${SECRET_PUBLIC_DOMAIN_NAME}
        parentRefs:
          - name: internal-gateway
            namespace: networking
        rules:
          - backendRefs:
              - name: minecraft-router
                port: 80
