# The server's INI, managed from git. The init container in hr.yaml applies these keys to
# the copy on the data volume on every start.
#
# Keys left out of this file are NOT reset: the server fills them in with its own defaults
# the first time it starts, and keeps whatever it has after that. Only the keys below are
# forced back to the value in git on every restart. The full set of keys the game supports
# is in Server/<SERVER_NAME>.ini on the data volume once the server has started once.
#
# Every value here is literal: Flux variable substitution is switched off for this file, so
# a dollar sign or a brace in a description or a password cannot break the build.
#
# @NAME@ is replaced with the environment variable NAME by the init container, and that is
# the way to set a value that is not literal -- a Secret key like the join password, or a
# Flux variable, which hr.yaml can hand over in an env var because substitution does run
# there.

# Shown in the in-game server browser. Deliberately NOT tied to SERVER_NAME any more: that
# name is pinned to `servertest` by the imported save -- it keys the save directory, the
# player database file and the world column on every character row -- and it is not what
# players should see in the browser.
PublicName=nk's server
PublicDescription=
# Whether to advertise the server in the public browser. It is joinable by address either
# way.
Public=true
# Password players must enter to join, from the join-password key of the
# project-zomboid-credentials Secret. An empty value there means anyone who can reach the
# port can play.
Password=@JOIN_PASSWORD@
MaxPlayers=8
# The server tries to port-forward itself through a UPnP internet gateway at startup. There
# is no gateway to find from a pod network -- the LoadBalancer address and the NAT rule on
# the firewall are what publish this server -- so all the discovery does is fire SSDP
# multicast at 239.255.255.250:1900 until it gives up, which the network policy denies. It
# is also not something a game server should be able to do: opening ports on the router is
# a deliberate, manual act here.
UPnP=false
# RCON. Setting a password is what makes the server open the RCON port at all -- with an
# empty one it never listens -- and the health checks in hr.yaml connect to that port to
# tell "the world is loaded and the server loop is running" apart from "the JVM exists".
# The value comes from the rcon-password key of the project-zomboid-credentials Secret.
RCONPassword=@RCON_PASSWORD@
# Pinned because hr.yaml's probes connect to this port; the two have to agree.
RCONPort=27015
# Stop the world clock while nobody is online.
PauseEmpty=true

# Carried over from the imported co-op save: none of these are server defaults, so without
# them the imported world would quietly come back with different rules.
PlayerSafehouse=true
SafehouseAllowRespawn=true
# Keeps continuity with the world as it was generated.
Seed=oQkcrOiDtxHqaEcY
# Tells clients whether the world was reset. Keeping the original value means nobody is
# told to throw away the map data they already have cached.
ResetID=5257937

# Workshop IDs for the server to download. These are the mods the imported world was built
# against -- the co-op host had them installed locally, so its INI listed the names with no
# IDs at all. Without the downloads the world loads with every item, recipe and spawn from
# these six missing.
#   2377867605 50% Wood Weight                                  ReducedWoodWeight2x41
#   3287958074 Choose Your Spawn!                               serellancustomspawn
#   3775407541 RadArchery                                       RadArchery
#   2747517727 [B42] Spawn with items and clothing by occupation ClothingBasedOnOccupation
#   3785539944 Vanilla Metalworking Expanded                    Vanilla Metalworking Expanded
#   2256623447 Firearms                                         firearmmod
WorkshopItems=2377867605;3287958074;3775407541;2747517727;3785539944;2256623447
# The mods to actually load, by the `id=` from each mod's mod.info. Downloading is not
# loading: a mod in WorkshopItems but not here is fetched and ignored. Order is the load
# order from the original save, and it decides which mod wins where two override the same
# thing -- do not reshuffle it.
Mods=ReducedWoodWeight2x41;serellancustomspawn;RadArchery;ClothingBasedOnOccupation;Vanilla Metalworking Expanded;firearmmod
# Map folders from map mods, semicolon separated. The vanilla map stays last.
Map=Muldraugh, KY
