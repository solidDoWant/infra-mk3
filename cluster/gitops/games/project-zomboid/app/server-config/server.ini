# The server's INI, managed from git. The init container in hr.yaml applies these keys to
# the copy on the data volume on every start.
#
# Keys left out of this file are NOT reset: the server fills them in with its own defaults
# the first time it starts, and keeps whatever it has after that. Only the keys below are
# forced back to the value in git on every restart. The full set of keys the game supports
# is in Server/<SERVER_NAME>.ini on the data volume once the server has started once.
#
# Every value here is literal: Flux variable substitution is switched off for this file, so
# a dollar sign or a brace in a description or a password cannot break the build.
#
# @NAME@ is replaced with the environment variable NAME by the init container, and that is
# the way to set a value that is not literal -- a Secret key like the join password, or a
# Flux variable, which hr.yaml can hand over in an env var because substitution does run
# there.

# Shown in the in-game server browser. Follows SERVER_NAME in hr.yaml, which is also what
# names the INI, the save and the player database, so the server is called one thing
# everywhere.
PublicName=@SERVER_NAME@
PublicDescription=
# Whether to advertise the server in the public browser. It is joinable by address either
# way.
Public=false
# Password players must enter to join, from the join-password key of the
# project-zomboid-credentials Secret. An empty value there means anyone who can reach the
# port can play.
Password=@JOIN_PASSWORD@
MaxPlayers=8
# Stop the world clock while nobody is online.
PauseEmpty=true

# Workshop IDs for the server to download, semicolon separated, e.g. 514427485;513111049
WorkshopItems=
# The mods to actually load: the `id=` line from each mod's info.txt, semicolon separated.
# A mod listed in WorkshopItems but not here is downloaded and then ignored.
Mods=
# Map folders from map mods, semicolon separated. The vanilla map stays last.
Map=Muldraugh, KY
