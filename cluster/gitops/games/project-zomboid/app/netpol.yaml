---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: project-zomboid
specs:
  - description: project-zomboid
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: project-zomboid
        app.kubernetes.io/controller: project-zomboid
        app.kubernetes.io/instance: project-zomboid
    egress:
      # DNS resolution. The wildcard rule is also what makes the toFQDNs rules below
      # work at all -- Cilium populates them from the lookups it sees on this proxy.
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"

      # Steam. The server registers itself with the master server, validates joining
      # players' auth tickets, and downloads every workshop mod in its INI on each
      # start. Without this it exits about a second after Steam initializes, silently.
      #
      # The UDP range is the part with no precedent in this cluster: every other UDP
      # rule here is a single fixed port, and Cilium can only match UDP against an
      # FQDN it saw resolved. If the server comes up but never appears in the Steam
      # server browser, this rule is the first thing to widen.
      - toFQDNs:
          - matchPattern: "*.steampowered.com"
          - matchPattern: "*.steamserver.net"
          - matchPattern: "*.steamcontent.com"
          - matchName: fastly.cdn.steampipe.steamcontent.com
          - matchName: steampipe.akamaized.net
        toPorts:
          - ports:
              # Workshop downloads and the web API.
              - port: "443"
                protocol: TCP
              - port: "27018"
                endPort: 27036
                protocol: TCP
              - port: "27015"
                endPort: 27036
                protocol: UDP

      # Steam Datagram Relay. The server pings Valve's relay POPs constantly to keep a
      # latency table, and clients that cannot reach it directly are routed through them.
      #
      # These cannot be expressed as FQDNs: the server is handed a raw IP and port list in
      # Valve's network config over HTTPS and never looks any of it up in DNS, so Cilium's
      # DNS proxy never sees a name to attach the IPs to and toFQDNs can never match them.
      # Denied, it shows up as a constant stream of UDP egress to 27xxx across many
      # addresses -- which is exactly what Hubble was reporting.
      #
      # The blocks below are every relay Valve publishes for this app (appid 108600),
      # collapsed from 141 addresses. Regenerate if denied UDP to 27xxx reappears, since
      # Valve adds and moves POPs:
      #   curl -s 'https://api.steampowered.com/ISteamApps/GetSDRConfig/v1/?appid=108600'
      - toCIDRSet:
          - cidr: 45.121.184.0/24
          - cidr: 103.10.124.0/23
          - cidr: 103.28.54.0/24
          - cidr: 146.66.152.0/24
          - cidr: 146.66.155.0/24
          - cidr: 155.133.224.0/22
          - cidr: 155.133.230.0/24
          - cidr: 155.133.238.0/24
          - cidr: 155.133.244.0/24
          - cidr: 155.133.246.0/24
          - cidr: 155.133.248.0/23
          - cidr: 155.133.252.0/24
          - cidr: 155.133.255.0/24
          - cidr: 162.254.192.0/21
          - cidr: 185.25.180.0/24
          - cidr: 185.25.182.0/23
          - cidr: 205.196.6.0/24
        toPorts:
          - ports:
              # Relay traffic itself. Valve's config gives three port ranges across the
              # POPs, all starting at 27015 and topping out at 27140.
              - port: "27015"
                endPort: 27140
                protocol: UDP
              # STUN and Steam's two NAT-punch ports, to the same relay addresses. The
              # server uses these to work out its public mapping before a relay path is
              # picked, so they are denied at exactly the moment a client is connecting.
              - port: "3478"
                protocol: UDP
              - port: "4379"
                protocol: UDP
              - port: "4380"
                protocol: UDP

      # Steam's connectivity check, which is plain HTTP and to a host outside the names
      # above. The client library uses it to tell "this machine has no internet" apart
      # from "Steam is down". Without it the check is a denied SYN to
      # steamconnecttest.com:80 every time the server looks, which is what showed up in
      # Hubble. test.steampowered.com is the same check against Valve's own host -- it
      # matches the wildcard above, but only for 443, so port 80 needs saying here.
      - toFQDNs:
          - matchName: steamconnecttest.com
          - matchName: test.steampowered.com
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP

    ingress:
      # Kubelet health checks. The probes in hr.yaml open a TCP connection to RCON, which
      # nothing else reaches -- the Service does not publish the port.
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "27015"
                protocol: TCP

      # Game traffic from players on the internet, via the LoadBalancer address. The
      # client uses the game port and the one above it.
      - fromEntities:
          - world
        toPorts:
          - ports:
              - port: "16261"
                protocol: UDP
              - port: "16262"
                protocol: UDP
