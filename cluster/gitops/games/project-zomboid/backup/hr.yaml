---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: project-zomboid-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.19
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: project-zomboid-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: project-zomboid-backup
  values:
    jobConfig:
      drType: generic
      drAction: backup
      cronjob:
        schedule: "0 2 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: project-zomboid-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          # Holds the save, the player database and the server config. The save grows
          # with how much of the map players have explored.
          size: 5Gi
        files:
          # The server's whole data directory. Everything unrecoverable is in here:
          # Saves/, the db/ player database, and the Server/ INI and sandbox settings.
          - name: data
            pvc: project-zomboid
            snapshotClass: ssd-replicated-3x-block
            exclude:
              # Steam re-downloads every workshop mod on each start, so backing them
              # up only bloats the snapshot.
              - glob: workshop
              # The server zips copies of the save here (on every start and on version
              # changes). Redundant with Saves/, and they multiply the snapshot size.
              - glob: backups
              - glob: Logs
              - glob: server-console.txt
              - glob: lost+found
