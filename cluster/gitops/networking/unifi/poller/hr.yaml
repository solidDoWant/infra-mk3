---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: unifi-poller
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-poller
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: unifi-poller
  values:
    controllers:
      unifi-poller:
        containers:
          unpoller:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v5.6.2@sha256:4ba1eab360adb75231ab05b7ee8adf252e6cf4c5d67ba39536492efd1e4605bd
            env:
              UP_INFLUXDB_DISABLE: "true"
              # Poll live per scrape. The background cache serves the last good
              # snapshot when the controller is unreachable, freezing
              # controller_up and device metrics, which blinds alerts.yaml.
              UP_PROMETHEUS_INTERVAL: "0"
              UP_UNIFI_DEFAULT_ROLE: infra-mk3
              UP_UNIFI_DEFAULT_URL: https://unifi-controller.networking.svc.cluster.local
              # TODO after deploying vmlogs
              # UP_LOKI_DISABLE: "false"
              # UP_LOKI_URL: http://log01.tylephony.com:3100
              # UP_UNIFI_DEFAULT_SAVE_ALARMS: "true"
              # UP_UNIFI_DEFAULT_SAVE_ANOMALIES: "true"
              # UP_UNIFI_DEFAULT_SAVE_DPI: "true"
              # UP_UNIFI_DEFAULT_SAVE_EVENTS: "true"
              # UP_UNIFI_DEFAULT_SAVE_IDS: "true"
              # UP_UNIFI_DEFAULT_SAVE_SITES: "true"
            envFrom:
              - secret: unifi-poller-credentials
            ports:
              - name: metrics
                containerPort: 9130
                protocol: TCP
            probes:
              liveness: &probe
                enabled: true
                port: metrics
                path: /metrics
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
    service:
      unifi-poller:
        controller: unifi-poller
        ports:
          metrics:
            port: 9130
    serviceMonitor:
      unifi-poller:
        serviceName: unifi-poller
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 30s
