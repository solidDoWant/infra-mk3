---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-dns
spec:
  interval: 1h
  # Stop-gap mirror, pruned 6 months after upstream publishes an OCI chart.
  # Switch to the official chart once https://github.com/kubernetes-sigs/external-dns/issues/4630 lands.
  url: oci://ghcr.io/home-operations/charts-mirror/external-dns
  ref:
    tag: 1.23.0
    digest: sha256:c7b8f2a30597547cde3008f2a1e3b5647a4ac0ea2dd3add0fffe2b84e0429aac
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns
  values:
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
    provider:
      name: cloudflare
    sources:
      - service
      - ingress
      - gateway-httproute
      - istio-gateway
      - crd
    triggerLoopOnEvent: true # Sync any time a supported resource changes
    policy: sync # Delete records when the resource is deleted
    extraArgs:
      # Only publish resources with this annotation set
      - --label-filter=external-dns.home.arpa/publish=true
      # Use <name>.domain.name for services by default
      # This is templated by Helm and then external-dns, hence the escaped "{{" and "}}"
      - --fqdn-template={{ "{{" }} .Name {{ "}}" }}.${SECRET_PUBLIC_DOMAIN_NAME}
      # Only watch loadbalancer services
      - --service-type-filter=LoadBalancer
      - --managed-record-types=A
      - --managed-record-types=CNAME
      - --managed-record-types=SRV
      # Point all records (CNAME usually) at this domain name, which will resolve to my WAN IP
      - --default-targets=public-wan.${SECRET_PUBLIC_DOMAIN_NAME}
      # v0.18+ skips default targets when the source has its own (gateway
      # status IPs), which the exclude nets below then strip -> records deleted
      - --force-default-targets
      # Ensure internal IP addresses are not published by accident
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
      # Encrypt TXT records
      - --txt-encrypt-enabled
      - --txt-encrypt-aes-key=$(TXT_RECORD_ENCRYPTION_KEY)
      # Proxy traffic by default (can be disabled via annotation)
      - --cloudflare-proxied
    env:
      - name: TXT_RECORD_ENCRYPTION_KEY
        valueFrom:
          secretKeyRef:
            key: TXT_RECORD_ENCRYPTION_KEY
            name: external-dns-secrets
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            key: CF_API_TOKEN
            name: external-dns-secrets
    domainFilters:
      - ${SECRET_PUBLIC_DOMAIN_NAME}
    serviceMonitor:
      enabled: true
