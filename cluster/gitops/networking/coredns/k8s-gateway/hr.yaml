---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns-k8s-gateway
spec:
  interval: 1h
  url: oci://ghcr.io/coredns/charts/coredns
  ref:
    tag: 1.49.0
    digest: sha256:f5eb6389e7ec1ffc654b41e1c90f1a4e10ef2b6d3f12d463291b2302efe06011
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/coredns/helm/\.github/workflows/release\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns-k8s-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns-k8s-gateway
  # These values are added now that the cluster has been bootstrapped
  values:
    image:
      repository: ghcr.io/k8s-gateway/k8s_gateway
      tag: 1.8.2@sha256:e7d334bc486fc78e2f2366da2029b7308240d500330e85d2367d4d9cc46a5e52
    replicaCount: 2
    serviceType: LoadBalancer
    prometheus:
      service:
        enabled: true
      monitor:
        enabled: true
    service:
      loadBalancerIP: 10.34.0.10 # By convention, set the last octet to 10
      trafficDistribution: PreferClose
      name: k8s-gateway
    serviceAccount:
      create: true
    rbac:
      create: false
    isClusterService: false
    priorityClassName: system-cluster-critical
    # Containerd 2.0 enables binding to port numbers <= 1024 by default, so the
    # NET_BIND_SERVICE capability is not needed
    # For some weird reason as of 1.12.3 this is needed or the entrypoint fails
    # with "permission denied" upon `exec`.
    # securityContext:
    #   capabilities:
    #     add: []
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: lameduck 5s
          - name: ready
          - name: log
          - name: prometheus
            parameters: 0.0.0.0:9153 # Default is localhost only
          - name: reload
          - name: loop
          - name: loadbalance
          # Reject requests from public IP space
          # This shouldn't happen - this config is just a precaution
          - name: acl
            configBlock: |-
              allow net 10.0.0.0/8
              drop
          - name: k8s_gateway
            parameters: ${SECRET_PUBLIC_DOMAIN_NAME}
            configBlock: |-
              apex coredns-k8s-gateway.networking
              ttl 300
              resources Ingress Service HTTPRoute TLSRoute DNSEndpoint
              gatewayClasses internal-gateways
          # Resolve PTR records for load-balanced services
          # The currently-used image does not have k8s_external, so forward requests instead.
          # TODO raise an issue upstream once the k8s_gateway project moves to a new maintainer
          # - name: k8s_external
          #   parameters: 34.10.in-addr.arpa
          - name: forward
            parameters: 34.10.in-addr.arpa /etc/resolv.conf
          # Fix PTR record lookups
          - name: rewrite
            parameters: stop
            configBlock: |-
              name suffix .in-addr.arpa. .in-addr.arpa.
              answer name auto
              answer value (.*)\.cluster\.local\. {1}.${SECRET_PUBLIC_DOMAIN_NAME}
    livenessProbe:
      initialDelaySeconds: 5
    readinessProbe:
      initialDelaySeconds: 5
    podDisruptionBudget:
      minAvailable: 1
    k8sAppLabelOverride: k8s-gateway
