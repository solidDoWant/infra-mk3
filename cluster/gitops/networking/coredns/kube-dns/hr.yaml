---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns-kube-dns
spec:
  interval: 1h
  url: oci://ghcr.io/coredns/charts/coredns
  ref:
    tag: 1.49.0
    digest: sha256:f5eb6389e7ec1ffc654b41e1c90f1a4e10ef2b6d3f12d463291b2302efe06011
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/coredns/helm/\.github/workflows/release\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns-kube-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns-kube-dns
  # These values are used for the initial deployment
  valuesFrom:
    - kind: ConfigMap
      name: helm-bootstrap-values
  # These values are added now that the cluster has been bootstrapped
  values:
    image:
      # Chart default is coredns/coredns on Docker Hub; same image, official k8s registry
      repository: registry.k8s.io/coredns/coredns
      tag: v1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    prometheus:
      monitor:
        enabled: true
  postRenderers:
    # Add a label to the pods specifically that marks them as DNS resolvers
    # for in-cluster resources. This is used by netpols for endpoint selection.
    - kustomize:
        patches:
          - patch: |
              - op: add
                path: /spec/template/metadata/labels/endpoints.netpols.home.arpa~1cluster-dns
                value: "true"
            target:
              group: apps
              version: v1
              kind: Deployment
              name: coredns-kube-dns
