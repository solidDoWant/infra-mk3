---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: node-network-operator
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/node-network-operator
  ref:
    tag: 0.0.11
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-network-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: node-network-operator
  values:
    config:
      crds:
        # These are installed via a separate Kustomization
        enabled: false
      webhook:
        enableTLS: true
        issuerRef:
          kind: Issuer
          name: networking-intermediary-ca
      # Production mode (JSON) at debug level: the debug lines record actual
      # link changes.
      logging:
        development: false
        level: debug
    resources:
      rawResources:
        webhook-certificate:
          manifest:
            spec:
              commonName: Node Network Operator
              subject:
                countries:
                  - US
                provinces:
                  - ${SECRET_STATE}
                organizations:
                  - infra-mk3
              usages:
                - server auth
              duration: 4h
