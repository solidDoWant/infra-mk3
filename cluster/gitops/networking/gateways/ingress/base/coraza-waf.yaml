---
# cspell:words corazawaf
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: coraza-waf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external-gateway
  # No @sha256 pin: Istio checks a URL digest against the Wasm binary's sha256,
  # not the image manifest digest; a mismatch fails closed (deny-all RBAC).
  url: oci://ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  pluginConfig:
    rules: |
      # Use the example config. This will provide some value while
      # reducing the need to fine-tune the configuration.
      Include @recommended-conf
      # Detection only by default: CRS evaluates and logs every request but
      # blocks nothing, so a new app needs no exceptions to work. Hosts that
      # benefit from blocking opt in below (rule 1010 onwards). Review the
      # gateway's Coraza logs before moving more hosts to enforcement.
      SecRuleEngine DetectionOnly
      # Enforced hosts. The stats API is custom code that queries a database,
      # which is where CRS adds real protection.
      SecRule REQUEST_HEADERS:Host "@streq insurgency-stats.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1010,phase:1,pass,nolog,ctl:ruleEngine=On"
      # The exceptions below still matter in detection-only mode: rules that
      # skip body inspection avoid the gateway's 1 MiB body buffer (413s) and
      # log noise, and the vault-sync rule keeps access tokens out of the logs.
      # Teleport multiplexes binary protocols (SSH/kube/db) and WebSocket ALPN
      # connection-upgrades over HTTPS. The OWASP CRS reliably flags this as
      # malicious and breaks tsh/Connect, so disable the WAF for the Teleport
      # host. Teleport enforces its own authN/authZ on these connections.
      SecRule REQUEST_HEADERS:Host "@streq teleport.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
      # Same for Teleport application access subdomains (<app>.teleport.<domain>).
      SecRule REQUEST_HEADERS:Host "@endsWith .teleport.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"
      # GitHub webhook payloads embed Renovate's PR/issue markdown, whose HTML
      # comments trip CRS XSS/RCE rules (941180, 932380). Skip body inspection
      # only; deliveries are HMAC-verified by the renovate-operator.
      SecRule REQUEST_HEADERS:Host "@streq renovate-webhook.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1002,phase:1,pass,nolog,chain"
        SecRule REQUEST_FILENAME "@beginsWith /webhook/v1/github" \
          "ctl:requestBodyAccess=Off"
      # GitHub push payloads list changed file paths (commits[].modified), and
      # paths containing words like "ansible" or "docker" trip CRS 932260 (Unix
      # RCE). Skip body inspection only; the Flux Receiver verifies the HMAC.
      SecRule REQUEST_HEADERS:Host "@streq flux-receiver.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1003,phase:1,pass,nolog,chain"
        SecRule REQUEST_FILENAME "@beginsWith /hook/" \
          "ctl:requestBodyAccess=Off"
      # vault-sync (Obsidian sync) speaks ConnectRPC with binary protobuf bodies,
      # whose content types CRS 920420 rejects by default. Bodies are file
      # contents (often E2EE ciphertext) that only trip false positives, so skip
      # body inspection; the server caps every request at 1 MiB itself. The
      # realtime WebSocket carries the access token in Sec-WebSocket-Protocol,
      # so keep that header out of every rule (and so out of the WAF's logs).
      SecRule REQUEST_HEADERS:Host "@streq vault-sync.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1006,phase:1,pass,nolog,setvar:'tx.allowed_request_content_type=|application/proto| |application/connect+proto| |application/json|',ctl:requestBodyAccess=Off,ctl:ruleRemoveTargetById=1-999999;REQUEST_HEADERS:sec-websocket-protocol"
      Include @crs-setup-conf
      Include @owasp_crs/*.conf
