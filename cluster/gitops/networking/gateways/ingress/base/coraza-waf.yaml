---
# cspell:words corazawaf
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: coraza-waf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external-gateway
  # No @sha256 pin: Istio checks a URL digest against the Wasm binary's sha256,
  # not the image manifest digest; a mismatch fails closed (deny-all RBAC).
  url: oci://ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  pluginConfig:
    rules: |
      # Use the example config. This will provide some value while
      # reducing the need to fine-tune the configuration.
      Include @recommended-conf
      # Detection only by default: CRS evaluates and logs every request but
      # blocks nothing, so a new app needs no exceptions to work. Hosts that
      # benefit from blocking opt in below (rule 1010 onwards). Review the
      # gateway's Coraza logs before moving more hosts to enforcement.
      SecRuleEngine DetectionOnly
      # Enforced hosts. The stats API is custom code that queries a database,
      # which is where CRS adds real protection.
      SecRule REQUEST_HEADERS:Host "@streq insurgency-stats.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1010,phase:1,pass,nolog,ctl:ruleEngine=On"
      # The exceptions below still matter in detection-only mode: rules that
      # skip body inspection avoid the gateway's 1 MiB body buffer (413s) and
      # log noise, and the vault-sync rule keeps access tokens out of the logs.
      # Teleport multiplexes binary protocols (SSH/kube/db) and WebSocket ALPN
      # connection-upgrades over HTTPS. The OWASP CRS reliably flags this as
      # malicious and breaks tsh/Connect, so disable the WAF for the Teleport
      # host. Teleport enforces its own authN/authZ on these connections.
      SecRule REQUEST_HEADERS:Host "@streq teleport.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
      # Same for Teleport application access subdomains (<app>.teleport.<domain>).
      SecRule REQUEST_HEADERS:Host "@endsWith .teleport.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"
      # GitHub webhook payloads embed Renovate's PR/issue markdown, whose HTML
      # comments trip CRS XSS/RCE rules (941180, 932380). Skip body inspection
      # only; deliveries are HMAC-verified by the renovate-operator.
      SecRule REQUEST_HEADERS:Host "@streq renovate-webhook.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1002,phase:1,pass,nolog,chain"
        SecRule REQUEST_FILENAME "@beginsWith /webhook/v1/github" \
          "ctl:requestBodyAccess=Off"
      # GitHub push payloads list changed file paths (commits[].modified), and
      # paths containing words like "ansible" or "docker" trip CRS 932260 (Unix
      # RCE). Skip body inspection only; the Flux Receiver verifies the HMAC.
      SecRule REQUEST_HEADERS:Host "@streq flux-receiver.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1003,phase:1,pass,nolog,chain"
        SecRule REQUEST_FILENAME "@beginsWith /hook/" \
          "ctl:requestBodyAccess=Off"
      # vault-sync (Obsidian sync) speaks ConnectRPC with binary protobuf bodies,
      # whose content types CRS 920420 rejects by default. Bodies are file
      # contents (often E2EE ciphertext) that only trip false positives, so skip
      # body inspection; the server caps every request at 1 MiB itself. The
      # realtime WebSocket carries the access token in Sec-WebSocket-Protocol,
      # so keep that header out of every rule (and so out of the WAF's logs).
      SecRule REQUEST_HEADERS:Host "@streq vault-sync.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1006,phase:1,pass,nolog,setvar:'tx.allowed_request_content_type=|application/proto| |application/connect+proto| |application/json|',ctl:requestBodyAccess=Off,ctl:ruleRemoveTargetById=1-999999;REQUEST_HEADERS:sec-websocket-protocol"
      # Pipelines-as-Code (ci/tekton) webhook, for every repository the GitHub
      # App is installed on. Pipelines-as-Code on its own also runs CI for
      # collaborators, org members and OWNERS-file entries, and lets them
      # drive it from comments. Here:
      # - Pull requests are only delivered if they were opened by my account
      #   (16456946, solidDoWant), the Renovate bot (338430720,
      #   infra-mk3-renovate-operator[bot]) or the githubgate App's bot
      #   (359098002, ghgate[bot]): the agent VMs act as that App through
      #   githubgate, which also sends any other githubgate caller's requests
      #   (each limited by its GitHubAccessPolicy, written only by Flux and the
      #   Coder template). That covers pull_request events, reviews and review
      #   comments, and comments on the pull request.
      # - Comment commands (/ok-to-test, /test, /retest, /cancel,
      #   comment-triggered pipelines) are only delivered from my account or
      #   ghgate[bot] (the agents' /retest); "Re-run" clicks (rerequested check
      #   runs and suites) only from my account.
      # - Pushes (branches and tags) are only delivered if they were made by my
      #   account, the Renovate bot or ghgate[bot] (agent pushes, release tags,
      #   and merges of PRs whose auto-merge the agents armed).
      # Matching is on account IDs, which survive a rename (and a freed login
      # can't be re-registered under them). These events are enforced with the
      # CRS removed, so PR, comment and commit text can't trip it; other events
      # stay detection-only. A missing field, or a body that isn't valid JSON (rule
      # 200002 from the recommended config), is rejected.
      # The fields are matched as ARGS_POST, not ARGS: the plugin is built with
      # multiphase evaluation, which runs a rule as soon as its variables are
      # available. ARGS counts as available in phase 1 (it includes the query
      # string), so the "missing" checks would run before the body arrives.
      SecRule REQUEST_HEADERS:Host "@streq pac-webhook.${SECRET_PUBLIC_DOMAIN_NAME}" \
        "id:1020,phase:1,pass,nolog,chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:pull_request|pull_request_review|pull_request_review_comment|issue_comment|commit_comment|check_run|check_suite|push)$" \
          "setvar:tx.pac_gated_event=1,ctl:ruleEngine=On,ctl:ruleRemoveByTag=OWASP_CRS,ctl:requestBodyAccess=On,ctl:requestBodyProcessor=JSON"
      # Comments and reviews: the sender must be me.
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1021,phase:2,deny,status:403,log,msg:'Pipelines-as-Code comment or review from another account (missing)',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:pull_request_review|pull_request_review_comment|issue_comment|commit_comment)$" "chain"
          SecRule &ARGS_POST:json.sender.id "@eq 0" "t:none"
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1022,phase:2,deny,status:403,log,msg:'Pipelines-as-Code comment or review from another account',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:pull_request_review|pull_request_review_comment|issue_comment|commit_comment)$" "chain"
          SecRule ARGS_POST:json.sender.id "!@rx ^(?:16456946|359098002)$" "t:none"
      # Pull request events, reviews and review comments: the pull request
      # must be opened by me or the Renovate bot.
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1023,phase:2,deny,status:403,log,msg:'Pipelines-as-Code pull request not opened by an allowed account (missing)',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:pull_request|pull_request_review|pull_request_review_comment)$" "chain"
          SecRule &ARGS_POST:json.pull_request.user.id "@eq 0" "t:none"
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1024,phase:2,deny,status:403,log,msg:'Pipelines-as-Code pull request not opened by an allowed account',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:pull_request|pull_request_review|pull_request_review_comment)$" "chain"
          SecRule ARGS_POST:json.pull_request.user.id "!@rx ^(?:16456946|338430720|359098002)$" "t:none"
      # Comments on pull requests (and issues): the pull request must be
      # opened by me or the Renovate bot.
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1025,phase:2,deny,status:403,log,msg:'Pipelines-as-Code comment on a pull request not opened by an allowed account (missing)',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@streq issue_comment" "chain"
          SecRule &ARGS_POST:json.issue.user.id "@eq 0" "t:none"
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1026,phase:2,deny,status:403,log,msg:'Pipelines-as-Code comment on a pull request not opened by an allowed account',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@streq issue_comment" "chain"
          SecRule ARGS_POST:json.issue.user.id "!@rx ^(?:16456946|338430720|359098002)$" "t:none"
      # "Re-run" clicks in GitHub: the sender must be me.
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1027,phase:2,deny,status:403,log,msg:'Pipelines-as-Code check re-run (missing)',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:check_run|check_suite)$" "chain"
          SecRule &ARGS_POST:json.sender.id "@eq 0" "t:none"
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1028,phase:2,deny,status:403,log,msg:'Pipelines-as-Code check re-run from another account',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@rx ^(?:check_run|check_suite)$" "chain"
          SecRule ARGS_POST:json.action "@streq rerequested" "chain"
            SecRule ARGS_POST:json.sender.id "!@rx ^(?:16456946)$" "t:none"
      # Pushes: the pusher must be me or the Renovate bot.
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1029,phase:2,deny,status:403,log,msg:'Pipelines-as-Code push (missing)',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@streq push" "chain"
          SecRule &ARGS_POST:json.sender.id "@eq 0" "t:none"
      SecRule TX:pac_gated_event "@eq 1" \
        "id:1030,phase:2,deny,status:403,log,msg:'Pipelines-as-Code push from another account',chain"
        SecRule REQUEST_HEADERS:X-GitHub-Event "@streq push" "chain"
          SecRule ARGS_POST:json.sender.id "!@rx ^(?:16456946|338430720|359098002)$" "t:none"
      Include @crs-setup-conf
      Include @owasp_crs/*.conf
