---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterparser_v1alpha2.json
# Envoy's default access log format (built-in `envoy` provider, TEXT encoding):
# https://www.envoyproxy.io/docs/envoy/latest/configuration/observability/access_log/usage#default-format-string
# Flags/details fields can be empty (e.g. Coraza WAF 403s), hence `\S*`.
# The `gw_` prefix is moved under `log_fields` by parse-istio-gateway-logs. The
# `istio-agent` parser lives in istio-system/istio/base.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterParser
metadata:
  name: istio-gateway-access-log
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  regex:
    regex: '^\[(?<gw_start_time>[^\]]+)\] "(?<gw_method>\S+) (?<gw_path>.*) (?<gw_protocol>\S+)" (?<gw_response_code>\d+) (?<gw_response_flags>\S*) (?<gw_response_code_details>\S*) (?<gw_connection_termination_details>\S*) "(?<gw_upstream_transport_failure_reason>[^"]*)" (?<gw_bytes_received>\d+) (?<gw_bytes_sent>\d+) (?<gw_duration>\d+) (?<gw_upstream_service_time>\S+) "(?<gw_x_forwarded_for>[^"]*)" "(?<gw_user_agent>[^"]*)" "(?<gw_request_id>[^"]*)" "(?<gw_authority>[^"]*)" "(?<gw_upstream_host>[^"]*)" (?<gw_upstream_cluster>\S+) (?<gw_upstream_local_address>\S+) (?<gw_downstream_local_address>\S+) (?<gw_downstream_remote_address>\S+) (?<gw_requested_server_name>\S+) (?<gw_route_name>\S+)$'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Drops internal-gateway access-log lines for machine keepalive traffic: health
# probes, Temporal worker long-polls/heartbeats, and Coder DERP latency checks.
#
# Each rule pins the request line AND `200 - via_upstream - "-"` (no response
# flags, no transport failure), so failed or abnormal requests still ship.
# gRPC application errors are still HTTP 200, hence exact paths only.
#
# Not done at the source (Telemetry CR filter): Envoy treats a CEL eval error
# as "don't log", which would blank the TCP/TLS passthrough listeners' logs.
#
# Named drop-* to sort before the `kubernetes` filter, skipping enrichment.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: drop-internal-gateway-keepalive-access-log
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  # External gateway deliberately excluded: its log is the record of internet traffic.
  matchRegex: ^kube\.networking\.internal-gateway-[^.]*\.istio-proxy\.
  filters:
    - grep:
        exclude: 'log "POST /grpc\.health\.v1\.Health/Check HTTP/2" 200 - via_upstream - "-" '
    - grep:
        exclude: 'log "POST /temporal\.api\.workflowservice\.v1\.WorkflowService/(PollActivityTaskQueue|PollWorkflowTaskQueue|RecordWorkerHeartbeat) HTTP/2" 200 - via_upstream - "-" '
    # Only while a Coder client is connected.
    - grep:
        exclude: 'log "GET /derp/latency-check HTTP/1\.1" 200 - via_upstream - "-" '
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Extracts fields from istio gateway logs into `log_fields.*`, matching the
# `kubernetes` filter's mergeLog convention for JSON loggers. Access lines keep
# `log` as-is: the full line is readable and bare-word searchable as `_msg`.
#
# Named to sort after the `kubernetes` filter (monitoring/fluent/node-agent);
# filters run in name order cluster-wide. ClusterFilter, not a namespaced
# Filter: see fluent/fluent-operator#1211. Lines matching neither parser
# (e.g. the proxy config dump at startup) pass through untouched.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: parse-istio-gateway-logs
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  # Gateway pods are <gateway>-<gatewayclass>-<hash>-<suffix>. Anchored on the
  # gateway pods because ztunnel's container is also named istio-proxy.
  matchRegex: ^kube\.networking\.[^.]+-gateway-[^.]*\.istio-proxy\.
  filters:
    - parser:
        keyName: log
        parser: istio-gateway-access-log,istio-agent
        preserveKey: true
        reserveData: true
    # Agent lines only (access lines have no istio_msg): `_msg` becomes the
    # message alone; the other columns stay in log_fields.
    - modify:
        rules:
          - hardCopy:
              istio_msg: log
    - nest:
        operation: nest
        wildcard:
          - gw_*
        removePrefix: gw_
        nestUnder: log_fields
    - nest:
        operation: nest
        wildcard:
          - istio_*
        removePrefix: istio_
        nestUnder: log_fields
