---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Gateway access logs: Envoy's default JSON format (`meshConfig.accessLogEncoding:
# JSON`, built-in `envoy` provider), already merged into `log_fields` by the
# `kubernetes` filter. Sets `_msg` to `<method> <authority><path> <protocol>
# <code> <flags>`, or `TCP <sni|cluster> <code> <flags>` for TCP/TLS listeners.
# The gateways' other log lines are handled by promote-istio-message
# (istio-system/istio/base).
#
# Drops internal-gateway lines for machine keepalive traffic: health probes,
# Temporal worker long-polls/heartbeats, and Coder DERP latency checks (only
# while a Coder client is connected). Each rule pins the request AND
# `200 - via_upstream` with no transport failure, so failed or abnormal
# requests still ship. gRPC application errors are still HTTP 200, hence
# exact paths only. The external gateway is deliberately excluded: its log is
# the record of internet traffic.
#
# Not done at the source (Telemetry CR filter): Envoy treats a CEL eval error
# as "don't log", which would blank the TCP/TLS passthrough listeners' logs.
#
# The operator joins the Lua onto one line with `;` per line: keep each
# statement on a single line.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: parse-istio-gateway-logs
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  # Gateway pods are <gateway>-<gatewayclass>-<hash>-<suffix>. Anchored on the
  # gateway pods because ztunnel's container is also named istio-proxy.
  matchRegex: ^kube\.networking\.[^.]+-gateway-[^.]*\.istio-proxy\.
  filters:
    - lua:
        call: parse_gateway_access
        code: |
          local keepalive = { ["POST /grpc.health.v1.Health/Check HTTP/2"] = true, ["POST /temporal.api.workflowservice.v1.WorkflowService/PollActivityTaskQueue HTTP/2"] = true, ["POST /temporal.api.workflowservice.v1.WorkflowService/PollWorkflowTaskQueue HTTP/2"] = true, ["POST /temporal.api.workflowservice.v1.WorkflowService/RecordWorkerHeartbeat HTTP/2"] = true, ["GET /derp/latency-check HTTP/1.1"] = true }

          function parse_gateway_access(tag, ts, record)
            local f = record["log_fields"]
            if type(f) ~= "table" or f["response_code"] == nil or f["msg"] ~= nil then
              return 0, ts, record
            end
            local code = tostring(f["response_code"])
            local flags = f["response_flags"] or "-"
            if type(f["method"]) ~= "string" then
              record["log"] = table.concat({ "TCP", tostring(f["requested_server_name"] or f["upstream_cluster"]), code, flags }, " ")
              return 2, ts, record
            end
            local req = table.concat({ f["method"], tostring(f["path"]), tostring(f["protocol"]) }, " ")
            if keepalive[req] and code == "200" and flags == "-" and f["response_code_details"] == "via_upstream" and f["upstream_transport_failure_reason"] == nil and tag:find("^kube%.networking%.internal%-gateway%-") then
              return -1, ts, record
            end
            record["log"] = table.concat({ f["method"], tostring(f["authority"]) .. tostring(f["path"]), tostring(f["protocol"]), code, flags }, " ")
            return 2, ts, record
          end
