---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: general-purpose-cni-plugin-installer
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: general-purpose-cni-plugin-installer
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: general-purpose-cni-plugin-installer
  values:
    controllers:
      installer:
        type: daemonset
        # 1. Install the plugins
        initContainers:
          installer:
            image:
              repository: ghcr.io/home-operations/cni-plugins
              tag: 1.9.1@sha256:e17cc64a81579a163646425d25d2e48065cfb0dc449d2de447b1fd29e9c2ca0f
            command:
              - rsync
              - -av
              - --exclude=LICENSE
              - --exclude=README.md
              - /plugins/
              - /host/opt/cni/bin/
            securityContext:
              readOnlyRootFilesystem: true
              seLinuxOptions:
                role: object_r
                type: cni_plugin_t
                user: system_u
        # 2. Label the node to stop the pod from installing this version again
        containers:
          labeler:
            image:
              repository: registry.k8s.io/kubectl
              tag: v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
            args:
              - label
              - --overwrite
              - node
              - "$(NODE_NAME)"
              - cni-plugins.home.arpa/node.general-purpose-plugins-version=$(VERSION)
            env:
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              # Label values can't hold a digest's "@"/":" and cap at 63 chars.
              VERSION: &plugin_version '{{ .Values.controllers.installer.initContainers.installer.image.tag | replace "@sha256:" "-" | trunc 63 }}'
            securityContext: &security_context_unprivileged
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
          # 3. Sleep forever and wait for the daemonset controller to terminate the pod
          pause:
            image:
              repository: registry.k8s.io/pause
              tag: "3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a"
            securityContext: *security_context_unprivileged
        pod:
          annotations:
            k8tz.io/inject: "false"
          # Labeler talks to the k8s API
          automountServiceAccountToken: true
          nodeSelector:
            cni-plugins.home.arpa/node.general-purpose-plugins-enabled: "true"
          # After the pod succeeds once for a given version, it will no longer match this selector.
          # As a result, the pod will exit and not run again until the version is updated.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cni-plugins.home.arpa/node.general-purpose-plugins-version
                        operator: NotIn
                        values:
                          - *plugin_version
        serviceAccount:
          identifier: labeler
    # Allow the labeler to label nodes
    serviceAccount:
      labeler: {}
    rbac:
      roles:
        labeler:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - nodes
              verbs:
                - get
                - patch
      bindings:
        labeler:
          type: ClusterRoleBinding
          roleRef:
            identifier: labeler
          subjects:
            - identifier: labeler
    persistence:
      host-cni-bin:
        type: hostPath
        hostPath: /opt/cni/bin
        advancedMounts:
          installer:
            installer:
              - path: /host/opt/cni/bin
