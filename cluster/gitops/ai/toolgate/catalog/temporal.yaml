---
# temporal-mcp: Temporal's official MCP server, reading (and, with approval,
# starting) workflow runs in the cluster's Temporal namespaces.
# https://github.com/temporalio/temporal-mcp
#
# Per-user: each user's instance calls Temporal with a Temporal access token
# for that user, which toolgate gets by exchanging the user's toolgate token
# at authentik ($${exchange:temporal}; config.tokenExchanges in
# ../app/hr.yaml). Temporal's own authorizer then enforces the user's
# `permissions` claim, so "Temporal users" can only read and "Temporal admins"
# can also start runs. toolgate refreshes the token in the instance's Secret
# at half its lifetime while the user calls the server, and temporal-mcp
# re-reads the token file on every use, so nothing restarts.
#
# temporal-mcp without its own OAuth `auth` section refuses to listen on
# anything but loopback, and needs a loopback Host header. toolgate already
# authenticates every caller, so an Envoy sidecar takes the gateway's
# connections and forwards them to 127.0.0.1 with Host: localhost.
#
# `$${` is Flux's escape: it reaches toolgate as a literal `${`.
apiVersion: toolgate.soliddowant.dev/v1alpha1
kind: MCPServerTemplate
metadata:
  name: temporal
spec:
  description: >-
    Temporal workflows in the cluster's backup and media namespaces: list the
    targets and check the connection, read a workflow run's state and event
    history or a summary of it, see a task queue's pollers and backlog, list
    search attributes, and search and count runs with Visibility queries.
    Starting a workflow run needs approval. Calls run with your own Temporal
    permissions.
  scope: per-user
  idleStop: 1h
  # Stateless: replace running instances as soon as the template changes.
  updatePolicy:
    mode: immediate
  startTimeout: 3m
  access:
    # The groups the Temporal provider maps to permissions; Temporal decides
    # what each user can do.
    groups:
      - Temporal users
      - Temporal admins
    environments: any
  endpoint:
    service: temporal
    port: 8931
  tools:
    # The one tool that changes anything.
    start_workflow:
      approval: required
  resources:
    # The exchanged Temporal token for the user who owns the instance.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: temporal-token
      stringData:
        token: $${exchange:temporal}
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: temporal-mcp
      data:
        config.yaml: |
          listen: 127.0.0.1:8080
          shutdown_timeout: 20s
          targets:
            - name: backup
              description: Backup jobs (tape-archiver) in the homelab cluster.
              # The frontend's serving cert SANs match this name.
              address: temporal-frontend.data.svc.cluster.local.:7233
              namespace: backup
              api_key:
                file: /var/run/secrets/temporal/token
            - name: media
              description: Media processing (media-processor) in the homelab cluster.
              address: temporal-frontend.data.svc.cluster.local.:7233
              namespace: media
              api_key:
                file: /var/run/secrets/temporal/token
        envoy.yaml: |
          static_resources:
            listeners:
              - name: mcp
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 8931
                filter_chains:
                  - filters:
                      - name: envoy.filters.network.http_connection_manager
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: mcp
                          route_config:
                            virtual_hosts:
                              - name: mcp
                                domains:
                                  - "*"
                                routes:
                                  - match:
                                      prefix: /
                                    route:
                                      cluster: temporal-mcp
                                      host_rewrite_literal: localhost
                                      # Streamable HTTP keeps SSE responses open.
                                      timeout: 0s
                                      idle_timeout: 3600s
                          http_filters:
                            - name: envoy.filters.http.router
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            clusters:
              - name: temporal-mcp
                type: STATIC
                connect_timeout: 2s
                load_assignment:
                  cluster_name: temporal-mcp
                  endpoints:
                    - lb_endpoints:
                        - endpoint:
                            address:
                              socket_address:
                                address: 127.0.0.1
                                port_value: 8080
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: temporal-mcp
      spec:
        replicas: 1
        revisionHistoryLimit: 1
        selector:
          matchLabels:
            app: temporal-mcp
        template:
          metadata:
            labels:
              app: temporal-mcp
              # Admitted by the Temporal frontend's network policy.
              endpoints.netpols.home.arpa/temporal-frontend-client: "true"
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: server
                image: mirror.gcr.io/temporalio/temporal-mcp:0.0.6@sha256:08af9f6c5ab4c98d953b43c0396be9c10858c13e64a6fde6336d778786b034b8
                args:
                  - --config
                  - /etc/temporal-mcp/config.yaml
                env:
                  # Only in-cluster Temporal is reached, so the cluster root
                  # CA alone is enough.
                  - name: SSL_CERT_FILE
                    value: /etc/root-ca/ca.crt
                resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    memory: 128Mi
                securityContext: &securityContext
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: config
                    mountPath: /etc/temporal-mcp/config.yaml
                    subPath: config.yaml
                    readOnly: true
                  # Not subPath: the kubelet must update the file when
                  # toolgate refreshes the token.
                  - name: token
                    mountPath: /var/run/secrets/temporal
                    readOnly: true
                  - name: root-ca
                    mountPath: /etc/root-ca
                    readOnly: true
              - name: envoy
                image: mirror.gcr.io/envoyproxy/envoy:contrib-v1.40.2@sha256:dc50a95c3d54a8f98cf682494db6fc42d77fde4ef12404fac3654d866a1f405d
                args:
                  - --config-path
                  - /etc/envoy/envoy.yaml
                  - --log-level
                  - warn
                ports:
                  - name: http
                    containerPort: 8931
                readinessProbe:
                  tcpSocket:
                    port: http
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 64Mi
                securityContext: *securityContext
                volumeMounts:
                  - name: config
                    mountPath: /etc/envoy/envoy.yaml
                    subPath: envoy.yaml
                    readOnly: true
            volumes:
              - name: config
                configMap:
                  name: temporal-mcp
              - name: token
                secret:
                  secretName: temporal-token
                  defaultMode: 0440
              # Kyverno puts the cluster's root CA in every namespace.
              - name: root-ca
                configMap:
                  name: root-ca-pub-cert
    - apiVersion: v1
      kind: Service
      metadata:
        name: temporal
      spec:
        selector:
          app: temporal-mcp
        ports:
          - name: http
            port: 8931
            targetPort: http
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: temporal-mcp
      spec:
        endpointSelector:
          matchLabels:
            app: temporal-mcp
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: networking
                  endpoints.netpols.home.arpa/cluster-dns: "true"
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchPattern: "*"
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: data
                  app.kubernetes.io/name: temporal
                  app.kubernetes.io/component: frontend
            toPorts:
              - ports:
                  - port: "7233"
                    protocol: TCP
        ingress:
          # Kubelet readiness probe
          - fromEntities:
              - host
            toPorts:
              - ports:
                  - port: "8931"
                    protocol: TCP
