---
# kubesearch-mcp: search kubesearch.dev (Flux/Argo deployments across public
# home-ops repos), and clone repos to read their manifests.
# https://github.com/perfectra1n/kubesearch-mcp
#
# No `scope`: the template references nothing user-specific, so toolgate runs
# one shared instance for everyone. That suits read-only public data, and the
# instance keeps the ~44 MB database cache and warm repo pool between users.
apiVersion: toolgate.soliddowant.dev/v1alpha1
kind: MCPServerTemplate
metadata:
  name: kubesearch
spec:
  description: >-
    Search kubesearch.dev: how public home-ops Kubernetes repos deploy Helm
    charts and images, real-world Helm values, and read those repos' manifests.
  # Short: the databases and clones live on a persistent volume, so a cold
  # start no longer downloads them again.
  idleStop: 30m
  # Stateless: replace running instances as soon as the template changes.
  updatePolicy:
    mode: immediate
  startTimeout: 5m
  access:
    # Every signed-in user: it's public data with no per-user access.
    users:
      - "*"
    # Usable from any signed-in machine, attested or not.
    environments: any
  # MCP is served at the default path, /mcp.
  # Gateway cache of read-only results (toolgate 0.4.12), shared by everyone.
  # kubesearch.dev's index updates about daily. The repo_* tools read the
  # instance's own clones, so they aren't cached.
  tools:
    kubesearch_search_releases:
      cache:
        ttl: 6h
        normalize:
          query: [trim, lowercase, collapseSpace]
    kubesearch_search_images:
      cache:
        ttl: 6h
        normalize:
          query: [trim, lowercase, collapseSpace]
    kubesearch_get_release:
      cache:
        ttl: 6h
    kubesearch_grep_values:
      cache:
        ttl: 6h
  # The search databases and repo clones survive idle stops and restarts
  # (toolgate 0.4.12 persistent volumes; one volume for the shared instance).
  persistentVolumes:
    - name: data
      size: 2Gi
      storageClassName: ssd-replicated-3x-retain
  endpoint:
    service: kubesearch
    port: 3000
  resources:
    # A Deployment, not a bare Pod: templates with persistent volumes need a
    # controller, so toolgate can scale it to zero and detach the volume
    # before it deletes the instance namespace.
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubesearch
      spec:
        replicas: 1
        revisionHistoryLimit: 1
        # The RBD volume attaches to one node at a time.
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: kubesearch
        template:
          metadata:
            labels:
              app: kubesearch
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000 # the image's `node` user
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: server
                image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
                ports:
                  - name: http
                    containerPort: 3000
                env:
                  - name: MCP_TRANSPORT
                    value: http
                  - name: KUBESEARCH_CACHE_DIR
                    value: /data
                  # Clone only from the forges the index covers; the netpol below
                  # allows only these hosts anyway.
                  - name: KUBESEARCH_CLONE_ALLOWED_HOSTS
                    value: github.com,gitlab.com
                readinessProbe:
                  httpGet:
                    path: /healthz
                    port: http
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: data
                    mountPath: /data
                  - name: tmp
                    mountPath: /tmp
            volumes:
              # The databases and clones are a cache. The volume outlives the
              # instance (persistentVolumes above), so a restart or idle stop
              # doesn't download them again.
              - name: data
                persistentVolumeClaim:
                  claimName: data
              - name: tmp
                emptyDir:
                  sizeLimit: 256Mi
    - apiVersion: v1
      kind: Service
      metadata:
        name: kubesearch
      spec:
        selector:
          app: kubesearch
        ports:
          - name: http
            port: 3000
            targetPort: http
    # toolgate's own policy in the instance namespace admits only the gateway
    # and DNS. This adds the egress the server needs.
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: kubesearch
      spec:
        endpointSelector:
          matchLabels:
            app: kubesearch
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: networking
                  endpoints.netpols.home.arpa/cluster-dns: "true"
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchPattern: "*"
          # The index databases are GitHub release assets
          # (whazor/k8s-at-home-search), and repo clones go to GitHub/GitLab.
          - toFQDNs:
              - matchName: github.com
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchName: objects.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
              - matchName: gitlab.com
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        ingress:
          # Kubelet readiness probe
          - fromEntities:
              - host
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
