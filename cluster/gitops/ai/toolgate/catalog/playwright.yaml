---
# Microsoft's Playwright MCP server: a headless Chromium the model drives to
# read and use web pages, from the homelab's own internet connection. Use it
# for sites that block or break Claude's built-in WebFetch, which runs on
# Anthropic's servers.
# https://github.com/microsoft/playwright-mcp
#
# Per-session: a browser holds one task's state (open tabs, the current page,
# and the element refs from the last snapshot), so two sessions sharing one
# would navigate away from each other's pages. It also stops cookies from one
# task reaching another. The cost is a pod start the first time a session
# calls it. The instance stops when its session ends or disables it, and the
# browser profile is in an emptyDir, so nothing outlives it.
#
# Playwright MCP keeps a separate browser context, with its own tabs, for each
# MCP session. Since toolgate 0.4.12 each toolgate session uses one upstream MCP
# session for its instance on every gateway replica, so a session sees the same
# tabs whichever replica serves a call. (Before that, Chromium ran as its own
# container and the server attached over CDP to share one context.)
#
# `$${` is Flux's escape: it reaches toolgate as a literal `${`.
apiVersion: toolgate.soliddowant.dev/v1alpha1
kind: MCPServerTemplate
metadata:
  name: playwright
spec:
  description: >-
    Browse the web in a headless Chromium from the homelab's internet
    connection: open pages, read them as text snapshots, click, type and fill
    forms. Use it when the built-in web fetch fails or a page needs JavaScript.
    Call browser_snapshot after navigating to read the page.
  scope: per-session
  # Keeps browser state (tabs, cookies): replace an outdated instance only
  # after 10 minutes without calls, so a change never lands mid-task.
  updatePolicy:
    mode: whenIdle
    idleFor: 10m
  startTimeout: 5m
  access:
    users:
      - "*"
    environments: any
  # MCP is served at the default path, /mcp.
  endpoint:
    service: playwright
    port: 8931
  toolFilter:
    deny:
      # Runs arbitrary Playwright code in the server's Node process, not the
      # page. browser_evaluate covers running JavaScript in the page.
      - browser_run_code_unsafe
      # Uploads files from the server's own filesystem, which holds nothing
      # worth uploading.
      - browser_file_upload
  resources:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: playwright
        labels:
          app: playwright-mcp
        annotations:
          # k8tz's timezone mounts break container creation under kata on
          # Debian-based images (this is node:lts-slim): "File exists (os error
          # 17)". The browser doesn't need the local timezone.
          k8tz.io/inject: "false"
      spec:
        # VM isolation: the browser runs whatever JavaScript the pages it
        # visits serve, with Chromium's own sandbox off. No `hostUsers: false`:
        # kata's handler doesn't support user namespaces, and the sandbox
        # fails to start with it.
        runtimeClassName: kata
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000 # the image's `node` user
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: server
            image: mcr.microsoft.com/playwright/mcp:v0.0.85@sha256:91838ad4927e574dcf787dd677e63c924b80f4adba6fe8ce47b92fab4a7841d6
            # The image's entrypoint adds --headless, --browser chromium and
            # --no-sandbox: Chromium's sandbox needs privileges the pod doesn't
            # have, and the kata VM is the isolation boundary instead.
            args:
              - --port=8931
              - --host=0.0.0.0
              # The gateway connects as <service>.<namespace>.svc:<port>, and
              # the server rejects any other Host header (the port is part of
              # the match).
              - --allowed-hosts=playwright.$${instance.namespace}.svc:8931
              # An in-memory profile for each MCP session; the instance is
              # per-session, and toolgate gives that session one MCP session.
              - --isolated
              # Headless Chromium reports "HeadlessChrome" in its user agent,
              # which many sites block outright (Anubis ships a DENY rule for
              # it). Send desktop Chrome's string instead, with the major
              # version matching the bundled Chromium; bump it with the image.
              # The client hints (Sec-CH-UA) already say plain "Chromium".
              - --user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/158.0.0.0 Safari/537.36
              # Without this, every action writes a page snapshot to a file in
              # the pod and returns only its path, which the client can't
              # read. browser_snapshot still returns the snapshot inline.
              - --snapshot-mode=none
              - --output-dir=/tmp/playwright-mcp
              - --init-script=/etc/playwright-mcp/init.js
            ports:
              - name: http
                containerPort: 8931
            # No health endpoint: /healthz and / are MCP-only.
            readinessProbe:
              tcpSocket:
                port: http
              periodSeconds: 10
            # Browser and server together: Chromium peaked at ~1.1Gi passing
            # an Anubis challenge (4 workers), the server at ~150Mi.
            resources:
              requests:
                cpu: 150m
                memory: 2304Mi
              limits:
                memory: 2304Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: init-script
                mountPath: /etc/playwright-mcp
                readOnly: true
              # The working directory, Chromium's config and crash reports.
              - name: home
                mountPath: /home/node
              # Console logs, screenshots and Chromium's temporary files.
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: init-script
            configMap:
              name: playwright-init-script
          - name: home
            emptyDir:
              sizeLimit: 256Mi
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
    # Runs in every page before the page's own scripts.
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: playwright-init-script
      data:
        init.js: |
          // The kata VM shows the browser every host CPU (32), and
          // proof-of-work challenges such as Anubis start one worker per
          // reported CPU. That many workers ran the pod out of memory, so
          // report a typical desktop's count.
          Object.defineProperty(Navigator.prototype, "hardwareConcurrency", {
            get: () => 4,
          });
    - apiVersion: v1
      kind: Service
      metadata:
        name: playwright
      spec:
        selector:
          app: playwright-mcp
        ports:
          - name: http
            port: 8931
            targetPort: http
    # toolgate's own policy in the instance namespace admits only the gateway
    # and DNS. This adds the egress the browser needs.
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: playwright-mcp
      spec:
        endpointSelector:
          matchLabels:
            app: playwright-mcp
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: networking
                  endpoints.netpols.home.arpa/cluster-dns: "true"
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchPattern: "*"
          # A general-purpose browser can't be limited to a list of FQDNs, so
          # this allows the public internet on web ports (approved for this
          # server only). The exceptions keep it off the home network, the
          # cluster and link-local metadata addresses, so the model can't be
          # pointed at internal services. CIDR rules never match cluster pods,
          # which have their own identities.
          - toCIDRSet:
              - cidr: 0.0.0.0/0
                except:
                  - 0.0.0.0/8
                  - 10.0.0.0/8
                  - 100.64.0.0/10
                  - 127.0.0.0/8
                  - 169.254.0.0/16
                  - 172.16.0.0/12
                  - 192.0.0.0/24
                  - 192.168.0.0/16
                  - 198.18.0.0/15
                  - 224.0.0.0/4
                  - 240.0.0.0/4
            toPorts:
              - ports:
                  - port: "80"
                    protocol: TCP
                  - port: "443"
                    protocol: TCP
                  # HTTP/3 (QUIC)
                  - port: "443"
                    protocol: UDP
        ingress:
          # Kubelet readiness probe
          - fromEntities:
              - host
            toPorts:
              - ports:
                  - port: "8931"
                    protocol: TCP
