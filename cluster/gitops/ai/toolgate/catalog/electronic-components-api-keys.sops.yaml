# DigiKey and Mouser API keys for the shared `electronic-components`
# server (electronic-components.yaml).
# Empty values leave a source off; jlcsearch needs no key. Fill them in with
#   sops cluster/gitops/ai/toolgate/catalog/electronic-components-api-keys.sops.yaml
# - digikey_client_id / digikey_client_secret: a DigiKey API app with
#   Product Information v4 (https://developer.digikey.com/).
# - mouser_api_key: a Mouser *Search* API key
#   (https://www.mouser.com/api-search/), which can't reach Mouser's cart or
#   order APIs.
# electronic-components-api-keys.yaml copies this Secret into each instance namespace.
