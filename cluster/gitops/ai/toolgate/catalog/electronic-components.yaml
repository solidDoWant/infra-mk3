---
# electronic-components: search DigiKey, Mouser and JLCPCB's parts library for electronic
# components and compare offers. Read-only.
# https://github.com/solidDoWant/mcp-servers/tree/master/servers/electronic-components
#
# One shared instance with one set of API keys (electronic-components-api-keys.sops.yaml,
# copied into the instance's own Secret by toolgate as template secrets), so nobody needs
# their own keys to search. A source whose keys are empty stays off; jlcsearch
# needs none. The server reads the keys when it starts.
#
# DigiKey and Mouser allow about 1000 calls a day each. The server caches
# answers in memory for an hour and keeps its own daily count. After two idle
# hours the cache holds nothing worth keeping, so the instance stops then, and
# the next call starts one on the template's current image (a shared instance
# that never stops never picks up a new one). A restart resets the server's
# own count; DigiKey and Mouser still enforce theirs.
#
# No `scope`: the template references nothing user-specific, so toolgate runs
# one shared instance for everyone.
apiVersion: toolgate.soliddowant.dev/v1alpha1
kind: MCPServerTemplate
metadata:
  name: electronic-components
spec:
  description: >-
    Search electronic component distributors and compare offers: DigiKey,
    Mouser, and JLCPCB's parts library (with basic/extended assembly status).
    Price and stock by part number or keyword, the cheapest offer at a
    quantity, and full specifications for one part.
  idleStop: 2h
  # Stateless: replace running instances as soon as the template changes.
  updatePolicy:
    mode: immediate
  startTimeout: 2m
  access:
    users:
      - "*"
    environments: any
  # MCP is served at the default path, /mcp.
  # Gateway cache of read-only results (toolgate 0.4.12), shared by everyone
  # like the instance itself: repeated searches don't spend the DigiKey and
  # Mouser daily quotas, and the cache survives instance restarts. 1h matches
  # the server's own in-memory cache, since prices and stock change.
  tools:
    search_parts:
      cache:
        ttl: 1h
        normalize:
          query: [trim, lowercase, collapseSpace]
    get_part:
      cache:
        ttl: 1h
        normalize:
          part_number: [trim]
  endpoint:
    service: electronic-components
    port: 8080
  resources:
    # The API keys and the MCP cache client certificate, copied by toolgate
    # from Secrets in `ai` (template secrets) before the pod starts, and
    # patched in place when a source changes. The reload label makes the
    # cluster's reloader policy restart the Deployment when the API keys
    # change. The certificate needs no restart: the dragonfly chart renews it
    # hourly and the server re-reads it for every new connection.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: electronic-components-api-keys
        labels:
          kyverno.home.arpa/reload: "true"
      stringData:
        digikey_client_id: $${templateSecret:electronic-components-api-keys/digikey_client_id}
        digikey_client_secret: $${templateSecret:electronic-components-api-keys/digikey_client_secret}
        mouser_api_key: $${templateSecret:electronic-components-api-keys/mouser_api_key}
        cache_url: $${templateSecret:electronic-components-api-keys/cache_url}
    - apiVersion: v1
      kind: Secret
      metadata:
        name: mcp-cache-client-cert
      stringData:
        tls.crt: $${templateSecret:mcp-cache-dragonfly-electronic-components-user/tls.crt}
        tls.key: $${templateSecret:mcp-cache-dragonfly-electronic-components-user/tls.key}
    # A Deployment rather than a bare Pod: Kubernetes recreates a deleted or
    # evicted pod, and the cluster's reloader policy restarts it when a
    # mounted Secret changes.
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: electronic-components
      spec:
        replicas: 1
        revisionHistoryLimit: 1
        selector:
          matchLabels:
            app: electronic-components-mcp
        template:
          metadata:
            labels:
              app: electronic-components-mcp
              endpoints.netpols.home.arpa/mcp-cache-client: "true"
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              # Secret files belong to root; this group lets the server read them.
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: server
                image: ghcr.io/soliddowant/mcp-electronic-components:0.4.0@sha256:0f51779e890942508ca7417a606891ec70f4e83ca6c83ee241cec1d96efe44a2
                env:
                  - name: DIGIKEY_CLIENT_ID_FILE
                    value: /var/run/secrets/electronic-components/digikey_client_id
                  - name: DIGIKEY_CLIENT_SECRET_FILE
                    value: /var/run/secrets/electronic-components/digikey_client_secret
                  - name: MOUSER_API_KEY_FILE
                    value: /var/run/secrets/electronic-components/mouser_api_key
                  # The shared MCP cache (mcp-cache/hr.yaml): answers and daily
                  # budgets survive restarts. mTLS with a client certificate
                  # renewed hourly, plus this server's own ACL user, whose
                  # password is in the connection string.
                  - name: CACHE_URL
                    valueFrom:
                      secretKeyRef:
                        name: electronic-components-api-keys
                        key: cache_url
                  - name: CACHE_TLS_CERT_FILE
                    value: /var/run/secrets/mcp-cache/tls.crt
                  - name: CACHE_TLS_KEY_FILE
                    value: /var/run/secrets/mcp-cache/tls.key
                  - name: CACHE_TLS_CA_FILE
                    value: /var/run/secrets/root-ca/ca.crt
                ports:
                  - name: http
                    containerPort: 8080
                readinessProbe:
                  httpGet:
                    path: /healthz
                    port: http
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: api-keys
                    mountPath: /var/run/secrets/electronic-components
                    readOnly: true
                  - name: cache-client-cert
                    mountPath: /var/run/secrets/mcp-cache
                    readOnly: true
                  - name: root-ca
                    mountPath: /var/run/secrets/root-ca
                    readOnly: true
            volumes:
              - name: api-keys
                secret:
                  secretName: electronic-components-api-keys
                  defaultMode: 0440
              # The MCP cache's client certificate (the Secret above).
              - name: cache-client-cert
                secret:
                  secretName: mcp-cache-client-cert
                  defaultMode: 0440
              # Kyverno puts the cluster's root CA in every namespace.
              - name: root-ca
                configMap:
                  name: root-ca-pub-cert
    - apiVersion: v1
      kind: Service
      metadata:
        name: electronic-components
      spec:
        selector:
          app: electronic-components-mcp
        ports:
          - name: http
            port: 8080
            targetPort: http
    # toolgate's own policy in the instance namespace admits only the gateway
    # and DNS. This adds the egress the server needs: the three distributor APIs.
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: electronic-components-mcp
      spec:
        endpointSelector:
          matchLabels:
            app: electronic-components-mcp
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: networking
                  endpoints.netpols.home.arpa/cluster-dns: "true"
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchPattern: "*"
          # The shared MCP cache.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  endpoints.netpols.home.arpa/mcp-cache-server: "true"
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
          - toFQDNs:
              - matchName: api.digikey.com
              - matchName: api.mouser.com
              - matchName: jlcsearch.tscircuit.com
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        ingress:
          # Kubelet readiness probe
          - fromEntities:
              - host
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
