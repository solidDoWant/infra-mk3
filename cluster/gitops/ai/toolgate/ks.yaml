---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name toolgate-backend
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ai/toolgate/backend
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: prometheus-crds
    - name: cluster-issuers
    - name: ai-namespace-issuer
    - name: cloudnative-pg
    - name: kyverno-app
    - name: rook-ceph-cluster
---
# The shared cache for MCP servers (Dragonfly), kept apart from toolgate's
# own backend so a cache problem never blocks the gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name toolgate-mcp-cache
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ai/toolgate/mcp-cache
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: prometheus-crds
    - name: cluster-issuers
    - name: ai-namespace-issuer
    - name: dragonfly-operator
    - name: kyverno-app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name toolgate-app
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ai/toolgate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  # The chart's hooks (model download, migrations) run before the release
  # applies, and the first model download can take a few minutes.
  timeout: 10m
  dependsOn:
    - name: toolgate-backend
    - name: gateway-crds
    - name: istio-base # DestinationRule CRD
    - name: grafana-crds
    - name: prometheus-crds
    - name: rook-ceph-cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name toolgate-catalog
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ai/toolgate/catalog
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The MCPServerTemplate CRD comes from the toolgate chart.
    - name: toolgate-app
    # Templates read API keys from the template secrets namespace.
    - name: toolgate-template-secrets
---
# Admin-managed Secrets that templates read as $${templateSecret:NAME/KEY}.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name toolgate-template-secrets
spec:
  targetNamespace: toolgate-template-secrets
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ai/toolgate/template-secrets/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The ClusterPolicy that keeps a copy of the MCP cache client certificate.
    - name: kyverno-app
    - name: toolgate-mcp-cache
