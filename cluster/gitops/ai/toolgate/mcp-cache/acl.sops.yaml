# Redis ACL users of the shared MCP cache (hr.yaml), loaded by the Dragonfly
# operator (aclFromSecret). One user per MCP server, limited to its own key
# and channel prefix, with commands that list or count other servers' keys
# denied. Passwords are stored as SHA-256 hashes (#...); each server's
# plain password is in its own catalog Secret's cache_url.
#
# mTLS signs every client in as `default`, so `default` is off. It keeps
# its permissions: Dragonfly checks AUTH itself against default's
# permissions, and the operator manages the server through the admin port as
# default.
