---
# Standalone (not chart-managed) so deleting the HelmRelease doesn't take the
# model with it. RWX so the pre-upgrade download Job can mount it alongside a
# running embeddings server.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: toolgate-models
spec:
  storageClassName: ssd-replicated-filesystem
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # bge-small-en-v1.5 is about 130 MiB; the chart's default size leaves
      # room for a larger model later.
      storage: 5Gi
