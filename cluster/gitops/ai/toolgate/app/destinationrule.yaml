---
# Optional since toolgate 0.4.5: MCP sessions are shared through PostgreSQL,
# so any replica serves any session and a replica that dies or rolls ends
# none. Hashing on X-Toolgate-Session (sent on every request of a Claude Code
# session, initialize included) keeps a session on one replica, which saves
# the other replicas from adopting it.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: toolgate
spec:
  host: toolgate.ai.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: X-Toolgate-Session
