---
# toolgate keeps each MCP session in memory on the replica that created it,
# and answers 404 to a request for a session it doesn't hold. Claude Code
# doesn't start a new session after that 404, so the gateway must keep each
# session on one replica. Hash on X-Toolgate-Session, which the plugin's
# headers helper sends on every request of a Claude Code session, initialize
# included. (Mcp-Session-Id doesn't work: initialize has none, so it lands on
# a random replica and the rest of the session hashes elsewhere.) Gateway
# rollouts still end open sessions; shared sessions are planned in toolgate.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: toolgate
spec:
  host: toolgate.ai.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: X-Toolgate-Session
