---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolgate
spec:
  interval: 1h
  # Not cosign-signed upstream, so there is no `verify` block.
  url: oci://ghcr.io/soliddowant/charts/toolgate
  ref:
    tag: 0.4.6
    digest: sha256:32879df9f260177d3a562e9d934f713f0be4ccef5ec4401de2e9320788c4bfbc
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolgate
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: toolgate
  values:
    config:
      image:
        # Repeated from the chart default so Renovate sees repository + tag.
        repository: ghcr.io/soliddowant/toolgate
        tag: 0.4.6@sha256:87aa90163a006471687f254e62ec9826c678d4ce9199f307189773ea3c43bf97
      database:
        # Split roles: the gateway connects as toolgate_app (rows only), and the
        # chart's pre-install/pre-upgrade hook Job runs the migrations as
        # toolgate_migrator (the schema owner). See backend/postgres/hr.yaml.
        # Inline, because the strings hold no password: pg_hba only allows
        # client certificate auth (CN = role name), with the certificates
        # mounted below. toolgate re-reads them for every new connection.
        # pgx sends search_path as a session setting, so tables and the
        # extension types resolve in the `toolgate` schema.
        url: >-
          host=toolgate-postgres-rw.ai.svc.cluster.local
          dbname=toolgate
          user=toolgate_app
          sslmode=verify-full
          sslrootcert=/etc/toolgate/certs/postgres/ca/ca.crt
          sslcert=/etc/toolgate/certs/postgres/app/tls.crt
          sslkey=/etc/toolgate/certs/postgres/app/tls.key
          search_path=toolgate
        migrateOnStart: false
        migrationUrl: >-
          host=toolgate-postgres-rw.ai.svc.cluster.local
          dbname=toolgate
          user=toolgate_migrator
          sslmode=verify-full
          sslrootcert=/etc/toolgate/certs/postgres/ca/ca.crt
          sslcert=/etc/toolgate/certs/postgres/migrator/tls.crt
          sslkey=/etc/toolgate/certs/postgres/migrator/tls.key
          search_path=toolgate
      oidc:
        # The public Authentik URL, not the in-cluster openid-configuration-proxy:
        # clients get their tokens from Authentik over the public hostname, and
        # the gateway requires the token `iss` to match this exactly (trailing
        # slash included). The chart has no setting for an extra CA, and the
        # internal gateway serves a publicly trusted cert.
        issuerURL: https://authentik.${SECRET_PUBLIC_DOMAIN_NAME}/application/o/toolgate/
        # The Authentik client ID: access tokens from `toolgate login`.
        audience: toolgate
        # Published at /.well-known/toolgate-client, so `toolgate login`
        # needs no --client-id.
        cliClientID: toolgate
        # Coder workspaces: Coder external auth `toolgate` holds each user's
        # consent to the `coder-toolgate` provider, and workspaces send its
        # access tokens (`coder external-auth access-token toolgate`).
        # Authentik gives each provider its own issuer, so it's listed here.
        # Same subject mode as the CLI provider: one identity per person.
        additionalIssuers:
          - issuerURL: https://authentik.${SECRET_PUBLIC_DOMAIN_NAME}/application/o/coder-toolgate/
            audience: coder-toolgate
      ui:
        publicURL: https://toolgate.${SECRET_PUBLIC_DOMAIN_NAME}
        # The same public client as the CLI (authorization code with PKCE), so
        # there is no client secret to manage. Authentik gives each provider its
        # own issuer, and the gateway takes only one.
        clientID: toolgate
        # Authentik's built-in superuser group.
        adminGroup: authentik Admins
      # Tool search is on for sessions that don't ask for it either way. The
      # chart points it at its own embeddings server (embeddings.server below).
      toolSearch: true
      serviceMonitor:
        enabled: true
      # Coder workspace sessions are attested: the client sends the workspace
      # pod's projected service-account token (audience `toolgate`) next to
      # the user token, and the gateway checks the pod's Coder labels against
      # the user. Only the Coder provisioner can create or change pods and
      # VMs in `development` (RBAC checked 2026-11-07: workspace service
      # accounts `default` and `coder-vm-workspace` can't create, patch or
      # update pods, virtualmachines or virtualmachineinstances there). The
      # label keys are Coder's defaults, which the templates set.
      workspaceAttestation:
        namespaces: [development]
        match:
          by: email
        workspaceID: coder/{username}/{workspace}
      # Encrypts user secrets (the secrets API, the web UI's Secrets page and
      # `toolgate secret set`). The keyset never goes in PostgreSQL; the SOPS
      # file in git is its off-cluster backup. A database backup is useless
      # without it.
      extraEnv:
        - name: TOOLGATE_SECRETS_KEYSET_FILE
          value: /etc/toolgate/keyset/keyset.json
    resources:
      defaultPodOptions:
        securityContext:
          # Lets the non-root user read the client certificate key files.
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
        dnsConfig:
          options:
            - name: ndots
              value: "1"
      controllers:
        gateway:
          containers:
            gateway:
              resources:
                requests:
                  cpu: 100m
                  memory: &gateway_memory 384Mi
                limits:
                  memory: *gateway_memory
      route:
        gateway:
          hostnames:
            - toolgate.${SECRET_PUBLIC_DOMAIN_NAME}
          parentRefs:
            - name: internal-gateway
              namespace: networking
          # Everything on the main port: MCP (/mcp), the OAuth metadata, the
          # web UI (/ui/) and the admin API (/api/v1/). Metrics are on a
          # separate port that isn't routed.
          rules:
            - backendRefs:
                - identifier: gateway
                  port: 80
      persistence:
        secrets-keyset:
          type: secret
          name: toolgate-keyset # toolgate-keyset.sops.yaml
          defaultMode: 0440
          advancedMounts:
            gateway:
              gateway:
                - path: /etc/toolgate/keyset
                  readOnly: true
        postgres-ca:
          type: secret
          name: toolgate-postgres-serving-cert
          defaultMode: 0444
          items:
            - key: ca.crt
              path: ca.crt
          advancedMounts:
            gateway:
              gateway:
                - path: /etc/toolgate/certs/postgres/ca
                  readOnly: true
            migrate:
              migrate:
                - path: /etc/toolgate/certs/postgres/ca
                  readOnly: true
        postgres-app-cert:
          type: secret
          name: toolgate-postgres-toolgate-app-user
          defaultMode: 0440
          advancedMounts:
            gateway:
              gateway:
                - path: /etc/toolgate/certs/postgres/app
                  readOnly: true
        postgres-migrator-cert:
          type: secret
          name: toolgate-postgres-toolgate-migrator-user
          defaultMode: 0440
          advancedMounts:
            migrate:
              migrate:
                - path: /etc/toolgate/certs/postgres/migrator
                  readOnly: true
    embeddings:
      server:
        enabled: true
        cache:
          # The chart creates `toolgate-models` once (Helm keeps it on
          # uninstall). RWX so the pre-upgrade download Job can mount it while
          # the server runs. bge-small-en-v1.5 is about 130 MiB.
          storageClassName: ssd-replicated-filesystem
          size: 5Gi
        # The gateway's leader scales the server to zero when no session has
        # used tool search for idleTimeout, and back to one when one does.
        # Searches while it starts use words only.
        scaleToZero:
          enabled: true
          idleTimeout: 15m
    dashboards:
      grafanaOperator:
        enabled: true
        instanceSelector:
          matchLabels:
            grafana.home.arpa/instance: grafana
        folder: toolgate
        allowCrossNamespaceImport: true
  postRenderers:
    - kustomize:
        patches:
          # The gateway owns the embeddings server's replica count (0 or 1), and
          # the chart leaves `replicas` out. Have drift detection ignore it.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: toolgate-embeddings
            patch: |
              - op: add
                path: /metadata/labels/patches.flux.home.arpa~1deployment.ignore-replicas
                value: "true"
