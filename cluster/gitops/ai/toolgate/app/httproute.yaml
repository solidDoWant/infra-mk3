---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toolgate
spec:
  hostnames:
    - toolgate.${SECRET_PUBLIC_DOMAIN_NAME}
  parentRefs:
    - name: internal-gateway
      namespace: networking
  rules:
    # Everything on the main port: MCP (/mcp), the OAuth metadata, the web UI
    # (/ui/) and the admin API (/api/v1/). Metrics are on a separate port that
    # isn't routed.
    - backendRefs:
        - name: toolgate
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
