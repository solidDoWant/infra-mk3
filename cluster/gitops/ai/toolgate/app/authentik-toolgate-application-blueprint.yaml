---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-toolgate-application-blueprint
  labels:
    k8s-sidecar.home.arpa/application: authentik
type: Opaque
stringData:
  # Must be a Secret (not a secretGenerator) so Flux substitutes the variables.
  authentik-toolgate-application-blueprint.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: toolgate application
      labels:
        blueprints.goauthentik.io/description: OIDC provider for the toolgate MCP gateway (CLI and web UI)
    entries:
      # Dependencies
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Explicit provider authentication
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Password authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Invalidation flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Blueprint library
          required: true
      # The device-code entry flow, set on the brand (infra-mk3 brand blueprint)
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: infra-mk3 brand
          required: true
      # One provider for both the CLI and the web UI. toolgate takes one issuer
      # URL (config.oidc.issuerURL), and with issuer_mode per_provider each
      # Authentik provider is its own issuer, so the two can't be separate
      # providers. One client also gives both the same `sub`, which grants,
      # approvals and UI-set secrets match on.
      - model: authentik_providers_oauth2.oauth2provider
        id: toolgate-provider
        identifiers:
          name: toolgate
        attrs:
          name: toolgate
          # Explicit consent: the device code link is the only check that the
          # user meant to sign in a device.
          authorization_flow:
            !Find [authentik_flows.flow, [slug, explicit-authorization-flow]]
          # Neither the CLI nor the browser can keep a secret, and the client ID
          # isn't secret either. The web UI uses PKCE.
          client_type: public
          client_id: toolgate
          grant_types:
            # `toolgate login`; its access tokens go to the gateway
            - urn:ietf:params:oauth:grant-type:device_code
            # The web UI
            - authorization_code
            - refresh_token
          redirect_uris:
            - url: https://toolgate.${SECRET_PUBLIC_DOMAIN_NAME}/ui/auth/callback
              matching_mode: strict
          signing_key:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=30
          # The gateway reads email, email_verified and groups from the tokens.
          # `profile` carries the groups.
          property_mappings:
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "OpenID 'email' (verified)"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'openid'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'profile'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'offline_access'"],
              ]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
      - model: authentik_core.application
        id: toolgate-application
        identifiers:
          slug: toolgate
        attrs:
          name: toolgate
          slug: toolgate
          group: Development access
          provider: !KeyOf toolgate-provider
          policy_engine_mode: any
          meta_launch_url: https://toolgate.${SECRET_PUBLIC_DOMAIN_NAME}/ui/
      # Coder external auth: Coder holds each user's consent and hands their
      # workspaces an access token (`coder external-auth access-token
      # toolgate`), so workspaces need no `toolgate login`. Confidential:
      # the Coder server keeps the secret. Same subject mode as the CLI
      # provider, so a user is one identity in toolgate.
      - model: authentik_providers_oauth2.oauth2provider
        id: coder-toolgate-provider
        identifiers:
          name: coder-toolgate
        attrs:
          name: coder-toolgate
          authorization_flow:
            !Find [authentik_flows.flow, [slug, explicit-authorization-flow]]
          client_type: confidential
          client_id: coder-toolgate
          client_secret: "${SECRET_CODER_TOOLGATE_CLIENT_SECRET}"
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - url: https://coder.${SECRET_PUBLIC_DOMAIN_NAME}/external-auth/toolgate/callback
              matching_mode: strict
          signing_key:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: hours=1
          # Coder refreshes on demand; a long refresh lifetime keeps workspaces
          # signed in without the user re-linking.
          refresh_token_validity: days=90
          property_mappings:
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "OpenID 'email' (verified)"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'openid'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'profile'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'offline_access'"],
              ]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
      - model: authentik_core.application
        id: coder-toolgate-application
        identifiers:
          slug: coder-toolgate
        attrs:
          name: toolgate (Coder workspaces)
          slug: coder-toolgate
          group: Development access
          provider: !KeyOf coder-toolgate-provider
          policy_engine_mode: any
      - model: authentik_core.group
        id: toolgate-group
        identifiers:
          name: toolgate access
        attrs:
          attributes:
            discord_role_id: "${SECRET_AUTHENTIK_TOOLGATE_DISCORD_ROLE_ID}"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf toolgate-group
          target: !KeyOf toolgate-application
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf toolgate-group
          target: !KeyOf coder-toolgate-application
      # Token exchange (RFC 8693) for toolgate's $${exchange:NAME} template
      # variable: the gateway swaps a user's toolgate or coder-toolgate access
      # token for a token of another provider (e.g. Temporal) for that same
      # user. Confidential, so only the gateway (which holds the secret) can
      # exchange; agents holding user tokens can't. Target providers list this
      # provider in their jwt_federation_providers (data/temporal/app).
      - model: authentik_providers_oauth2.oauth2provider
        id: toolgate-token-exchange-provider
        identifiers:
          name: toolgate-token-exchange
        attrs:
          name: toolgate-token-exchange
          authorization_flow:
            !Find [authentik_flows.flow, [slug, explicit-authorization-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          client_type: confidential
          client_id: toolgate-token-exchange
          client_secret: "${SECRET_TOOLGATE_TOKEN_EXCHANGE_CLIENT_SECRET}"
          grant_types:
            - urn:ietf:params:oauth:grant-type:token-exchange
          # Required by authentik's serializer even though the token-exchange
          # grant never redirects.
          redirect_uris: []
          # Subject tokens are verified against these providers' keys.
          jwt_federation_providers:
            - !KeyOf toolgate-provider
            - !KeyOf coder-toolgate-provider
          signing_key:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          access_token_validity: minutes=10
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      - model: authentik_core.application
        id: toolgate-token-exchange-application
        identifiers:
          slug: toolgate-token-exchange
        attrs:
          name: toolgate token exchange
          slug: toolgate-token-exchange
          group: Development access
          provider: !KeyOf toolgate-token-exchange-provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf toolgate-group
          target: !KeyOf toolgate-token-exchange-application
