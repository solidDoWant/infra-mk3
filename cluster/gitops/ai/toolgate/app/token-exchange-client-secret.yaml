---
# The toolgate-token-exchange client secret (authentik blueprint), read by the
# gateway for each token exchange through the TokenExchange's clientSecretRef
# (catalog/temporal-token-exchange.yaml). `ai` is the template secrets
# namespace (hr.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: toolgate-token-exchange-client
type: Opaque
stringData:
  client-secret: "${SECRET_TOOLGATE_TOKEN_EXCHANGE_CLIENT_SECRET}"
