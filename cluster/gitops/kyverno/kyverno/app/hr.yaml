---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name kyverno
spec:
  interval: 5m
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: kyverno-charts
      # Pinned: 3.6.3+ (Kyverno v1.16.3+) ships the CVE-2026-22039 fix, which
      # has a regression that breaks namespaced Policy resources containing any
      # apiCall context entry that uses `service:` instead of `urlPath:` —
      # path.Clean("") becomes "." and trips the new namespace-segment check.
      # Affects our Postgres/Dragonfly CA-bundle policies. Bump back to
      # current once # https://github.com/kyverno/kyverno/pull/16047 is released.
      version: 3.6.2
  values:
    # Global logging for all controllers. The chart default verbosity is 2
    # (trace): the background controller alone emits ~1900 TRC lines (per-UR
    # mutate/generate reconcile traces) on top of startup. 1 keeps INF/WARN/ERR
    # (leader election, deprecation warnings, and the real mutate-conflict
    # errors) while dropping the v=2 trace. Does NOT affect the ERR volume --
    # errors are not verbosity-gated.
    features:
      logging:
        verbosity: 1
    admissionController: &controller_config
      replicas: 2
      revisionHistoryLimit: 1
      # NOTE: resources are deliberately NOT in this anchor. The four controllers
      # have very different profiles (see per-controller blocks below), and the
      # key differs: the admission controller reads `container.resources`, while
      # the other three read `resources` at the controller level. The previous
      # `admissionController.resources` here was the wrong key and was silently
      # ignored for admission (it ran chart defaults 128Mi/384Mi) while the `<<:`
      # merge happened to land it on the correct key for the other three.
      container:
        # Right-sized 2026-08-01 from 14d: p95 CPU 52m (max 125m), peak working
        # set 214Mi — which was ABOVE the 128Mi chart-default request.
        # Memory request == limit throughout (incompressible: a request below
        # the limit lets the node fill to 100% of requests while pods grow into
        # their limits, and the OOM killer's victim is not necessarily the pod
        # that overcommitted). CPU keeps request < limit -- it only throttles.
        resources:
          requests:
            cpu: 75m
            memory: &admission_memory 384Mi
          limits:
            # No CPU limit: CPU is compressible, so the request sets the baseline
            # and a limit only adds throttling.
            memory: *admission_memory
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - ""
              resources:
                - configmaps
                - secrets
              verbs: &all_common_verbs
                - create
                - delete
                - deletecollection
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - apps
              resources:
                - deployments
                - statefulsets
                - daemonsets
              verbs: *all_common_verbs
            - apiGroups:
                - cert-manager.io
              resources:
                - certificates
              verbs: *all_common_verbs
            - apiGroups:
                - gateway.networking.k8s.io
              resources:
                - referencegrants
              verbs: *all_common_verbs
            # Required by the teleport-cr-mirror-policy ClusterPolicy,
            # which clones Teleport CRs from any namespace into security
            # so the operator (which only watches its own namespace) can
            # reconcile them.
            - apiGroups:
                - resources.teleport.dev
              resources:
                - "*"
              verbs: *all_common_verbs
      priorityClassName: system-cluster-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: *app_name
          whenUnsatisfiable: DoNotSchedule
      podDisruptionBudget:
        enabled: true
      serviceMonitor:
        enabled: true
    backgroundController:
      <<: *controller_config
      # Right-sized 2026-08-01 from 14d. This is an INCREASE and the busiest
      # kyverno controller — likely the "kyverno is choking" this config was
      # originally written for. It is leader-elected, so only ONE of the two
      # replicas does work: the active leader averages ~100m with p95 316m and
      # bursts to 1867m, while the standby sits at ~1m. The old 100m request was
      # roughly the leader's *average*, so it was under-reserved most of the time.
      # 300m covers the leader's sustained p95; bursts ride the 2000m limit.
      # Sizing to the leader's p95 rather than its max keeps the idle standby from
      # reserving a core it never uses. Peak working set 274Mi.
      resources:
        requests:
          cpu: 300m
          memory: &background_memory 512Mi
        limits:
          memory: *background_memory
      backgroundScan:
        # TODO this may be too high... default value has changed upstream from 1h to 30s to 1h, back and forth.
        # Shorter duration = more CPU usage, but changes are picked up faster.
        backgroundScanInterval: 1m
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: background-controller
              app.kubernetes.io/instance: *app_name
          whenUnsatisfiable: DoNotSchedule
    cleanupController:
      <<: *controller_config
      # Right-sized 2026-08-01 from 14d: p95 CPU 6m (max 8m), peak working set
      # 127Mi. Effectively idle — it only acts on cleanup policy intervals.
      resources:
        requests:
          cpu: 10m
          memory: &cleanup_memory 256Mi
        limits:
          memory: *cleanup_memory
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup-controller
              app.kubernetes.io/instance: *app_name
          whenUnsatisfiable: DoNotSchedule
    reportsController:
      <<: *controller_config
      # Right-sized 2026-08-01 from 14d: p95 CPU 40m (p99 43m, max 74m), peak
      # working set 165Mi.
      resources:
        requests:
          cpu: 75m
          memory: &reports_memory 320Mi
        limits:
          memory: *reports_memory
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: reports-controller
              app.kubernetes.io/instance: *app_name
          whenUnsatisfiable: DoNotSchedule
