---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kyverno.io/clusterpolicy_v1.json
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: set-workload-revision-history-limit
spec:
  # A webhook outage must not block workload creation.
  failurePolicy: Ignore
  rules:
    # The creator owns the API-defaulted value (10), so the background rules'
    # ownership precondition never matches a new workload. Set it at admission
    # instead. CREATE only: a manager that later writes the field (a chart value,
    # an operator rewriting its spec) wins, with no fight loop.
    - name: set-revision-history-limit-on-create
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
      preconditions:
        all:
          - key: "{{ request.object.spec.revisionHistoryLimit || `10` }}"
            operator: Equals
            value: 10
      mutate:
        patchStrategicMerge:
          spec:
            revisionHistoryLimit: 1
    - name: set-deployment-revision-history-limit
      match:
        any:
          - resources:
              kinds:
                - Deployment
      # Skip when any non-Kyverno manager owns spec.revisionHistoryLimit, so we
      # don't fight operators / charts that set it. Note the creator owns the
      # defaulted value, so this only reaches workloads Kyverno already owns.
      preconditions:
        all:
          - key: '{{ request.object.metadata.managedFields[?fieldsV1."f:spec"."f:revisionHistoryLimit" != null && manager != ''background-controller''] | length(@) }}'
            operator: Equals
            value: 0
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: "{{ request.namespace }}"
            name: "{{ request.object.metadata.name }}"
        patchStrategicMerge:
          spec:
            revisionHistoryLimit: 1
    - name: set-statefulset-revision-history-limit
      match:
        any:
          - resources:
              kinds:
                - StatefulSet
      preconditions:
        all:
          - key: '{{ request.object.metadata.managedFields[?fieldsV1."f:spec"."f:revisionHistoryLimit" != null && manager != ''background-controller''] | length(@) }}'
            operator: Equals
            value: 0
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: apps/v1
            kind: StatefulSet
            namespace: "{{ request.namespace }}"
            name: "{{ request.object.metadata.name }}"
        patchStrategicMerge:
          spec:
            revisionHistoryLimit: 1
    - name: set-daemonset-revision-history-limit
      match:
        any:
          - resources:
              kinds:
                - DaemonSet
      preconditions:
        all:
          - key: '{{ request.object.metadata.managedFields[?fieldsV1."f:spec"."f:revisionHistoryLimit" != null && manager != ''background-controller''] | length(@) }}'
            operator: Equals
            value: 0
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: apps/v1
            kind: DaemonSet
            namespace: "{{ request.namespace }}"
            name: "{{ request.object.metadata.name }}"
        patchStrategicMerge:
          spec:
            revisionHistoryLimit: 1
