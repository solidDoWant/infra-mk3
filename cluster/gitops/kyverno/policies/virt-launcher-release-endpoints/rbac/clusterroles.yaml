---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
# Aggregated into kyverno:background-controller, which applies the
# release-terminal-virt-launcher-endpoints label removal.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:release-terminal-virt-launcher-endpoints
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
# The reports controller watches every kind a policy matches, including the
# migration status subresource the policy triggers on.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:release-terminal-virt-launcher-endpoints
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachineinstancemigrations
      - virtualmachineinstancemigrations/status
    verbs:
      - get
      - list
      - watch
