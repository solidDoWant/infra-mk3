---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: insurgency-a2s-exporter
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: insurgency-a2s-exporter
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: insurgency-a2s-exporter
  values:
    # One controller per game server: the exporter only queries a single address.
    controllers:
      main: &controller
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        strategy: RollingUpdate
        containers:
          app: &container
            image:
              # Only published to Docker Hub
              repository: docker.io/armsnyder/a2s-exporter
              tag: v0.4.0@sha256:76c98734c8e56f056d8f5f090601b3b8320a297c4e6f4acadbb153ffe219aaef
            env: &env
              # srcds answers A2S queries on the game port
              A2S_EXPORTER_QUERY_ADDRESS: insurgency-server.tug2.svc.cluster.local:27000
              # Drop Go runtime and promhttp metrics
              A2S_EXPORTER_A2S_ONLY_METRICS: "true"
              # Per-player series are labelled by player name (unbounded cardinality).
              # Player totals still come from a2s_server_players/a2s_server_bots.
              A2S_EXPORTER_EXCLUDE_PLAYER_METRICS: "true"
            ports:
              - name: metrics
                # Exporter default
                containerPort: &metrics_port 9841
            probes:
              # TCP only: every /metrics request queries the game server, so an HTTP
              # probe would fail (and restart the exporter) whenever the server is down.
              readiness: &probe
                enabled: true
                type: TCP
              liveness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: &memory 32Mi
              limits:
                memory: *memory
      test:
        <<: *controller
        containers:
          app:
            <<: *container
            env:
              <<: *env
              A2S_EXPORTER_QUERY_ADDRESS: insurgency-server.tug2.svc.cluster.local:27001
    defaultPodOptions:
      # The image (scratch, static binary) defines no user
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    service:
      main:
        controller: main
        ports:
          metrics:
            port: *metrics_port
      test:
        controller: test
        ports:
          metrics:
            port: *metrics_port
