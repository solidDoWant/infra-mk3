---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: insurgency-postgres
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/postgres/cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    clusterName: insurgency
    certificates:
      client:
        ca:
          subject: &subject
            countries:
              - US
            provinces:
              - ${SECRET_STATE}
            organizations:
              - infra-mk3
      serving:
        issuerRef:
          name: tug2-intermediary-ca
        subject: *subject
    users:
      insurgency:
        username: insurgency
        # Cert will be reloaded on disk automatically, so no need to restart the pod (which would restart the entire VM as well)
        disableReloading: true
      # Test game server. Gets its own schema in each of the existing databases, holding an
      # independent copy of that database's tables. The schema is named after this role, so
      # the default search_path resolves to it with no client-side configuration. The role has
      # no grants on anything `insurgency` owns in public, and no CREATE on public, so it
      # cannot write there. See docs/insurgency-second-server.md.
      insurgency-test:
        username: insurgency-test
        disableReloading: true
        role:
          comment: Test game server
      # Read-only consumer (stats-api, both the main and test instances)
      stats-api:
        username: stats-api
        disableReloading: true
        # Create a CNPG-managed login role that is a member of the built-in
        # pg_read_all_data role, so it can only SELECT.
        role:
          comment: Read-only stats API consumer
          inRoles:
            - pg_read_all_data
      # Read-only SQL for the Discord bot's query_stats tool, which runs SQL the model writes.
      # Unlike stats-api it is NOT in pg_read_all_data: it reads only the tables granted to it
      # below, so connection_log (player IP addresses) stays out of reach. The bot reloads the
      # cert from disk itself, so a rotation needs no restart.
      #
      # Table grants and role settings aren't declarative here (postInitApplicationSQL only runs
      # on a fresh initdb), so they are applied once by hand as the superuser, e.g.
      #   kubectl -n tug2 exec -i insurgency-postgres-1 -c postgres -- psql -d sourcemod-insurgency-stats
      # A table created later (or dropped and re-created) is unreadable until granted. Keep the
      # list in step with the schema doc in tug2's tools/discord-bot/statsdb_schema.go.
      #   ALTER ROLE "discord-bot" SET temp_file_limit = '256MB';
      #   ALTER ROLE "discord-bot" SET statement_timeout = '5s';
      #   ALTER ROLE "discord-bot" SET default_transaction_read_only = on;
      #   GRANT USAGE ON SCHEMA "insurgency-test" TO "discord-bot";
      #   DO $$ DECLARE s text; t text; BEGIN
      #     FOREACH s IN ARRAY ARRAY['public', 'insurgency-test'] LOOP
      #       FOREACH t IN ARRAY ARRAY['player_stats', 'player_kills', 'weapon_stats', 'bot_kills',
      #           'map_stats', 'win_loss_log', 'maps', 'medics', 'fire_support', 'player_tks',
      #           'player_tk_logs', 'player_drag_mode', 'player_fy_opt_out', 'players_smoke_cache',
      #           'smoke_warning_seen', 'gg2_messages_rotating_player', 'gg2_messages_rotating_admin',
      #           'gg2_messages_join_player'] LOOP
      #         IF to_regclass(format('%I.%I', s, t)) IS NOT NULL THEN
      #           EXECUTE format('GRANT SELECT ON %I.%I TO "discord-bot"', s, t);
      #         END IF;
      #       END LOOP;
      #     END LOOP;
      #   END $$;
      discord-bot:
        username: discord-bot
        disableReloading: true
        role:
          comment: Discord bot, read-only SQL on the stats tables
          connectionLimit: 2
      # Enable the PgBouncer backend user so the read-only pooler can authenticate to the cluster.
      pooler:
        disabled: false
    # Read-only PgBouncer pooler (type: ro, routes to the replicas). stats-api connects here.
    pooler:
      ro:
        enabled: true
    bucket:
      endpoint: https://s3.${SECRET_PUBLIC_DOMAIN_NAME}
    netpol:
      applicationAccess:
        selector:
        selectors:
          # The insurgency game server connects directly to the cluster.
          - matchLabels:
              kubevirt.io/vm: insurgency-server
          # stats-api reaches the read-only pooler. The chart applies these selectors to the
          # pooler ingress as well; stats-api's own egress policy restricts it to the pooler.
          - matchLabels:
              app.kubernetes.io/name: stats-api
              app.kubernetes.io/controller: main
              app.kubernetes.io/instance: stats-api
          # The Discord bot reaches the read-only pooler for query_stats; its own egress policy
          # restricts it to the pooler.
          - matchLabels:
              app.kubernetes.io/name: discord-bot
              app.kubernetes.io/instance: discord-bot
          # stats-api-test connects to the cluster directly (it needs PGOPTIONS, which the
          # pooler drops), as the stats-api role.
          - matchLabels:
              app.kubernetes.io/name: stats-api
              app.kubernetes.io/controller: test
              app.kubernetes.io/instance: stats-api
