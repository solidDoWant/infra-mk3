---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: insurgency-sourcemod-insurgency-stats
spec:
  name: sourcemod-insurgency-stats
  owner: insurgency
  cluster:
    name: insurgency-postgres
  schemas:
    # The test server's copy of this database, independent of public in both content and
    # structure. Starts empty. See docs/insurgency-second-server.md.
    - name: insurgency-test
      owner: insurgency-test
    # Stats v2 for the test server (tug2 issue #44): the new tables and views, written by
    # gg2_stats2 next to the old tables in insurgency-test. The game server's user can't
    # create schemas, so it is made here; gg2_stats2 and the stats_*.sql migrations find it
    # as the one stats_* schema the connecting user owns.
    - name: stats_test
      owner: insurgency-test
