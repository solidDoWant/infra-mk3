---
# SDS configuration for the test server's Postgres client certificate
# Envoy polls /mnt/postgres-test for changes (poll_interval in envoy-config.yaml)
resources:
  - "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret"
    name: postgres_test_client_cert
    tls_certificate:
      certificate_chain:
        filename: /mnt/postgres-test/tls.crt
      private_key:
        filename: /mnt/postgres-test/tls.key
