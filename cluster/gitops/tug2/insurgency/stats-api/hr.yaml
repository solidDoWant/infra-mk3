---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: stats-api
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stats-api
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: stats-api
  values:
    controllers:
      # Serves the public game server's stats (the public schema) under /main.
      stats-api:
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        strategy: RollingUpdate
        containers:
          app:
            image: &image
              repository: harbor.${SECRET_PUBLIC_DOMAIN_NAME}/tug2/stats-api
              tag: 0.0.8
            env:
              LISTEN_ADDR: ":8080"
              # Both instances share the insurgency-stats hostname; the gateway forwards
              # the prefix intact, and the app serves its API, docs and spec under it.
              BASE_PATH: /main
              # Read-only access through the PgBouncer ro pooler (routes to the replicas).
              # pgx reads the standard libpq env vars when DATABASE_URL is unset.
              PGHOST: insurgency-postgres-pooler-ro.tug2.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: &pg_database sourcemod-insurgency-stats
              PGUSER: &pg_user stats-api
              # Tells this instance's sessions apart from stats-api-test's, which use the
              # same role.
              PGAPPNAME: stats-api
              # The pooler serving cert SAN matches the FQDN above, so verify-full is safe.
              PGSSLMODE: &pg_sslmode verify-full
              PGSSLCERT: &pg_sslcert /etc/stats-api/certs/postgres/tls.crt
              PGSSLKEY: &pg_sslkey /etc/stats-api/certs/postgres/tls.key
              PGSSLROOTCERT: &pg_sslrootcert /etc/stats-api/certs/root-ca/ca.crt
              PGOPTIONS: -c statement_timeout=5000 # Fail fast if the database is unresponsive
              # Replaces k8tz injection (see pod annotation). distroless/static ships tzdata.
              TZ: &tz America/Chicago
            ports: &ports
              - name: web
                containerPort: &web_port 8080
              - name: metrics
                containerPort: &metrics_port 9090
            probes: &probes
              # /readyz pings the database; /livez does not. Both stay at the root
              # whatever BASE_PATH is.
              readiness:
                enabled: true
                type: HTTP
                path: /readyz
              liveness:
                enabled: true
                type: HTTP
                path: /livez
            securityContext: &container_security_context
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources: &resources
              requests:
                cpu: 25m
                memory: &memory 128Mi
              limits:
                memory: *memory
                cpu: 500m
        pod: &pod
          annotations:
            # k8tz's nested zoneinfo + /etc/localtime mounts break kata: every pod
            # deleted (weekly, by descheduler PodLifeTime) left an orphaned
            # containerd-shim-kata-v2 whose container task never stops, so kubelet
            # container GC fails "cannot delete running task" forever.
            k8tz.io/inject: "false"
          labels:
            endpoints.netpols.home.arpa/external-ingress-enabled: "true"
          # Harbor project tug2 is private. tug2-pull-credentials-dockerconfig is the
          # kubernetes.io/dockerconfigjson secret derived from tug2-pull-credentials by
          # the Kyverno policy in pull-credentials-policy.yaml.
          imagePullSecrets:
            - name: tug2-pull-credentials-dockerconfig
      # Serves the test game server's stats (the insurgency-test schema) under /test.
      test:
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        strategy: RollingUpdate
        containers:
          app:
            image: *image
            env:
              LISTEN_ADDR: ":8080"
              BASE_PATH: /test
              # Connects to the replicas directly rather than through the pooler. The app's
              # table names are unqualified, so the test schema is selected with a
              # connect-time search_path (PGOPTIONS below), and PgBouncer drops the
              # `options` startup parameter (ignore_startup_parameters).
              PGHOST: insurgency-postgres-ro.tug2.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: *pg_database
              # Same read-only role and client cert as stats-api (pg_read_all_data covers
              # the test schema too).
              PGUSER: *pg_user
              PGAPPNAME: stats-api-test
              # Keeps the total well under max_connections now that this instance doesn't
              # share the pooler.
              DATABASE_URL: postgres:///?pool_max_conns=4
              # The cluster serving cert SAN matches the FQDN above, so verify-full is safe.
              PGSSLMODE: *pg_sslmode
              PGSSLCERT: *pg_sslcert
              PGSSLKEY: *pg_sslkey
              PGSSLROOTCERT: *pg_sslrootcert
              PGOPTIONS: -c search_path=insurgency-test -c statement_timeout=5000
              TZ: *tz
            ports: *ports
            probes: *probes
            securityContext: *container_security_context
            resources: *resources
        pod: *pod
    defaultPodOptions:
      # Run under the kata-containers runtime for VM-level isolation (public-facing API).
      runtimeClassName: kata
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    persistence:
      # Postgres client cert (CN=stats-api) issued by the postgres chart. Left reloadable
      # so the cert secret keeps the cnpg.io/reload label (Kyverno restarts this Deployment
      # on rotation).
      stats-api-postgres-user-cert:
        type: secret
        name: insurgency-postgres-stats-api-user
        defaultMode: 0440
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
        advancedMounts:
          stats-api:
            app:
              - &postgres_cert_mount
                path: /etc/stats-api/certs/postgres
          test:
            app:
              - *postgres_cert_mount
      # Cluster root CA (TLS trust anchor) in its own directory — mounting it as a
      # subPath file inside the postgres cert dir fails (nested volume mount points).
      root-ca:
        type: secret
        name: root-ca-pub-cert
        defaultMode: 0444
        items:
          - key: ca.crt
            path: ca.crt
        advancedMounts:
          stats-api:
            app:
              - &root_ca_mount
                path: /etc/stats-api/certs/root-ca
          test:
            app:
              - *root_ca_mount
    service:
      stats-api:
        controller: stats-api
        ports:
          web:
            port: *web_port
            primary: true
          metrics:
            port: *metrics_port
      test:
        controller: test
        ports:
          web:
            port: *web_port
            primary: true
          metrics:
            port: *metrics_port
    serviceMonitor:
      # /metrics on port 9090; scraped on both replicas of each instance (per-pod
      # metrics). The job label (the service name) tells the instances apart.
      stats-api:
        service:
          identifier: stats-api
        endpoints: &service_monitor_endpoints
          - port: metrics
            path: /metrics
            relabelings:
              # Report `instance` as the pod name rather than the default <pod-ip>:<port>.
              - action: replace
                sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
      test:
        service:
          identifier: test
        endpoints: *service_monitor_endpoints
    route:
      stats-api:
        labels:
          external-dns.home.arpa/publish: "true"
        hostnames:
          - insurgency-stats.${SECRET_PUBLIC_DOMAIN_NAME}
        parentRefs:
          - name: internal-gateway
            namespace: networking
          - name: external-gateway
            namespace: networking
        # Only the two base paths reach the app, so the root-level kubelet-only health
        # endpoints (/readyz, /livez) get the gateway's 404. The prefix is forwarded
        # intact: the app expects it.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /main
            backendRefs:
              - identifier: stats-api
                port: *web_port
          - matches:
              - path:
                  type: PathPrefix
                  value: /test
            backendRefs:
              - identifier: test
                port: *web_port
          # The API used to be served at the root. Redirect the old paths to /main so
          # existing clients and links keep working.
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            filters:
              - type: RequestRedirect
                requestRedirect:
                  statusCode: 301
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /main/api
          - matches:
              - path:
                  type: PathPrefix
                  value: /schemas
            filters:
              - type: RequestRedirect
                requestRedirect:
                  statusCode: 301
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /main/schemas
          - matches:
              - path:
                  type: Exact
                  value: /
              - path:
                  type: Exact
                  value: /docs
            filters:
              - type: RequestRedirect
                requestRedirect:
                  statusCode: 301
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /main/docs
          - matches:
              - path:
                  type: Exact
                  value: /openapi.json
            filters:
              - type: RequestRedirect
                requestRedirect:
                  statusCode: 301
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /main/openapi.json
          - matches:
              - path:
                  type: Exact
                  value: /openapi.yaml
            filters:
              - type: RequestRedirect
                requestRedirect:
                  statusCode: 301
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /main/openapi.yaml
