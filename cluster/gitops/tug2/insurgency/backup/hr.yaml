---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: insurgency-backup
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.19
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: insurgency-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: insurgency-backup
  values:
    jobConfig:
      drType: generic
      drAction: backup
      cronjob:
        schedule: "40 0 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: insurgency-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          size: 1Gi
        postgres:
          - name: &cluster_name insurgency-postgres
            cluster: *cluster_name
