---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-cleanup
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dr-job
      app.kubernetes.io/instance: backup-cleanup
      app.kubernetes.io/controller: backup-tool
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
