---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name email-namespace-issuer
spec:
  targetNamespace: &namespace email
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/email/issuers/namespace
  postBuild:
    substitute:
      NAMESPACE: *namespace
      # mail-archiver is .NET (Npgsql); matches the other namespaces with .NET
      # postgres clients (media, security).
      CERT_ALGORITHM: ECDSA
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: cluster-issuers
