---
# Plain Secret consumed by mail-archiver. The values come from Flux variable
# substitution (cluster-secrets.sops.yaml), so SOPS encryption isn't needed at
# rest in git. Don't use `$` in these values; Flux would try to substitute it.
apiVersion: v1
kind: Secret
metadata:
  name: mail-archiver
type: Opaque
stringData:
  oidc-client-secret: "${SECRET_MAIL_ARCHIVER_AUTHENTIK_OIDC_CLIENT_SECRET}"
  # Encrypts the stored IMAP/M365 credentials (base64 of 32 random bytes, from
  # `openssl rand -base64 32`). Losing it makes every stored credential
  # unreadable; rotate through Security__CredentialEncryptionKeyPrevious.
  credential-encryption-key: "${SECRET_MAIL_ARCHIVER_CREDENTIAL_ENCRYPTION_KEY}"
  # Break-glass local admin. Password login is hidden in the UI (OIDC only),
  # but the account is created on first start and kept for emergency access.
  admin-password: "${SECRET_MAIL_ARCHIVER_ADMIN_PASSWORD}"
