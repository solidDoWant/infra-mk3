---
# Plain Secret consumed by mail-archiver. The values come from Flux variable
# substitution (cluster-secrets.sops.yaml), so SOPS encryption isn't needed at
# rest in git. Don't use `$` in these values; Flux would try to substitute it.
apiVersion: v1
kind: Secret
metadata:
  name: mail-archiver
type: Opaque
stringData:
  oidc-client-secret: "${SECRET_MAIL_ARCHIVER_AUTHENTIK_OIDC_CLIENT_SECRET}"
