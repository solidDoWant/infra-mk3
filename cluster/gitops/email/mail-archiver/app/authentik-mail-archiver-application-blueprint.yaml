---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-mail-archiver-application-blueprint
  labels:
    k8s-sidecar.home.arpa/application: authentik
type: Opaque
stringData:
  # Unfortunately this must be a secret (rather than secretGenerator) or Flux will not substitute
  # values within it
  authentik-mail-archiver-application-blueprint.yaml: |
    ---
    # yaml-language-server: $schema=../../../../../schemas/configs/blueprint.authentik_v1.json
    version: 1
    metadata:
      name: Mail Archiver application
      labels:
        blueprints.goauthentik.io/description: Resources for Mail Archiver SSO
    entries:
      # Dependencies
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Implicit provider authentication
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Password authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Invalidation flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Blueprint library
          required: true
      # Application
      - model: authentik_providers_oauth2.oauth2provider
        id: mail-archiver-provider
        identifiers:
          name: Mail Archiver
        attrs:
          name: Mail Archiver
          authorization_flow:
            !Find [authentik_flows.flow, [slug, implicit-authorization-flow]]
          client_type: confidential
          # Required: the field's model default is an EMPTY list, and the
          # authorize endpoint rejects any grant type not listed. The app runs
          # the browser authorization-code flow (with PKCE).
          grant_types:
            - authorization_code
            - refresh_token
          client_id: "${SECRET_MAIL_ARCHIVER_AUTHENTIK_OIDC_CLIENT_ID}"
          client_secret: "${SECRET_MAIL_ARCHIVER_AUTHENTIK_OIDC_CLIENT_SECRET}"
          # Fixed by the app (not configurable).
          redirect_uris:
            - url: https://mail-archiver.${SECRET_PUBLIC_DOMAIN_NAME}/oidc-signin-completed
              matching_mode: strict
          # Not "authentik Self-signed Certificate": that one has expired, and
          # .NET rejects signing keys whose certificate has expired. This one
          # is renewed by cert-manager (security/authentik/app/oidc-signing-cert.yaml).
          signing_key:
            !Find [authentik_crypto.certificatekeypair, [name, authentik-oidc-signing]]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          # The app requires `sub`, `email`, and `name` or `preferred_username`
          # (from userinfo). The email also matches AdminEmails, so it must be
          # the verified address.
          property_mappings:
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "OpenID 'email' (verified)"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'openid'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'profile'"],
              ]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
      - model: authentik_core.application
        id: mail-archiver-application
        identifiers:
          slug: mail-archiver
        attrs:
          name: Mail Archiver
          slug: mail-archiver
          group: Productivity access
          provider: !KeyOf mail-archiver-provider
          policy_engine_mode: any
          meta_launch_url: https://mail-archiver.${SECRET_PUBLIC_DOMAIN_NAME}
      # Membership is the only gate: the app auto-approves every user who gets
      # through, as a Standard user.
      - model: authentik_core.group
        id: mail-archiver-group
        identifiers:
          name: Mail Archiver access
        attrs:
          attributes:
            discord_role_id: "${SECRET_AUTHENTIK_MAIL_ARCHIVER_DISCORD_ROLE_ID}"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf mail-archiver-group
          target: !KeyOf mail-archiver-application
