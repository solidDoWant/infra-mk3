---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name mail-archiver-backend
spec:
  targetNamespace: email
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/email/mail-archiver/backend
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: prometheus-crds
    - name: cluster-issuers
    - name: email-namespace-issuer
    - name: rook-ceph-cluster
    - name: cloudnative-pg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name mail-archiver
spec:
  targetNamespace: email
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/email/mail-archiver/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: prometheus-crds
    - name: gateway-crds
    - name: rook-ceph-cluster
    - name: mail-archiver-backend
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name mail-archiver-backup
spec:
  targetNamespace: email
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/email/mail-archiver/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: mail-archiver
    - name: volume-snapshot-crds
    - name: rook-ceph-cluster
    - name: prometheus-crds
    - name: email-namespace-issuer
    - name: cluster-issuers
    - name: approver-policy
    - name: openebs
    - name: cloudnative-pg
    - name: democratic-csi-zfs-generic-nfs
