---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postfix-exporter
spec:
  groups:
    - name: postfix-exporter
      rules:
        # The exporter stays scrapeable (`up` = 1) when it cannot read showq.
        # Only the showq series is checked. The mail.log series starts at 0 and
        # turns 1 only when the exporter reads a new log line, so on a quiet relay
        # it stays 0 for hours after every restart.
        - alert: PostfixExporterCannotReadQueue
          expr: postfix_up{path=~".*showq"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Postfix exporter cannot read {{ $labels.path }} on {{ $labels.pod }}"
            description: |
              The postfix exporter in {{ $labels.namespace }}/{{ $labels.pod }} cannot
              read the mail queue via {{ $labels.path }}, so queue metrics are missing.
              Either postfix is down or the shared spool mount is broken.
