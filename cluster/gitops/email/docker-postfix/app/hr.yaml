---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docker-postfix
spec:
  interval: 5m
  chart:
    spec:
      chart: mail
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bokysan-charts
      version: v4.3.0
  values:
    replicaCount: 2
    service:
      # Chart defaults to 587, but doesn't use TLS
      port: 25
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    extraVolumes:
      - name: &secret_name upstream-relay-credentials
        secret:
          defaultMode: 0440
          secretName: *secret_name
          items:
            - key: password
              path: password
      - name: &serving_cert_volume_name serving-cert
        secret:
          defaultMode: 0440
          secretName: email-intermediate-ca-docker-postfix-serving-cert
    extraVolumeMounts:
      - name: *secret_name
        mountPath: /etc/postfix/upstream-relay-credentials
        readOnly: true
      - name: *serving_cert_volume_name
        mountPath: /etc/postfix/certs
        readOnly: true
    # Set the timezone directly instead of letting the k8tz webhook inject it -- see
    # the pod annotation below. The image is Debian-based and ships tzdata, so this
    # resolves natively with no zoneinfo mount needed.
    extraEnv:
      - name: TZ
        value: America/Chicago
    pod:
      annotations:
        # k8tz's injected timezone mounts break container creation under the
        # kata-containers runtime. It mounts a single emptyDir at BOTH
        # /usr/share/zoneinfo (volume root) and /etc/localtime (subPath
        # America/Chicago) -- the file mount's source nested inside the directory
        # mount's source. kata-agent fails that with:
        #   failed to create shim task: File exists (os error 17)
        # so the mail container never starts (StartError, exit 128). Confirmed by
        # A/B on 2026-08-28: the same image on the same node under kata starts fine
        # with injection disabled, and fails with it enabled. It is image-dependent
        # -- debian/busybox-based images fail, alpine-based ones (including the
        # postfix-exporter sidecar, which is why it starts in the same sandbox the
        # mail container dies in) are unaffected.
        k8tz.io/inject: "false"
      labels:
        endpoints.netpols.home.arpa/email-relay: "true"
      #   TODO enable this when migrating workloads to istio
      #   istio.io/dataplane-mode: ambient
    config:
      general:
        ALLOWED_SENDER_DOMAINS: ${SECRET_PUBLIC_DOMAIN_NAME}
        LOG_FORMAT: json
        RELAYHOST: "${SECRET_EMAIL_PROVIDER_HOSTNAME}:587"
        # Provided via secret
        # RELAYHOST_USERNAME:
        RELAYHOST_PASSWORD_FILE: /etc/postfix/upstream-relay-credentials/password
        SMTP_HEADER_CHECKS: "1"
      postfix:
        smtp_tls_security_level: encrypt
        # This can be tested with:
        # kubectl port-forward -n email pods/docker-postfix-mail-0 587:587
        # echo | openssl s_client -connect 127.0.0.1:587 -starttls smtp
        smtpd_tls_chain_files: /etc/postfix/certs/tls.key,/etc/postfix/certs/tls.crt,/etc/postfix/certs/ca.crt
        smtpd_tls_security_level: may
        myhostname: postfix
        message_size_limit: "104448" # 1MB
        inet_protocols: ipv4
  valuesFrom:
    - kind: Secret
      name: upstream-relay-credentials
      valuesKey: username
      targetPath: config.general.RELAYHOST_USERNAME
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              # Use kata-containers runtime
              - op: add
                path: /spec/template/spec/runtimeClassName
                value: kata
            target:
              group: apps
              version: v1
              kind: StatefulSet
