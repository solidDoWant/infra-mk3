---
# Upstream registries for the CI projects' proxy-cache projects
# (cluster/charts/ci/project, docker.registrygate.mirrors), which registrygate
# uses as per-project pull-through mirrors.
#
# No credentials that can read private content, on purpose: a proxy-cache
# project fetches with its endpoint's credential, and anyone holding the
# project's robot could then read whatever that credential can. These caches
# hold public content only; private images are pulled with an
# UpstreamCredential, never through a mirror. The one credential here, Docker
# Hub's, is a "Public Repo Read-only" token, for the account's higher rate
# limit.
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborRegistry
metadata:
  name: ghcr
spec:
  connectionRef:
    name: harbor
  type: github-ghcr
  url: https://ghcr.io
  description: ghcr.io, anonymous (for registrygate's mirrors)
  allowedNamespaces:
    selector:
      matchLabels:
        harbor.soliddowant.dev/ci-project: "true"
---
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborRegistry
metadata:
  name: quay
spec:
  connectionRef:
    name: harbor
  # Harbor's quay adapter can't back a proxy-cache project ("unsupported
  # registry type quay"); quay.io serves the standard registry API.
  type: docker-registry
  url: https://quay.io
  description: quay.io, anonymous (for registrygate's mirrors)
  allowedNamespaces:
    selector:
      matchLabels:
        harbor.soliddowant.dev/ci-project: "true"
---
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborRegistry
metadata:
  name: mirror-gcr
spec:
  connectionRef:
    name: harbor
  type: docker-registry
  url: https://mirror.gcr.io
  description: mirror.gcr.io, anonymous (for registrygate's mirrors)
  allowedNamespaces:
    selector:
      matchLabels:
        harbor.soliddowant.dev/ci-project: "true"
---
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborRegistry
metadata:
  name: dockerhub
spec:
  connectionRef:
    name: harbor
  type: docker-hub
  url: https://hub.docker.com
  description: Docker Hub, with a public-read-only token (for registrygate's mirrors)
  # accessKey and accessSecret (dockerhub-credentials.sops.yaml)
  credentialsSecretRef:
    name: dockerhub-credentials
  allowedNamespaces:
    selector:
      matchLabels:
        harbor.soliddowant.dev/ci-project: "true"
---
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborRegistry
metadata:
  name: ecr-public
spec:
  connectionRef:
    name: harbor
  # Harbor's aws-ecr adapter is for private ECR (it needs AWS credentials);
  # public.ecr.aws serves the standard registry API anonymously.
  type: docker-registry
  url: https://public.ecr.aws
  description: public.ecr.aws, anonymous (for registrygate's mirrors)
  allowedNamespaces:
    selector:
      matchLabels:
        harbor.soliddowant.dev/ci-project: "true"
