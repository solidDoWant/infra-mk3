---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: harbor
spec:
  interval: 1h
  # Stop-gap mirror, pruned 6 months after upstream publishes an OCI chart.
  # Switch to the official chart once https://github.com/goharbor/harbor-helm/issues/2265 lands.
  url: oci://ghcr.io/home-operations/charts-mirror/harbor
  ref:
    tag: 1.19.2
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: harbor
  valuesFrom:
    - kind: ConfigMap
      name: harbor-registry-bucket-hr-config
      valuesKey: regionendpoint
      targetPath: persistence.imageChartStorage.s3.regionendpoint
    - kind: ConfigMap
      name: harbor-registry-bucket-hr-config
      valuesKey: bucket
      targetPath: persistence.imageChartStorage.s3.bucket
  # This is not HA. The HA support is pretty terrible and is missing a support for a ton of basic features
  # like mTLS DB auth and redis failover. Run with a single instance of each component until I get time to
  # fix this mess.
  values:
    expose:
      type: route
      tls:
        # This is a bug. tls.enabled should only be true when ingress is used, not gateway API.
        enabled: false
      route:
        # Internal-only: do not publish a public DNS record via external-dns.
        # labels:
        #   external-dns.home.arpa/publish: "true"
        hosts:
          - harbor.${SECRET_PUBLIC_DOMAIN_NAME}
        parentRefs:
          - name: internal-gateway
            namespace: networking
          # Internal-only: not attached to the public external-gateway.
          # - name: external-gateway
          #   namespace: networking
    externalURL: https://harbor.${SECRET_PUBLIC_DOMAIN_NAME}
    persistence:
      resourcePolicy: ""
      imageChartStorage:
        # Disable S3 redirect for now while I sort out access requirements
        disableredirect: true
        type: s3
        s3:
          # Bucket and endpoint are set via valuesFrom above
          existingSecret: harbor-registry-bucket-credentials
    existingSecretAdminPassword: harbor-admin-credentials
    ipFamily:
      ipv6:
        enabled: false
    logLevel: info
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        metricRelabelings:
          # `pool` is gocraft/work's worker pool ID — 12 random bytes regenerated
          # on every jobservice startup — so it churns ~unboundedly across restarts
          # (e.g. harbor_task_concurrency had ~5k stale pool values in 24h).
          - regex: pool
            action: labeldrop
    portal:
      image:
        repository: docker.io/goharbor/harbor-portal
        tag: v2.15.2@sha256:b811b67f7a7f6f1614e4bdf7478b207d13e8aa3f815ff6ad84f216a5098d213d
      replicas: 2
      revisionHistoryLimit: 1
      podLabels: &external_access_labels
        endpoints.netpols.home.arpa/external-ingress-enabled: "true"
    core:
      image:
        repository: docker.io/goharbor/harbor-core
        tag: v2.15.2@sha256:d7b780d23721a000f0fb8e181add6675eafa336de5d033b77fd7da0c171ff7f7
      replicas: 2
      revisionHistoryLimit: 1
      podLabels: *external_access_labels
      extraEnvVars:
        # This could alternatively be set via `configureUserSettings`, but this doesn't play nice with flux var substitution because the value is a JSON object
        - name: CONFIG_OVERWRITE_JSON
          valueFrom:
            secretKeyRef:
              name: harbor-authentication-config
              key: configureUserSettings
      initContainers:
        - &envoy_sidecar
          name: envoy
          # Contrib image is required because the postgres filter extension is only in the contrib build
          image: envoyproxy/envoy:contrib-v1.40.0
          ports:
            - name: envoy-admin
              containerPort: 8000
          securityContext:
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: postgres-cert
              mountPath: /etc/envoy/secrets/postgres
            # Not mounted while the redis proxy is disabled by
            # https://github.com/envoyproxy/envoy/issues/41659. Nothing reads
            # this cert -- Harbor is on `redis: type: internal` and talks to
            # harbor-redis directly -- but the mount alone made the
            # restart-workload-on-config-changes kyverno policy restart every
            # harbor pod on each hourly rotation of harbor-dragonfly-harbor-user.
            # Restore this together with the redis listener/cluster in the envoy
            # configs.
            # - name: redis-cert
            #   mountPath: /etc/envoy/secrets/redis
            - name: root-ca
              mountPath: /etc/envoy/secrets/root-ca
          restartPolicy: Always
    jobservice:
      image:
        repository: docker.io/goharbor/harbor-jobservice
        tag: v2.15.2@sha256:f71a4452a095bcd2a8f0683648a3ae28415432df87ccfb00ec7625f3e340a598
      replicas: 2
      revisionHistoryLimit: 1
      jobLoggers:
        - database # TODO I might be able to remove this
        - stdout
      initContainers:
        - *envoy_sidecar
    registry:
      registry:
        image:
          repository: docker.io/goharbor/registry-photon
          tag: v2.15.2@sha256:c4ebef61ceb50a3d8bc21d149bc280422db20a1e69df317b64b74098c3615855
      controller:
        image:
          repository: docker.io/goharbor/harbor-registryctl
          tag: v2.15.2@sha256:223d5cb49d5dbf0ba4ae022e7dd9775fa459904112dc12084d3aaa36c1408362
      replicas: 2
      revisionHistoryLimit: 1
      credentials:
        username: harbor-internal
        password: ""
        existingSecret: harbor-internal-registry-credentials
    trivy:
      image:
        repository: docker.io/goharbor/trivy-adapter-photon
        tag: v2.15.2@sha256:215c07b71c37fc7fc16e02d9185d936dcb8884a80e810817c2cd058bbd7c4e98
      replicas: 2
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 256Mi
      ignoreUnfixed: true
      initContainers:
        - <<: *envoy_sidecar
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            # Not mounted while the redis proxy is disabled by
            # https://github.com/envoyproxy/envoy/issues/41659. Nothing reads
            # this cert -- Harbor is on `redis: type: internal` and talks to
            # harbor-redis directly -- but the mount alone made the
            # restart-workload-on-config-changes kyverno policy restart every
            # harbor pod on each hourly rotation of harbor-dragonfly-harbor-user.
            # Restore this together with the redis listener/cluster in the envoy
            # configs.
            # - name: redis-cert
            #   mountPath: /etc/envoy/secrets/redis
            - name: root-ca
              mountPath: /etc/envoy/secrets/root-ca
    database:
      type: external
      external:
        # This uses the password auth, and no TLS. Envoy sidecars on all pods that access the DB
        # will proxy the DB connections and authenticate via mTLS.
        host: 127.0.0.1
        username: harbor
        coreDatabase: harbor
        maxOpenConns: 50
        maxIdleConns: 10
    redis:
      type: internal
      internal:
        image:
          repository: docker.io/goharbor/valkey-photon
          tag: v2.15.2@sha256:7337783e8148f01a25b113f5c7b1d640f78b1860fcaf80a33d0dbb294f7b99d0
      # This does not currently work due to https://github.com/envoyproxy/envoy/issues/41659
      # type: external
      # external:
      #   # See above DB note about Envoy sidecar for mTLS
      #   # This is only used by the registry service due to the envoy redis connection pooling mess
      #   addr: 127.0.0.1:6379
    exporter:
      image:
        repository: docker.io/goharbor/harbor-exporter
        tag: v2.15.2@sha256:e1b0a248f61aad5084c5d1612d5f1da89f99c23ce743eaf8cba913d6d00c0547
      revisionHistoryLimit: 1
      # TODO, this will require changing the ServiceMonitor to avoid metric duplication
      # replicas: 2
  postRenderers:
    # Add the cert and envoy config volumes to envoy sidecars
    - kustomize:
        patches:
          - patch: |
              # Add the postgres user cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: postgres-cert
                  secret:
                    secretName: harbor-postgres-harbor-user
                    items:
                      - key: tls.crt
                        path: tls.crt
                      - key: tls.key
                        path: tls.key
                    defaultMode: 0440
              # The redis user cert volume is not added while the redis proxy is
              # disabled by https://github.com/envoyproxy/envoy/issues/41659.
              # See the note on the sidecar volumeMount above.
              # - op: add
              #   path: /spec/template/spec/volumes/-
              #   value:
              #     name: redis-cert
              #     secret:
              #       secretName: harbor-dragonfly-harbor-user
              #       items:
              #         - key: tls.crt
              #           path: tls.crt
              #         - key: tls.key
              #           path: tls.key
              #       defaultMode: 0440
              # Add the root CA cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: root-ca
                  secret:
                    secretName: root-ca-pub-cert
                    items:
                      - key: ca.crt
                        path: ca.crt
                    defaultMode: 0444
              # Add the envoy config volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: envoy-config
                  configMap:
                    name: harbor-envoy-pg-redis-config
                    defaultMode: 0440
            target:
              group: apps
              version: v1
              kind: Deployment
              name: harbor-core
    - kustomize:
        patches:
          - patch: |
              # Add the postgres user cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: postgres-cert
                  secret:
                    secretName: harbor-postgres-harbor-user
                    items:
                      - key: tls.crt
                        path: tls.crt
                      - key: tls.key
                        path: tls.key
                    defaultMode: 0440
              # The redis user cert volume is not added while the redis proxy is
              # disabled by https://github.com/envoyproxy/envoy/issues/41659.
              # See the note on the sidecar volumeMount above.
              # - op: add
              #   path: /spec/template/spec/volumes/-
              #   value:
              #     name: redis-cert
              #     secret:
              #       secretName: harbor-dragonfly-harbor-user
              #       items:
              #         - key: tls.crt
              #           path: tls.crt
              #         - key: tls.key
              #           path: tls.key
              #       defaultMode: 0440
              # Add the root CA cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: root-ca
                  secret:
                    secretName: root-ca-pub-cert
                    items:
                      - key: ca.crt
                        path: ca.crt
                    defaultMode: 0444
              # Add the envoy config volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: envoy-config
                  configMap:
                    name: harbor-envoy-pg-redis-config
                    defaultMode: 0440
            target:
              group: apps
              version: v1
              kind: Deployment
              name: harbor-jobservice
    - kustomize:
        patches:
          - patch: |
              # Add an empty volume list
              - op: add
                path: /spec/template/spec/volumes
                value: []
              # The redis user cert volume is not added while the redis proxy is
              # disabled by https://github.com/envoyproxy/envoy/issues/41659.
              # See the note on the sidecar volumeMount above.
              # - op: add
              #   path: /spec/template/spec/volumes/-
              #   value:
              #     name: redis-cert
              #     secret:
              #       secretName: harbor-dragonfly-harbor-user
              #       items:
              #         - key: tls.crt
              #           path: tls.crt
              #         - key: tls.key
              #           path: tls.key
              #       defaultMode: 0440
              # Add the root CA cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: root-ca
                  secret:
                    secretName: root-ca-pub-cert
                    items:
                      - key: ca.crt
                        path: ca.crt
                    defaultMode: 0444
              # Add the envoy config volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: envoy-config
                  configMap:
                    name: harbor-envoy-redis-only-config
                    defaultMode: 0440
            target:
              group: apps
              version: v1
              kind: StatefulSet
              name: harbor-trivy
    # This deployment does not support `initContainers`, so a patch is needed for it here as well
    - kustomize:
        patches:
          - patch: |
              # Add the postgres user cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: postgres-cert
                  secret:
                    secretName: harbor-postgres-harbor-user
                    items:
                      - key: tls.crt
                        path: tls.crt
                      - key: tls.key
                        path: tls.key
                    defaultMode: 0440
              # The redis user cert volume is not added while the redis proxy is
              # disabled by https://github.com/envoyproxy/envoy/issues/41659.
              # See the note on the sidecar volumeMount above.
              # - op: add
              #   path: /spec/template/spec/volumes/-
              #   value:
              #     name: redis-cert
              #     secret:
              #       secretName: harbor-dragonfly-harbor-user
              #       items:
              #         - key: tls.crt
              #           path: tls.crt
              #         - key: tls.key
              #           path: tls.key
              #       defaultMode: 0440
              # Add the root CA cert volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: root-ca
                  secret:
                    secretName: root-ca-pub-cert
                    items:
                      - key: ca.crt
                        path: ca.crt
                    defaultMode: 0444
              # Add the envoy config volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: envoy-config
                  configMap:
                    name: harbor-envoy-pg-redis-config
                    defaultMode: 0440
              # Add the envoy sidecar init container
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: envoy
                    # Contrib image is required because the postgres filter extension is only in the contrib build
                    image: envoyproxy/envoy:contrib-v1.39.1
                    ports:
                      - name: envoy-admin
                        containerPort: 8000
                    securityContext:
                      capabilities:
                        drop:
                          - ALL
                      privileged: false
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: envoy-config
                        mountPath: /etc/envoy
                      - name: postgres-cert
                        mountPath: /etc/envoy/secrets/postgres
                      # redis-cert not mounted while the redis proxy is disabled
                      # by https://github.com/envoyproxy/envoy/issues/41659.
                      # - name: redis-cert
                      #   mountPath: /etc/envoy/secrets/redis
                      - name: root-ca
                        mountPath: /etc/envoy/secrets/root-ca
                    restartPolicy: Always
            target:
              group: apps
              version: v1
              kind: Deployment
              name: harbor-exporter
