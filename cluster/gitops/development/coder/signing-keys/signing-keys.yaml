---
# Runs the k8s-vm-workspace template's signing-key Jobs: at every workspace
# start one adds a fresh SSH signing key to the owner's GitHub account, and at
# stop one deletes it. The Jobs' pods opt in to githubgate interception (pod
# label), so their plain curl calls to api.github.com go through githubgate,
# which sends them with the owner's user access token (ci/soliddowant). The
# pods never see the token. Created by the template, never by Flux.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-signing-keys
automountServiceAccountToken: false
---
apiVersion: githubgate.soliddowant.dev/v1alpha1
kind: GitHubAccessPolicy
metadata:
  name: coder-signing-keys
spec:
  serviceAccounts:
    - coder-signing-keys
  rules:
    - name: signing-keys
      userAuthorizationRef:
        namespace: ci
        name: soliddowant
      proxy:
        enabled: true
        allowOperations:
          - users/list-ssh-signing-keys-for-authenticated-user
          - users/create-ssh-signing-key-for-authenticated-user
          - users/delete-ssh-signing-key-for-authenticated-user
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coder-signing-keys
specs:
  - description: coder-signing-keys
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: coder-signing-keys
    egress:
      # DNS resolution (the interceptor resolves githubgate-proxy.ci.svc)
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # githubgate's proxy (ci/githubgate), which the injected interceptor
      # sends the GitHub requests to. Nothing goes to GitHub directly.
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: ci
              app.kubernetes.io/name: githubgate
              app.kubernetes.io/instance: githubgate
        toPorts:
          - ports:
              - port: "9443"
                protocol: TCP
