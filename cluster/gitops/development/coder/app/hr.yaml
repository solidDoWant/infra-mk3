---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  interval: 5m
  chart:
    spec:
      chart: coder
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: coder-charts
      version: 2.28.3
  valuesFrom:
    - kind: Secret
      name: coder-helm-values
  values:
    coder:
      image:
        pullSecrets:
          - name: coder-pull-credentials
      securityContext:
        readOnlyRootFilesystem: true
      podLabels:
        endpoints.netpols.home.arpa/email-sender: "true"
      serviceAccount:
        extraRules:
          - apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - coder-claude-oauth-token
            verbs:
              - get
          # Read cluster info (e.g. public domain) for the workspace template
          - apiGroups:
              - ""
            resources:
              - configmaps
            resourceNames:
              - coder-workspace-cluster-info
            verbs:
              - get
          # Rule to manage CiliumNetworkPolicy objects for workspaces
          - apiGroups:
              - cilium.io
            resources:
              - ciliumnetworkpolicies
            verbs:
              - "*"
          # Rule to manage PDBs for workspaces
          - apiGroups:
              - policy
            resources:
              - poddisruptionbudgets
            verbs:
              - "*"
          # Manage service accounts for workspaces
          - apiGroups:
              - ""
            resources:
              - serviceaccounts
            verbs:
              - "*"
          # Rule to manage resource claim templates for workspaces
          - apiGroups:
              - resource.k8s.io
            resources:
              - resourceclaimtemplates
            verbs:
              - "*"
          # Rule to manage KubeVirt VirtualMachines for VM workspaces
          # (k8s-vm-workspace template)
          - apiGroups:
              - kubevirt.io
            resources:
              - virtualmachines
            verbs:
              - "*"
          # Rule to manage CDI DataVolumes backing VM workspace root disks
          # (k8s-vm-workspace template - the per-workspace root is a standalone
          # DataVolume, not a dataVolumeTemplate; see the template's vm.tf)
          - apiGroups:
              - cdi.kubevirt.io
            resources:
              - datavolumes
            verbs:
              - "*"
          # Rule to manage per-workspace cloud-init Secrets (k8s-vm-workspace
          # template). KubeVirt caps inline cloudInitNoCloud userData at 2048
          # bytes, so the VM references a Secret instead.
          #
          # This cannot be narrowed with resourceNames - RBAC does not evaluate
          # them for `create`, since the name is not known at authorization time -
          # so it is namespace-wide write on Secrets, which would otherwise let a
          # template overwrite the Postgres client cert, the Harbor pull
          # credentials or the Claude token. The Kyverno policy in ./rbac.yaml
          # confines this SA to Secrets labelled as workspace resources.
          - apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
      podSecurityContext:
        fsGroup: 1000
      volumes:
        - name: postgres-user-cert
          secret:
            secretName: coder-postgres-coder-user
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            defaultMode: 0400
        - name: postgres-serving-cert
          secret:
            secretName: coder-postgres-serving-cert
            items:
              - key: tls.crt
                path: tls.crt
            defaultMode: 0400
        - name: coder-startup
          image:
            reference: harbor.${SECRET_PUBLIC_DOMAIN_NAME}/coder/coder-startup:0.0.2
        - name: temp
          emptyDir:
            sizeLimit: 4Gi
      volumeMounts:
        - name: postgres-user-cert
          mountPath: /etc/coder/certs/postgres/user
          readOnly: true
        - name: postgres-serving-cert
          mountPath: /etc/coder/certs/postgres/serving
          readOnly: true
        - name: coder-startup
          mountPath: /coder-startup
          readOnly: true
        - name: temp
          mountPath: /tmp
          subPath: tmp
        - name: temp
          mountPath: /home/coder/.cache
          subPath: cache
      resources:
        requests: {}
        limits: {}
      service:
        type: ClusterIP
      command:
        - /coder-startup/coder-startup
