---
# The bulk-pool-01 NFS pool for k8s-vm-workspace VMs that enable "Mount NFS
# storage". The kubelet mounts it on the node, like the apps' inline NFS
# volumes, and the template shares the PVC with the guest over virtiofs (vm.tf),
# so the VM's netpol needs no egress to the NFS server and the guest needs no
# NFS client. One mount of the pool root exposes every share under it.
# virtiofsd runs as uid 107: it can read the pool and write only where the
# pool's modes let any user write (e.g. media/downloads, media/library).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: coder-vm-workspace-bulk-pool-01
spec:
  capacity:
    # Not enforced for NFS; required by the API.
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: development
    name: coder-vm-workspace-bulk-pool-01
  nfs:
    server: ${NFS_ADDRESS}
    path: /mnt/bulk-pool-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coder-vm-workspace-bulk-pool-01
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: coder-vm-workspace-bulk-pool-01
  resources:
    requests:
      storage: 1Ti
