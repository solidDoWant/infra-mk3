---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-renovate-application-blueprint
  labels:
    k8s-sidecar.home.arpa/application: authentik
type: Opaque
stringData:
  # Must be a Secret (not secretGenerator) so Flux substitution applies inside.
  authentik-renovate-application-blueprint.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Renovate application
      labels:
        blueprints.goauthentik.io/description: OIDC provider for the Renovate operator UI
    entries:
      # Dependencies
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Implicit provider authentication
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Password authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Invalidation flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Blueprint library
          required: true
      # Replaces the default 'profile' mapping for this provider. The operator
      # stores the groups claim twice (once in the session, once inside the raw
      # ID token kept for logout) in a cookie limited to 4 KB, so it only gets
      # the groups it authorizes on. picture is omitted for the same reason.
      - model: authentik_providers_oauth2.scopemapping
        id: renovate-profile-scope
        identifiers:
          name: Renovate profile
        attrs:
          name: Renovate profile
          scope_name: profile
          description: General profile information, Renovate groups only
          expression: |
            return delete_none_values({
                "name": request.user.name,
                "given_name": ak_obj_attr(request.user, "given_name", "name"),
                "family_name": ak_obj_attr(request.user, "family_name"),
                "preferred_username": request.user.username,
                "nickname": request.user.username,
                "groups": [
                    group.name
                    for group in request.user.groups.filter(name__startswith="Renovate ")
                ],
            })
      # Application
      - model: authentik_providers_oauth2.oauth2provider
        id: renovate-provider
        identifiers:
          name: Renovate
        attrs:
          name: Renovate
          authorization_flow:
            !Find [authentik_flows.flow, [slug, implicit-authorization-flow]]
          client_type: confidential
          client_id: "${SECRET_RENOVATE_AUTHENTIK_OIDC_CLIENT_ID}"
          client_secret: "${SECRET_RENOVATE_AUTHENTIK_OIDC_CLIENT_SECRET}"
          # The model default is an EMPTY list, which rejects every login.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - url: https://renovate.${SECRET_PUBLIC_DOMAIN_NAME}/auth/callback
              matching_mode: strict
          signing_key:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: hours=4
          refresh_token_validity: days=2
          # 'profile' carries the groups claim, which the operator's
          # authorization.defaults.adminGroups is matched against.
          property_mappings:
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "OpenID 'email' (verified)"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'openid'"],
              ]
            - !KeyOf renovate-profile-scope
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
      - model: authentik_core.application
        id: renovate-application
        identifiers:
          slug: renovate
        attrs:
          name: Renovate
          slug: renovate
          group: Development access
          provider: !KeyOf renovate-provider
          policy_engine_mode: any
          meta_launch_url: https://renovate.${SECRET_PUBLIC_DOMAIN_NAME}
      # Groups
      - model: authentik_core.group
        id: renovate-users-group
        identifiers:
          name: Renovate users
        attrs:
          attributes:
            discord_role_id: "${SECRET_AUTHENTIK_RENOVATE_USERS_DISCORD_ROLE_ID}"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf renovate-users-group
          target: !KeyOf renovate-application
