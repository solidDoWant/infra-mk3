---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: renovate-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: mogenius-charts
      version: 6.4.0
  values:
    fullnameOverride: renovate-operator
    # >1 enables leader election: only the leader runs the scheduler and
    # executor. UI/webhook requests are served by every replica (sessions live
    # in encrypted cookies, triggers are written to RenovateProject status).
    replicaCount: 2
    # Render the CRDs as regular templates instead of a pre-install kubectl hook Job.
    crd:
      install: true
      mode: template
    rbac:
      # RenovateJobs only live in this namespace.
      ownNamespaceOnly: true
    deployment:
      podLabels:
        # Ingress allow into the openid-configuration-proxy.
        endpoints.netpols.home.arpa/oidc-querier: "true"
    resources:
      requests:
        cpu: 10m
        memory: &memory 256Mi
      limits:
        memory: *memory

    config:
      # No log store: the UI streams logs from the Job pod, which outlives the
      # next hourly run. Full history is in VictoriaLogs.
      jobTTLSecondsAfterFinished: 86400

    # Renovate repository cache, forwarded to the job pods.
    s3:
      bucket: renovate-operator
      endpoint: https://s3.${SECRET_PUBLIC_DOMAIN_NAME}
      forcePathStyle: true
      # Generated by the build-renovate-operator-bucket-config Kyverno policy.
      existingSecret: renovate-operator-bucket-credentials

    route:
      enabled: true
      hostnames:
        - renovate.${SECRET_PUBLIC_DOMAIN_NAME}
      parentRefs:
        - name: internal-gateway
          namespace: networking

    # The webhook server listens on its own port. It is exposed on the external
    # gateway by webhook-httproute.yaml (GitHub path only), not by the chart's
    # route, which always adds a catch-all rule.
    webhook:
      enabled: true
      baseUrl: https://renovate-webhook.${SECRET_PUBLIC_DOMAIN_NAME}

    auth:
      oidc:
        enabled: true
        # Canonical in-cluster OIDC origin; browser-facing endpoints are
        # rewritten to the public Authentik host by the proxy.
        issuerUrl: https://openid-configuration-proxy.security.svc.cluster.local/application/o/renovate/
        clientId: ${SECRET_RENOVATE_AUTHENTIK_OIDC_CLIENT_ID}
        existingSecret: renovate-operator-oidc
        secretKey: client-secret
        # Fixed key: sessions are encrypted cookies, so every replica must
        # derive the same key (unset = random per pod).
        sessionSecretKey: session-secret
        # The chart derives an http:// URL from route.hostnames.
        redirectUrl: https://renovate.${SECRET_PUBLIC_DOMAIN_NAME}/auth/callback
        # Used only by the OIDC client; replaces its trust store.
        caCert:
          existingSecret: root-ca-pub-cert
          key: ca.crt
          mountPath: /etc/renovate-operator/certs/root-ca/ca.crt

    authorization:
      enabled: true
      defaults:
        adminGroups:
          - Renovate users

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              grafana.home.arpa/instance: grafana
  postRenderers:
    - kustomize:
        patches:
          # The chart defines no probes. /health always returns 200 (including
          # on the non-leader replica) once the UI server is up.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: renovate-operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: renovate-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: renovate-operator
                        livenessProbe: &probe
                          httpGet:
                            path: /health
                            port: http
                          periodSeconds: 10
                          timeoutSeconds: 2
                        readinessProbe: *probe
