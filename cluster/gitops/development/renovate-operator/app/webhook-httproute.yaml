---
# Only the GitHub handler is reachable from the internet; /webhook/v1/schedule
# and the other platform handlers stay unexposed. Every request must carry a
# valid HMAC signature (RenovateJob spec.webhook.authentication).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate-operator-webhook
  labels:
    external-dns.home.arpa/publish: "true"
spec:
  hostnames:
    - renovate-webhook.${SECRET_PUBLIC_DOMAIN_NAME}
  parentRefs:
    - name: external-gateway
      namespace: networking
  rules:
    - backendRefs:
        - name: renovate-operator
          port: 8082
      matches:
        - path:
            type: PathPrefix
            value: /webhook/v1/github
