---
# Values come from Flux variable substitution (cluster-secrets.sops.yaml), so
# SOPS encryption isn't needed at rest in git.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-operator-oidc
type: Opaque
stringData:
  client-secret: "${SECRET_RENOVATE_AUTHENTIK_OIDC_CLIENT_SECRET}"
  session-secret: "${SECRET_RENOVATE_OPERATOR_SESSION_SECRET}"
