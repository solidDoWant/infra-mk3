---
# Routes Renovate's traffic through a proxy that retries ghcr.io lookups
# (envoy.yaml): adds it to the executor pods as a native sidecar, plus the
# global config that points Renovate at it. The RenovateJobTemplate has no
# field for extra containers, and a RenovateJob's extraEnv replaces the
# template's.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: inject-renovate-ghcr-proxy
spec:
  # An unmutated pod looks up ghcr.io directly, as before this policy.
  failurePolicy: Ignore
  background: false
  rules:
    - name: inject-renovate-ghcr-proxy
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only: a pod spec is immutable, so mutating UPDATEs
              # deadlocks finalizer removal on completed Job pods.
              operations:
                - CREATE
              selector:
                matchLabels:
                  renovate-operator.mogenius.com/type: executor
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - name: ghcr-proxy
                image: mirror.gcr.io/envoyproxy/envoy:contrib-v1.40.2@sha256:dc50a95c3d54a8f98cf682494db6fc42d77fde4ef12404fac3654d866a1f405d
                restartPolicy: Always
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  runAsNonRoot: true
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 64Mi
                volumeMounts:
                  - name: ghcr-proxy-config
                    mountPath: /etc/envoy
            containers:
              - name: renovate
                env:
                  # insecureRegistry: ghcr.io lookups go out as plain HTTP so
                  # the proxy can retry them; it adds TLS upstream. Package
                  # names keep ghcr.io, so repo packageRules match unchanged.
                  # RENOVATE_TOKEN (GitHub App) comes from the operator's envFrom
                  # Secret; Kubernetes expands it. `\$(` stops Kyverno reading
                  # it as a $() reference.
                  - name: RENOVATE_HOST_RULES
                    value: |-
                      [{"matchHost":"ghcr.io","hostType":"docker","insecureRegistry":true,"username":"x-access-token","password":"\$(RENOVATE_TOKEN)"}]
                  # Also carries HTTPS (as CONNECT): Renovate's proxy agent
                  # falls back to HTTP_PROXY when HTTPS_PROXY is unset.
                  - name: HTTP_PROXY
                    value: http://127.0.0.1:10000
                  - name: NO_PROXY
                    value: localhost,127.0.0.1,.svc,.cluster.local
                  # Renovate reads up to 1000 GHCR pages only when the host is
                  # literally https://ghcr.io; over plain HTTP, the default
                  # 20-page cap drops the newest tags (GHCR lists oldest-first).
                  # immich-machine-learning alone is 200+ pages.
                  - name: RENOVATE_DOCKER_MAX_PAGES
                    value: "1000"
            volumes:
              - name: ghcr-proxy-config
                configMap:
                  name: renovate-ghcr-proxy-config
                  defaultMode: 0444
