---
# Forward proxy on 127.0.0.1:10000 for the Renovate executor pods, injected by
# inject-ghcr-proxy-policy.yaml as their HTTP_PROXY. ghcr.io lookups arrive as
# plain HTTP (insecureRegistry) and go upstream over TLS with retries; all
# other traffic arrives as CONNECT and is tunnelled untouched. Renovate's
# proxy agent sends HTTPS to HTTP_PROXY when HTTPS_PROXY is unset, so the
# tunnel is required.
#
# GHCR burst-limits with 429 and no Retry-After header; Renovate retries page
# requests only twice, never retries its auth probe, and one failed page
# discards the whole lookup as "no-result". Images with tens of thousands of
# tags (immich: 30+ pages) hit it most. Envoy retries harder.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 8000

# JSON lines for fluent-bit (promote-envoy-sidecar-message). %j escapes the
# message for JSON.
application_log_config:
  log_format:
    json_format:
      time: "%Y-%m-%dT%T.%e%z"
      level: "%l"
      logger: "%n"
      source: "%g:%#"
      msg: "%j"

node:
  id: envoy-renovate-ghcr-proxy
  cluster: development

static_resources:
  listeners:
    - name: ghcr_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ghcr
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          authority: "%REQ(:AUTHORITY)%"
                          path: "%REQ(:PATH)%"
                          status: "%RESPONSE_CODE%"
                          attempts: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"
                          flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                route_config:
                  virtual_hosts:
                    # Port-less authority: plain-HTTP registry requests only.
                    # CONNECT ghcr.io:443 (the token realm) falls through to
                    # the tunnel.
                    - name: ghcr
                      domains:
                        - ghcr.io
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: ghcr
                            # Under Renovate's 60s request timeout, so Envoy's
                            # final answer arrives before Renovate gives up.
                            timeout: 50s
                            retry_policy:
                              retry_on: retriable-status-codes,5xx,reset,connect-failure
                              retriable_status_codes:
                                - 429
                              num_retries: 8
                              per_try_timeout: 20s
                              retry_back_off:
                                base_interval: 0.25s
                                max_interval: 5s
                    - name: tunnel
                      domains:
                        - "*"
                      routes:
                        - match:
                            connect_matcher: {}
                          route:
                            cluster: dynamic_forward_proxy
                            # Tunnels outlive any request timeout (git clones).
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                upgrade_configs:
                  - upgrade_type: CONNECT
                http_filters:
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: &dns_cache
                        name: tunnel
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ghcr
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: ghcr
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ghcr.io
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: ghcr.io
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: ghcr.io

    - name: dynamic_forward_proxy
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: *dns_cache
