---
# yaml-language-server: $schema=../../../../../schemas/crds/renovatejob_v1alpha1.json
# Scope is whatever repositories the GitHub App is installed on (autodiscovery,
# no filters).
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
spec:
  schedule: "0 * * * *"
  # Slim image: tools (Go, Terraform, Python, Nix, ...) are installed on demand
  # (binarySource: install).
  image: ghcr.io/renovatebot/renovate:44.141.0
  provider:
    name: github
  # The operator mints a short-lived installation token from these and injects
  # it as RENOVATE_TOKEN.
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: app-id
    installationIdSecretKey: installation-id
    pemSecretKey: private-key.pem
  skipForks: true
  parallelism: 2
  resources:
    requests:
      cpu: 500m
      memory: &memory 2Gi
    limits:
      memory: *memory
  # Configured as the GitHub App's own webhook (Issues + Pull request events),
  # so no per-repo webhook sync is needed.
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
  renovateConfig:
    fileName: config.json5
    inline: |
      {
        binarySource: "install",
        onboarding: true,
        // Commits are made through the GitHub API, so GitHub signs them as
        // the App.
        platformCommit: "enabled",
      }
