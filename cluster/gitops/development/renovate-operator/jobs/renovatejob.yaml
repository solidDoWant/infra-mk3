---
# yaml-language-server: $schema=../../../../../schemas/crds/renovatejob_v1alpha1.json
# Every repository the GitHub App is installed on, except infra-mk3. No
# postUpgradeTasks commands are allowed here: the command is matched by string,
# but the code it runs comes from the repository being processed.
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
spec:
  templateRef:
    name: renovate
  # Case-insensitive, like the glob in renovate-infra-mk3, so the two jobs
  # never both pick up the repository.
  discoveryFilters:
    - "!/^soliddowant\\/infra-mk3$/i"
---
# yaml-language-server: $schema=../../../../../schemas/crds/renovatejob_v1alpha1.json
# infra-mk3 only, with postUpgradeTasks commands allowed. Anyone who can push to
# infra-mk3 already controls the cluster through Flux.
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-infra-mk3
spec:
  templateRef:
    name: renovate
  discoveryFilters:
    - solidDoWant/infra-mk3
  extraEnv:
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^go -C cluster/gitops/monitoring/victoria-metrics/sync-job/tool run \\.$"]'
