---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vaultwarden-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.20
    digest: sha256:62a08c11d4ded623adc7078f8eda8644e4e0afcb0313be78fcaa675ccce6df72
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: vaultwarden-backup
  values:
    resources:
      controllers:
        backup-tool:
          containers:
            backup-tool:
              # The chart passes this to the pods the tool starts (BACKUP_TOOL_IMAGE).
              image:
                repository: ghcr.io/soliddowant/backup-tool
                tag: 0.0.20@sha256:3ca5d08a0d6b05810cc75694e105061b90531184e06960bf8321e6dfbb9ce9e4
    jobConfig:
      drType: vaultwarden
      drAction: backup
      cronjob:
        schedule: "50 0 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: vaultwarden-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
        dataPVCName: vaultwarden-data
        cluster:
          name: vaultwarden-postgres
