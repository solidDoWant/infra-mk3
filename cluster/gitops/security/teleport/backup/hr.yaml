---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: teleport-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.21
    digest: sha256:f8e3b08309cd008c64c2748756a8391f76a7ece01f482f3cd653887b9346ac48
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: teleport-backup
  values:
    resources:
      controllers:
        backup-tool:
          containers:
            backup-tool:
              # The chart passes this to the pods the tool starts (BACKUP_TOOL_IMAGE).
              image:
                repository: ghcr.io/soliddowant/backup-tool
                tag: 0.0.21@sha256:b6320c6ff76a5f4c431c843771c346c803bbb299ab81234fada80c2ebb58c4ca
    jobConfig:
      drType: teleport
      drAction: backup
      cronjob:
        schedule: "40 1 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: teleport-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          snapshotLabels:
            # Selected (newest per PVC) by tape-archiver runs
            tape.home.arpa/archive: "true"
        cnpgClusters:
          core:
            name: teleport-core-postgres
          audit:
            name: teleport-audit-postgres
        auditSessionLogs:
          credentials:
            # Required when not using AWS S3
            region: dummy-value
            s3ForcePathStyle: true
  valuesFrom:
    - kind: Secret
      name: teleport-audit-sessions
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: jobConfig.configFile.auditSessionLogs.credentials.accessKeyId
    - kind: Secret
      name: teleport-audit-sessions
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: jobConfig.configFile.auditSessionLogs.credentials.secretAccessKey
    - kind: ConfigMap
      name: teleport-audit-sessions-backup-vars
      valuesKey: endpoint
      targetPath: jobConfig.configFile.auditSessionLogs.credentials.endpoint
    - kind: ConfigMap
      name: teleport-audit-sessions-backup-vars
      valuesKey: s3Path
      targetPath: jobConfig.configFile.auditSessionLogs.s3Path
