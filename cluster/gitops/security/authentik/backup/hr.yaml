---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: authentik-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.19
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: authentik-backup
  values:
    jobConfig:
      drType: authentik
      drAction: backup
      cronjob:
        schedule: "20 1 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: authentik-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
        cluster:
          name: authentik-postgres
        s3:
          credentials:
            # Required when not using AWS S3
            region: dummy-value
            s3ForcePathStyle: true
  valuesFrom:
    - kind: Secret
      name: authentik-media
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: jobConfig.configFile.s3.credentials.accessKeyId
    - kind: Secret
      name: authentik-media
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: jobConfig.configFile.s3.credentials.secretAccessKey
    - kind: ConfigMap
      name: authentik-media-backup-vars
      valuesKey: endpoint
      targetPath: jobConfig.configFile.s3.credentials.endpoint
    - kind: ConfigMap
      name: authentik-media-backup-vars
      valuesKey: s3Path
      targetPath: jobConfig.configFile.s3.s3Path
