---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: authentik
spec:
  interval: 1h
  url: oci://ghcr.io/goauthentik/helm-charts/authentik
  ref:
    tag: 2026.8.5
    digest: sha256:9683518d02b5e41f69d045b59a779c40260608b5631d18273407ea2cfe708712
---
# cspell:words REQS certfile
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name authentik
spec:
  interval: 5m
  # DB migrations can outlast the 5m default; a rollback onto a migrated schema is worse
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: authentik
  values:
    global:
      podLabels:
        endpoints.netpols.home.arpa/email-sender: "true"
      env:
        # Postgres
        ## RW endpoint. Host and TLS settings differ per component, see
        ## server.env and worker.env.
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        ## RO endpoint
        # Disable read replica configuration. This seems to cause a bug with !KeyOf
        # YAML tags, which causes blueprints to valid to install.
        # For details, see https://github.com/goauthentik/authentik/issues/12186 and
        # https://discord.com/channels/673534664354430999/1152393369687965736/1311410413090373694
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__HOST
        #   value: authentik-postgres-ro.security.svc.cluster.local
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__NAME
        #   value: authentik
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__USER
        #   value: authentik
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PORT
        #   value: "5432"
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__SSLMODE
        #   value: verify-full
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__SSLROOTCERT
        #   value: /etc/authentik/secrets/root-ca-cert/ca.crt
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__SSLCERT
        #   value: /etc/authentik/secrets/postgres-authentik-user/tls.crt
        # - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__SSLKEY
        #   value: /etc/authentik/secrets/postgres-authentik-user/tls.key
        # Use the right source IP
        # TODO netpol to limit traffic to gateway pods
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: 10.32.0.0/16
        # Media file storage
        - name: AUTHENTIK_STORAGE__MEDIA__BACKEND
          value: s3
        - name: AUTHENTIK_STORAGE__MEDIA__S3__USE_SSL
          value: "true"
        - name: AUTHENTIK_STORAGE__MEDIA__S3__SECURE_URLS
          value: "true"
        - name: AUTHENTIK_STORAGE__MEDIA__S3__ENDPOINT
          value: https://$(BUCKET_HOST)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY
          value: $(AWS_ACCESS_KEY_ID)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY
          value: $(AWS_SECRET_ACCESS_KEY)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME
          value: $(BUCKET_NAME)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__CUSTOM_DOMAIN
          value: $(BUCKET_HOST):$(BUCKET_PORT)/$(BUCKET_NAME)
        # Email
        - name: AUTHENTIK_EMAIL__HOST
          value: docker-postfix-mail.email.svc.cluster.local
        - name: AUTHENTIK_EMAIL__PORT
          value: "25"
        - name: AUTHENTIK_EMAIL__USE_TLS
          value: "false"
        - name: AUTHENTIK_EMAIL__FROM
          value: Authentik <no-reply-authentik@${SECRET_PUBLIC_DOMAIN_NAME}>
        # Authentik
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "true"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        # Needed because IPv6 is disabled at the kernel level
        - name: AUTHENTIK_LISTEN__HTTP
          value: 0.0.0.0:9000
        - name: AUTHENTIK_LISTEN__HTTPS
          value: 0.0.0.0:9443
        - name: AUTHENTIK_LISTEN__LDAP
          value: 0.0.0.0:3389
        - name: AUTHENTIK_LISTEN__LDAPS
          value: 0.0.0.0:6636
        - name: AUTHENTIK_LISTEN__METRICS
          value: 0.0.0.0:9300
      envFrom:
        - configMapRef:
            name: authentik-media
        - secretRef:
            name: authentik-media
        - secretRef:
            name: authentik-env-values
      volumes:
        - name: root-ca-cert
          secret:
            secretName: security-intermediary-ca
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: postgres-authentik-user
          secret:
            secretName: authentik-postgres-authentik-user
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: authentik-css
          configMap:
            name: authentik-css
            defaultMode: 0440
      volumeMounts:
        - name: authentik-css
          mountPath: /web/dist/custom.css
          subPath: custom.css
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # Per-component, not global.image: global.image.tag feeds the version label.
    server:
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
      replicas: 2
      env: &envoy_db_env
        # Plaintext to the Envoy sidecar, which does the mTLS. The server's Go
        # embedded outpost and the worker's Rust status heartbeat load the client
        # cert once at startup and never re-read it.
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: 127.0.0.1
        # libpq's default `prefer` would attempt TLS without a client cert
        # through the postgres_proxy filter
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: disable
      initContainers: &envoy_init_containers
        - name: envoy
          # Contrib image is required for the postgres_proxy filter
          image: mirror.gcr.io/envoyproxy/envoy:contrib-v1.40.0@sha256:366ea8bbbbaded6d95f3a1aafedd12c6def9f0d6eea02f3123b69c41e46e54f5
          restartPolicy: Always
          ports:
            - name: envoy-admin
              containerPort: 8000
          securityContext:
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            # The image has no USER; the entrypoint skips su-exec when non-root
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: &envoy_memory 64Mi
            limits:
              memory: *envoy_memory
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: postgres-authentik-user
              mountPath: /etc/envoy/secrets/postgres
            - name: root-ca-cert
              mountPath: /etc/envoy/secrets/root-ca
      volumes:
        - &envoy_config_volume
          name: envoy-config
          configMap:
            name: authentik-envoy-pg-config
            defaultMode: 0440
      podLabels:
        endpoints.netpols.home.arpa/external-ingress-enabled: "true"
        # Pods serving OIDC discovery + JWKS to in-cluster consumers (Temporal etc).
        # Lets clients skip the ingress gateway round-trip for server-side fetches.
        endpoints.netpols.home.arpa/oidc-supplier: "true"
      pdb:
        enabled: true
        minAvailable: 1
      metrics: &metrics
        enabled: true
        serviceMonitor:
          enabled: true
          # Unused latency histograms; their _count/_sum are kept
          metricRelabelings:
            - action: drop
              sourceLabels: [__name__]
              regex: (django_http_requests_latency_seconds_by_view_method|authentik_property_mapping_execution_time|authentik_tasks_duration_milliseconds)_bucket
    worker:
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
      replicas: 2
      env: *envoy_db_env
      initContainers: *envoy_init_containers
      pdb:
        enabled: true
        minAvailable: 1
      volumes:
        - *envoy_config_volume
        - name: sidecar-blueprints
          emptyDir: {}
        - name: mask-blueprints
          emptyDir: {}
      volumeMounts:
        - &blueprints_mount
          name: sidecar-blueprints
          mountPath: &sidecar_blueprints_dir /blueprints/k8s-sidecar
        # Don't load these blueprints. This means that Authentik will not be
        # accessible until the customization fluxtomization loads.
        - name: mask-blueprints
          mountPath: /blueprints/default
        - name: mask-blueprints
          mountPath: /blueprints/example
      extraContainers:
        - name: k8s-sidecar
          image: ghcr.io/kiwigrid/k8s-sidecar:2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
          env:
            - name: LABEL
              value: k8s-sidecar.home.arpa/application
            - name: LABEL_VALUE
              value: authentik
            - name: FOLDER
              value: *sidecar_blueprints_dir
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: both
            - name: METHOD
              value: WATCH
            - name: UNIQUE_FILENAMES
              value: "true"
            - name: DEFAULT_FILE_MODE
              value: "660" # Write permissions are required so that the files can be updated
          volumeMounts:
            - *blueprints_mount
      metrics: *metrics
    geoip:
      enabled: false
      existingSecret:
        secretName: authentik-geoip-credentials
    # The chart's recording rules use pre-`_total` django-prometheus names and
    # metrics authentik doesn't export (goauthentik/helm#491). Its alerts are
    # in alerts.yaml.
    prometheus:
      rules:
        enabled: false
  postRenderers:
    # Allow pods to be evicted when unhealthy
    # This occurs during postgres failover, which and is required for node draining
    - kustomize:
        patches:
          - patch: |
              - op: add
                path: /spec/unhealthyPodEvictionPolicy
                value: AlwaysAllow
            target:
              group: policy
              version: v1
              kind: PodDisruptionBudget
