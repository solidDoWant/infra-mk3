---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Drops authentik's access-log records for its health and metrics endpoints
# (in-container healthcheck, kubelet probes, metrics scrapes).
#
# No source lever: the Django and Rust request loggers are unconditional, and
# AUTHENTIK_LOG_LEVEL is global.
#
# Matches both the server's structlog (`": "`) and the worker's compact serde
# JSON (`":"`). Anchored on `"event":` because the worker repeats the path in
# its `spans` array. Requires status 200, so failing probes/scrapes still ship.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: drop-authentik-healthprobe-access-log
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.security\.authentik-(server|worker)-[^.]*\.(server|worker)\.
  filters:
    # Django `/-/health/{live,ready}/` and `/-/metrics/`, the Rust server's
    # `/health/{live,ready}/` (logged without the `/-` mount prefix), and the
    # bare `/metrics` (:9300). Separate branches so unserved variants can't match.
    - grep:
        exclude: 'log "event": ?"(/-/(health/(live|ready)|metrics)/|/health/(live|ready)/|/metrics)".*"status": ?200[,}]'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Sets `_msg` on authentik server/worker to `event` instead of the JSON
# envelope (the request path, for access-log records). Fields stay under
# `log_fields.*`. Runs after `kubernetes`, which populates `log_fields`.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: promote-authentik-message
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.security\.authentik-(server|worker)-[^.]*\.(server|worker)\.
  filters:
    - lua:
        call: promote_message
        code: |
          function promote_message(tag, ts, record)
            local fields = record["log_fields"]
            if type(fields) ~= "table" then
              return 0, ts, record
            end
            local msg = fields["event"]
            if type(msg) ~= "string" or msg == "" then
              return 0, ts, record
            end
            record["log"] = msg
            return 2, ts, record
          end
