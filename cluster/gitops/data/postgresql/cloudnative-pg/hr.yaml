---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  ref:
    tag: 0.29.2
    digest: sha256:3bfb3670ccb80c7f2e6bef3189c1599ad4b6d6f0a52fb745f986ac5b511d2fc0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/cloudnative-pg/charts/\.github/workflows/release-publish\.yml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name cloudnative-pg
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  values:
    # If the operator fails, then instance failover will also fail.
    replicaCount: 2
    nameOverride: *app_name
    fullnameOverride: *app_name
    # Also the instance-manager image in every Cluster pod (OPERATOR_IMAGE_NAME)
    image:
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      tag: 1.30.2@sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913
    config:
      data:
        INHERITED_LABELS: app.kubernetes.io/instance
        # renovate: image
        PGBOUNCER_IMAGE_NAME: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:c96417dce3f7ee82a1cb6df65309ebb7efec0a449363c333c043e2fe0c636097
    priorityClassName: system-cluster-critical
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
        sidecarLabel: "" # Unset this and load via operator resource
    updateStrategy:
      type: RollingUpdate
