---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  ref:
    tag: 0.29.1
    digest: sha256:3245fa051bb21d0dd9246272f57a2760b4234817a164a3167d2a1e7fb9f63fd9
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/cloudnative-pg/charts/\.github/workflows/release-publish\.yml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name cloudnative-pg
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  values:
    # If the operator fails, then instance failover will also fail.
    replicaCount: 2
    nameOverride: *app_name
    fullnameOverride: *app_name
    # Also the instance-manager image in every Cluster pod (OPERATOR_IMAGE_NAME)
    image:
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
    config:
      data:
        INHERITED_LABELS: app.kubernetes.io/instance
        # renovate: image
        PGBOUNCER_IMAGE_NAME: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:4bc1a2f2310e9ca5b3211e72edab97b1e1c2370c36961c253a279a341d5d2ee6
    priorityClassName: system-cluster-critical
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
        sidecarLabel: "" # Unset this and load via operator resource
    updateStrategy:
      type: RollingUpdate
