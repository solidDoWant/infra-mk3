---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: plugin-barman-cloud
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
  ref:
    tag: 0.9.0
    digest: sha256:d34ada2eedffaee9153c6ae31e0e5b93fd28765cc8fba7c5fb45d4ed6b60df1a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/cloudnative-pg/charts/\.github/workflows/release-publish\.yml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name plugin-barman-cloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  values:
    nameOverride: *app_name
    fullnameOverride: *app_name
    image:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud
      tag: v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
    # Injected into every Cluster pod using the plugin
    sidecarImage:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud-sidecar
      tag: v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
    # The CNPG-I plugin uses leader election, so run two replicas: if the plugin
    # is down, WAL archival and restore for every cluster using it fails.
    # Both replicas report Ready (probes hit :8081), but only the leader serves
    # gRPC on 9090; the operator's connection pool retries onto the leader.
    replicaCount: 2
    priorityClassName: system-cluster-critical
    crds:
      create: true
    certificate:
      # The CNPG-I mTLS certs are authored directly (server-cert.yaml /
      # client-cert.yaml) so they issue from the namespace CA with the correct
      # namespace-scoped names, rather than being rewritten via post-render.
      createServerCertificate: false
      createClientCertificate: false
      # In-namespace certs issue from the namespace intermediary CA;
      # approver-policy denies certs from an ad-hoc issuer.
      createIssuer: false
    resources:
      requests:
        cpu: 50m
        memory: &memory 128Mi
      limits:
        memory: *memory
  postRenderers:
    - kustomize:
        patches:
          # By default the operator verifies the plugin's server cert against the
          # bare Service name; tell it to use the namespace-scoped DNS name that
          # the CA is actually able to sign (see server-cert.yaml).
          - target:
              version: v1
              kind: Service
              name: barman-cloud
            patch: |
              - op: add
                path: /metadata/annotations/cnpg.io~1pluginServerName
                value: barman-cloud.data.svc
