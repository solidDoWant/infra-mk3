---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  ref:
    tag: v1.7.1
    digest: sha256:334cdd6cd58e08e77289b87ec8756b9f65fd085929ac8bb31e8b847981023376
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name dragonfly-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  values:
    replicaCount: 2
    rbacProxy:
      enabled: false
    manager:
      image:
        repository: ghcr.io/dragonflydb/operator
        tag: v1.7.1@sha256:bc0067369a456810d00715d7292da32b82f6df491fd51d6c57f2b2b3193ab490
      extraArgs:
        - --metrics-bind-address=0.0.0.0:8080
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
