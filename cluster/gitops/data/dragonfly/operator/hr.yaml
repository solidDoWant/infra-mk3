---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  ref:
    tag: v1.7.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name dragonfly-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  values:
    replicaCount: 2
    rbacProxy:
      enabled: false
    manager:
      extraArgs:
        - --metrics-bind-address=0.0.0.0:8080
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
