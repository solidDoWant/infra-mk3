---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  ref:
    tag: v1.8.0
    digest: sha256:c52cf016eafb100f2b4f8d7f4f1469b743aac0787a992dbda88cac4544a2eb14
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name dragonfly-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  values:
    replicaCount: 2
    rbacProxy:
      enabled: false
    manager:
      image:
        repository: ghcr.io/dragonflydb/operator
        tag: v1.8.0@sha256:953b5aab07963e2ccc4c61ab6e6bc0d27bfdda6301d81dc2b807396dfef6e6a3
      extraArgs:
        - --metrics-bind-address=0.0.0.0:8080
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
