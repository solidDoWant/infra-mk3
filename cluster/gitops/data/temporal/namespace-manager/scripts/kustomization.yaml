---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: manager-scripts
    files:
      - ./manager.sh
    options:
      labels:
        kyverno.home.arpa/reload: "true"
      annotations:
        # Don't run Flux postBuild substitution on this ConfigMap -- the script's shell
        # variables would collide with Flux's ${...} syntax.
        kustomize.toolkit.fluxcd.io/substitute: disabled
      disableNameSuffixHash: true
