---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: flux-receiver
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  path: /cluster/gitops/flux-system/flux/receiver
  targetNamespace: flux-system
  dependsOn:
    - name: flux
    - name: gateway-crds
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: flux-monitoring
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  path: /cluster/gitops/flux-system/flux/monitoring
  targetNamespace: flux-system
  dependsOn:
    - name: flux
    - name: prometheus-crds
    - name: fluent-crds
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: flux-web
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  path: /cluster/gitops/flux-system/flux/web
  targetNamespace: flux-system
  dependsOn:
    # Provides the flux-operator OCIRepository
    - name: flux
    - name: gateway-crds
