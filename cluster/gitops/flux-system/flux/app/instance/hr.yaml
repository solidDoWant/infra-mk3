---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-instance
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
  ref:
    tag: 0.61.0
    digest: sha256:ba8b22b2a9306b984b842941a8eb4b5c7cdc8d582990827069bdcd1735bfbb59
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/controlplaneio-fluxcd/charts/\.github/workflows/release\.yml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-instance
  # The chart deploys the FluxInstance CR, the CRD comes from the operator chart
  dependsOn:
    - name: flux-operator
  valuesFrom:
    - kind: ConfigMap
      name: flux-instance-bootstrap-values
