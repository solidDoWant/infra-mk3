---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-instance
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
  ref:
    tag: 0.62.1
    digest: sha256:38215516080c6e0bd9b574ca79cb9de224d2aed37db211b0256fd383d2350450
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/controlplaneio-fluxcd/charts/\.github/workflows/release\.yml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-instance
  # Waiting for the FluxInstance to become ready means waiting for the operator
  # to restart helm-controller, which interrupts the wait
  install:
    disableWait: true
  upgrade:
    disableWait: true
  # The chart deploys the FluxInstance CR, the CRD comes from the operator chart
  dependsOn:
    - name: flux-operator
  valuesFrom:
    - kind: ConfigMap
      name: flux-instance-bootstrap-values
  # The chart always renders `artifact`, and an empty value is null, which the
  # CRD rejects. Without it the operator uses the manifests in its image.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: fluxcd.controlplane.io
              version: v1
              kind: FluxInstance
              name: flux
            patch: |
              - op: remove
                path: /spec/distribution/artifact
