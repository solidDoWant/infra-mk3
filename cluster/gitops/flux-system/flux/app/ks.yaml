---
# Deploys the Flux Operator and the FluxInstance, which manages the Flux controllers
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: flux
spec:
  interval: 5m
  # TODO set back to true once the operator migration has been deployed.
  # This Kustomization used to deploy the Flux controllers and CRDs directly
  # (/cluster/bootstrap). Pruning would delete them before the operator has
  # taken them over. With pruning disabled, the inventory is replaced with the
  # new contents instead, after which pruning is safe again.
  prune: false
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  path: /cluster/gitops/flux-system/flux/app
  targetNamespace: flux-system
  dependsOn:
    - name: flux-sources
