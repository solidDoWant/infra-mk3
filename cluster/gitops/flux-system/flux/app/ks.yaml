---
# "Install" flux by re-using the install kustomization
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: flux
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  path: /cluster/bootstrap
  targetNamespace: flux-system
  dependsOn:
    - name: flux-sources
