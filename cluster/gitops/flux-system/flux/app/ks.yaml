---
# Deploys the Flux Operator and the FluxInstance, which manages the Flux controllers
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: flux
spec:
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  path: /cluster/gitops/flux-system/flux/app
  targetNamespace: flux-system
  dependsOn:
    - name: flux-sources
