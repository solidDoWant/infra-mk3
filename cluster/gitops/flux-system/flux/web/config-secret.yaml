---
# Web UI config. A plain Secret so that Flux substitution fills in the OIDC
# client credentials from cluster-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: flux-web-config
type: Opaque
stringData:
  config.yaml: |
    apiVersion: web.fluxcd.controlplane.io/v1
    kind: Config
    spec:
      baseURL: https://flux.${SECRET_PUBLIC_DOMAIN_NAME}
      authentication:
        type: OAuth2
        oauth2:
          provider: OIDC
          clientID: "${SECRET_FLUX_AUTHENTIK_OIDC_CLIENT_ID}"
          clientSecret: "${SECRET_FLUX_AUTHENTIK_OIDC_CLIENT_SECRET}"
          issuerURL: https://openid-configuration-proxy.security.svc.cluster.local/application/o/flux/
          # Authentik has no `groups` scope, the claim comes with `profile`
          scopes:
            - openid
            - profile
            - email
            - offline_access
          validations:
            - expression: "'Flux admins' in claims.groups"
              message: user must be in the Flux admins group
          # Kubernetes RBAC for UI actions, see rbac.yaml
          impersonation:
            username: claims.email
            groups: claims.groups
