---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: approver-policy
spec:
  interval: 1h
  url: oci://quay.io/jetstack/charts/cert-manager-approver-policy
  ref:
    tag: v0.28.0
---
# This service needs to be highly available.
# If this service fails then cert-manager will fail.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name approver-policy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: approver-policy
  values:
    crds:
      keep: true
      enabled: true
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    app:
      logFormat: json
      metrics:
        service:
          servicemonitor:
            enabled: true
    # Prefer scheduling on an instance with cert-manager, but
    # don't schedule all replicas on the same node
    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: cert-manager
              topologyKey: kubernetes.io/hostname