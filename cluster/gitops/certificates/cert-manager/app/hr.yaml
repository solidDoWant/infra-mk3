---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
spec:
  interval: 1h
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.21.3
    digest: sha256:e482675aec32862d323a9218293ff7de81192337998615e4378c56498473f240
---
# This service needs to be highly available.
# If cert-manager fails then services that need to generate mTLS certs will fail.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    global:
      leaderElection:
        namespace: certificates
      priorityClassName: system-cluster-critical
    image:
      repository: quay.io/jetstack/cert-manager-controller
      tag: v1.21.3@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
    crds:
      enabled: true
      keep: true
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    featureGates: ServerSideApply=true,UseCertificateRequestBasicConstraints=true,ExperimentalGatewayAPISupport=true
    enableCertificateOwnerRef: true
    disableAutoApproval: true # approver-policy will be used to handle approvals given specific constraints
    ingressShim:
      defaultIssuerGroup: cert-manager.io
      defaultIssuerKind: ClusterIssuer
      defaultIssuerName: letsencrypt-production
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: https://dns.quad9.net/dns-query
    extraArgs: &json_logs
      - --logging-format=json
    prometheus:
      servicemonitor:
        enabled: true
        endpointAdditionalProperties:
          # This adds a "9402" valued label to all metrics, which is also included
          # in the instance metric. This is useless, so drop it.
          relabelings:
            - action: labeldrop
              regex: endpoint
    # Prefer placing cert-manager pods _of different components_ on the same
    # node, but force pods _of the same component_ onto separate nodes.
    affinity: &affinity_rules
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: *app_name
              topologyKey: kubernetes.io/hostname
    webhook:
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        tag: v1.21.3@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
      replicaCount: 2
      extraArgs: *json_logs
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      affinity: *affinity_rules
    cainjector:
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.3@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
      replicaCount: 2
      featureGates: ServerSideApply=true
      extraArgs: *json_logs
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      affinity: *affinity_rules
    acmesolver:
      image:
        repository: quay.io/jetstack/cert-manager-acmesolver
        tag: v1.21.3@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
    startupapicheck:
      image:
        repository: quay.io/jetstack/cert-manager-startupapicheck
        tag: v1.21.3@sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1
      # The chart's default is [-v]; keep it.
      extraArgs:
        - -v
        - --logging-format=json
