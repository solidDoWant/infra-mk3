---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
spec:
  interval: 1h
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.21.2
    digest: sha256:634dce9c13b56677a2c05e2ab76c312d0be2664022d5dd05815da67e1fd5f610
---
# This service needs to be highly available.
# If cert-manager fails then services that need to generate mTLS certs will fail.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    global:
      leaderElection:
        namespace: certificates
      priorityClassName: system-cluster-critical
    image:
      repository: quay.io/jetstack/cert-manager-controller
      tag: v1.21.2@sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
    crds:
      enabled: true
      keep: true
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    featureGates: ServerSideApply=true,UseCertificateRequestBasicConstraints=true,ExperimentalGatewayAPISupport=true
    enableCertificateOwnerRef: true
    disableAutoApproval: true # approver-policy will be used to handle approvals given specific constraints
    ingressShim:
      defaultIssuerGroup: cert-manager.io
      defaultIssuerKind: ClusterIssuer
      defaultIssuerName: letsencrypt-production
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: https://dns.quad9.net/dns-query
    extraArgs: &json_logs
      - --logging-format=json
    prometheus:
      servicemonitor:
        enabled: true
        endpointAdditionalProperties:
          # This adds a "9402" valued label to all metrics, which is also included
          # in the instance metric. This is useless, so drop it.
          relabelings:
            - action: labeldrop
              regex: endpoint
    # Prefer placing cert-manager pods _of different components_ on the same
    # node, but force pods _of the same component_ onto separate nodes.
    affinity: &affinity_rules
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: *app_name
              topologyKey: kubernetes.io/hostname
    webhook:
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        tag: v1.21.2@sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
      replicaCount: 2
      extraArgs: *json_logs
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      affinity: *affinity_rules
    cainjector:
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.2@sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
      replicaCount: 2
      featureGates: ServerSideApply=true
      extraArgs: *json_logs
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      affinity: *affinity_rules
    acmesolver:
      image:
        repository: quay.io/jetstack/cert-manager-acmesolver
        tag: v1.21.2@sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
    startupapicheck:
      image:
        repository: quay.io/jetstack/cert-manager-startupapicheck
        tag: v1.21.2@sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
      # The chart's default is [-v]; keep it.
      extraArgs:
        - -v
        - --logging-format=json
