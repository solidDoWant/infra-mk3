---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: lingarr-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.19
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lingarr-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: lingarr-backup
  values:
    jobConfig:
      drType: generic
      drAction: backup
      cronjob:
        schedule: "10 1 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: lingarr-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          # Holds a logical dump of the lingarr database (~15Mi live).
          size: 1Gi
        postgres:
          - name: &cluster_name lingarr-postgres
            cluster: *cluster_name
        files:
          # Contains Lingarr's database encryption keys
          - name: config
            pvc: lingarr
            snapshotClass: ssd-replicated-3x-block
            exclude:
              - glob: lost+found
