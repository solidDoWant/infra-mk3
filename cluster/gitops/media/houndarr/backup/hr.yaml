---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: houndarr-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.20
    digest: sha256:62a08c11d4ded623adc7078f8eda8644e4e0afcb0313be78fcaa675ccce6df72
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: houndarr-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: houndarr-backup
  values:
    jobConfig:
      drType: generic
      drAction: backup
      cronjob:
        schedule: "20 0 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: houndarr-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          size: 1Gi
        files:
          # Contains houndarr's database, keys, etc
          - name: config
            pvc: houndarr
            snapshotClass: ssd-replicated-3x-block
            exclude:
              - glob: lost+found
