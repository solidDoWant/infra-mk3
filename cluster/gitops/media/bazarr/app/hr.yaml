---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bazarr
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: bazarr
  values:
    controllers:
      bazarr:
        defaultContainerOptions:
          image:
            repository: ghcr.io/home-operations/bazarr
            tag: 1.6.2@sha256:b8434a7339ebd9c2bfe4464c28db79944e0f52f47da85345fc7e0563c19f83ac
          securityContext: &container_security_context
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        initContainers:
          init-config:
            image:
              repository: ghcr.io/mikefarah/yq
              tag: 4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
            envFrom:
              - secret: bazarr-api-key
            env:
              RADARR_API_KEY:
                secretKeyRef:
                  name: radarr-api-key
                  key: API_KEY
              SONARR_API_KEY:
                secretKeyRef:
                  name: sonarr-api-key
                  key: API_KEY
              # Flux substitution is disabled on the script ConfigMap, so
              # the domain comes in via this env var instead.
              PUBLIC_DOMAIN_NAME: ${SECRET_PUBLIC_DOMAIN_NAME}
            command:
              - sh
              - /etc/init/init-config.sh
          # Native sidecar: terminates Bazarr's plaintext psycopg2 connection
          # on 127.0.0.1:5432 and proxies to the postgres cluster with mTLS.
          # Bazarr's psycopg2 connection is built from discrete kwargs that
          # don't forward libpq SSL params (see bazarr/app/database.py),
          # so the only TLS path is via this sidecar.
          envoy:
            restartPolicy: Always
            # contrib image is required for the postgres_proxy filter
            image:
              repository: mirror.gcr.io/envoyproxy/envoy
              tag: contrib-v1.40.1@sha256:e2c04c703265ab832c7b9e89a13399f8ab3813fc7e7fbcd5a3a2b83bc2cb48d1
            ports:
              - name: envoy-admin
                containerPort: 8000
            securityContext:
              <<: *container_security_context
              runAsNonRoot: true
            resources:
              requests:
                cpu: 25m
                memory: &memory 64Mi
              limits:
                memory: *memory
        containers:
          bazarr:
            env:
              # Bazarr's POSTGRES_* env vars take precedence over config.yaml
              # and are read directly at connection-construction time.
              POSTGRES_ENABLED: "true"
              POSTGRES_HOST: 127.0.0.1
              POSTGRES_PORT: "5432"
              POSTGRES_DATABASE: bazarr
              POSTGRES_USERNAME: bazarr
              POSTGRES_PASSWORD: not-used-cert-auth-via-envoy
              # Envoy forwards an SSLRequest upstream instead of answering it,
              # so libpq's default sslmode=prefer handshakes with Postgres
              # without a client cert (FATAL 28000) before retrying plaintext.
              PGSSLMODE: disable
              # Sourced for the probes' X-API-KEY header (kubelet's
              # httpGet.httpHeaders values are literal, so probes must
              # exec into the container to read the secret).
              BAZARR_API_KEY:
                secretKeyRef:
                  name: bazarr-api-key
                  key: API_KEY
            ports:
              - name: web
                containerPort: &web_port 6767
            probes:
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  exec: &probe_exec
                    command:
                      - sh
                      - -c
                      - 'curl --fail -sS -o /dev/null -H "X-API-KEY: $$BAZARR_API_KEY" http://127.0.0.1:6767/api/system/status'
                  timeoutSeconds: 5
              liveness: *probe
              # Startup blocks ~20s on an (egress-denied) GitHub update check, and upgrades run DB migrations
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probe_exec
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
      exportarr:
        replicas: 2
        strategy: RollingUpdate
        podDisruptionBudget:
          minAvailable: 1
        containers:
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - bazarr
              # See the radarr HelmRelease for the rationale.
              - --log-level=warn
            env:
              PORT: &metrics_port 80
              URL: http://bazarr.media.svc.cluster.local:6767
              ENABLE_ADDITIONAL_METRICS: true
            envFrom:
              - secret: bazarr-api-key
            ports:
              - name: web
                containerPort: *metrics_port
            probes:
              readiness: &exportarr_probe
                enabled: true
                type: HTTP
              liveness: *exportarr_probe
            securityContext: *container_security_context
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # home-operations/bazarr drops to USER nobody:nogroup (65534) in its
        # Dockerfile; match so the PVC and certs are accessible.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    persistence:
      # Bazarr's runtime state lives in Postgres; config.yaml is rewritten
      # from the bazarr-config Secret on every boot. Everything else under
      # /config (logs, cache, provider sessions) be regenerated, so a
      # tmpfs emptyDir is sufficient.
      config:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          bazarr:
            init-config:
              - path: /config
            bazarr:
              - path: /config
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 50Mi
        advancedMounts:
          bazarr:
            bazarr:
              - path: /tmp
      config-source:
        type: secret
        name: bazarr-config
        defaultMode: 0440
        items:
          - key: config.yaml
            path: config.yaml
        advancedMounts:
          bazarr:
            init-config:
              - path: /etc/bazarr/config-source
                readOnly: true
      init-scripts:
        type: configMap
        name: bazarr-init-scripts
        defaultMode: 0444
        advancedMounts:
          bazarr:
            init-config:
              - path: /etc/init
                readOnly: true
      # Bazarr writes subtitle files alongside videos, so RW is required.
      media:
        type: nfs
        server: ${NFS_ADDRESS}
        path: ${NFS_MEDIA_PATH}
        advancedMounts:
          bazarr:
            bazarr:
              - path: /mnt/library/Movies
                subPath: library/Movies
              - path: /mnt/library/Shows
                subPath: library/Shows
      envoy-config:
        type: configMap
        name: bazarr-envoy-pg-config
        defaultMode: 0440
        advancedMounts:
          bazarr:
            envoy:
              - path: /etc/envoy
      bazarr-postgres-bazarr-user-cert:
        type: secret
        name: bazarr-postgres-bazarr-user
        defaultMode: 0440
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
        advancedMounts:
          bazarr:
            envoy:
              - path: /etc/envoy/secrets/postgres
      root-ca:
        type: secret
        name: root-ca-pub-cert
        defaultMode: 0444
        items:
          - key: ca.crt
            path: ca.crt
        advancedMounts:
          bazarr:
            envoy:
              - path: /etc/envoy/secrets/root-ca
    service:
      bazarr:
        controller: bazarr
        ports:
          web:
            port: *web_port
            primary: true
      metrics:
        controller: exportarr
        ports:
          metrics:
            port: *metrics_port
            primary: true
    route:
      bazarr:
        hostnames:
          - bazarr.${SECRET_PUBLIC_DOMAIN_NAME}
        parentRefs:
          - name: internal-gateway
            namespace: networking
        rules:
          - backendRefs:
              - identifier: bazarr
                port: *web_port
          # Send auth requests to the authentik outpost
          - backendRefs:
              - name: authentik-server
                namespace: security
                port: 80
            matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
