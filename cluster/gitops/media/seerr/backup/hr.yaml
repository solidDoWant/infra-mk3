---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: seerr-backup
spec:
  interval: 1h
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.21
    digest: sha256:f8e3b08309cd008c64c2748756a8391f76a7ece01f482f3cd653887b9346ac48
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: seerr-backup
  values:
    resources:
      controllers:
        backup-tool:
          containers:
            backup-tool:
              # The chart passes this to the pods the tool starts (BACKUP_TOOL_IMAGE).
              image:
                repository: ghcr.io/soliddowant/backup-tool
                tag: 0.0.21@sha256:b6320c6ff76a5f4c431c843771c346c803bbb299ab81234fada80c2ebb58c4ca
    jobConfig:
      drType: generic
      drAction: backup
      cronjob:
        schedule: "30 0 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: seerr-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          snapshotLabels:
            # Selected (newest per PVC) by tape-archiver runs
            tape.home.arpa/archive: "true"
          size: 2Gi
        postgres:
          - name: &cluster_name seerr-postgres
            cluster: *cluster_name
        files:
          # Seerr's /app/config PVC: settings, cookies, schema migration markers,
          # etc. Postgres holds the relational data; this captures everything else.
          - name: config
            pvc: seerr
            snapshotClass: ssd-replicated-3x-block
            exclude:
              - glob: cache
              - glob: logs
              - glob: lost+found
