---
# This relies on the beta resource claim API + the AMD GPU resource driver.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: jellyfin-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            selectors:
              - cel:
                  expression: device.attributes["gpu.amd.com"].deviceID == '${AMD_IGPU_PCI_DEVICE_ID}'
