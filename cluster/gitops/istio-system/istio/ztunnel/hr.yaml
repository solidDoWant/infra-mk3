---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-ztunnel
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/ztunnel
  ref:
    tag: 1.32.0
    digest: sha256:3c7e140fae16365e053ccabb041453d075d802dfeeb1966985fe4723fcf3daa0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ztunnel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-ztunnel
  values:
    profile: ambient
    image: mirror.gcr.io/istio/ztunnel:1.32.0-distroless@sha256:953a77fc17379301de4b7c6697b1668471c9c1f6ff912c9c5b78f454ab362180
    logAsJson: true
    caAddress: cert-manager-istio-csr.istio-system.svc.cluster.local.:443
    # Defaults to the bare `istiod.<istioNamespace>.svc:15012`, which cannot resolve
    # absolutely and so burns three NXDOMAINs against the search list first.
    xdsAddress: istiod.istio-system.svc.cluster.local.:15012
    env:
      IPV6_ENABLED: "false"
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 200m/512Mi per
    # node; measured p95 CPU <1m and peak working set 22Mi across all three nodes.
    # ztunnel memory scales with the number of enrolled workloads and open
    # connections, so 128Mi is deliberately ~6x the observed peak rather than a
    # tight fit. Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &ztunnel_memory 128Mi
      limits:
        memory: *ztunnel_memory
