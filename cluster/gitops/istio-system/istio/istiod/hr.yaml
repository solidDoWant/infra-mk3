---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-istiod
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/istiod
  ref:
    tag: 1.31.4
    digest: sha256:15f223639172e782066e8f3980d12a8a47ae8a6088586d488787531fe21f2d64
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-istiod
  labels:
    patches.flux.home.arpa/helmrelease.append-drift-detection: "true"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-istiod
  driftDetection:
    ignore:
      - paths:
          - /webhooks/0/failurePolicy
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system
  values:
    profile: ambient
    pilot:
      # A ref containing `/` bypasses hub/tag/variant.
      image: mirror.gcr.io/istio/pilot:1.31.4-distroless@sha256:2bc9c4190eec5146c6dacb3e2b81fe2752ecd4f5f5198e51fb27ca67b5930312
      autoscaleMin: 2
      # Right-sized 2026-08-01 from 14d of metrics. Chart default is 500m/2048Mi;
      # measured p95 CPU 13m (p99 17m, max 60m) and peak working set 435Mi. This
      # is a small mesh, so pilot never approaches the upstream defaults, which
      # are sized for a large one. Memory request == limit (incompressible;
      # see the vmselect block for the reasoning).
      # 2026-11-05: RSS was 320-500Mi before 2026-08 but has stayed 140-240Mi
      # since (working set peak 240Mi over 90d), so 512Mi is ~2x the current peak.
      resources:
        requests:
          cpu: 25m
          memory: &istiod_memory 512Mi
        limits:
          memory: *istiod_memory
      env:
        ENABLE_CA_SERVER: "false"
      deploymentLabels:
        patches.flux.home.arpa/deployment.ignore-replicas: "true"
      # Try to schedule on nodes that already have istio services running
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: istio-csr
                topologyKey: kubernetes.io/hostname
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: istio-istiod
                topologyKey: kubernetes.io/hostname
    global:
      # Injected into gateways and sidecars.
      proxy:
        image: mirror.gcr.io/istio/proxyv2:1.31.4-distroless@sha256:553f3640686d588531426e4c6b6810390b230374b7f83aae65fe4c68efccf1cc
      proxy_init:
        image: mirror.gcr.io/istio/proxyv2:1.31.4-distroless@sha256:553f3640686d588531426e4c6b6810390b230374b7f83aae65fe4c68efccf1cc
      caAddress: cert-manager-istio-csr.istio-system.svc.cluster.local.:443
      istiod:
        # Continuous in-cluster config analysis. Disabled: it emitted ~1600
        # error + 450 warn lines/istiod that are mostly FALSE POSITIVES here
        # (the working, cert-manager-Ready wildcard cert flagged IST0101
        # "credentialName not found"; the intentional external/internal
        # dual-gateways for *.<domain> flagged IST0145 "conflict"), and it
        # drove the known ~990-line `nil status ... on updateStatus()` retry
        # spam writing analysis status back to the Gateway-API auto-generated
        # gateways. The gateways are Programmed=True and serving fine; on-demand
        # `istioctl analyze` covers the real need without the runtime noise.
        enableAnalysis: false
      priorityClassName: system-cluster-critical
      # istiod, and the pilot-agent and Envoy of injected pods and gateways.
      logAsJson: true
    meshConfig:
      trustDomain: istio.cluster.local
      accessLogEncoding: JSON
      extensionProviders:
        - name: authentik
          envoyExtAuthzHttp:
            # Points at the authentik server, which runs the embedded outpost.
            # The embedded outpost stores sessions in PostgreSQL (shared across
            # server replicas and durable across restarts), unlike the standalone
            # proxy outpost which used per-pod /dev/shm sessions and broke the
            # OAuth callback under multiple replicas.
            service: authentik-server.security.svc.cluster.local
            port: 80
            pathPrefix: /outpost.goauthentik.io/auth/envoy
            headersToDownstreamOnAllow:
              # Pretty sure that the authentik docs have this backwards
              - set-cookie
              # These don't appear to be needed but I'm leaving them here pending the outcome of https://github.com/goauthentik/authentik/pull/17233
              # Note: Currently uncommenting these can lead to their values being duplicated responses coming from the authentik outpost
              # - Access-Control-Allow-Origin
              # - Access-Control-Allow-Credentials
            headersToUpstreamOnAllow:
              # These need to be listed explicitly until https://github.com/goauthentik/authentik/issues/17074 is fixed
              - X-Authentik-Email
              - X-Authentik-Entitlements
              - X-Authentik-Groups
              - X-Authentik-Meta-App
              - X-Authentik-Meta-Jwks
              - X-Authentik-Meta-Outpost
              - X-Authentik-Meta-Provider
              - X-Authentik-Meta-Version
              - X-Authentik-Name
              - X-Authentik-Uid
              - X-Authentik-Username
              # Disable this for now due to https://github.com/istio/api/issues/3569#issuecomment-3344686050
              # NZBHydra2 won't work with the x-authentik-* headers being passed upstream, presumably because they
              # are too large
              # - X-Authentik-Jwt
              # Not currently used but will be useful once QBT supports basic auth
              # https://github.com/qbittorrent/qBittorrent/issues/15007
              - authorization
            includeRequestHeadersInCheck:
              - cookie
              - Origin
        # This approach does not work due to https://github.com/istio/api/issues/3569#issuecomment-3344686050
        # # Same as above but doesn't add the upstream headers
        # - name: authentik-no-upstream-headers
        #   envoyExtAuthzHttp:
        #     <<: *authentik_ext_auth
        #     headersToUpstreamOnAllow: ~
