---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-base
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/base
  ref:
    tag: 1.32.0
    digest: sha256:c43b7f57c75f8ba1957ffd91fc9cb88a3ec407bbf0095ad4be2376d1cdc7de67
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  labels:
    patches.flux.home.arpa/helmrelease.append-drift-detection: "true"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-base
  driftDetection:
    ignore:
      - paths:
          - /webhooks/0/failurePolicy
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
