---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-base
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/base
  ref:
    tag: 1.31.1
    digest: sha256:c9717f814748f15b4448098e79484f675d9601fe42ee7218f6f5f7c955b3df99
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  labels:
    patches.flux.home.arpa/helmrelease.append-drift-detection: "true"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-base
  driftDetection:
    ignore:
      - paths:
          - /webhooks/0/failurePolicy
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
