---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-base
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/base
  ref:
    tag: 1.31.2
    digest: sha256:4e992fddb71ace84e46dc1eb8309402a20aa869d46c20f95bd64f12826bd842a
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  labels:
    patches.flux.home.arpa/helmrelease.append-drift-detection: "true"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-base
  driftDetection:
    ignore:
      - paths:
          - /webhooks/0/failurePolicy
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
