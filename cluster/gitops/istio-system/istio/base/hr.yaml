---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-base
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/base
  ref:
    tag: 1.30.5
    digest: sha256:72cbde12be25bd081b7feb69fecd2c5e8f97a43605ce741f97b8f8c3c3750012
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  labels:
    patches.flux.home.arpa/helmrelease.append-drift-detection: "true"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-base
  driftDetection:
    ignore:
      - paths:
          - /webhooks/0/failurePolicy
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
