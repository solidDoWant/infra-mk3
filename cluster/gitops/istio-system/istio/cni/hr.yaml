---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-cni
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/cni
  ref:
    tag: 1.31.3
    digest: sha256:65bc2f95324d0a09e001204ea77009a447946bb01915529b3a46a438f0dcd87d
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-cni
  values:
    profile: ambient
    image: mirror.gcr.io/istio/install-cni:1.31.3-distroless@sha256:42cb4521bfef160fbe60087f2d68ba630c7220ebc4260388a9897eb75063731e
    global:
      logAsJson: true
    cni:
      repair:
        deletePods: true
        repairPods: false
    ambient:
      ipv6: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 100m/100Mi per
    # node; measured p95 CPU <1m (max 4m) but peak working set 111Mi, i.e. memory
    # was slightly UNDER the request. CPU down, memory up.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &cni_memory 192Mi
      limits:
        memory: *cni_memory
