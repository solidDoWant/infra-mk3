---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  chart:
    spec:
      chart: cni
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: istio-charts
      version: 1.30.1
  values:
    profile: ambient
    cni:
      repair:
        deletePods: true
        repairPods: false
    ambient:
      ipv6: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 100m/100Mi per
    # node; measured p95 CPU <1m (max 4m) but peak working set 111Mi, i.e. memory
    # was slightly UNDER the request. CPU down, memory up.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &cni_memory 192Mi
      limits:
        memory: *cni_memory
