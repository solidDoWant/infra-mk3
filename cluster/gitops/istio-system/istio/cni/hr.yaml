---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-cni
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/cni
  ref:
    tag: 1.32.0
    digest: sha256:ec5eb8a6980dd18ebb28842453b9f081a8cd2aa969305dd95ca89e15e18699e2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-cni
  values:
    profile: ambient
    image: mirror.gcr.io/istio/install-cni:1.32.0-distroless@sha256:bf8fa30fe56fc7209941af23999f1463071b9885c22ec81f5998645718698787
    global:
      logAsJson: true
    cni:
      repair:
        deletePods: true
        repairPods: false
    ambient:
      ipv6: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 100m/100Mi per
    # node; measured p95 CPU <1m (max 4m) but peak working set 111Mi, i.e. memory
    # was slightly UNDER the request. CPU down, memory up.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &cni_memory 192Mi
      limits:
        memory: *cni_memory
