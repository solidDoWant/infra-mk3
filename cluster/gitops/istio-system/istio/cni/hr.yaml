---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-cni
spec:
  interval: 1h
  url: oci://gcr.io/istio-release/charts/cni
  ref:
    tag: 1.30.5
    digest: sha256:bc33230803b4ca1a9beb6ddf287198bbc1eac6d576cda8da3a292137c62ba8ca
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-cni
  values:
    profile: ambient
    global:
      logAsJson: true
    cni:
      repair:
        deletePods: true
        repairPods: false
    ambient:
      ipv6: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 100m/100Mi per
    # node; measured p95 CPU <1m (max 4m) but peak working set 111Mi, i.e. memory
    # was slightly UNDER the request. CPU down, memory up.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &cni_memory 192Mi
      limits:
        memory: *cni_memory
