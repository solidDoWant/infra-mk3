---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-cni
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/cni
  ref:
    tag: 1.31.4
    digest: sha256:abd69dd03d23ec7174b8e021641eb97bc221f5447dd77224ee1c780c5e2abae3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-cni
  values:
    profile: ambient
    image: mirror.gcr.io/istio/install-cni:1.31.4-distroless@sha256:f80f8bd86001494329d62544da21d75570eef4582f6e95f431296f3bc13b9629
    global:
      logAsJson: true
    cni:
      repair:
        deletePods: true
        repairPods: false
    ambient:
      ipv6: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 100m/100Mi per
    # node; measured p95 CPU <1m (max 4m) but peak working set 111Mi, i.e. memory
    # was slightly UNDER the request. CPU down, memory up.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &cni_memory 192Mi
      limits:
        memory: *cni_memory
