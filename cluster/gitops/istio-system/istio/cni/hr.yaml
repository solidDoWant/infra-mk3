---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-cni
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/cni
  ref:
    tag: 1.31.1
    digest: sha256:10f2acee15145919a8283febb69c537bcddec4300f489e459094a1312f9d15d8
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istio-cni
  values:
    profile: ambient
    image: mirror.gcr.io/istio/install-cni:1.31.1-distroless@sha256:5b4b7a9a6188cbb6a65d2c700df793b50484e87d009f26be5e22d46dfbbc3c62
    global:
      logAsJson: true
    cni:
      repair:
        deletePods: true
        repairPods: false
    ambient:
      ipv6: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 100m/100Mi per
    # node; measured p95 CPU <1m (max 4m) but peak working set 111Mi, i.e. memory
    # was slightly UNDER the request. CPU down, memory up.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &cni_memory 192Mi
      limits:
        memory: *cni_memory
