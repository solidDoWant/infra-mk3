---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istiod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: istiod
  jobLabel: istiod
  namespaceSelector:
    matchNames:
      - istio-system
  podMetricsEndpoints:
    - interval: 15s
      port: http-monitoring
  podTargetLabels:
    - app
