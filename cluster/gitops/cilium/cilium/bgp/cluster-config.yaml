---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp-talos
spec:
  # Peers with the node-local Talos BGP instance, which re-advertises to the
  # routers with BFD. See talos/patches/all/26-bgp.yaml.tpl.
  nodeSelector:
    matchLabels:
      cilium.home.arpa/node.bgp-enabled: "true"
  bgpInstances:
    - name: talos-local
      localASN: 64515
      peers:
        - name: talos
          peerASN: 64514
          # Talos end of the veth-cilium pair, same on every node.
          peerAddress: 10.63.255.255
          peerConfigRef:
            name: talos-local
