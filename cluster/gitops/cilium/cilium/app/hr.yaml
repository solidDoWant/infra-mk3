---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  ref:
    tag: 1.20.2
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/cilium/cilium/\.github/workflows/release\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  # These values are used for the initial deployment
  valuesFrom:
    - kind: ConfigMap
      name: helm-bootstrap-values
  # These values are added now that the cluster has been bootstrapped
  values:
    hubble:
      metrics:
        serviceMonitor:
          enabled: true
          metricRelabelings:
            - action: drop
              regex: ICMPv6
              sourceLabels:
                - protocol
      relay:
        prometheus:
          serviceMonitor:
            enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
    envoy:
      prometheus:
        serviceMonitor:
          enabled: true
    operator:
      prometheus:
        serviceMonitor:
          enabled: true
