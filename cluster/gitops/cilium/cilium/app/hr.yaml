---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  ref:
    tag: 1.20.4
    digest: sha256:712e1f65bf30533d117d1996ac3ace3efdb2521302d31ee887b1e45806bd6b64
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/cilium/cilium/\.github/workflows/release\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  # These values are used for the initial deployment
  valuesFrom:
    - kind: ConfigMap
      name: helm-bootstrap-values
  # These values are added now that the cluster has been bootstrapped
  # Scrape intervals are 30s instead of the chart's 10s: every agent scrape walks all
  # ~1300 BPF maps/programs, which was over half the agent's allocation churn.
  values:
    hubble:
      metrics:
        serviceMonitor:
          enabled: true
          interval: &scrape_interval 30s
          metricRelabelings:
            - action: drop
              regex: ICMPv6
              sourceLabels:
                - protocol
      relay:
        prometheus:
          serviceMonitor:
            enabled: true
            interval: *scrape_interval
    prometheus:
      serviceMonitor:
        enabled: true
        interval: *scrape_interval
    envoy:
      prometheus:
        serviceMonitor:
          enabled: true
          interval: *scrape_interval
    operator:
      prometheus:
        serviceMonitor:
          enabled: true
          interval: *scrape_interval
