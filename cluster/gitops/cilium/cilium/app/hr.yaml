---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://quay.io/cilium/charts/cilium
  ref:
    tag: 1.20.2
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  # These values are used for the initial deployment
  valuesFrom:
    - kind: ConfigMap
      name: helm-bootstrap-values
  # These values are added now that the cluster has been bootstrapped
  values:
    hubble:
      metrics:
        serviceMonitor:
          enabled: true
          metricRelabelings:
            - action: drop
              regex: ICMPv6
              sourceLabels:
                - protocol
      relay:
        prometheus:
          serviceMonitor:
            enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
    envoy:
      prometheus:
        serviceMonitor:
          enabled: true
    operator:
      prometheus:
        serviceMonitor:
          enabled: true
