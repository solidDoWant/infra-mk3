---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: githubgate
spec:
  interval: 1h
  # Not cosign-signed yet, so no verify block.
  url: oci://ghcr.io/soliddowant/charts/githubgate
  ref:
    tag: 0.3.0
    digest: sha256:b9c18ebd3dbd2006840e36ab628924a8654b6b07931b881c95dbfca1d85fb3b9
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: githubgate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: githubgate
  values:
    # Every replica serves (it is stateless; tokens are cached per replica)
    # and the status controller is leader-elected, so 2 survive a node drain.
    replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    image:
      digest: sha256:fa659c157b39a6aac2984e9e48a43abcf1431e2783e473e32e8358919fcac2fa
    # Only ci holds the GitHubApp, its key and the GitHubInstallation.
    adminNamespaces:
      - ci
    # Rejects GitHubApp/GitHubInstallation objects outside ci and rules outside
    # the installation's ceiling at admission. Its certificate comes from the
    # chart's own issuer (tls.yaml approves it).
    webhook:
      enabled: true
    # Token mode only for now. Proxy mode and sidecar injection come with the
    # CI and Coder steps (githubgate #21).
    proxy:
      enabled: false
    inject:
      enabled: false
    serviceMonitor:
      enabled: true
