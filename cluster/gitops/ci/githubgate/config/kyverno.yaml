---
# Intercepts CI tasks by ServiceAccount, so pipelines need no GitHub setup:
# a TaskRun in a CI project namespace that runs as ci-report or ci-release
# gets the label githubgate.soliddowant.dev/inject=true. Tekton copies TaskRun
# labels to the pod, and githubgate's injection webhook (app/hr.yaml, inject)
# then adds its interceptor. What each ServiceAccount may do through it is in
# the ci/project chart's proxy rules (templates/githubgate.yaml).
#
# - ci-report: PR and push runs' reporting tasks (check runs, PR labels).
#   A PR's own .tekton can pick it, so its rule allows only those operations.
# - ci-release: only runs started by a version-tag push (the
#   ci-release-pipelineruns admission policy), so only what can push tags
#   reaches its rule.
# - ci-build is never intercepted: PR builds clone and fetch github.com
#   anonymously, as before.
#
# The TaskRun, not the pod: the label must be there before githubgate's webhook
# sees the pod, and the webhook selects pods by label.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ci-githubgate-intercept
spec:
  # Fail closed would block every TaskRun when Kyverno is down. Failing open
  # only leaves the task without GitHub access: GitHub refuses its
  # unauthenticated writes (the test guard fails; report logs that it created
  # no check runs).
  failurePolicy: Ignore
  background: false
  rules:
    - name: inject-label
      match:
        any:
          - resources:
              kinds:
                - tekton.dev/v1/TaskRun
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  ci.home.arpa/project: "true"
                  githubgate.home.arpa/client: "true"
      preconditions:
        all:
          - key: "{{ request.object.spec.serviceAccountName || '' }}"
            operator: AnyIn
            value:
              - ci-report
              - ci-release
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              githubgate.soliddowant.dev/inject: "true"
