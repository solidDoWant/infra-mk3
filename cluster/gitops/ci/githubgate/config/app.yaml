---
# The production GitHub App, installed on every repository of the account.
# Its ID, OAuth client ID and private key are in app-key.sops.yaml. The client
# ID is only for GitHubUserAuthorizations (device flow, user access tokens).
apiVersion: githubgate.soliddowant.dev/v1alpha1
kind: GitHubApp
metadata:
  name: github
spec:
  appIDSecretRef:
    name: githubgate-app
    key: app-id
  clientIDSecretRef:
    name: githubgate-app
    key: client-id
  privateKeySecretRef:
    name: githubgate-app
    key: private-key.pem
---
# The App's installation on the account, and the most any policy may get
# through it. No administration or other repository settings, so no client can
# change branch protection or rulesets. Workflow files are allowed: a policy
# gets them only when it asks (the Coder template's "GitHub workflow changes").
apiVersion: githubgate.soliddowant.dev/v1alpha1
kind: GitHubInstallation
metadata:
  name: soliddowant
spec:
  appRef:
    name: github
  owner: solidDoWant
  ceiling:
    - repositories:
        - "*"
      permissions:
        contents: write
        pull_requests: write
        issues: write
        checks: write
        statuses: write
        workflows: write
  # Namespaces whose policies may use it (the ci/project chart and the Coder
  # template label them).
  allowedNamespaces:
    selector:
      matchLabels:
        githubgate.home.arpa/client: "true"
