---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Helm deletes CRDs that leave a release unless they carry this annotation.
# The chart installed these before they moved here (crds.install: false).
commonAnnotations:
  helm.sh/resource-policy: keep
resources:
  # Every githubgate CRD, attached to each GitHub release.
  - https://github.com/solidDoWant/githubgate/releases/download/v0.7.1-rc.1/crds.yaml
