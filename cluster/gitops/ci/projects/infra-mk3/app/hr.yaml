---
# The release is stored in ci; everything it creates is in ci-infra-mk3, which
# the chart creates.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-infra-mk3
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  targetNamespace: ci-infra-mk3
  storageNamespace: ci
  values:
    name: infra-mk3
    url: https://github.com/solidDoWant/infra-mk3
