---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-infra-mk3
  labels:
    # Build steps often run as root. They run in kata VMs
    # (default-pod-template in the TektonConfig).
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    # k8tz's timezone mounts break kata pods.
    k8tz.io/inject: "false"
