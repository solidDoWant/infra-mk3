---
# Pipelines run from the .tekton/ directory of the event's commit. Push events
# and pull requests from the owner and collaborators run automatically; pull
# requests from anyone else need an /ok-to-test comment naming the commit
# (require-ok-to-test-sha in the TektonConfig).
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: infra-mk3
spec:
  url: https://github.com/solidDoWant/infra-mk3
  # Builds for this repository wait their turn instead of all starting at once.
  concurrency_limit: 2
