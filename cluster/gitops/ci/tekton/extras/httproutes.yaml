---
# GitHub App webhook deliveries. Every request must carry a valid HMAC
# signature (webhook.secret in pipelines-as-code-secret).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelines-as-code-webhook
  labels:
    external-dns.home.arpa/publish: "true"
spec:
  hostnames:
    - pac-webhook.${SECRET_PUBLIC_DOMAIN_NAME}
  parentRefs:
    - name: external-gateway
      namespace: networking
  rules:
    - backendRefs:
        - name: pipelines-as-code-controller
          port: 8080
---
# Read-only Dashboard. It has no authentication of its own (and no OIDC
# support), so it's behind Authentik forward-auth: the host is also listed in
# networking/gateways/ingress/policies/authorization-policy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
spec:
  hostnames:
    - tekton.${SECRET_PUBLIC_DOMAIN_NAME}
  parentRefs:
    - name: internal-gateway
      namespace: networking
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
    # Send auth requests to the authentik outpost
    - backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
