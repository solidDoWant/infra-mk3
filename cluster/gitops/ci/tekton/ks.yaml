---
# Operator CRDs. Kept out of the Helm release so that uninstalling the chart
# can't delete them (and with them every Tekton object), and never pruned.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-operator-crds
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/crds
  prune: false # Don't ever drop the CRDs
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-operator
spec:
  targetNamespace: ci
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: tekton-operator-crds
    - name: prometheus-crds
---
# The TektonConfig, from which the operator installs Tekton Pipelines,
# Pipelines-as-Code and the Dashboard into ci-tekton, and everything in
# ci-tekton that the operator doesn't create. The TektonConfig is
# cluster-scoped, so the other objects set their namespace themselves rather
# than through targetNamespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  # Waits for the TektonConfig to report Ready, i.e. every component installed.
  wait: true
  timeout: 15m
  dependsOn:
    # The TektonConfig is validated by the operator's webhook.
    - name: tekton-operator
    - name: gateway-crds
    - name: prometheus-crds
---
# One HelmRelease of cluster/charts/ci/project per repository built by
# Pipelines-as-Code (projects/<name>.yaml). The releases live in ci; each
# creates its own ci-<name> namespace with the repository's Repository CR and
# build isolation.
#
# Secrets a repository's pipelines use (e.g. a ghcr.io push credential) can't
# go in the chart values (Flux doesn't decrypt them there). They belong in a
# second Kustomization, ci-project-secrets, with dependsOn ci-projects (the
# namespaces come from the releases) and each secret's namespace set in its
# file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name ci-projects
spec:
  targetNamespace: ci
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/projects
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The Repository CRD comes from Pipelines-as-Code, which the operator only
    # installs once the TektonConfig is reconciled. tekton waits for the
    # TektonConfig to be Ready, so this is what guarantees the CRD exists;
    # tekton-operator-crds only has the operator's own CRDs.
    - name: tekton
