---
# Operator CRDs. Kept out of the Helm release so that uninstalling the chart
# can't delete them (and with them every Tekton object), and never pruned.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-operator-crds
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/crds
  prune: false # Don't ever drop the CRDs
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-operator
spec:
  targetNamespace: ci
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: tekton-operator-crds
    - name: prometheus-crds
---
# The TektonConfig, from which the operator installs Tekton Pipelines,
# Pipelines-as-Code and the Dashboard into ci-tekton, and everything in
# ci-tekton that the operator doesn't create. The TektonConfig is
# cluster-scoped, so the other objects set their namespace themselves rather
# than through targetNamespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  # Waits for the TektonConfig to report Ready, i.e. every component installed.
  wait: true
  timeout: 15m
  dependsOn:
    # The TektonConfig is validated by the operator's webhook.
    - name: tekton-operator
    - name: gateway-crds
    - name: prometheus-crds
---
# Tekton Dashboard, limited to the project namespaces
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-dashboard
spec:
  targetNamespace: ci-tekton
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/dashboard
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The ci-tekton namespace
    - name: tekton
    - name: gateway-crds
---
# Docker for builds: the shared `docker` Task (task/), the Kyverno policy that
# starts each build from its project's golden cache, and the cache promoter
# (promoter/). The objects set their own namespaces (ci, ci-tekton,
# cluster-scoped).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-docker
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/docker
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The Task CRD and the ci-tekton namespace
    - name: tekton
    - name: kyverno-app
    # The ci-docker-cache storage class and its pool
    - name: rook-ceph-cluster
---
# Other shared Tasks (tasks/<name>/), for pipelines to reference through the
# cluster resolver from ci-tekton.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-tasks
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/tasks
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The Task CRD and the ci-tekton namespace
    - name: tekton
---
# The agent projects' shared Pipelines (pipelines/; container
# images/ci-tools), for their PipelineRuns to reference through the cluster
# resolver from ci-tekton.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-pipelines
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/pipelines
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The Pipeline CRD and the ci-tekton namespace
    - name: tekton
---
# One HelmRelease of cluster/charts/ci/project per repository built by
# Pipelines-as-Code (projects/<name>.yaml). The releases live in ci; each
# creates its own ci-<name> namespace with the repository's Repository CR,
# build isolation and the Dashboard's read access. Also add the namespace to
# the Dashboard's --namespaces (dashboard/hr.yaml). Each project's values set
# docker.registrygate.harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME} (the
# chart's registrygate interception is on by default and needs it).
#
# Secrets a repository's pipelines use (e.g. a ghcr.io push credential) can't
# go in the chart values (Flux doesn't decrypt them there). They belong in a
# second Kustomization, ci-project-secrets, with dependsOn ci-projects (the
# namespaces come from the releases) and each secret's namespace set in its
# file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name ci-projects
spec:
  targetNamespace: ci
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/projects
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    # The Repository CRD comes from Pipelines-as-Code, which the operator only
    # installs once the TektonConfig is reconciled. tekton waits for the
    # TektonConfig to be Ready, so this is what guarantees the CRD exists;
    # tekton-operator-crds only has the operator's own CRDs.
    - name: tekton
    # The chart's HarborProject/HarborProjectRobot/HarborRetentionPolicy need
    # the harbor-operator CRDs and the connection that admits ci-* namespaces.
    - name: harbor-operator-config
    # The chart's RegistryMirror/UpstreamCredential/RegistryAccessPolicy
    # need registrygate's CRDs and UpstreamRegistry objects.
    - name: registrygate-config
    # The chart's GitHubAccessPolicy objects need githubgate's CRDs, its
    # validating webhook, and the GitHubInstallation they reference.
    - name: githubgate-config
