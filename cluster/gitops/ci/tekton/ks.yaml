---
# Operator CRDs and the deletion guard. Kept out of the Helm release so that
# uninstalling the chart can't delete the CRDs (and with them every Tekton
# object), and never pruned.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-operator-crds
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/crds
  prune: false # Don't ever drop the CRDs
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-operator
spec:
  targetNamespace: ci
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: tekton-operator-crds
    - name: prometheus-crds
---
# The TektonConfig, from which the operator installs Tekton Pipelines,
# Pipelines-as-Code and the Dashboard into ci-tekton.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-config
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  # Waits for the TektonConfig to report Ready, i.e. every component installed.
  wait: true
  timeout: 15m
  dependsOn:
    - name: tekton-operator
---
# Everything in ci-tekton that the operator doesn't create: the GitHub App
# secret, routes, network policies, PDBs and scrape configs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name tekton-extras
spec:
  targetNamespace: ci-tekton
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/ci/tekton/extras
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: tekton-config
    - name: gateway-crds
    - name: prometheus-crds
