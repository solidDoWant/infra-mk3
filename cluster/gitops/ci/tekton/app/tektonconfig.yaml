---
# The operator installs every Tekton component from this, into ci-tekton.
#
# Fields under `options` that the operator doesn't support are ignored
# silently, with no error, so check a change actually landed on the generated
# object. Supported fields:
# https://github.com/tektoncd/operator/blob/main/docs/TektonConfig.md#additional-fields-as-options
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  # The operator's webhook rejects any other name.
  name: config
  annotations:
    # Deleting this uninstalls everything, including the Pipelines CRDs (and so
    # every PipelineRun), and garbage-collects ci-tekton.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # On operator v0.81.x Pipelines-as-Code is only installed with the `all`
  # profile (fixed on the v0.82 branch), which also installs the Dashboard.
  # Triggers, Chains and Results are disabled below.
  profile: all
  # Can't be changed once created. The namespace itself is namespace.yaml.
  targetNamespace: ci-tekton
  # The operator's default-deny NetworkPolicies. Cilium policies in
  # netpol.yaml replace them.
  networkPolicy:
    disabled: true
  trigger:
    disabled: true
  chain:
    disabled: true
  result:
    disabled: true
  # Pipelines-as-Code prunes the runs it creates (default-max-keep-runs), and
  # it creates every run here. Logs are kept by VictoriaLogs.
  pruner:
    disabled: true
  tektonpruner:
    disabled: true
  # The `all` profile always installs a Dashboard, whose ServiceAccount the
  # operator binds cluster-wide to read every pod and pod log. It's scaled to
  # 0; ../dashboard runs one limited to the project namespaces.
  dashboard:
    readonly: true
    options:
      deployments:
        tekton-dashboard:
          spec:
            replicas: 0
  pipeline:
    set-security-context: true
    default-timeout-minutes: 60
    # Builds run as each project's ci-build ServiceAccount (made by the
    # ci/project chart), which has no API access and is what registrygate's
    # policies name. A run can still pick another.
    default-service-account: ci-build
    # Every build runs in a VM. The pod template also takes `env`, applied to
    # every step container (a run's own podTemplate wins for the same name).
    #
    # ndots 1: a name with a dot (ghcr.io, a service's full name) is looked up
    # as it is, instead of first through the three search domains, both A and
    # AAAA: one query instead of up to eight. Bare service names still use the
    # search domains. kind nodes and other containers on the build's dockerd
    # inherit it from the pod's resolv.conf.
    default-pod-template: |
      runtimeClassName: kata
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # Spread the docker Task pods (each a large kata VM) across nodes when
      # there is room, but never hold one back for it: several on one node is
      # fine. The scheduler's default spread constraints don't reach these
      # pods (they only apply to pods of Services and controllers), and they are
      # hard rules.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              ci.home.arpa/docker-task: "true"
    # No fetching Tasks or Pipelines from outside a repo's own .tekton/
    # directory. The cluster resolver only reads objects already in the
    # cluster. The http resolver has no field here; it's turned off in
    # resolvers-feature-flags below.
    enable-bundles-resolver: false
    enable-hub-resolver: false
    enable-git-resolver: false
    enable-cluster-resolver: true
    # Shared Tasks (e.g. ../docker/task/task.yaml) live in ci-tekton; nothing else
    # can be resolved from the cluster.
    cluster-resolver-config:
      default-namespace: ci-tekton
      allowed-namespaces: ci-tekton
    # The controller, leader-elected across buckets
    performance:
      disable-ha: false
      replicas: 2
      buckets: 2
    options:
      configMaps:
        config-observability:
          data:
            metrics-protocol: prometheus
        # At info, the webhook logs a full Go dump of every HTTP request it
        # serves (~1.5KB each). The API server sends one per CRD conversion,
        # for every TaskRun/PipelineRun write: it keeps a watch cache for each
        # served version, and v1beta1 is still served. ~150k lines/day. The
        # key is `loglevel.<component>`, and the webhook's component is its
        # service name; the shipped `loglevel.webhook` key matches nothing.
        config-logging:
          data:
            loglevel.tekton-pipelines-webhook: warn
        resolvers-feature-flags:
          data:
            enable-http-resolver: "false"
        feature-flags:
          data:
            # Run Task sidecars as native Kubernetes sidecars, which kubelet
            # stops with the pod. Tekton's own way of stopping them swaps in
            # a no-op image, so kubelet restarts the container while the kata
            # VM is being torn down. That race leaves an orphaned kata shim
            # holding the dead container, and kubelet's garbage collector
            # fails to remove it every minute. TektonConfig has no field for
            # this flag.
            enable-kubernetes-sidecar: "true"
      deployments:
        tekton-pipelines-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-pipelines-controller
                    resources:
                      requests:
                        cpu: 10m
                        memory: &controller_memory 256Mi
                      limits:
                        memory: *controller_memory
        tekton-events-controller:
          spec:
            replicas: 2
            template:
              spec:
                containers:
                  - name: tekton-events-controller
                    resources:
                      requests:
                        cpu: 10m
                        memory: &events_memory 128Mi
                      limits:
                        memory: *events_memory
        tekton-pipelines-remote-resolvers:
          spec:
            replicas: 2
            template:
              spec:
                containers:
                  - name: controller
                    resources:
                      requests:
                        cpu: 10m
                        memory: &resolvers_memory 256Mi
                      limits:
                        memory: *resolvers_memory
        tekton-pipelines-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    resources:
                      requests:
                        cpu: 10m
                        memory: &webhook_memory 256Mi
                      limits:
                        memory: *webhook_memory
        # Operator-added mutating webhook for TaskRun pods. It fails closed,
        # so keep two.
        tekton-operator-proxy-webhook:
          spec:
            replicas: 2
            template:
              spec:
                containers:
                  - name: proxy
                    resources:
                      requests:
                        cpu: 10m
                        memory: &proxy_webhook_memory 128Mi
                      limits:
                        memory: *proxy_webhook_memory
      # The release ships an HPA for the webhook, which owns its replica count
      # (the operator can't remove it). Pin it to two: its admission webhooks
      # fail closed, and a homelab's load never needs more.
      horizontalPodAutoscalers:
        tekton-pipelines-webhook:
          spec:
            minReplicas: 2
            maxReplicas: 2
        # Same for the operator's proxy webhook, which ships an HPA too.
        tekton-operator-proxy-webhook:
          spec:
            minReplicas: 2
            maxReplicas: 2
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: true
        settings:
          application-name: Tekton CI
          # Repositories are onboarded with a release of the ci-project chart
          # (../projects).
          auto-configure-new-github-repo: "false"
          # An /ok-to-test comment must name the commit it approves, so a push
          # made after the comment doesn't run unreviewed.
          require-ok-to-test-sha: "true"
          remember-ok-to-test: "false"
          # Don't copy build log lines into GitHub checks: they may include
          # secrets.
          error-log-snippet: "false"
          error-detection-from-container-logs: "false"
          # The per-run git token only covers the repository being built.
          secret-auto-create: "true"
          secret-github-app-token-scoped: "true"
          # No fetching tasks from Artifact Hub or URLs.
          remote-tasks: "false"
          default-max-keep-runs: "10"
          max-keep-run-upper-limit: "50"
          tekton-dashboard-url: https://tekton.${SECRET_PUBLIC_DOMAIN_NAME}
        options:
          deployments:
            pipelines-as-code-controller:
              spec:
                replicas: 2
                template:
                  metadata:
                    labels:
                      # External gateway egress allow, for GitHub webhook
                      # deliveries. The pod's own netpol limits this to the
                      # listener port.
                      endpoints.netpols.home.arpa/external-ingress-enabled: "true"
                  spec:
                    containers:
                      - name: pac-controller
                        resources:
                          requests:
                            cpu: 10m
                            memory: &pac_controller_memory 256Mi
                          limits:
                            memory: *pac_controller_memory
            # Leader-elected (pac-watcher-config-leader-election)
            pipelines-as-code-watcher:
              spec:
                replicas: 2
                template:
                  spec:
                    containers:
                      - name: pac-watcher
                        resources:
                          requests:
                            cpu: 10m
                            memory: &pac_watcher_memory 256Mi
                          limits:
                            memory: *pac_watcher_memory
            pipelines-as-code-webhook:
              spec:
                replicas: 2
                template:
                  spec:
                    containers:
                      - name: pac-webhook
                        resources:
                          requests:
                            cpu: 10m
                            memory: &pac_webhook_memory 128Mi
                          limits:
                            memory: *pac_webhook_memory
