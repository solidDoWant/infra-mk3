---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: ci
  name: ci-docker-cache-promoter
specs:
  - description: docker cache promoter
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: ci-docker-cache-promoter
    egress:
      # DNS resolution
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # Kubernetes API: runs, pods, PVCs and snapshots in project namespaces
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
    ingress:
      - {}
