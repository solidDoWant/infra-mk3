---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: ci
  name: ci-docker-cache-promoter
---
# Granted in each project namespace by the ci-project chart's RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-docker-cache-promoter
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
    verbs:
      - get
      - list
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - get
      - list
      - create
      - delete
---
# Cluster-wide, it only finds the project namespaces (by label).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-docker-cache-promoter-namespaces
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-docker-cache-promoter-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-docker-cache-promoter-namespaces
subjects:
  - kind: ServiceAccount
    name: ci-docker-cache-promoter
    namespace: ci
