---
# Promotes the Docker cache of each project's newest successful push build on
# its default branch to be the project's golden cache, which later builds clone
# (golden-clone-policy.yaml). Only those builds can promote: the event type
# label and branch annotation are set by Pipelines-as-Code itself, overwriting
# anything a repository's .tekton/ files declare, and PR and other-branch
# builds never qualify. It runs here rather than in a project namespace so
# nothing a build runs can reach its permissions.
apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: ci
  name: ci-docker-cache-promoter
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ci-docker-cache-promoter
        spec:
          serviceAccountName: ci-docker-cache-promoter
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: promote
              image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                # kubectl's cache; the root filesystem is read-only
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: &memory 128Mi
                limits:
                  memory: *memory
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  # Golden snapshots kept per project. The newest is cloned;
                  # the previous one stays until its replacement is ready.
                  KEEP=2

                  for ns in $(kubectl get namespaces -l ci.home.arpa/project=true -o jsonpath='{.items[*].metadata.name}'); do
                    branch="$(kubectl get namespace "$ns" -o jsonpath='{.metadata.annotations.ci\.home\.arpa/default-branch}')"
                    [ -n "$branch" ] || continue

                    # Newest successful push build on the default branch. The
                    # branch annotation is the pushed ref (refs/heads/<branch>).
                    run="$(kubectl -n "$ns" get pipelineruns -l pipelinesascode.tekton.dev/event-type=push -o json | jq -r --arg b "$branch" '
                      [.items[]
                        | select((.metadata.annotations["pipelinesascode.tekton.dev/branch"] // "" | ltrimstr("refs/heads/")) == $b)
                        | select(any(.status.conditions[]?; .type == "Succeeded" and .status == "True"))]
                      | sort_by(.status.completionTime) | last | .metadata.name // empty')"
                    [ -n "$run" ] || continue

                    snapshot="docker-cache-${run}"
                    if kubectl -n "$ns" get volumesnapshot "$snapshot" >/dev/null 2>&1; then
                      continue
                    fi

                    # The run's cache volume: the docker Task pod that finished
                    # last. Finished pods have released the volume, so the
                    # snapshot is consistent.
                    pvc="$(kubectl -n "$ns" get pods -l tekton.dev/pipelineRun="$run" -o json | jq -r '
                      [.items[]
                        | select(.status.phase == "Succeeded")
                        | . as $pod
                        | .spec.volumes[]?
                        | select(.ephemeral.volumeClaimTemplate.metadata.labels["ci.home.arpa/docker-cache"] == "true")
                        | {pvc: ($pod.metadata.name + "-" + .name),
                           finished: ([$pod.status.containerStatuses[].state.terminated.finishedAt] | max)}]
                      | sort_by(.finished) | last | .pvc // empty')"
                    [ -n "$pvc" ] || continue
                    kubectl -n "$ns" get pvc "$pvc" >/dev/null 2>&1 || continue

                    echo "${ns}: promoting ${pvc} (PipelineRun ${run})"
                    kubectl -n "$ns" create -f - <<YAML
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: ${snapshot}
                    labels:
                      ci.home.arpa/docker-cache-golden: "true"
                    annotations:
                      ci.home.arpa/source-pipelinerun: ${run}
                  spec:
                    volumeSnapshotClassName: ssd-replicated-3x-block
                    source:
                      persistentVolumeClaimName: ${pvc}
                  YAML

                    # Drop all but the newest KEEP ready golden snapshots.
                    kubectl -n "$ns" get volumesnapshots -l ci.home.arpa/docker-cache-golden=true -o json \
                      | jq -r --argjson keep "$KEEP" '
                        [.items[] | select(.status.readyToUse == true)]
                        | sort_by(.metadata.creationTimestamp) | reverse | .[$keep:][] | .metadata.name' \
                      | while read -r old; do
                          echo "${ns}: deleting old golden snapshot ${old}"
                          kubectl -n "$ns" delete volumesnapshot "$old" --wait=false
                        done
                  done
