---
# Lets the docker cache promoter (hr.yaml) see which Ceph OSDs are up, to put
# golden caches only in pools that are available.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: storage
  name: ci-docker-cache-promoter
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: storage
  name: ci-docker-cache-promoter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-docker-cache-promoter
subjects:
  - kind: ServiceAccount
    namespace: ci
    name: ci-docker-cache-promoter
