---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  namespace: ci
  name: ci-docker-cache-promoter
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-5.3.0/charts/other/app-template/values.schema.json
# Promotes the Docker cache of each project's newest successful default-branch
# push build to be its golden cache (script/promote.sh). It watches push
# PipelineRuns and acts when one succeeds. It runs here rather than in a
# project namespace so nothing a build runs can reach its permissions.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: ci
  name: ci-docker-cache-promoter
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: ci-docker-cache-promoter
  values:
    controllers:
      promoter:
        # One: a promotion takes several steps that resume after a restart,
        # and a second replica would work on the same run. A promotion missed
        # while it restarts is caught by the scan it starts with.
        replicas: 1
        strategy: Recreate
        serviceAccount:
          identifier: promoter
        containers:
          promoter:
            image:
              repository: mirror.gcr.io/alpine/k8s
              tag: 1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
            command:
              - /bin/bash
              - /scripts/promote.sh
            env:
              # kubectl's cache; the root filesystem is read-only
              HOME: /tmp
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: &memory 128Mi
              limits:
                memory: *memory
        pod:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          dnsConfig:
            options:
              - name: ndots
                value: "1"
    persistence:
      script:
        type: configMap
        # Generated by script/kustomization.yaml
        name: ci-docker-cache-promoter-script
        globalMounts:
          - path: /scripts
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    serviceAccount:
      promoter:
        forceRename: ci-docker-cache-promoter
    rbac:
      roles:
        # Granted in each project namespace by the ci-project chart's
        # RoleBinding (it references this name).
        project:
          type: ClusterRole
          forceRename: ci-docker-cache-promoter
          rules:
            - apiGroups:
                - tekton.dev
              resources:
                - pipelineruns
              verbs:
                - get
                - list
            # Reading builds' pods and volumes, and the snapshots, volumes
            # and copy pod a promotion goes through (script/promote.sh). The
            # copy pod runs in kata like any build pod (ci-build-pods).
            - apiGroups:
                - ""
              resources:
                - pods
                - persistentvolumeclaims
              verbs:
                - get
                - list
                - create
                - delete
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - get
            - apiGroups:
                - snapshot.storage.k8s.io
              resources:
                - volumesnapshots
              verbs:
                - get
                - list
                - watch
                - create
                - patch
                - delete
        # Cluster-wide: finding the project namespaces, and the PipelineRun
        # watch it triggers on. PipelineRuns only exist in project namespaces.
        cluster:
          type: ClusterRole
          forceRename: ci-docker-cache-promoter-cluster
          rules:
            - apiGroups:
                - ""
              resources:
                - namespaces
              verbs:
                - get
                - list
            - apiGroups:
                - tekton.dev
              resources:
                - pipelineruns
              verbs:
                - list
                - watch
            # Choosing a cache pool: cordoned nodes, and docker cache volumes
            # per pool as the load. OSD state is read through rbac.yaml.
            - apiGroups:
                - ""
              resources:
                - nodes
                - persistentvolumeclaims
              verbs:
                - list
      bindings:
        cluster:
          type: ClusterRoleBinding
          forceRename: ci-docker-cache-promoter-cluster
          roleRef:
            identifier: cluster
          subjects:
            - identifier: promoter
              kind: ServiceAccount
