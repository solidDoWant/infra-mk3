---
# The operator's metrics. The webhook's Service has the same labels but no
# http-metrics port, so it isn't scraped.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tekton-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-operator
      app.kubernetes.io/instance: tekton-operator
  endpoints:
    - port: http-metrics
  jobLabel: app.kubernetes.io/name
