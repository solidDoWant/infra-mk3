---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tekton-operator
spec:
  interval: 1h
  url: oci://ghcr.io/tektoncd/operator/charts/tekton-operator
  # The chart isn't cosign-signed, so the digest is the only pin.
  ref:
    tag: 0.82.0
    digest: sha256:7747b8c870990df5ebadbd0b2b3a38439858e3a6b6b62abfe69bce84578f1e71
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tekton-operator
  values:
    # The CRDs are installed by the tekton-operator-crds Kustomization (../crds).
    installCRDs: false
    operator:
      image:
        # Spelled out (it's the chart default) so Renovate sees the image.
        repository: ghcr.io/tektoncd/operator/operator-303303c315a48490ba6517859ef65b77
        # The webhook tag is left at the chart default: the chart reuses it as
        # the operator's VERSION env var, so it can't carry a digest. This tag
        # must match the chart version; Renovate's tekton-operator group moves
        # them together.
        tag: v0.82.0@sha256:22ded5603bf1cca965604ebf93e7700b2106764a7bb65a00687193446d2aaa31
      # Leader-elected
      replicas: 2
      # Flux owns the TektonConfig (../app). With auto-install on, the
      # operator creates its own `config` at startup, and targetNamespace can't
      # be changed after creation.
      autoInstallComponents: false
      defaultTargetNamespace: ci-tekton
      # Applies to both operator containers.
      resources:
        requests:
          cpu: 10m
          memory: &operator_memory 256Mi
        limits:
          memory: *operator_memory
    webhook:
      replicas: 2
      resources:
        requests:
          cpu: 10m
          memory: &webhook_memory 128Mi
        limits:
          memory: *webhook_memory
    podSecurityContext:
      runAsNonRoot: true
      # The image's nonroot user
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    # The chart's ServiceMonitor selects on app.kubernetes.io/component, which
    # its Service doesn't carry, so it matches nothing; service-scrape.yaml
    # replaces it.
    service:
      createServiceMonitor: false
  postRenderers:
    - kustomize:
        patches:
          # The operator's own metrics are off by default since v0.80.
          - target:
              kind: ConfigMap
              name: tekton-operator-observability
            patch: |
              - op: add
                path: /data/metrics-protocol
                value: prometheus
