---
# This repository, onboarded for testing the Tekton install. It has no .tekton/
# directory on its default branch, so Pipelines-as-Code does nothing for it
# until a branch adds one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-infra-mk3
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    name: infra-mk3
    # Publishes from master: the project-zomboid image goes to Harbor on every
    # push to master that changes it (.tekton/project-zomboid/push.yaml).
    release:
      refs: "^master$"
    harbor:
      vulnerability:
        # Scans still run on push, but don't block pulls. The project-zomboid
        # image ships the game's own Java libraries (Jackson, Guava), whose
        # CVEs can't be fixed here; with the block on, a newly published CVE
        # would stop the game server from starting after its next restart.
        preventVulnerableImages: false
      # The game server's pull robot (games/project-zomboid).
      allowedNamespaces:
        - games
      retention:
        # Images here are ~2 GB; a few tags of each are plenty.
        keepLatestPushed: 3
    docker:
      # The project-zomboid image build holds the ~7 GB game install twice
      # (builder and runtime stages) plus the exported image, unpacked again
      # to load it.
      cacheVolumeSize: 50Gi
      registrygate:
        harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME}
        # This repository's pipelines publish images for the whole account,
        # so it may push any of them. Other projects keep the default (their
        # own packages only).
        ghcrPush:
          enabled: true
          repositories:
            - soliddowant/**
