---
# solidDoWant/harbor-operator: Kubernetes operator for Harbor, built by
# agents. CI runs on the shared Pipelines (cluster/gitops/ci/tekton/pipelines)
# from the repository's ci.yaml: parallel stages in one dind sidecar per run,
# with three Harbor installs on their own kind clusters (integration and two
# e2e).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-harbor-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    name: harbor-operator
    # A run holds three kind clusters, each with a full Harbor install, so it
    # is among the heaviest projects. Start at 3 and raise it once a run's
    # size is measured.
    concurrencyLimit: 3
    quota:
      # 3 runs at ~21.5 GiB each (a 20 GiB dind sidecar plus the task). A
      # ceiling, not a reservation.
      memory: 72Gi
      # Up to 3 pods a run (labels, ci, report).
      pods: 15
    harbor:
      # CI pushes no images: releases go to ghcr.io.
      enabled: false
    docker:
      # The CI image from flake.nix, Go module and build caches (with -race),
      # the kind node image and the Harbor images for three clusters.
      cacheVolumeSize: 80Gi
      registrygate:
        harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME}
        # Releases (.tekton/release.yaml, on version tags) push the operator
        # image and the chart. Only the ci-release ServiceAccount gets push;
        # PR and master builds only pull.
        ghcrPush:
          enabled: true
          repositories:
            - soliddowant/harbor-operator
            - soliddowant/charts/harbor-operator
