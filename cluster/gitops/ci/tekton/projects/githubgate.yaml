---
# solidDoWant/githubgate: GitHub App access broker for CI and workspaces,
# built by agents. CI layout copied from registrygate (parallel stages in one
# dind sidecar per run, kind clusters for e2e).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-githubgate
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    name: githubgate
    # Agents open many PRs, and a run waiting in the queue adds to every
    # issue's time. Lowered from 6 (2026-11-21): a run's dind sidecar needs
    # 13 GiB (measured peak ~8.6 GiB with envtest, kind and -race), and the
    # fuzz and lint stages use every CPU they see, so six parallel runs
    # starved one node and OOM-killed sidecars.
    concurrencyLimit: 4
    quota:
      # 4 runs at ~14.5 GiB each (13 GiB dind sidecar plus the task). A
      # ceiling, not a reservation.
      memory: 64Gi
      # Up to 3 pods a run (ci, test-guard, report).
      pods: 20
    harbor:
      # CI pushes no images: releases go to ghcr.io.
      enabled: false
    docker:
      # The CI image from flake.nix, Go module and build caches (with -race),
      # the kind node image and e2e images, with kind clusters during e2e.
      # Raised from 50Gi (2026-11-21): phase 4's caches left it 82% full after
      # cleanup, over cleanup.sh's limit. Thin RBD on ci-cache-ec.
      cacheVolumeSize: 80Gi
      registrygate:
        harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME}
        # Releases (.tekton/release.yaml, on version tags) push the server and
        # client images and the chart. Only the ci-release ServiceAccount gets
        # push; PR and master builds only pull.
        ghcrPush:
          enabled: true
          repositories:
            - soliddowant/githubgate
            - soliddowant/githubgate-client
            - soliddowant/charts/githubgate
