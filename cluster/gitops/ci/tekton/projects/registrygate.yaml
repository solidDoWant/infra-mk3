---
# solidDoWant/registrygate, moving its CI from GitHub Actions to Tekton
# (registrygate issue #175). Sized for its phase 4 design (registrygate
# #182): every stage runs in parallel inside one dind sidecar per run.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-registrygate
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    name: registrygate
    # Agents open many PRs, and PRs share the queue with master pushes, so a
    # run waiting in the queue adds to an issue's time as much as the CI does.
    # A run is ~4 min now. Runs that the nodes have no room for wait Pending.
    concurrencyLimit: 6
    quota:
      # One run is ~14.5 GiB (a 14 GiB dind sidecar, sized from the stages'
      # cold-cache peaks, plus small pods and kata overhead), so this fits 6
      # at once. A ceiling, not a reservation.
      memory: 96Gi
      # Up to 3 pods a run (ci, test-guard, report).
      pods: 20
    harbor:
      # CI pushes no images: releases go to ghcr.io.
      enabled: false
    docker:
      # The CI image built from flake.nix (~3.4 GB), the Go build and module
      # caches (~4 GB and growing), the kind node image and the e2e images,
      # plus two kind clusters at once during e2e, each with its own copy of
      # the ~14 preloaded images: past 20 GB mid-run, with Docker keeping its
      # build cache to 60% of this. At 30Gi, runs hit write-back errors on
      # this disk, which then block the kind nodes' overlay mounts
      # (registrygate#191).
      cacheVolumeSize: 50Gi
      registrygate:
        harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME}
