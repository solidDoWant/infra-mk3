---
# solidDoWant/registrygate, moving its CI from GitHub Actions to Tekton
# (registrygate issue #175). Sized for its phase 4 design (registrygate
# #182): every stage runs in parallel inside one dind sidecar per run.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-registrygate
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    name: registrygate
    # Agents open many PRs, and PRs share the queue with master pushes, so a
    # run waiting in the queue adds to an issue's time as much as the CI does.
    # A run is ~4 min now. Past what the quota or the nodes have room for, runs
    # wait (Tekton retries pods over quota; the scheduler leaves the rest
    # Pending), so this is a ceiling.
    concurrencyLimit: 10
    quota:
      # Measured 2026-11-19 inside a warm run's VM: 4.0 GiB used at the peak
      # (page cache excluded), both kind clusters included. With registrygate's
      # dind sidecar at 8 GiB (2x that, see registrygate's .tekton/), a run is
      # ~8.5 GiB, so this fits 10 at once with room for a cold-cache run. A
      # ceiling, not a reservation.
      memory: 96Gi
      # Up to 3 pods a run (ci, test-guard, report).
      pods: 32
    harbor:
      # CI pushes no images: releases go to ghcr.io.
      enabled: false
    docker:
      # The CI image built from flake.nix (~3.4 GB), the Go build and module
      # caches (~4 GB and growing), the kind node image and the e2e images,
      # plus two kind clusters at once during e2e, each with its own copy of
      # the ~14 preloaded images: past 20 GB mid-run, with Docker keeping its
      # build cache to 60% of this. At 30Gi, runs hit write-back errors on
      # this disk, which then block the kind nodes' overlay mounts
      # (registrygate#191).
      cacheVolumeSize: 50Gi
      registrygate:
        harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME}
        # Releases (.tekton/release.yaml, on version tags) push both images
        # and the chart to ghcr.io. Only the ci-release ServiceAccount gets
        # these push rules; PR and master builds still only pull.
        ghcrPush:
          enabled: true
          repositories:
            - soliddowant/registrygate
            - soliddowant/registrygate-credential-helper
            - soliddowant/charts/registrygate
