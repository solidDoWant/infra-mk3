---
# solidDoWant/toolgate: MCP gateway for Claude Code, built by agents. CI runs
# on the shared Pipelines (cluster/gitops/ci/tekton/pipelines) from the
# repository's ci.yaml: parallel stages in one dind sidecar per run, with one
# e2e kind cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-project-toolgate
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/ci/project
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    name: toolgate
    # One run at a time: a run reserves ~17.6 GiB (a 14Gi dind sidecar, the
    # other containers and kata's overhead), and on 2026-11-23 no node had
    # room for a second one beside the cluster's other reservations. A run
    # that can't be scheduled still counts against the pipeline's 1h timeout,
    # while one waiting in Pipelines-as-Code's concurrency queue doesn't, so a
    # higher limit made runs time out instead of waiting their turn. 2 since
    # githubgate's agent VM (16.4 GiB) was stopped: drop back to 1 if runs
    # start timing out unscheduled again (e.g. while both agent VMs run).
    concurrencyLimit: 2
    quota:
      # Two runs plus one more's pods while a run finishes (~17.6 GiB each). A
      # ceiling, not a reservation.
      memory: 56Gi
      # Up to 3 pods a run (labels, ci, report).
      pods: 15
    harbor:
      # CI pushes no images: releases go to ghcr.io.
      enabled: false
    docker:
      # The CI image from flake.nix (with Chromium), Go module and build caches
      # (with -race), the embeddings model, the kind node image and e2e images
      # for three clusters.
      cacheVolumeSize: 80Gi
      registrygate:
        harborHost: harbor.${SECRET_PUBLIC_DOMAIN_NAME}
        # Releases (.tekton/release.yaml, on version tags) push the gateway
        # image and the chart. Only the ci-release ServiceAccount gets push;
        # PR and master builds only pull.
        ghcrPush:
          enabled: true
          repositories:
            - soliddowant/toolgate
            - soliddowant/charts/toolgate
