---
# Pushes (and pulls) to ghcr.io/soliddowant/... with the account's PAT
# (ghcr-push-credentials.sops.yaml). One credential for every project that
# pushes to GHCR: each project's RegistryAccessPolicy, rendered by the
# ci/project chart from docker.registrygate.ghcrPush, decides which of the
# account's packages its builds may push. That's enough because only Flux
# writes those policies (builds' ci-build ServiceAccount has no RBAC, and
# people get view access). If people ever get edit rights in project
# namespaces, give each project its own credential with a narrower ceiling.
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamCredential
metadata:
  namespace: ci
  name: ghcr-push
spec:
  upstreamRef:
    name: ghcr
  secretRef:
    name: ghcr-push-credentials
  ceiling:
    - repositories:
        - soliddowant/**
      actions:
        - pull
        - push
  # Only projects that opt in (docker.registrygate.ghcrPush.enabled).
  allowedNamespaces:
    selector:
      matchLabels:
        registrygate.home.arpa/ghcr-push: "true"
