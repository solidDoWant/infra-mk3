---
# Copies the registrygate CA certificate (app/tls.yaml) into every CI project
# namespace as the ConfigMap registrygate-ca, which the docker Task mounts into
# dockerd's /etc/docker/certs.d. Same pattern as the root CA's trust
# distribution (certificates/issuers/trust-distribution). The CA lasts 10
# years; a reissue reaches a namespace on its next sync.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ci-registrygate-ca
spec:
  rules:
    - name: copy-ca-certificate
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  ci.home.arpa/project: "true"
      skipBackgroundRequests: true
      context:
        - name: caCert
          apiCall:
            method: GET
            urlPath: /api/v1/namespaces/ci/secrets/registrygate-ca
            # Secret data is base64-encoded; ConfigMap data is plain PEM.
            jmesPath: base64_decode(data."tls.crt")
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: ConfigMap
        name: registrygate-ca
        namespace: >-
          {{ request.object.metadata.name }}
        data:
          data:
            ca.crt: >-
              {{ caCert }}
---
# Sends the registry hosts registrygate stands in for to the proxy, in docker
# Task build pods (labelled by the Task) of project namespaces that opt in with
# registrygate.home.arpa/intercept=true (the ci/project chart's
# docker.registrygate.intercept value). The Task's step turns on the credential helper
# only when these entries are in /etc/hosts, so without this policy (or with
# Kyverno down) builds go straight to the registries, as before.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ci-registrygate-intercept
spec:
  failurePolicy: Ignore
  background: false
  rules:
    - name: host-aliases
      match:
        any:
          - resources:
              kinds:
                - Pod
              # hostAliases can only be set at creation.
              operations:
                - CREATE
              selector:
                matchLabels:
                  ci.home.arpa/docker-task: "true"
              namespaceSelector:
                matchLabels:
                  ci.home.arpa/project: "true"
                  registrygate.home.arpa/intercept: "true"
      mutate:
        patchStrategicMerge:
          spec:
            hostAliases:
              # The proxy's pinned ClusterIP (app/hr.yaml). Keep the host list
              # equal to the UpstreamRegistry hosts (upstreams.yaml) and the
              # CA's name constraints (app/tls.yaml).
              - ip: 10.33.0.11
                hostnames:
                  - ghcr.io
