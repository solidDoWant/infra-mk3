---
# ghcr.io. Builds that intercept it (config/kyverno.yaml) pull through the
# proxy with their ServiceAccount token. Until a project's policy adds a mirror
# or a credential, its pulls go to ghcr.io anonymously, as they would without
# the proxy.
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamRegistry
metadata:
  namespace: ci
  name: ghcr
spec:
  hosts:
    - ghcr.io
  url: https://ghcr.io
  tls:
    secretRef:
      name: registrygate-tls
  # Anonymous requests get a 401, so BuildKit and containerd, which try
  # without credentials first, retry with the pod's token and the proxy knows
  # which project is pulling.
  anonymousPulls: Challenge
  # The CI projects' Harbor proxy-cache projects, reached over Harbor core's
  # Service (plain HTTP inside the cluster, so the mirror robots' credentials
  # aren't encrypted in transit; harbor-operator already talks to Harbor the
  # same way).
  allowedMirrorURLs:
    - http://harbor-core.development.svc.cluster.local
  allowedNamespaces:
    selector:
      matchLabels:
        registrygate.home.arpa/client: "true"
---
# The cluster's Harbor, under the name builds use for it. Builds push to (and
# pull from) their own Harbor project through the proxy with their
# ServiceAccount token, with the project's push robot behind an
# UpstreamCredential in the project namespace (cluster/charts/ci/project,
# registrygate.yaml). The proxy reaches Harbor over
# core's Service. Harbor names itself by its externalURL, which is this same
# host, in token realms and upload Locations; registrygate treats its own hosts
# as aliases, so those go to the Service too.
#
# Intercepting this host means builds can't use Harbor's own API
# (/api/v2.0/...): the proxy serves only the registry API.
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamRegistry
metadata:
  namespace: ci
  name: harbor
spec:
  hosts:
    - harbor.${SECRET_PUBLIC_DOMAIN_NAME}
  url: http://harbor-core.development.svc.cluster.local
  # Harbor's token realm and Locations name the host it was reached by, with
  # https; send those to url too. (Its externalURL is in hosts, which count
  # as aliases already.)
  aliasHosts:
    - harbor-core.development.svc.cluster.local
  tls:
    secretRef:
      name: registrygate-tls
  anonymousPulls: Challenge
  allowedNamespaces:
    selector:
      matchLabels:
        registrygate.home.arpa/client: "true"
---
# quay.io. Its token endpoint is on the same host.
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamRegistry
metadata:
  namespace: ci
  name: quay
spec:
  hosts:
    - quay.io
  url: https://quay.io
  tls:
    secretRef:
      name: registrygate-tls
  anonymousPulls: Challenge
  allowedMirrorURLs:
    - http://harbor-core.development.svc.cluster.local
  allowedNamespaces:
    selector:
      matchLabels:
        registrygate.home.arpa/client: "true"
---
# mirror.gcr.io (Google's Docker Hub mirror). Anonymous, token endpoint on the same
# host.
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamRegistry
metadata:
  namespace: ci
  name: mirror-gcr
spec:
  hosts:
    - mirror.gcr.io
  url: https://mirror.gcr.io
  tls:
    secretRef:
      name: registrygate-tls
  anonymousPulls: Challenge
  allowedMirrorURLs:
    - http://harbor-core.development.svc.cluster.local
  allowedNamespaces:
    selector:
      matchLabels:
        registrygate.home.arpa/client: "true"
---
# Docker Hub, under every name Docker's clients use for it: dockerd pulls
# from registry-1.docker.io, and the CLI and BuildKit look up credentials as
# index.docker.io (https://index.docker.io/v1/).
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamRegistry
metadata:
  namespace: ci
  name: dockerhub
spec:
  hosts:
    - registry-1.docker.io
    - docker.io
    - index.docker.io
  url: https://registry-1.docker.io
  tokenRealmHosts:
    - auth.docker.io
  tls:
    secretRef:
      name: registrygate-tls
  anonymousPulls: Challenge
  allowedMirrorURLs:
    - http://harbor-core.development.svc.cluster.local
  allowedNamespaces:
    selector:
      matchLabels:
        registrygate.home.arpa/client: "true"
