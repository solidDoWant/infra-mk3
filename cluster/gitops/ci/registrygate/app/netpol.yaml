---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registrygate
specs:
  - description: proxy
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: registrygate
        app.kubernetes.io/instance: registrygate
    egress:
      # DNS resolution
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # kube-apiserver: token reviews, the custom resources and their status,
      # Secret watches, leader election
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
      # Harbor core, directly over its Service (plain HTTP inside the cluster):
      # the CI projects' proxy-cache mirrors and their Harbor projects. Harbor
      # admits the harbor-api-client label (hr.yaml).
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: development
              app.kubernetes.io/name: harbor
              app.kubernetes.io/component: core
              app.kubernetes.io/instance: harbor
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
      # The upstream registries (UpstreamRegistry url and token endpoints).
      # Blob redirects to storage go to the client, never through the proxy.
      - toFQDNs:
          - matchName: ghcr.io
          - matchName: quay.io
          - matchName: mirror.gcr.io
          - matchName: registry-1.docker.io
          # Docker Hub's token endpoint
          - matchName: auth.docker.io
          - matchName: public.ecr.aws
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
    ingress:
      # Docker in the client namespaces (labelled
      # registrygate.home.arpa/client=true, e.g. by the ci/project chart)
      - fromEndpoints:
          - matchLabels:
              io.cilium.k8s.namespace.labels.registrygate.home.arpa/client: "true"
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      # Metrics, scraped by vmagent
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: monitoring
              endpoints.netpols.home.arpa/metrics-scraper: "true"
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
      # Kubelet health and readiness probes
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
