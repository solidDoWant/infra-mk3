---
# The CA that signs the proxy's certificate for the registry hosts it stands in
# for. Only dockerd in docker Task builds trusts it, through
# /etc/docker/certs.d/<host>/ca.crt, and its name constraints limit it to
# exactly those hosts. It can't come from root-ca, whose constraints only
# permit internal names.
#
# Adding an intercepted host means adding it to permitted.dnsDomains here and
# to the serving certificate below. cert-manager reissues the serving
# certificate for its new name, but not the CA: a nameConstraints change
# doesn't trigger a reissue. So after the change is applied:
#   1. kubectl -n ci delete secret registrygate-ca (a new CA, new key)
#   2. kubectl -n ci delete secret registrygate-tls (re-signed by it)
#   3. Touch each client namespace (e.g. add and remove an annotation) so the
#      registrygate-ca Kyverno policy (config/kyverno.yaml) copies the new CA
#      now rather than at its next sync.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registrygate-ca
spec:
  isCA: true
  commonName: infra-mk3 registrygate Certificate Authority
  subject:
    organizations:
      - infra-mk3
  usages:
    - cert sign
    - crl sign
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - ghcr.io
        - harbor.${SECRET_PUBLIC_DOMAIN_NAME}
  duration: 87660h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: self-signed
    kind: ClusterIssuer
    group: cert-manager.io
  secretName: registrygate-ca
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: registrygate-ca
spec:
  ca:
    secretName: registrygate-ca
---
# The proxy's serving certificate, referenced by every UpstreamRegistry
# (config/upstreams.yaml). Its names must cover every intercepted host.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registrygate-serving
spec:
  commonName: ghcr.io
  dnsNames:
    - ghcr.io
    - harbor.${SECRET_PUBLIC_DOMAIN_NAME}
  usages:
    - server auth
  duration: 2160h # 90 days
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: registrygate-ca
    kind: Issuer
    group: cert-manager.io
  secretName: registrygate-tls
---
# Approve only that certificate from the registrygate CA.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: registrygate-ca-serving-cert
spec:
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: registrygate-ca
    namespace:
      matchNames:
        - ci
  allowed:
    commonName:
      required: true
      value: ghcr.io
    dnsNames:
      required: true
      values:
        - ghcr.io
        - harbor.${SECRET_PUBLIC_DOMAIN_NAME}
    usages:
      - server auth
  constraints:
    maxDuration: 2160h
