---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - EnableVirtioFsStorageVolumes
        - CPUManager
        # Alpha (v1.8+). Shares a path from the virt-launcher compute container
        # with the guest over virtiofs. VM workspaces use it for the toolgate
        # attestation token that a MutatingAdmissionPolicy adds to their
        # launcher pods (development/coder/app/vm-workspace-tokens.yaml).
        - ContainerPathVolumes
        - DeclarativeHotplugVolumes
        - ImageVolume
        - NodeRestriction
        - RebootPolicy
        - Snapshot
        - VmiMemoryOverheadReport
      # v1.9 enables every Beta gate by default; opt out of the unused ones, per
      # upstream's production guidance. Opt in by moving a gate to featureGates.
      disabledFeatureGates:
        - ExternalNetResourceInjection
        - GPUsWithDRA
        - HostDevicesWithDRA
        - KubevirtSeccompProfile
        - LibvirtHooksServerAndClient
        - OptOutRoleAggregation
        - PasstBinding
        - PodSecondaryInterfaceNamingUpgrade
        - Template
        - WorkloadEncryptionSEV
    evictionStrategy: LiveMigrate
    migrations:
      allowAutoConverge: true
      allowWorkloadDisruption: false
    network:
      # Needed for live migration to work properly
      defaultNetworkInterface: masquerade
      permitBridgeInterfaceOnPodNetwork: false
    # Roll out changes right away via migrations where supported
    vmRolloutStrategy: LiveUpdate
    vmStateStorageClass: ssd-replicated-3x
  monitorNamespace: monitoring
  monitorAccount: vmagent-victoria-metrics-k8s-stack
  serviceMonitorNamespace: system-controllers
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
