---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Drops virt-api's access log for kube-apiserver's discovery/OpenAPI polls of
# the aggregated subresources.kubevirt.io API. Logged at a fixed INFO level that
# logVerbosity can't gate.
#
# Requires status 200 and one of the exact discovery URLs (closing `",`), so
# failures and real subresource calls (console, vnc, ...) still ship. Relies on
# Go's sorted map keys putting `statusCode` before `url`.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: drop-virt-api-aggregation-access-log
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.system-controllers\.virt-api-[^.]*\.virt-api\.
  filters:
    - grep:
        exclude: 'log "statusCode":200,.*"url":"(/apis|/openapi/v2|/apis/subresources\.kubevirt\.io/v1(alpha3)?(/healthz)?)",'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Drops virt-operator's steady-state reconcile heartbeat: it re-enqueues its
# KubeVirt CR every 5s (hard-coded) and logs the same lines each cycle. Most
# are V(0), so lowering verbosity can't silence them.
#
# Only the no-op `patched` and ready/handling lines are dropped; created/deleted,
# namespace patches, warnings and errors ship.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: drop-virt-operator-reconcile-chatter
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.system-controllers\.virt-operator-
  filters:
    - grep:
        exclude: 'log "msg":"(Handling KubeVirt resource|Handling deployment|All KubeVirt resources created|All KubeVirt components ready|service [^"]*patched"|validatingAdmissionPolicy[^"]*patched"|Kept old CA certificates|Kubevirt namespace [^"]*labels are in sync")'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Drops cdi-operator's per-reconcile narration: it resyncs the CDI CR every
# 60s and logs the same four lines each time, all V(0), so lowering
# `VERBOSITY` can't silence them. The degraded-check lines only drop while
# not degraded.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: drop-cdi-operator-reconcile-chatter
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.system-controllers\.cdi-operator-[^.]*\.cdi-operator\.
  filters:
    - grep:
        exclude: 'log "msg":"(Reconciling CDI CR|Doing reconcile update)"'
    - grep:
        exclude: 'log "msg":"Degraded check",.*"Degraded":false'
    - grep:
        exclude: 'log "msg":"Finished degraded check",.*"type":"Degraded","status":"False"'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Drops virt-launcher's guest-agent poller narration: a `Polling command: [...]`
# line every 5s and `Polling API operations: N` every 10s per VM (~2.3k
# lines/h each), both V(0) in v1.6. Upstream moved `Polling command` to V(3) in
# v1.8.0 (kubevirt 021524ba74); `Polling API operations` is still V(0) in
# v1.9.0. Poller errors are separate lines and ship.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: drop-virt-launcher-agent-poller-chatter
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.[^.]+\.virt-launcher-[^.]*\.compute\.
  filters:
    - grep:
        exclude: 'log "msg":"Polling (command: \[[^"]*\]|API operations: \d+)","pos":"agent_poller\.go:\d+"'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/fluentbit.fluent.io/clusterfilter_v1alpha2.json
# Sets `_msg` on KubeVirt and CDI components to `msg` instead of the JSON envelope, or
# `<method> <url> <statusCode>` for virt-api access-log records, which have no
# message. Fields stay under `log_fields.*`. Runs after `kubernetes`, which
# populates `log_fields`. VMs run in any namespace, hence the pod-name match
# for virt-launcher. klog lines are handled by parse-klog.
#
# The operator joins the Lua onto one line with `;` per line: keep each
# statement on a single line.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: promote-kubevirt-message
  labels:
    config.fluentbit.fluent.io/enabled: "true"
    config.fluentbit.fluent.io/agent: node
spec:
  matchRegex: ^kube\.([^.]+\.virt-launcher-[^.]*\.compute|system-controllers\.(virt-(handler|controller|api|operator)-[^.]*\.virt-(handler|controller|api|operator)|cdi-(operator|deployment)-[^.]*\.cdi-(operator|deployment)))\.
  filters:
    - lua:
        call: promote_message
        code: |
          function promote_message(tag, ts, record)
            local fields = record["log_fields"]
            if type(fields) ~= "table" then
              return 0, ts, record
            end
            local msg = fields["msg"]
            if type(msg) == "string" and msg ~= "" then
              record["log"] = msg
              return 2, ts, record
            end
            local method, url = fields["method"], fields["url"]
            if type(method) == "string" and type(url) == "string" then
              local status = fields["statusCode"] and (" " .. tostring(fields["statusCode"])) or ""
              record["log"] = method .. " " .. url .. status
              return 2, ts, record
            end
            return 0, ts, record
          end
