---
# Install the operator via the manifest for the version's release.
# TODO when/if kubevirt ever makes progress on the Helm chart, switch to that.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.1/cdi-operator.yaml
  - ./netpol.yaml
  - ./pdbs.yaml
patches:
  # Why do some tools insist on trying to create their own namespaces???
  - patch: |-
      $patch: delete
      apiVersion: placeholder-value-does-not-matter
      kind: placeholder-value-does-not-matter
      metadata:
        name: placeholder-value-does-not-matter
    target:
      kind: Namespace
  # cdi-operator strips the served-but-unstored v1alpha1 from its CRD on every
  # reconcile; the release manifest still ships it, so each Flux apply re-adds
  # it and the two fight every 5m.
  - patch: |-
      - op: test
        path: /spec/versions/0/name
        value: v1alpha1
      - op: remove
        path: /spec/versions/0
    target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: cdis.cdi.kubevirt.io
  # Upstream ships probes (:8444) since v1.64.0; only HA is missing
  - patch: |-
      # Set replicas to 2
      - op: replace
        path: /spec/replicas
        value: 2
      # Change strategy to RollingUpdate
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
    target:
      group: apps
      version: v1
      kind: Deployment
      name: cdi-operator
  # Operand images are pinned through the operators' *_IMAGE env vars, which
  # take full refs. VIRT_OPERATOR_IMAGE keeps the bare tag: virt-operator
  # derives the KubeVirt version from it.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: virt-operator
        namespace: kubevirt
      spec:
        template:
          spec:
            containers:
              - name: virt-operator
                image: quay.io/kubevirt/virt-operator:v1.9.1@sha256:a8adf7b772e9ce0bf7e2ce889910fc41ebadf552c9dbe843e9b86641e34f5df9
                env:
                  - name: VIRT_API_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-api:v1.9.1@sha256:d341c751dbe632d183989cce78203a888293e0e2a32719f32461bd6273322485
                  - name: VIRT_CONTROLLER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-controller:v1.9.1@sha256:75c94c787eec15458729848e00fe0b421ca8998c6219de8c2d3cae72ff0bd287
                  - name: VIRT_HANDLER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-handler:v1.9.1@sha256:c23b635ea4aff7f0779c6c061c431da0469c7796255e6de90a5970236b5ea61b
                  - name: VIRT_LAUNCHER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-launcher:v1.9.1@sha256:53e6d12197761cda653201f82e295ac6098d689a58bc2c68df0970c248d61fa6
                  - name: VIRT_EXPORTPROXY_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-exportproxy:v1.9.1@sha256:fe9a0a297e7b407c3a322c6f5fccba5313c668907c30cb0b80b8c51bcdea640a
                  - name: VIRT_EXPORTSERVER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-exportserver:v1.9.1@sha256:76c01dca74921eb5fd74d00b82e77a60d58e8213c72d84cc66a3bc92679690b8
                  - name: VIRT_SYNCHRONIZATIONCONTROLLER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/virt-synchronization-controller:v1.9.1@sha256:5f3da789a7b7a4febb1ece9f4a085ceb73aabcd468af84563ea7b6809341eb10
                  - name: SIDECAR_SHIM_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/sidecar-shim:v1.9.1@sha256:d48c6af64305c28de7e9a5509a11737b115cc0193f57f2a0f42faff85bebe5cd
                  - name: PR_HELPER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/pr-helper:v1.9.1@sha256:c7724681efa3297091d0ce0edf4fda52c062455fb83b76484499a46ae261f61d
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cdi-operator
        namespace: cdi
      spec:
        template:
          spec:
            containers:
              - name: cdi-operator
                image: quay.io/kubevirt/cdi-operator:v1.66.1@sha256:470b2997b87c152b2573cdb4a3feb2a7925f60602e16c052de94e8d765b97357
                env:
                  - name: CONTROLLER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-controller:v1.66.1@sha256:0cbf467d04febc5d63b7682524e87be7d775b488cb8b5963706d2ebc3465a72f
                  - name: IMPORTER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-importer:v1.66.1@sha256:e22b63872cd04da43c62ad8ebb73cac46958b6e759fcc347752ec2ace1df75f4
                  - name: CLONER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-cloner:v1.66.1@sha256:febbe8b265bb6fcf7ab743b780069fbae4a0531119933026de59545ad1bfc7a3
                  - name: OVIRT_POPULATOR_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-importer:v1.66.1@sha256:e22b63872cd04da43c62ad8ebb73cac46958b6e759fcc347752ec2ace1df75f4
                  - name: APISERVER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-apiserver:v1.66.1@sha256:98b71040e0e8de9397b57b4998641d4d3ea248fc300253b23085838990c4d241
                  - name: UPLOAD_SERVER_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-uploadserver:v1.66.1@sha256:d3a6b735efcc914a0c9679fa8f64ab3dda764f7997d53bcafa6e2944f123420a
                  - name: UPLOAD_PROXY_IMAGE
                    # renovate: image
                    value: quay.io/kubevirt/cdi-uploadproxy:v1.66.1@sha256:f2493c0b33140167135110561ff415b8344f33dd53e20b9c8fbdb288e43326c9
