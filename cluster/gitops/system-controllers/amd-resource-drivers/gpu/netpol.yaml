---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: amd-resource-drivers-gpu
specs:
  - description: amd-resource-drivers-gpu
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: k8s-gpu-dra-driver
        app.kubernetes.io/instance: amd-resource-drivers-gpu
        app.kubernetes.io/component: kubeletplugin
    egress:
      # Publish and maintain this node's ResourceSlice, and read the
      # ResourceClaims it is asked to prepare.
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
    ingress:
      # Kubelet runs the gRPC livenessProbe against kubeletPlugin.healthcheckPort.
      # Without this rule the probe fails closed and the kubelet kills every
      # plugin pod.
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "51515"
                protocol: TCP
