---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-resource-drivers-gpu
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s-gpu-dra-driver
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: rocm-charts
      version: v1.0.1
  values:
    cdi:
      dynamicPath: /var/cdi/dynamic
    kubeletPlugin:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/amdgpu
                    operator: Exists
      containers:
        init:
          # Chart default is docker.io/busybox:1.36; this is the same image from
          # a registry that is not rate limited.
          image: public.ecr.aws/docker/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          # Chart default is privileged. This container only runs a `[ -d ]`
          # test against the hostPath-mounted /sys, and both paths it tests
          # (/sys/class/kfd, /sys/module/amdgpu/drivers) are 0755 root:root, so
          # it needs no privileges. `privileged: false` has to be spelled out:
          # Helm deep merges values, so omitting it leaves the chart default of
          # true in place, and privileged=true with allowPrivilegeEscalation=
          # false is rejected by the API server.
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: &memory 32Mi
            limits:
              memory: *memory
        plugin:
          resources:
            requests:
              cpu: 10m
              memory: &memory 128Mi
            limits:
              memory: *memory
