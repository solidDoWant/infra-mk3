---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/upgrade.cattle.io/plan_v1.json
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-upgrade
spec:
  concurrency: 1
  # Match Talos nodes with an out of date version only
  nodeSelector:
    matchLabels:
      feature.node.kubernetes.io/system-os_release.ID: talos
    matchExpressions:
      - key: feature.node.kubernetes.io/system-os_release.VERSION_ID
        operator: NotIn
        values:
          - ${TALOS_VERSION}
  # The pod will already have enough access to the node and talos to compromise
  # the whole cluster. Reusing the account should have a minimal risk and means
  # that I don't have to debug more RBAC issues.
  serviceAccountName: system-upgrade-controller
  version: ${TALOS_VERSION}
  secrets:
    - name: talos-credentials
      path: /var/run/secrets/talos.dev
    # If the Plan CRD ever adds support for configmaps, this should be
    # converted
    - name: upgrade-scripts
      path: /scripts
      defaultMode: 0500
  exclusive: true
  # TODO set an upgrade window
  # window:
  prepare: &prepare
    image: alpine/k8s:1.37.1
    envs:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: TALOS_VERSION
        value: ${TALOS_VERSION}
    command:
      - /scripts/talos.sh
    args:
      - prepare
  drain: {}
  upgrade:
    <<: *prepare
    args:
      - upgrade
