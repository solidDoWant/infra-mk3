---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name system-upgrade-controller
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s-charts
      version: 4.6.2
  values:
    controllers:
      system-upgrade-controller:
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        serviceAccount:
          identifier: *app_name
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/rancher/system-upgrade-controller
              tag: v0.20.2
            env:
              SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE: registry.k8s.io/kubectl:v1.37.1
              #   SYSTEM_UPGRADE_JOB_POD_REPLACEMENT_POLICY: Failed # Required for Talos
              SYSTEM_UPGRADE_CONTROLLER_NAME: *app_name
              # Off unless set; required with replicas > 1.
              SYSTEM_UPGRADE_CONTROLLER_LEADER_ELECT: "true"
              SYSTEM_UPGRADE_CONTROLLER_NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              SYSTEM_UPGRADE_CONTROLLER_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    serviceAccount:
      system-upgrade-controller: {}
    rbac:
      roles:
        system-upgrade-controller:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - namespaces
              verbs:
                - get
                - list
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - ""
              resources:
                - nodes
              verbs:
                - get
                - list
                - update
                - patch
                - watch
            - apiGroups:
                - upgrade.cattle.io
              resources:
                - plans
              verbs:
                - get
                - list
                - update
                - watch
            - apiGroups:
                - upgrade.cattle.io
              resources:
                - plans/status
              verbs:
                - update
            - apiGroups:
                - batch
              resources:
                - jobs
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
            # Drain jobs run as this service account
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
                - delete
            - apiGroups:
                - apps
              resources:
                - daemonsets
                - replicasets
                - statefulsets
              verbs:
                - get
                - list
            - apiGroups:
                - ""
              resources:
                - pods/eviction
              verbs:
                - create
            - apiGroups:
                - batch
              resources:
                - jobs/status
              verbs:
                - get
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - get
                - create
                - patch
                - update
            # Leader election
            - apiGroups:
                - coordination.k8s.io
              resources:
                - leases
              verbs:
                - create
            - apiGroups:
                - coordination.k8s.io
              resources:
                - leases
              resourceNames:
                - system-upgrade-controller
              verbs:
                - get
                - update
      bindings:
        system-upgrade-role:
          type: ClusterRoleBinding
          roleRef:
            identifier: *app_name
          subjects:
            - identifier: *app_name
              namespace: "{{ .Release.Namespace }}"
