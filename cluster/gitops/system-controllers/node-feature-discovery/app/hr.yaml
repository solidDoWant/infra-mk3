---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  url: oci://registry.k8s.io/nfd/charts/node-feature-discovery
  ref:
    tag: 0.19.0
    digest: sha256:c74eeb7fe33c060e49e42cc8d588eeeddfbda6ae9bcd0835e0e398e02c5c2223
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://accounts\.google\.com$
        subject: ^krel-trust@k8s-releng-prod\.iam\.gserviceaccount\.com$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  # CRDs ship in the chart's crds/ dir, which Helm skips on upgrade by default.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: registry.k8s.io/nfd/node-feature-discovery
      tag: v0.19.0@sha256:2fa1c99ad09bdf2c8ad97706a4ad2fd548c84d5ecd70ba32a6152c667b96c4d2
    featureGates:
      NodeFeatureGroupAPI: true
    prometheus:
      enable: true
    # The chart renders `revisionHistoryLimit: null` when unset, which resets the
    # Kyverno-applied limit to the API default (10) on every upgrade.
    master:
      replicaCount: 2
      revisionHistoryLimit: 1
      hostUsers: false
      podDisruptionBudget:
        enable: true
        minAvailable: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    worker:
      revisionHistoryLimit: 1
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 64Mi
    gc:
      replicaCount: 1
      revisionHistoryLimit: 1
      hostUsers: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
