---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chart:
    spec:
      chart: node-feature-discovery
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: node-feature-discovery-charts
      version: 0.19.0
  # CRDs ship in the chart's crds/ dir, which Helm skips on upgrade by default.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    featureGates:
      NodeFeatureGroupAPI: true
    prometheus:
      enable: true
    master:
      replicaCount: 2
      hostUsers: false
      podDisruptionBudget:
        enable: true
        minAvailable: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    worker:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 64Mi
    gc:
      replicaCount: 1
      hostUsers: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
