---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  url: oci://registry.k8s.io/nfd/charts/node-feature-discovery
  ref:
    tag: 0.20.0
    digest: sha256:4b012ea6dd8d815a054174310e53051d3e097b381265ff12e0f4b6c77fe2f2b2
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://accounts\.google\.com$
        subject: ^krel-trust@k8s-releng-prod\.iam\.gserviceaccount\.com$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  # CRDs ship in the chart's crds/ dir, which Helm skips on upgrade by default.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: registry.k8s.io/nfd/node-feature-discovery
      tag: v0.20.0@sha256:3f600513a463712aaab33cf525e20be0b5718e57da50d0ac2e092b86bcfc4812
    featureGates:
      NodeFeatureGroupAPI: true
    prometheus:
      enable: true
    # The chart renders `revisionHistoryLimit: null` when unset, which resets the
    # Kyverno-applied limit to the API default (10) on every upgrade.
    master:
      replicaCount: 2
      revisionHistoryLimit: 1
      hostUsers: false
      podDisruptionBudget:
        enable: true
        minAvailable: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    worker:
      revisionHistoryLimit: 1
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 64Mi
    gc:
      replicaCount: 1
      revisionHistoryLimit: 1
      hostUsers: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
