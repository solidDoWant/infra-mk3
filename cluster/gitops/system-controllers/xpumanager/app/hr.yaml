---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: xpumanager
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xpumanager
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: xpumanager
  values:
    controllers:
      xpumanager:
        type: daemonset
        containers:
          app:
            image: &image
              repository: ghcr.io/soliddowant/xpumanager
              tag: 1.3.2@sha256:262486c4674193f704a32d60e584483175e4380508f46d5b6571d8768d01f277
            args:
              - --socket_folder
              - /run/xpumanager
              - --dump_folder
              - /run/xpumanager/dump
            resources:
              claims:
                - name: gpu
            securityContext: &container_security_context
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 1000
              runAsGroup: 1000
              # This will flood the logs until https://github.com/intel/xpumanager/issues/101 is fixed
              capabilities:
                drop:
                  - ALL
          metrics:
            image: *image
            env:
              XPUM_SOCKET_FILE: /run/xpumanager/xpum_p.sock
              XPUM_EXPORTER_NO_AUTH: "1"
              XPUM_EXPORTER_ONLY: "1"
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            workingDir: /usr/lib/xpum/rest
            command:
              - gunicorn
            args:
              - --bind
              - 0.0.0.0:29999
              - --worker-connections
              - "64"
              - --worker-class
              - gthread
              - --workers
              - "1"
              - --threads
              - "4"
              - xpum_rest_main:main(dump_folder="/run/xpumanager/dump")
            ports:
              - containerPort: 29999
                name: metrics
            probes:
              liveness: &probe
                enabled: true
                port: metrics
                type: HTTP
                path: /metrics
              readiness: *probe
            securityContext: *container_security_context
        pod:
          securityContext:
            fsGroup: 1000
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: xpumanager-gpu
    service:
      app:
        controller: xpumanager
        ports:
          metrics:
            port: 29999
            protocol: HTTP
    serviceMonitor:
      xpumanager:
        enabled: true
        serviceName: xpumanager
        endpoints:
          - port: metrics
            interval: 10s
            relabelings:
              - action: labeldrop
                regex: (service|endpoint|pod|container)
              - action: replace
                sourceLabels:
                  - __meta_kubernetes_pod_node_name
                targetLabel: instance
    persistence:
      shared:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Mi
        globalMounts:
          - path: /run/xpumanager
        # Make /tmp RW for HTTP webserver (gunicorn) heartbeat file
      gunicorn-heartbeat:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Ki
        advancedMounts:
          xpumanager:
            metrics:
              - path: /tmp
                subPath: gunicorn-heartbeat
