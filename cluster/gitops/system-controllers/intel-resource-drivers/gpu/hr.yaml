---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-resource-drivers-gpu
spec:
  interval: 5m
  chart:
    spec:
      chart: intel-gpu-resource-driver-chart
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: intel-resource-drivers-charts
      version: 0.12.0
  values:
    cdi:
      staticPath: /var/cdi/static
      dynamicPath: /var/cdi/dynamic
    kubeletPlugin:
      # Health monitoring requires Intel's xpumd daemon on a gRPC socket at
      # /run/xpumd. The cluster does not run it -- note that the xpumanager
      # deployment in this repo is the REST metrics exporter, a different thing
      # on a different (emptyDir) socket, and is currently disabled anyway. With
      # monitoring enabled and no xpumd, the plugin panics after ~5m and every
      # GPU claim in the cluster becomes unsatisfiable.
      healthMonitoring:
        enabled: false
      # Required when healthMonitoring is disabled: hardware details (VRAM size)
      # are then queried directly from the devices instead of via xpumd.
      privileged: true
      # Default is true, which lets the driver rebind GPUs between i915/xe and
      # vfio-pci on demand for the gpu-vfio.intel.com DeviceClass. Nothing here
      # claims that class, and KubeVirt runs on these same nodes, so an
      # unattended rebind would tear a GPU away from the container workloads.
      #
      # This value only half-works: the chart nests --manage-binding=false
      # inside its `if healthMonitoring.enabled` block, so with monitoring off
      # the flag is never passed and the binary default (true) wins. What the
      # value DOES still do is restrict the gpu-vfio.intel.com DeviceClass to
      # already-vfio-bound GPUs (and gpu.intel.com to i915/xe-bound ones), so no
      # claim can reach the rebind path. extraArgs closes the daemon-side gap.
      # Drop it if upstream unnests the flag.
      manageBinding:
        enabled: false
      extraArgs: --manage-binding=false
    nodeFeatureRules:
      enabled: true
