---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fstrim
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# TODO replace this with a tool that deploys/deletes a daemonset
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name fstrim
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fstrim
  values:
    controllers:
      fstrim:
        type: cronjob
        cronjob:
          schedule: "@monthly"
          parallelism: 3
        containers:
          app:
            # This image contains fstrim via the util-linux package
            image:
              repository: ubuntu
              tag: "26.04"
            command:
              - fstrim
              - --verbose
              - --all
            # Required for the FITRIM ioctl syscall. For details, see
            # https://github.com/torvalds/linux/blob/cfaaa7d010d1fc58f9717fcc8591201e741d2d49/fs/xfs/xfs_discard.c#L653
            securityContext:
              capabilities:
                add:
                  - SYS_ADMIN
    defaultPodOptions:
      hostPID: true
      # Note this is not an HA spread -- it is a per-node fan-out. The job runs
      # `parallelism: 3` pods against a hostPath mount of `/`, so the intent is
      # exactly one pod per node, each trimming that node's disks. maxSkew 1 with
      # a hard constraint is what enforces that. Relaxing it to ScheduleAnyway
      # would let all three pods land on one node, trimming it three times and
      # silently never trimming the other two.
      #
      # A node outage leaves this job unable to complete, which is acceptable:
      # it is monthly maintenance, so an incomplete run costs nothing and
      # self-corrects on the next schedule.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app_name
    # This ensures that the container access to the drive mounts. Path can be
    # pretty much anywhere. `fstrim` will discover the drives and mount paths.
    persistence:
      rootfs:
        type: hostPath
        hostPath: /
        hostPathType: Directory
        globalMounts:
          - path: /host-rootfs
