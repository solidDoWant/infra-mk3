---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: descheduler
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Stop-gap mirror, pruned 6 months after upstream publishes an OCI chart.
  # Switch to the official chart once https://github.com/kubernetes-sigs/descheduler/issues/1470 lands.
  url: oci://ghcr.io/home-operations/charts-mirror/descheduler
  ref:
    tag: 0.37.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/home-operations/charts-mirror.*$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name descheduler
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: descheduler
  values:
    kind: Deployment
    replicas: 2
    # Chart always renders this, which disables the Kyverno revision-limit policy.
    revisionHistoryLimit: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    hostUsers: false
    # Right-sized 2026-08-01 from 14d of metrics. Chart default is 500m/256Mi;
    # measured p95 CPU 5m (p99 7m, max 19m) and peak working set 109Mi. The
    # descheduler only does work on its interval, so it is idle almost always.
    # Memory request == limit (incompressible).
    resources:
      requests:
        cpu: 10m
        memory: &descheduler_memory 256Mi
      limits:
        # Chart >=0.34 defaults a 500m CPU limit; Helm deep-merges it in.
        cpu: null
        memory: *descheduler_memory
    leaderElection:
      enabled: true
    deschedulerPolicy:
      # TODO tracing
      # tracing:
      # For some dumb reason this doesn't use a CRD, but a config file
      # templated as multiple instances of CRD-conformant YAML files
      profiles:
        # Default configuration that should apply to everything
        - name: default
          plugins:
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingNodeTaints
                - RemovePodsHavingTooManyRestarts
                - PodLifeTime
          pluginConfig:
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled: &evictable_by_default
                    - PodsWithLocalStorage
                    - SystemCriticalPods
                    - FailedBarePods
            - name: RemoveFailedPods
              args:
                # TODO
                # reasons:
                #   - TODO
                # exitCodes:
                #   - 1234
                includingInitContainers: true
                minPodLifetimeSeconds: 86400 # One day
            - name: RemovePodsViolatingNodeTaints
              args:
                includePreferNoSchedule: true
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 10
                includingInitContainers: true
            - name: PodLifeTime
              args:
                includingInitContainers: true
                includingEphemeralContainers: true
                maxPodLifeTimeSeconds: 604800 # One week
                # Co-aged Ceph pods are evicted together; an OSD + mon leader in one
                # pass loses the OSD's mark-down (ceph#18516), stalling all RBD writes ~30s.
                namespaces:
                  exclude:
                    - storage
                labelSelector:
                  matchExpressions:
                    - key: descheduler.home.arpa/enable-lifetime-eviction
                      operator: NotIn
                      values:
                        - "false"
        # Policy for services with multiple instances
        - name: replicated-pods
          plugins:
            deschedule:
              enabled:
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
            balance:
              enabled:
                - RemoveDuplicates
                - LowNodeUtilization
                - RemovePodsViolatingTopologySpreadConstraint
          pluginConfig:
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled: *evictable_by_default
                  extraEnabled:
                    - PodsWithoutPDB
                # Docs imply that this doesn't take into account
                # topologyspreadconstraints.
                nodeFit: true
                minReplicas: 1
            - name: RemoveDuplicates
            # Spread out workloads. There's no autoscaling, so all resources
            # might as well be used
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 20
                  memory: 0
                  pods: 0
                targetThresholds:
                  cpu: 50
                  memory: 100
                  pods: 100
            # Get pods placed optimally
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - preferredDuringSchedulingIgnoredDuringExecution
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                topologyBalanceNodeFit: true
    cmdOptions:
      # v=1 keeps actual evictions (klog V(1)) and errors while dropping the
      # per-pod evaluation spam.
      v: 1
    service:
      enabled: true
    serviceMonitor:
      enabled: true