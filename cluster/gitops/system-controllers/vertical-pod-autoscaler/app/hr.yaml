---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
spec:
  interval: 5m
  chart:
    spec:
      chart: vpa
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: fairwinds-charts
      version: 5.1.0
  values:
    fullnameOverride: vertical-pod-autoscaler
    recommender:
      revisionHistoryLimit: 1
      image:
        repository: registry.k8s.io/autoscaling/vpa-recommender
        tag: 1.8.0@sha256:e743e3a7e58a614f850063dba5df88eec5a19cf4cc43edb2050248df2d7dd8d3
      podLabels:
        endpoints.netpols.home.arpa/time-series-querier: "true"
      extraArgs:
        # Chart defaults to --v=4, which floods logs with V(4) debug lines (e.g. a
        # per-recommendation "DEPRECATED: Converting raw value to humanized value"
        # from humanize-memory). klog -v gates only Info/V(n), not warnings/errors.
        v: "2"
        pod-recommendation-min-memory-mb: 64
        humanize-memory: true
        leader-elect: true
        leader-elect-resource-namespace: system-controllers
        # See https://github.com/kubernetes/autoscaler/issues/5031#issuecomment-1450583325 for config
        use-external-metrics: true
        storage: prometheus
        prometheus-address: http://vmclusterlb-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8427/select/0/prometheus/
        prometheus-cadvisor-job-name: kubelet
        container-pod-name-label: pod
        container-name-label: container
        metric-for-pod-labels: kube_pod_labels{job="kube-state-metrics"}[8d]
        pod-namespace-label: namespace
        pod-name-label: pod
        pod-label-prefix: label_
      replicaCount: 2
      podDisruptionBudget:
        minAvailable: 1
      podMonitor:
        enabled: true
    rbac:
      extraRules:
    # Only enable the recommender for goldilocks.
    updater:
      enabled: false
    admissionController:
      enabled: false
