---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: spegel
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  # The chart's dashboard: grafana.com 18089 predates the 0.6 metric renames.
  url: https://raw.githubusercontent.com/spegel-org/spegel/refs/tags/v0.7.4/charts/spegel/monitoring/grafana-dashboard.json
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
