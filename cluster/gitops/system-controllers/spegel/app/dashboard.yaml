---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: spegel
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  # Fork of grafana.com 25919 rev 1: spegel 0.8 replaced the per-registry
  # advertised digest gauges with spegel_advertised_keys. Upstream dropped the
  # chart's own dashboard in 0.8.
  configMapRef:
    key: dashboard.json
    name: spegel-dashboard
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
