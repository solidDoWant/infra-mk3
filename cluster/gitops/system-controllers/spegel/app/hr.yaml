---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spegel
spec:
  interval: 1h
  url: oci://ghcr.io/spegel-org/helm-charts/spegel
  ref:
    tag: 0.7.4
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/spegel-org/spegel/\.github/workflows/release\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spegel
  # These values are used for the initial deployment
  valuesFrom:
    - kind: ConfigMap
      name: helm-bootstrap-values
  # These values are added now that the cluster has been bootstrapped
  values:
    revisionHistoryLimit: 1
    serviceMonitor:
      enabled: true
