---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spegel
spec:
  interval: 1h
  url: oci://ghcr.io/spegel-org/helm-charts/spegel
  ref:
    tag: 0.8.1
    digest: sha256:0f6685e12ba49fa57b3fd4329e0e9695d60d00024df102733f337e4752ca2e61
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/spegel-org/spegel/\.github/workflows/release\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spegel
  # These values are used for the initial deployment
  valuesFrom:
    - kind: ConfigMap
      name: helm-bootstrap-values
  # These values are added now that the cluster has been bootstrapped
  values:
    revisionHistoryLimit: 1
    serviceMonitor:
      enabled: true
