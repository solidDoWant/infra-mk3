---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda
specs:
  - description: keda-operator
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: keda-operator
    egress:
      # Watch and create resources (Jobs, ScaledJobs, etc.)
      - &to_apiserver
        toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
      - &to_dns_resolver
        toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # Temporal frontend — the operator's Temporal scaler issues
      # DescribeTaskQueue gRPC calls to drive ScaledJob scaling decisions.
      # Authentication is via JWT-SVID surfaced through the operator's
      # TriggerAuthentication (e.g. media namespace's media-temporal-keda-auth
      # Secret); the frontend validates the JWT against its JWKS endpoints.
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: data
              app.kubernetes.io/name: temporal
              app.kubernetes.io/instance: temporal
              app.kubernetes.io/component: frontend
        toPorts:
          - ports:
              - port: "7233"
                protocol: TCP
      # HTTP add-on external scaler (gRPC) -- the `external-push` trigger of the
      # add-on's ScaledObjects (its interceptor, and each InterceptorRoute's)
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: http-add-on
              app.kubernetes.io/component: scaler
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
    ingress:
      # Liveness/readiness probes from kubelet on the host.
      - &from_healthcheck
        fromEntities:
          - host
        toPorts:
          - ports:
              - port: "8081"
                protocol: TCP
      # The metrics API server reads scaler metrics from the operator over
      # mTLS gRPC.
      - fromEndpoints:
          - matchLabels:
              app.kubernetes.io/name: keda-operator-metrics-apiserver
        toPorts:
          - ports:
              - port: "9666"
                protocol: TCP
      # Victoria Metrics agent scrapes the operator's /metrics endpoint.
      - &from_monitoring
        fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: monitoring
              endpoints.netpols.home.arpa/metrics-scraper: "true"
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP

  - description: keda-admission-webhooks
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: keda-admission-webhooks
    egress:
      # Webhook needs to read referenced resources during validation.
      - *to_apiserver
      - *to_dns_resolver
    ingress:
      # kube-apiserver calls the validating webhook for ScaledJob/ScaledObject
      # admission. With failurePolicy=Fail, this path must work.
      - fromEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "9443"
                protocol: TCP
      # Liveness/readiness probes.
      - *from_healthcheck
      # Metrics scraping.
      - *from_monitoring

  - description: keda-operator-metrics-apiserver
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: keda-operator-metrics-apiserver
    egress:
      # Delegated authn/authz for the apiserver's requests, and reading
      # ScaledObjects.
      - *to_apiserver
      - *to_dns_resolver
      # Scaler metrics from the operator (mTLS gRPC)
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: keda-operator
        toPorts:
          - ports:
              - port: "9666"
                protocol: TCP
    ingress:
      # kube-apiserver proxies external.metrics.k8s.io requests (from the HPA
      # controller) to this APIService backend.
      - fromEntities:
          - kube-apiserver
        toPorts: &metrics_apiserver_ports
          - ports:
              - port: "6443"
                protocol: TCP
      # Liveness/readiness probes (HTTPS on the same port).
      - fromEntities:
          - host
        toPorts: *metrics_apiserver_ports
