---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http
specs:
  - description: operator
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: http-add-on
        app.kubernetes.io/component: operator
    egress:
      # Watch InterceptorRoutes and HTTPScaledObjects, and the leader Lease
      - &to_apiserver
        toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
      - &to_dns_resolver
        toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
    ingress:
      # Liveness/readiness probes
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "8081"
                protocol: TCP

  - description: scaler
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: http-add-on
        app.kubernetes.io/component: scaler
    egress:
      # Find the interceptor pods and read InterceptorRoutes
      - *to_apiserver
      - *to_dns_resolver
      # Pending request counts from each interceptor's admin port
      - toEndpoints:
          - &interceptor_selector
            matchLabels:
              app.kubernetes.io/name: http-add-on
              app.kubernetes.io/component: interceptor
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
    ingress:
      # The KEDA operator queries the external scaler over gRPC; kubelet runs
      # gRPC probes on the same port.
      - fromEndpoints:
          - matchLabels:
              app.kubernetes.io/name: keda-operator
        toPorts: &scaler_ports
          - ports:
              - port: "9090"
                protocol: TCP
      - fromEntities:
          - host
        toPorts: *scaler_ports

  - description: interceptor
    endpointSelector: *interceptor_selector
    egress:
      # Watch InterceptorRoutes, Services and EndpointSlices
      - *to_apiserver
      - *to_dns_resolver
      # Routed backends. With direct pod routing the interceptor connects to
      # the target pods, not their Service.
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/name: toolgate
              app.kubernetes.io/instance: toolgate
              app.kubernetes.io/component: embeddings
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP
    ingress:
      # Liveness/readiness probes, and the scaler's pending request queries
      - fromEntities:
          - host
        toPorts: &admin_ports
          - ports:
              - port: "9090"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              app.kubernetes.io/name: http-add-on
              app.kubernetes.io/component: scaler
        toPorts: *admin_ports
      # Clients of routed backends, through the proxy port
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/name: toolgate
              app.kubernetes.io/instance: toolgate
              app.kubernetes.io/controller: gateway
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
