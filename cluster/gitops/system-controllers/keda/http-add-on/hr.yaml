---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keda-add-ons-http
spec:
  interval: 1h
  # Stop-gap mirror, like KEDA's own chart (../app/hr.yaml): upstream publishes
  # no OCI chart.
  url: oci://ghcr.io/home-operations/charts-mirror/keda-add-ons-http
  ref:
    tag: 0.16.0
    digest: sha256:379a09cbb8654d3d9a68e8fbb311d016b6378fd6e33b28539e667a55f7e253bc
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/.+$
---
# Scales HTTP workloads to and from zero. Clients send requests to the
# interceptor (keda-add-ons-http-interceptor-proxy:8080), which routes each by
# its InterceptorRoute, counts it, and holds it while KEDA scales the target up.
# Used by toolgate's embeddings server (ai/toolgate).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: keda-add-ons-http
  values:
    # CRDs are deployed in the keda-crds Flux Kustomization.
    crds:
      install: false

    logging:
      operator:
        format: json
      scaler:
        format: json
      interceptor:
        format: json

    # The images take a single shared tag from the chart, so the digests are
    # pinned with the post-renderer below.
    operator:
      replicas: 2 # Leader-elected
      pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: &operator_memory 64Mi
        limits:
          cpu: null # Drop the chart's default CPU limit
          memory: *operator_memory
    scaler:
      replicas: 2
      pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: &scaler_memory 64Mi
        limits:
          cpu: null # Drop the chart's default CPU limit
          memory: *scaler_memory
    interceptor:
      pullPolicy: IfNotPresent
      # The interceptor fleet is itself scaled by a KEDA ScaledObject.
      replicas:
        min: 2
        max: 4
      resources:
        requests:
          cpu: 50m
          memory: &interceptor_memory 128Mi
        limits:
          cpu: null # Drop the chart's default CPU limit
          memory: *interceptor_memory
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/kedacore/http-add-on-operator
            newTag: 0.16.0
            digest: sha256:2ae0076d549fb7d12b3d9ecb1e87d035c7ee73e94a640ff53842e70ab0824da0
          - name: ghcr.io/kedacore/http-add-on-scaler
            newTag: 0.16.0
            digest: sha256:db5223b1a37521ec0f099ac04785bfc069f5c3ebf4bacffd04e5127b0876dffb
          - name: ghcr.io/kedacore/http-add-on-interceptor
            newTag: 0.16.0
            digest: sha256:3a9a454b949edd5dee711ed14e603cc3b91b7c065905ecc251fe0a56a4c026f1
