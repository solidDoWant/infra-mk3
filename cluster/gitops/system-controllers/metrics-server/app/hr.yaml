---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metrics-server
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Stop-gap mirror, pruned 6 months after upstream publishes an OCI chart.
  # Switch to the official chart once https://github.com/kubernetes-sigs/metrics-server/issues/1527 lands.
  url: oci://ghcr.io/home-operations/charts-mirror/metrics-server
  ref:
    tag: 3.14.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/home-operations/charts-mirror.*$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name metrics-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: metrics-server
  values:
    apiService:
      insecureSkipTLSVerify: false
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    tls:
      type: cert-manager
      certManager:
        existingIssuer:
          enabled: true
          kind: Issuer
          group: cert-manager.io
          name: system-controllers-intermediary-ca
        # Pinned under the CertificateRequestPolicy maxDuration (1h).
        duration: 1h
        renewBefore: 30m
  # Certificate patches to satisfy the namespace issuer + approver-policy:
  #   * dnsNames: drop the bare `metrics-server.system-controllers` form
  #     (violates the issuer's critical nameConstraints). The aggregator dials
  #     `<svc>.<ns>.svc`, so that form must stay.
  #   * commonName: removed; the bare `metrics-server` CN is unused.
  #   * usages: drop `client auth`, only the serving cert is used.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: cert-manager.io
              version: v1
              kind: Certificate
              name: metrics-server
            patch: |
              - op: replace
                path: /spec/dnsNames
                value:
                  - metrics-server.system-controllers.svc
                  - metrics-server.system-controllers.svc.cluster.local
              - op: remove
                path: /spec/commonName
              - op: replace
                path: /spec/usages
                value:
                  - server auth
