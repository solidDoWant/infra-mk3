---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: metrics-server-charts
      version: 3.14.0
  values:
    apiService:
      # cert-manager TLS can't be verified: the chart always adds a bare
      # `metrics-server.system-controllers` SAN, which the intermediary CA's
      # name constraints reject. Needs a postRenderer dropping that SAN first.
      insecureSkipTLSVerify: true
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    tls:
      type: metrics-server
