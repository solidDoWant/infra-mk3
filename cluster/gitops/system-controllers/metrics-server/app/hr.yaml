---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: metrics-server-charts
      version: 3.14.0
  values:
    apiService:
      insecureSkipTLSVerify: false
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    tls:
      type: cert-manager
      certManager:
        existingIssuer:
          enabled: true
          kind: Issuer
          group: cert-manager.io
          name: system-controllers-intermediary-ca
        # Pinned under the CertificateRequestPolicy maxDuration (1h).
        duration: 1h
        renewBefore: 30m
  # Certificate patches to satisfy the namespace issuer + approver-policy:
  #   * dnsNames: drop the bare `metrics-server.system-controllers` form
  #     (violates the issuer's critical nameConstraints). The aggregator dials
  #     `<svc>.<ns>.svc`, so that form must stay.
  #   * commonName: removed; the bare `metrics-server` CN is unused.
  #   * usages: drop `client auth`, only the serving cert is used.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: cert-manager.io
              version: v1
              kind: Certificate
              name: metrics-server
            patch: |
              - op: replace
                path: /spec/dnsNames
                value:
                  - metrics-server.system-controllers.svc
                  - metrics-server.system-controllers.svc.cluster.local
              - op: remove
                path: /spec/commonName
              - op: replace
                path: /spec/usages
                value:
                  - server auth
