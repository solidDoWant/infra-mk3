---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: metrics-server-charts
      version: 3.12.2
  values:
    apiService:
      # This must be disabled until the new TLS feature is released in
      # (hopefully) 0.8:
      # https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml#L203
      insecureSkipTLSVerify: true
      # insecureSkipTLSVerify: false
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    tls:
      type: cert-manager
      certManager:
        existingIssuer:
          enabled: true
          kind: Issuer
          name: system-controllers-intermediary-ca
