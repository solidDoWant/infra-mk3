---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: qbittorrent-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/service: qbittorrent
      app.kubernetes.io/instance: qbittorrent
  endpoints:
    - port: metrics
      # qbittorrent_torrent_info carries per-torrent values as labels, creating
      # new series every scrape (~70k/day). Strip them so it only identifies
      # the torrent; the values are exported as qbittorrent_torrent_* gauges.
      metricRelabelConfigs:
        - if: '{__name__="qbittorrent_torrent_info"}'
          action: labeldrop
          regex: (time_active|uploaded|uploaded_session|downloaded|downloaded_session|up_speed|dl_speed|ratio|eta|progress|amount_left|size|seeders|leechers|added_on|completed_on)
      vm_scrape_params:
        # Stale markers are computed from the raw scrape, before relabeling: every
        # changed info line marks the (identical, relabeled) live series stale.
        no_stale_markers: true
