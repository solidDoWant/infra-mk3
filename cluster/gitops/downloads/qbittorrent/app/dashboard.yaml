---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: qbittorrent
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.home.arpa/instance: grafana
  # Fork of upstream v1.13.4 dashboard_high_cardinality.json: the Torrents table
  # reads the per-torrent gauges instead of qbittorrent_torrent_info labels.
  configMapRef:
    key: dashboard.json
    name: qbittorrent-dashboard
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
