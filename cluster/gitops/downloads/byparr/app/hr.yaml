---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: byparr
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byparr
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: byparr
  values:
    controllers:
      byparr:
        defaultContainerOptions:
          securityContext:
            # Root filesystem must be writable: the browser is baked into /cache and the GeoIP mmdb is refreshed there on every launch
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        containers:
          byparr:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: 3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
            ports:
              - name: web
                containerPort: 8191
            probes:
              # /health launches the browser and loads google.com; the first launch also downloads the GeoIP mmdb
              startup:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 20
                  timeoutSeconds: 180
                  periodSeconds: 200
                  failureThreshold: 5
                  httpGet:
                    port: 8191
                    path: /health
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 0
                  timeoutSeconds: 15
                  periodSeconds: 60
                  httpGet:
                    port: 8191
                    path: /health
              liveness: *probe
        pod:
          annotations:
            # Egress via a single gateway so that the external IP address is consistent
            k8s.v1.cni.cncf.io/networks: networking/gateway-network-single-router-client-pods@vpn-gw-veth0
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          dnsConfig:
            options:
              - name: ndots
                value: "1"
    service:
      byparr:
        controller: byparr
        ports:
          web:
            port: 8191
            primary: true
