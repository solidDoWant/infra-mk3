---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nzbhydra2-backup
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/soliddowant/charts/dr-job
  ref:
    tag: 0.0.19
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbhydra2-backup
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: nzbhydra2-backup
  values:
    jobConfig:
      drType: generic
      drAction: backup
      cronjob:
        schedule: "50 1 * * *" # Staggered to avoid concurrent snapshots on the shared zfs-generic-nfs provisioner
      configFile:
        backupName: nzbhydra2-backup
        backupVolume:
          storageClass: zfs-generic-nfs # Backed by storage server
          size: 1Gi
        files:
          # Contains nzbhydra2's database, keys, etc
          - name: config
            pvc: nzbhydra2
            snapshotClass: ssd-replicated-3x-block
            exclude:
              - glob: backup
              - glob: blackhole
              - glob: cache
              - glob: logs
              - glob: lost+found
              - glob: restore
              # Pre-migration DB copies kept for 14 days by the H2 upgrade (9.0.0)
              - glob: database/nzbhydra.mv.db.old.bak.*
