---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-nzbhydra2-application-blueprint
  labels:
    k8s-sidecar.home.arpa/application: authentik
type: Opaque
stringData:
  # Unfortunately this must be a secret (rather than secretGenerator) or Flux will not substitute
  # values within it
  authentik-nzbhydra2-application-blueprint.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: NZBHydra 2 application
      labels:
        blueprints.goauthentik.io/description: Resources for NZBHydra 2 SSO
    entries:
      # Dependencies
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Implicit provider authentication
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Password authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Invalidation flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Blueprint library
          required: true
      # Replaced by the OAuth2 provider below; provider names are unique
      # across provider types, so this must be removed first.
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: NZBHydra 2
      # Hydra only accepts OIDC logins for usernames in its own config, so
      # every user the application admits maps to its single `admin` user
      # (see init-scripts/init-config.sh).
      - model: authentik_providers_oauth2.scopemapping
        id: nzbhydra2-user-scope
        identifiers:
          name: NZBHydra 2 user
        attrs:
          name: NZBHydra 2 user
          scope_name: nzbhydra2
          description: NZBHydra 2 username
          expression: |
            return {"nzbhydra2_user": "admin"}
      # Application
      - model: authentik_providers_oauth2.oauth2provider
        id: nzbhydra2-provider
        identifiers:
          name: NZBHydra 2
        attrs:
          name: NZBHydra 2
          authorization_flow:
            !Find [authentik_flows.flow, [slug, implicit-authorization-flow]]
          client_type: confidential
          # Required: the model default is an empty list, which rejects every
          # login. Hydra keeps its own session and never refreshes tokens.
          grant_types:
            - authorization_code
          client_id: "${SECRET_NZBHYDRA2_AUTHENTIK_OIDC_CLIENT_ID}"
          client_secret: "${SECRET_NZBHYDRA2_AUTHENTIK_OIDC_CLIENT_SECRET}"
          # Spring Security's default `{baseUrl}/login/oauth2/code/{registrationId}`.
          redirect_uris:
            - url: https://nzbhydra2.${SECRET_PUBLIC_DOMAIN_NAME}/login/oauth2/code/nzbhydra2
              matching_mode: strict
          signing_key:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          property_mappings:
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'openid'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'profile'"],
              ]
            - !KeyOf nzbhydra2-user-scope
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
      - model: authentik_core.application
        id: nzbhydra2-application
        identifiers:
          slug: nzbhydra2
        attrs:
          name: NZBHydra 2
          slug: nzbhydra2
          group: Downloads access
          provider: !KeyOf nzbhydra2-provider
          policy_engine_mode: any
          meta_launch_url: https://nzbhydra2.${SECRET_PUBLIC_DOMAIN_NAME}
          # icon: # TODO
      # Groups
      - model: authentik_core.group
        id: nzbhydra2-group
        identifiers:
          name: NZBHydra 2 access
        attrs:
          attributes:
            discord_role_id: "${SECRET_AUTHENTIK_NZBHYDRA2_DISCORD_ROLE_ID}"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf nzbhydra2-group
          target: !KeyOf nzbhydra2-application
