---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbhydra2
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s-charts
      version: 4.6.2
  values:
    controllers:
      nzbhydra2:
        containers:
          nzbhydra2:
            image: &image
              repository: ghcr.io/home-operations/nzbhydra2
              tag: 7.19.2
            env:
              # Overrides the image's -Xmx256M (nzbhydra.yml `xmx` is only read
              # by the upstream wrapper, which the image doesn't use). Heap OOM
              # inside H2 mid-write corrupts the database.
              JAVA_TOOL_OPTIONS: -Xmx768M
              # Console layout for fluent-bit (parse-nzbhydra2-logs): no ANSI
              # colors or padding, full logger name. NZBHydra2 has no JSON
              # console option; its logback config reads this variable, and
              # keeps its API key/password scrubbing on the result. %mdc is
              # `[ID: <search>, Host: <ip>, User: <user>] ` when set.
              CONSOLE_LOG_PATTERN: "%d{yyyy-MM-dd HH:mm:ss.SSS} %level [%thread] %logger : %mdc%replace(%marker: ){'^: ',''}%m%n%wEx{15}"
            ports:
              - name: web
                containerPort: &web_port 5076
            probes:
              readiness:
                enabled: true
              liveness:
                enabled: true
            securityContext: &container_security_context
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          exporter:
            # Reuses the NZBHydra2 image for its busybox, curl and jq. Each
            # connection is served by a fresh run of the script.
            image: *image
            command:
              - nc
              - -lk
              - -p
              - "8080"
              - -e
              - /scripts/metrics.sh
            env:
              NZBHYDRA2_URL: http://localhost:5076
            ports:
              - name: metrics
                containerPort: &metrics_port 8080
            # No readiness probe: it would gate the whole pod, so a broken
            # exporter would pull NZBHydra2 out of its Service.
            probes:
              liveness:
                enabled: true
                type: HTTP
            securityContext: *container_security_context
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: networking/gateway-network-client-pods-forwarded-port-1@vpn-gw-veth0
          labels:
            endpoints.netpols.home.arpa/download-searcher: "true"
            endpoints.netpols.home.arpa/nzbget-client: "true"
            endpoints.netpols.home.arpa/qbittorrent-client: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          dnsConfig:
            options:
              - name: ndots
                value: "1"
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ssd-replicated-3x
        size: 10Gi
        advancedMounts:
          nzbhydra2:
            nzbhydra2:
              - path: /config
            # Read for NZBHydra2's API key
            exporter:
              - path: /config
                readOnly: true
      logs:
        type: emptyDir
        medium: Memory
        sizeLimit: 50Mi
        advancedMounts:
          nzbhydra2:
            nzbhydra2:
              - path: /config/logs
      media-downloads:
        type: nfs
        server: ${NFS_ADDRESS}
        path: ${NFS_MEDIA_PATH}
        advancedMounts:
          nzbhydra2:
            nzbhydra2:
              - path: /config/blackhole/torrents
                subPath: qbittorrent/blackhole
      temp:
        type: emptyDir
        medium: Memory
        sizeLimit: 50Mi
        advancedMounts:
          nzbhydra2:
            nzbhydra2:
              - path: /tmp
      exporter-scripts:
        type: configMap
        name: nzbhydra2-exporter
        defaultMode: 0755
        advancedMounts:
          nzbhydra2:
            exporter:
              - path: /scripts
    service:
      nzbhydra2:
        controller: nzbhydra2
        ports:
          web:
            port: *web_port
            primary: true
          metrics:
            port: *metrics_port
    serviceMonitor:
      nzbhydra2:
        endpoints:
          - port: metrics
            interval: 5m
    route:
      nzbhydra2:
        hostnames:
          - nzbhydra2.${SECRET_PUBLIC_DOMAIN_NAME}
        parentRefs:
          - name: internal-gateway
            namespace: networking
        rules:
          - backendRefs:
              - identifier: nzbhydra2
                port: *web_port
          # Send auth requests to the authentik outpost
          - backendRefs:
              - name: authentik-server
                namespace: security
                port: 80
            matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
