---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: nzbhydra2-init-scripts
    files:
      - init-config.sh=./init-config.sh
    options:
      labels:
        kyverno.home.arpa/reload: "true"
      annotations:
        # Shell variables in the script would collide with Flux's ${...}
        # substitution; substituted values come in via the init container env.
        kustomize.toolkit.fluxcd.io/substitute: disabled
      disableNameSuffixHash: true
