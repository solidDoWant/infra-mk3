---
# Intel GPU for the immich machine-learning pods (OpenVINO inference), via DRA.
#
# Shared (adminAccess) claim on an Arc Pro (A40/A50, 6 GiB VRAM).
#
# Measured footprint: 0 at idle, 0.96 GiB with CLIP + facial recognition loaded,
# 1.24 GiB peak with OCR as well. Models unload after the default 300s
# MACHINE_LEARNING_MODEL_TTL, so the hold is bursty rather than continuous --
# this is a cheap co-tenant and does not need a dedicated card.
#
# adminAccess also means the two replicas no longer consume two of the three
# allocation slots, which previously left no exclusive headroom for anything
# else. Spreading the replicas across nodes is now the job of the pod
# anti-affinity in hr.yaml rather than a side effect of exclusivity.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: immich-machine-learning-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            adminAccess: true
            selectors:
              - cel:
                  expression: device.attributes["gpu.intel.com"].family == 'Arc Pro A-Series'
---
# Intel GPU for the immich microservices worker's video transcoding (ffmpeg
# QSV/VAAPI), via DRA.
#
# adminAccess (shared) — the cluster convention for transcode workloads. Requires
# the namespace label resource.kubernetes.io/admin-access: "true".
#
# Targets Arc Pro. This previously selected the Iris Xe iGPUs on the grounds that
# they were the least-contended GPU type; that hardware no longer exists in the
# cluster, so the claim was unsatisfiable and the pod could not schedule.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: immich-microservices-transcode-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            adminAccess: true
            allocationMode: All
            selectors:
              - cel:
                  expression: device.attributes["gpu.intel.com"].family == 'Arc Pro A-Series'
