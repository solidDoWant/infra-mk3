---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-sync-postgres
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/postgres/cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    clusterName: vault-sync
    certificates:
      client:
        ca:
          subject: &subject
            countries:
              - US
            provinces:
              - ${SECRET_STATE}
            organizations:
              - infra-mk3
      serving:
        issuerRef:
          name: productivity-intermediary-ca
        subject: *subject
    users:
      # Owner role `vault-sync` is created by initdb (owner defaults to the
      # database name). This block only issues the server's client certificate.
      vault-sync:
        username: vault-sync
        # The server re-reads the cert files for every new connection, so a
        # rotation needs no restart.
        disableReloading: true
      # Read-only role for the plaintext export CronJob, so it can't write even
      # if its sessions weren't already read-only.
      vault-sync-export:
        username: vault-sync-export
        disableReloading: true
        role:
          comment: vault-sync plaintext export (read-only)
          inRoles:
            - pg_read_all_data
    bucket:
      endpoint: https://s3.${SECRET_PUBLIC_DOMAIN_NAME}
    netpol:
      applicationAccess:
        selectors:
          - matchLabels:
              app.kubernetes.io/name: vault-sync
              app.kubernetes.io/instance: obsidian-vault-sync
              app.kubernetes.io/controller: main
          - matchLabels:
              app.kubernetes.io/name: vault-sync
              app.kubernetes.io/instance: obsidian-vault-sync
              app.kubernetes.io/controller: export
