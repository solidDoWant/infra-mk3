---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-vault-sync-application-blueprint
  labels:
    k8s-sidecar.home.arpa/application: authentik
type: Opaque
stringData:
  # Must be a Secret (not a secretGenerator) so Flux substitutes the variables.
  authentik-vault-sync-application-blueprint.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: vault-sync application
      labels:
        blueprints.goauthentik.io/description: OIDC provider for the vault-sync Obsidian plugin
    entries:
      # Dependencies
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Explicit provider authentication
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Password authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Invalidation flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Blueprint library
          required: true
      # The device-code entry flow, set on the brand (infra-mk3 brand blueprint)
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: infra-mk3 brand
          required: true
      # The plugin asks only for `openid offline_access`, and authentik applies
      # a scope mapping only when its scope is requested, so the default
      # 'profile' mapping below never fires for the plugin. This mapping is
      # tied to `openid`, which every request includes, so the tokens always
      # carry the profile claims the server reads (`name`, else
      # `preferred_username`). It uses them as the user's name in the history
      # and in the names of conflict copies (vault-sync
      # docs/admin/identity-provider.md).
      - model: authentik_providers_oauth2.scopemapping
        id: vault-sync-profile-scope
        identifiers:
          name: vault-sync profile
        attrs:
          name: vault-sync profile
          scope_name: openid
          description: vault-sync user name (profile claims on every token)
          expression: |
            return {
                "name": request.user.name,
                "preferred_username": request.user.username,
            }
      # Application
      - model: authentik_providers_oauth2.oauth2provider
        id: vault-sync-provider
        identifiers:
          name: vault-sync
        attrs:
          name: vault-sync
          # Explicit consent: the plugin opens a link with the device code
          # pre-filled, so this prompt is the only check that the user meant
          # to sign in a device.
          authorization_flow:
            !Find [authentik_flows.flow, [slug, explicit-authorization-flow]]
          # The plugin can't keep a secret. The client ID isn't secret either:
          # the server advertises it to the plugin.
          client_type: public
          client_id: vault-sync
          # The plugin signs in with the device authorization grant only, and
          # refuses a sign-in without a refresh token (offline_access below).
          grant_types:
            - urn:ietf:params:oauth:grant-type:device_code
            - refresh_token
          # Required by the serializer even though the device grant never
          # redirects. Without it, creating the provider fails validation.
          redirect_uris: []
          signing_key:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          # The plugin refreshes ahead of expiry. The refresh token lifetime is
          # how long a device can stay offline and still be signed in.
          access_token_validity: hours=1
          refresh_token_validity: days=90
          property_mappings:
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'openid'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'profile'"],
              ]
            - !Find [
                authentik_providers_oauth2.scopemapping,
                [name, "authentik default OAuth Mapping: OpenID 'offline_access'"],
              ]
            - !KeyOf vault-sync-profile-scope
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      - model: authentik_core.application
        id: vault-sync-application
        identifiers:
          slug: vault-sync
        attrs:
          name: vault-sync
          slug: vault-sync
          group: Productivity access
          provider: !KeyOf vault-sync-provider
          policy_engine_mode: any
      - model: authentik_core.group
        id: vault-sync-group
        identifiers:
          name: vault-sync access
        attrs:
          attributes:
            discord_role_id: "${SECRET_AUTHENTIK_VAULT_SYNC_DISCORD_ROLE_ID}"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf vault-sync-group
          target: !KeyOf vault-sync-application
