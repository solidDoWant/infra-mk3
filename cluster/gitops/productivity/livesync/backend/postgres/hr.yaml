---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livesync-postgres
spec:
  interval: 5m
  chart:
    spec:
      chart: ./cluster/charts/postgres/cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        namespace: flux-system
        name: infra-mk3
  values:
    clusterName: livesync
    certificates:
      client:
        ca:
          subject: &subject
            countries:
              - US
            provinces:
              - ${SECRET_STATE}
            organizations:
              - infra-mk3
      serving:
        issuerRef:
          name: productivity-intermediary-ca
        subject: *subject
    users:
      # couchgres connects as the database owner: it creates a schema per CouchDB database.
      livesync:
        username: livesync
        # The Envoy sidecar hot-reloads the cert, so no pod restart is needed on rotation.
        disableReloading: true
    storage:
      # Vault contents and attachments (images, PDFs), encrypted, as chunk documents.
      size: 10Gi
    bucket:
      endpoint: https://s3.${SECRET_PUBLIC_DOMAIN_NAME}
    netpol:
      applicationAccess:
        selector:
          matchLabels:
            app.kubernetes.io/name: livesync
            app.kubernetes.io/controller: livesync
            app.kubernetes.io/instance: livesync
