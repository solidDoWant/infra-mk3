---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: livesync-bridge
specs:
  - description: livesync-bridge
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: livesync-bridge
        app.kubernetes.io/controller: livesync-bridge
        app.kubernetes.io/instance: livesync-bridge
    egress:
      # DNS resolution
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # couchgres, through its Envoy sidecar
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: livesync
              app.kubernetes.io/controller: livesync
              app.kubernetes.io/instance: livesync
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
