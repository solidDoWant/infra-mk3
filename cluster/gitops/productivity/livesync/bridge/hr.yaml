---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: livesync-bridge
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livesync-bridge
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: livesync-bridge
  values:
    controllers:
      # Mirrors every vault-* database to plaintext markdown under /vaults/<database>/.
      # One-way: local changes are never sent back.
      livesync-bridge:
        # Single replica: file watching and the sync checkpoints in local storage
        # aren't safe to share.
        strategy: Recreate
        containers:
          livesync-bridge:
            image:
              # Built from "container images/livesync-bridge"; upstream publishes no image.
              repository: ghcr.io/soliddowant/livesync-bridge
              tag: fc0e028-r1@sha256:a15e4d2744269aca30fa7a70428eb2d49f6cdd0a4a7c1270cdb05eb204ada5cd
            env:
              COUCHDB_URL: http://livesync.productivity.svc.cluster.local:8080
              COUCHDB_ADMIN_USER:
                secretKeyRef:
                  name: &secret livesync
                  key: ADMIN_USERNAME
              COUCHDB_ADMIN_PASSWORD:
                secretKeyRef:
                  name: *secret
                  key: ADMIN_PASSWORD
              COUCHDB_USER:
                secretKeyRef:
                  name: *secret
                  key: SYNC_USERNAME
              COUCHDB_PASSWORD:
                secretKeyRef:
                  name: *secret
                  key: SYNC_PASSWORD
              VAULT_PASSPHRASE:
                secretKeyRef:
                  name: *secret
                  key: VAULT_PASSPHRASE
              VAULT_ID_RECOVERY_CODE:
                secretKeyRef:
                  name: *secret
                  key: VAULT_ID_RECOVERY_CODE
              VAULT_PREFIX: vault-
              VAULTS_DIR: /vaults
            probes:
              # Stale heartbeat (wedged event loop) or a peer reporting restartWorthy.
              # A changed vault list makes the process exit on its own.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /app/healthcheck.sh
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 1
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: &memory 512Mi
              limits:
                memory: *memory
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # deno user in the denoland/deno image
        runAsUser: 1993
        runAsGroup: 1993
        fsGroup: 1993
        fsGroupChangePolicy: OnRootMismatch
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    persistence:
      data:
        type: persistentVolumeClaim
        # Fixed name: the backup job references it.
        forceRename: livesync-bridge
        storageClass: ssd-replicated-3x
        accessMode: ReadWriteOnce
        size: 10Gi
        labels:
          tape.home.arpa/archive: "true"
        globalMounts:
          - path: /vaults
            subPath: vaults
          # Sync checkpoints (Deno localStorage). Losing them means a full re-fetch.
          - path: /deno-dir/location_data
            subPath: state
      # Generated bridge config (contains the passphrase) and the heartbeat file.
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
