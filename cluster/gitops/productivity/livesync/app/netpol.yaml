---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: livesync
specs:
  - description: livesync
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: livesync
        app.kubernetes.io/controller: livesync
        app.kubernetes.io/instance: livesync
    egress:
      # DNS resolution (Envoy resolves the postgres service)
      - &dns_resolution
        toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # Backing CNPG cluster. Nothing else: a compromised couchgres can reach only its
      # own database.
      - toEndpoints:
          - matchLabels:
              cnpg.io/cluster: livesync-postgres
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
    ingress:
      # Obsidian devices via the gateways, the bridge, and the config Job
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              app.kubernetes.io/name: ingress-gateways
              gateway.networking.k8s.io/gateway-name: internal-gateway
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              app.kubernetes.io/name: ingress-gateways
              gateway.networking.k8s.io/gateway-name: external-gateway
          - matchLabels:
              app.kubernetes.io/name: livesync-bridge
              app.kubernetes.io/controller: livesync-bridge
              app.kubernetes.io/instance: livesync-bridge
          - matchLabels:
              app.kubernetes.io/name: livesync
              app.kubernetes.io/controller: config
              app.kubernetes.io/instance: livesync
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
      # Kubelet for probes (couchgres' /_up is probed through Envoy's 8080)
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
              - port: "9090"
                protocol: TCP
      # Envoy metrics scraping
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: monitoring
              endpoints.netpols.home.arpa/metrics-scraper: "true"
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
  - description: config
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: livesync
        app.kubernetes.io/controller: config
        app.kubernetes.io/instance: livesync
    egress:
      - *dns_resolution
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: livesync
              app.kubernetes.io/controller: livesync
              app.kubernetes.io/instance: livesync
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
