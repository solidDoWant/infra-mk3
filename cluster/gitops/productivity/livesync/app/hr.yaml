---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: livesync
spec:
  interval: 1h
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/bjw-s-labs/helm-charts/\.github/workflows/chart-release-steps\.yaml@refs/.+$
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livesync
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: livesync
  values:
    controllers:
      # couchgres: a stateless CouchDB-API server backed by Postgres. The Obsidian
      # LiveSync plugin syncs against it directly.
      livesync:
        replicas: 2
        podDisruptionBudget:
          minAvailable: 1
        strategy: RollingUpdate
        initContainers:
          # Native sidecar. See envoy-config/envoy.yaml for what each listener is for.
          envoy:
            restartPolicy: Always
            # contrib image is required for the postgres_proxy filter
            image:
              repository: mirror.gcr.io/envoyproxy/envoy
              tag: contrib-v1.40.0@sha256:366ea8bbbbaded6d95f3a1aafedd12c6def9f0d6eea02f3123b69c41e46e54f5
            args:
              - --config-path
              - /etc/envoy/envoy.yaml
              - --concurrency
              - "2"
            ports:
              - name: http
                containerPort: &http_port 8080
              - name: metrics
                containerPort: &metrics_port 9090
            probes:
              # Holds couchgres back until the postgres listener is up (Envoy only
              # reports LIVE after the initial upstream health check), since couchgres
              # exits if Postgres is unreachable at startup.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *metrics_port
                  periodSeconds: 1
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec: &envoy_ready_probe
                  httpGet:
                    path: /ready
                    port: *metrics_port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec: *envoy_ready_probe
            resources:
              requests:
                cpu: 25m
                memory: &envoy_memory 64Mi
              limits:
                memory: *envoy_memory
        containers:
          couchgres:
            image:
              # Built from "container images/couchgres"; upstream publishes no image.
              repository: ghcr.io/soliddowant/couchgres
              tag: 1.0.0-r1@sha256:0d48a2ff8eb57d8aff4b55cd4cc6270452e8296215bc8117d9033be76a75e2e5
            env:
              - name: ADMIN_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: &secret livesync
                    key: ADMIN_USERNAME
              - name: ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: ADMIN_PASSWORD
              - name: COUCHGRES_ADMIN
                value: $(ADMIN_USERNAME):$(ADMIN_PASSWORD)
              # Loopback only: all traffic comes in through Envoy, which adds CORS.
              - name: COUCHGRES_BIND
                value: 127.0.0.1
              # Envoy terminates mTLS upstream; the client cert is the credential.
              - name: COUCHGRES_PG_URL
                value: postgres://livesync@127.0.0.1:5432/livesync?sslmode=disable
              # The durable _replicator worker can make requests to arbitrary private
              # addresses, and nothing here uses server-side replication.
              - name: COUCHGRES_REPLICATOR_ENABLED
                value: "false"
              # Slow mobile uploads of large attachments outlast the 60s default.
              - name: COUCHGRES_HTTP_READ_TIMEOUT
                value: 5m
            probes:
              # /_up doesn't check Postgres, but couchgres exits when it can't reach it
              # at startup. Probed through Envoy, since couchgres is on loopback.
              readiness: &couchgres_probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_up
                    port: *http_port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              liveness: *couchgres_probe
            resources:
              requests:
                cpu: 50m
                # couchgres admits up to 256MiB of in-flight request bodies.
                memory: &couchgres_memory 512Mi
              limits:
                memory: *couchgres_memory
        pod:
          labels:
            endpoints.netpols.home.arpa/external-ingress-enabled: "true"
        defaultContainerOptions: &default_container_options
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      # Runs config-script/configure.sh on every upgrade. A script-only change
      # needs an HR upgrade (any values change) to rerun it.
      config:
        type: job
        annotations:
          helm.sh/hook: post-install,post-upgrade,post-rollback
          # Jobs are immutable: delete the previous one before recreating it.
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        job:
          backoffLimit: 3
          ttlSecondsAfterFinished: 600
        defaultContainerOptions: *default_container_options
        containers:
          config:
            image:
              repository: quay.io/curl/curl
              tag: 8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
            env:
              COUCHDB_URL: http://livesync.productivity.svc.cluster.local:8080
              ADMIN_USERNAME:
                secretKeyRef:
                  name: *secret
                  key: ADMIN_USERNAME
              ADMIN_PASSWORD:
                secretKeyRef:
                  name: *secret
                  key: ADMIN_PASSWORD
              SYNC_USERNAME:
                secretKeyRef:
                  name: *secret
                  key: SYNC_USERNAME
              SYNC_PASSWORD:
                secretKeyRef:
                  name: *secret
                  key: SYNC_PASSWORD
            command:
              - /bin/sh
              - /etc/livesync/configure.sh
            resources:
              requests:
                cpu: 10m
                memory: &config_memory 32Mi
              limits:
                memory: *config_memory

    defaultPodOptions:
      # VM isolation: couchgres is internet-facing, young, and runs design-document
      # JavaScript (QuickJS) in-process.
      runtimeClassName: kata
      annotations:
        # k8tz's timezone mounts break container creation under kata, and nothing
        # here needs local time.
        k8tz.io/inject: "false"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    persistence:
      config-script:
        type: configMap
        name: livesync-config-script
        defaultMode: 0444
        advancedMounts:
          config:
            config:
              - path: /etc/livesync
      envoy-config:
        type: configMap
        name: livesync-envoy-config
        defaultMode: 0440
        advancedMounts:
          livesync:
            envoy:
              - path: /etc/envoy
      root-ca:
        type: secret
        name: root-ca-pub-cert
        defaultMode: 0444
        items:
          - key: ca.crt
            path: ca.crt
        advancedMounts:
          livesync:
            envoy:
              - path: /etc/envoy/secrets/root-ca
      postgres-cert:
        type: secret
        name: livesync-postgres-livesync-user
        defaultMode: 0440
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
        advancedMounts:
          livesync:
            envoy:
              - path: /etc/envoy/secrets/postgres
    service:
      livesync:
        controller: livesync
        ports:
          http:
            port: *http_port
            primary: true
          metrics:
            port: *metrics_port
    serviceMonitor:
      livesync:
        endpoints:
          # Envoy's request/response stats; couchgres has no Prometheus endpoint.
          - port: metrics
            path: /stats/prometheus
            relabelings:
              - action: replace
                sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
    route:
      livesync:
        labels:
          external-dns.home.arpa/publish: "true"
        hostnames:
          - livesync.${SECRET_PUBLIC_DOMAIN_NAME}
        parentRefs:
          - name: internal-gateway
            namespace: networking
          # Devices sync from outside the home network too.
          - name: external-gateway
            namespace: networking
        rules:
          - backendRefs:
              - identifier: livesync
                port: *http_port
