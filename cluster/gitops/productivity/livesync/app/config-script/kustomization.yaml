---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: livesync-config-script
    files:
      - ./configure.sh
    options:
      annotations:
        # The script's shell variables would collide with Flux's ${...} substitution.
        kustomize.toolkit.fluxcd.io/substitute: disabled
      disableNameSuffixHash: true
