---
# Sidecar in front of couchgres, which listens on loopback only:
# - couchdb_listener (8080): the gateways' backend. Adds the CORS handling couchgres
#   lacks; the Obsidian plugin is a browser-origin client and needs it.
# - postgres_listener (127.0.0.1:5432): mTLS to the CNPG cluster with hot-reloaded certs.
#   pgx reads the client cert once at startup, and certs rotate hourly.
# - observability_listener (9090): /ready and /stats/prometheus only.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

# JSON lines for fluent-bit (promote-envoy-sidecar-message). %j escapes the
# message for JSON.
application_log_config:
  log_format:
    json_format:
      time: "%Y-%m-%dT%T.%e%z"
      level: "%l"
      logger: "%n"
      source: "%g:%#"
      msg: "%j"

node:
  id: envoy-livesync
  cluster: productivity

static_resources:
  clusters:
    - name: couchgres
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: couchgres
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5984
    - name: admin_cluster
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: admin_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9901
    - name: postgres_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: postgres_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: livesync-postgres-rw.productivity.svc.cluster.local
                      port_value: 5432
      health_checks:
        - timeout: 1s
          interval: 3s
          unhealthy_threshold: 2
          healthy_threshold: 1
          tcp_health_check: {}
      dns_lookup_family: V4_ONLY
      transport_socket:
        name: postgres_upstream_tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.starttls.v3.UpstreamStartTlsConfig
          tls_socket_config:
            common_tls_context:
              tls_params:
                tls_minimum_protocol_version: TLSv1_3
                tls_maximum_protocol_version: TLSv1_3
                signature_algorithms:
                  - ed25519
                  - rsa_pss_rsae_sha512
              tls_certificate_sds_secret_configs:
                - name: postgres_client_cert
                  sds_config:
                    resource_api_version: V3
                    path_config_source:
                      path: /etc/envoy/postgres-client-cert-sds.yaml
                      watched_directory:
                        path: /etc/envoy/secrets/postgres
              validation_context_sds_secret_config:
                name: postgres_serving_cert
                sds_config:
                  resource_api_version: V3
                  path_config_source:
                    path: /etc/envoy/postgres-validation-context-sds.yaml
                    watched_directory:
                      path: /etc/envoy/secrets/root-ca
            auto_host_sni: true
            auto_sni_san_validation: true
      close_connections_on_host_health_failure: true
      ignore_health_on_host_removal: true

  listeners:
    - name: couchdb_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: couchdb
                codec_type: AUTO
                # No path normalization: un-obfuscated document IDs are file paths with
                # %2F-escaped slashes, which CouchDB semantics require to pass through as-is.
                # The gateways already append XFF.
                use_remote_address: false
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"
                          duration_ms: "%DURATION%"
                          client_ip: "%REQ(X-FORWARDED-FOR)%"
                          origin: "%REQ(ORIGIN)%"
                          user_agent: "%REQ(USER-AGENT)%"
                route_config:
                  name: couchdb_route
                  virtual_hosts:
                    - name: couchdb
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          # Obsidian desktop, iOS, and Android webview origins, per
                          # obsidian-livesync's couchdb-init.sh.
                          allow_origin_string_match:
                            - exact: app://obsidian.md
                            - exact: capacitor://localhost
                            - exact: http://localhost
                          allow_methods: GET, PUT, POST, HEAD, DELETE
                          allow_headers: accept, authorization, content-type, origin, referer
                          # CouchDB's default exposed headers.
                          expose_headers: content-type, cache-control, accept-ranges, etag, server, x-couch-request-id, x-couch-update-newrev, x-couchdb-body-time
                          allow_credentials: true
                          max_age: "3600"
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: couchgres
                            # _changes feeds (longpoll/continuous) are long-lived.
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: postgres_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 5432
      filter_chains:
        - filters:
            - name: envoy.filters.network.postgres_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.postgres_proxy.v3alpha.PostgresProxy
                stat_prefix: egress_postgres
                enable_sql_parsing: false
                upstream_ssl: REQUIRE
            - name: envoy.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_postgres
                cluster: postgres_cluster
                # pgx manages idle connections, and LISTEN connections sit idle for long
                # stretches by design.
                idle_timeout: 0s

    - name: observability_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9090
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: observability
                codec_type: AUTO
                normalize_path: true
                route_config:
                  name: observability_route
                  virtual_hosts:
                    - name: observability
                      domains: ["*"]
                      routes:
                        - match:
                            path: /ready
                          route:
                            cluster: admin_cluster
                        - match:
                            path: /stats/prometheus
                          route:
                            cluster: admin_cluster
                        # The admin interface's write endpoints stay unreachable.
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found\n"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
