---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: livesync-envoy-config
    files:
      - envoy.yaml
      - postgres-client-cert-sds.yaml
      - postgres-validation-context-sds.yaml
    options:
      labels:
        # Envoy has no config hot-reload; restart the Deployment on changes.
        kyverno.home.arpa/reload: "true"
      disableNameSuffixHash: true
