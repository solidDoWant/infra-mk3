---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openebs
spec:
  interval: 1h
  url: oci://ghcr.io/openebs/charts/openebs
  ref:
    tag: 4.6.2
    digest: sha256:00aef696af02ef2862da07c564a12b0f10c27cf9fc225462991f0dcf76d57d17
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: openebs
  values:
    # Disable openebs-installed volume snapshot CRDs entirely
    openebs-crds: &crds
      csi:
        # Handled via volume-snapshot-crds
        volumeSnapshots:
          enabled: false
    # Disable localpv provisioner entirely
    localpv-provisioner:
      rbac:
        create: false
      localpv:
        enabled: false
      serviceAccount:
        create: false
      hostpathClass:
        enabled: false
    # Disable everything but zfs-localpv
    preUpgradeHook:
      enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    zfs-localpv:
      zfsNode:
        resources: &resources
          requests:
            cpu: 10m
            memory: &memory 128Mi
          limits:
            memory: *memory
        # cspell:words encr
        encrKeysDir: /var/zfs/encryption-keys
        nodeSelector: &node_selector
          zfs.home.arpa/node.local-storage-deployed: "true"
        # Which node labels the node agent publishes as CSI topology keys
        # (rendered as the ALLOWED_TOPOLOGIES env var on the node DaemonSet).
        #
        # The chart default is "All", which publishes EVERY node label. On these
        # nodes that is 401 labels -- 296 of them KubeVirt node-labeller output
        # (cpu-feature.node.kubevirt.io/*, cpu-model*, hyperv, machine-type) and
        # 73 more from NFD. That set then propagates into:
        #
        #   * CSINode.spec.drivers[zfs.csi.openebs.io].topologyKeys (401 entries)
        #   * every CSIStorageCapacity object's nodeTopology.matchLabels, and
        #   * the accessible_topology segment of every GetCapacity gRPC request.
        #
        # The last one is the expensive part. zfs-driver logs every gRPC call
        # unconditionally (pkg/driver/grpc.go logGRPC -> klog.Infof, NOT gated on
        # klog -v, and GetCapacity is not in its skip list), so each capacity
        # poll wrote a ~21 KB log line. external-provisioner polls capacity for
        # 6 storage classes x 3 segments on a 1m interval, which came to
        # 589 MB/day out of 1.40 GB/day of total cluster log ingest -- 42% of
        # everything VictoriaLogs stored, from one log line.
        #
        # Restricting the list is safe here because nothing consumes the extra
        # keys: none of the six zfs.csi.openebs.io StorageClasses sets
        # allowedTopologies, and every existing PV's nodeAffinity is pinned on
        # `openebs.io/nodeid` alone. openebs.io/nodeid and openebs.io/nodename
        # are appended by the driver regardless of this setting (agent.go adds
        # ZFSTopologyKey and ZFSTopoNodenameKey unconditionally), so those keep
        # working. kubernetes.io/hostname is listed so a StorageClass can still
        # constrain by host without needing this value changed first.
        allowedTopologyKeys: kubernetes.io/hostname
        driverRegistrar:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-node-driver-registrar
            tag: v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
      zfsController:
        replicas: 2
        resources: *resources
        nodeSelector: *node_selector
        resizer:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-resizer
            tag: v2.3.0@sha256:48fb3deb93cd848e3c8998b6368f4322c93bb5ce4a90d1307b6dda0dbefb9a0e
          extraArgs:
            - --v=2
        snapshotter:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-snapshotter
            tag: v8.7.0@sha256:b03d3334f8035fa42660b166f6eb819a659a14774da020eb1b6c52cd422eaadb
        provisioner:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-provisioner
            tag: v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
          extraArgs:
            - --v=2
            # Own CSIStorageCapacity objects from the DEPLOYMENT, not the
            # ReplicaSet. The flag counts hops up from the provisioner's own pod
            # (0 = pod, 1 = ReplicaSet, 2 = Deployment) and the chart leaves it
            # at the upstream default of 1, which is actively broken for a
            # Deployment-managed controller:
            #
            # external-provisioner APPENDS its owner when it updates an object
            # it does not already own (pkg/capacity/capacity.go:
            # `if c.owner != nil && !c.isOwnedByUs(capacity) {
            #    capacity.OwnerReferences = append(capacity.OwnerReferences, *c.owner) }`).
            # Every rollout mints a new ReplicaSet, so the new provisioner
            # appends its own ref to objects still owned by the previous one --
            # and the apiserver rejects any object with two `controller: true`
            # refs ("Only one reference can have Controller set to true").
            #
            # The rejection is retried forever with no backoff ceiling and no
            # self-heal. It had been running since the 2026-07-20 rollout, at
            # ~4,400 failures per storage class and climbing, and cost roughly
            # 80k log lines/day across two components:
            #   * csi-provisioner: paired capacity.go "Unhandled Error" +
            #     "Retrying capacity.workItem" (~55k lines/day), and
            #   * kube-apiserver: validate.go "Found duplicate validation error"
            #     kind=CSIStorageCapacity (~24k lines/day).
            # Each retry also re-issued the GetCapacity gRPC call whose logging
            # the zfsNode.allowedTopologyKeys comment above deals with.
            #
            # Level 2 pins ownership to the Deployment, whose UID never changes,
            # so a rollout no longer changes the owner and there is nothing to
            # append. -1 (no owner) would also work but would leak the objects
            # if the driver were ever uninstalled.
            #
            # NOTE: the pre-existing CSIStorageCapacity objects are still owned
            # by a ReplicaSet, and this flag does not rewrite them -- the new
            # provisioner would just append the Deployment ref and hit the same
            # rejection. They have to be deleted ONCE after this rolls out:
            #   kubectl delete csistoragecapacity -n storage --all
            # The provisioner recreates all 18 within a poll interval, owned by
            # the Deployment. They are derived scheduling hints only; no volume
            # or PVC state lives in them.
            - --capacity-ownerref-level=2
      zfsPlugin:
        image:
          # ghcr.io mirrors docker.io/openebs
          registry: ghcr.io
          repository: openebs/zfs-driver
          tag: 2.11.2@sha256:0234692bb4a48b3e70d0bc25f3327ca2b6f1c93d57a066eea755a5c0d94bfb2d
      analytics:
        enabled: false
      # Disable zfs-localpv-installed volume snapshot CRDs entirely
      crds: *crds
  postRenderers:
    # Remove the volume snapshot controller
    # Why TF is this included in every CSI controller pod???
    - kustomize:
        patches:
          - patch: |
              - op: remove
                path: /spec/template/spec/containers/2
            target:
              group: apps
              version: v1
              kind: Deployment
              labelSelector: component = openebs-zfs-controller
