---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: volume-snapshot-controller
spec:
  interval: 1h
  url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  ref:
    tag: 5.4.0
    digest: sha256:b885ec62379a71eca0a6b97373fc342280c7f65885608d522ee908c023f86bae
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name volume-snapshot-controller
  labels:
    patches.flux.home.arpa/helmrelease.skip-crds: "true"
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: volume-snapshot-controller
  values:
    installCRDs: false
    webhook:
      enabled: false
      tls:
        autogenerate: false
    controller:
      image:
        repository: registry.k8s.io/sig-storage/snapshot-controller
        tag: v8.7.0@sha256:8511f417d0072efcd937aedd7cc79a937d5066e64ee17beb6097301c92742f19
      revisionHistoryLimit: 1
      replicaCount: 2
      pdb:
        minAvailable: 1
      serviceMonitor:
        create: true
