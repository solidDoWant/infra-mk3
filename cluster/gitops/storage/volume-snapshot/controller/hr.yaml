---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: volume-snapshot-controller
spec:
  interval: 1h
  url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  ref:
    tag: 5.3.0
    digest: sha256:9026d5c4c86d54ff213b53bb6cb6c854ed5648bb0bf5b32614e4f26651c465d9
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name volume-snapshot-controller
  labels:
    patches.flux.home.arpa/helmrelease.skip-crds: "true"
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: volume-snapshot-controller
  values:
    installCRDs: false
    webhook:
      enabled: false
      tls:
        autogenerate: false
    controller:
      image:
        repository: registry.k8s.io/sig-storage/snapshot-controller
        tag: v8.6.0@sha256:81e79f205083f105e573ba2ebfe5964ede7f69a154e8627f53ebbbccd3ed9f70
      revisionHistoryLimit: 1
      replicaCount: 2
      pdb:
        minAvailable: 1
      serviceMonitor:
        create: true
