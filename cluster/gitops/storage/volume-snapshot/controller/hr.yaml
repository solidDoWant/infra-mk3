---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: volume-snapshot-controller
spec:
  interval: 1h
  url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  ref:
    tag: 5.4.1
    digest: sha256:dae3f46022b42a46a1f6d2489a4ee16d9b55f85e07c36c3d6063bcb0e1b35a69
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name volume-snapshot-controller
  labels:
    patches.flux.home.arpa/helmrelease.skip-crds: "true"
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: volume-snapshot-controller
  values:
    installCRDs: false
    webhook:
      enabled: false
      tls:
        autogenerate: false
    controller:
      image:
        repository: registry.k8s.io/sig-storage/snapshot-controller
        tag: v8.7.1@sha256:d3c3893704c86f0fe428a6429c705b7103a653bea151db0fc5ab0fdb25bb2290
      revisionHistoryLimit: 1
      replicaCount: 2
      pdb:
        minAvailable: 1
      serviceMonitor:
        create: true
