---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: volume-snapshot-controller
spec:
  interval: 1h
  url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  ref:
    tag: 5.3.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name volume-snapshot-controller
  labels:
    patches.flux.home.arpa/helmrelease.skip-crds: "true"
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: volume-snapshot-controller
  values:
    installCRDs: false
    webhook:
      enabled: false
      tls:
        autogenerate: false
    controller:
      revisionHistoryLimit: 1
      replicaCount: 2
      pdb:
        minAvailable: 1
      serviceMonitor:
        create: true
