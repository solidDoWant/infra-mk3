---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: democratic-csi-zfs-generic-nfs
spec:
  interval: 1h
  url: oci://ghcr.io/democratic-csi/charts/democratic-csi
  ref:
    tag: 0.15.1
    digest: sha256:71d37a00f607f6c4f3f5e19e44293ad1582450cf0c47205774c23804fef78040
---
# TODO tunnel via istio so that data is encrypted in transit
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app_name democratic-csi-zfs-generic-nfs
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: democratic-csi-zfs-generic-nfs
  # Not using Teleport for this until https://github.com/democratic-csi/democratic-csi/issues/454
  # is addressed
  valuesFrom:
    - kind: Secret
      name: zfs-generic-nfs-authentication
      valuesKey: SSH_PRIVATE_KEY
      targetPath: driver.config.sshConnection.privateKey
  values:
    driver:
      config:
        driver: zfs-generic-nfs
        sshConnection:
          # Options documented here: https://www.npmjs.com/package/ssh2#client-methods
          host: &host 10.2.3.1 # ubuntu-storage-host-01
          port: 22
          username: democratic-csi
        zfs:
          cli:
            sudoEnabled: true
          datasetProperties:
            # TODO user properties
          snapshotProperties:
            # TODO user properties
          datasetParentName: bulk-pool-01/k8s/democratic-csi/nfs/pvcs
          detachedSnapshotsDatasetParentName: bulk-pool-01/k8s/democratic-csi/nfs/detached-snapshots
          datasetEnableQuotas: true
          datasetEnableReservation: true
          datasetPermissionsMode: "0770"
          datasetPermissionsUser: democratic-csi
          datasetPermissionsGroup: democratic-csi
        nfs:
          shareStrategy: setDatasetProperties
          shareStrategySetDatasetProperties:
            properties:
              # TODO enable TLS for kernel socks via tlshd (xprtsec=mtls)
              # This will require expanding PKI out of cluster
              # Limit mounts of this dataset to the k8s cluster host network only
              sharenfs: sec=sys,rw=@10.3.0.0/16,crossmnt,no_subtree_check,no_root_squash
          shareHost: *host
    csiDriver:
      name: nfs.zfs.democratic-csi.local
    controller:
      replicaCount: 2
      priorityClassName: system-cluster-critical
      externalHealthMonitorController:
        extraArgs:
          - --enable-node-watcher=true
      # Chart default `--v=5` is almost entirely leader-election lease renewals
      # (~2s, forever) plus per-resync PVC chatter: ~96k lines/24h across
      # attacher/provisioner/resizer. Real events (create/delete/attach/resize,
      # leadership changes, errors) are V<=2 and still ship. `2` matches the
      # openebs zfs-localpv sidecars and the usual kubernetes-csi default.
      externalAttacher:
        image:
          registry: registry.k8s.io/sig-storage/csi-attacher
          tag: v4.13.0@sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
        verbosityLevel: 2
      externalProvisioner:
        image:
          registry: registry.k8s.io/sig-storage/csi-provisioner
          tag: v3.6.4@sha256:e7ad666f1d9b0caa077c7f0c157c9f87d1e73858390732496f66dcc716ff10c5
        verbosityLevel: 2
      externalResizer:
        image:
          registry: registry.k8s.io/sig-storage/csi-resizer
          tag: v1.14.0@sha256:5e7cbb63fd497fa913caa21fee1a69f727c220c6fa83c5f8bb0995e2ad73a474
        verbosityLevel: 2
      externalSnapshotter:
        image:
          registry: registry.k8s.io/sig-storage/csi-snapshotter
          tag: v8.6.0@sha256:42af0929bcd60a43499825c078a60ff0534e08af8fbeb283aa391be40feb9f3e
        verbosityLevel: 2
      driver:
        image: &image
          registry: ghcr.io/democratic-csi/democratic-csi
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: v1.9.5
    node:
      priorityClassName: system-cluster-critical
      driver:
        image: *image
      driverRegistrar:
        image:
          registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
          tag: v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
      cleanup:
        image:
          registry: public.ecr.aws/docker/library/busybox
          tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    csiProxy:
      image:
        registry: ghcr.io/democratic-csi/csi-grpc-proxy
        tag: v0.5.7@sha256:0240d0fba3cedd598036766b1865e88aa2eac9c16822df03d5d912a81128ebb6
    storageClasses:
      - name: zfs-generic-nfs
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - timeo=100 # Start request timeout at 10s instead of the default of 60
          - rsize=1048576 # 1MB read size (max)
          - wsize=1048576 # 1MB write size (max)
          - nfsvers=4.2
            # If client ports are randomly chosen, then this should roughly balance the traffic between both legs in the LAG
          - nconnect=8
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:
    volumeSnapshotClasses:
      - name: zfs-generic-nfs-snapshot
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "false"
