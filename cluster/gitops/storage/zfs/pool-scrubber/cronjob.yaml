---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: &app_name zfs-pool-scrubber-labeler
spec:
  schedule: "@weekly"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: *app_name
              image: mirror.gcr.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              command:
                - /scripts/label-zpool-nodes.sh
              volumeMounts:
                - name: scripts
                  readOnly: true
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: zfs-pool-scrubber-scripts
                defaultMode: 0500
          serviceAccountName: zfs-pool-scrubber
          restartPolicy: OnFailure
