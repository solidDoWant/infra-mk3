---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: &app_name zfs-pool-scrubber-labeler
spec:
  schedule: "@weekly"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: *app_name
              image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              command:
                - /scripts/label-zpool-nodes.sh
              volumeMounts:
                - name: scripts
                  readOnly: true
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: zfs-pool-scrubber-scripts
                defaultMode: 0500
          serviceAccountName: zfs-pool-scrubber
          restartPolicy: OnFailure
