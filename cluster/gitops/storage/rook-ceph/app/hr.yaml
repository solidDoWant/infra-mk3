---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 1h
  url: oci://ghcr.io/rook/rook-ceph
  ref:
    tag: 1.21.0
    digest: sha256:0b5b8ec32bec6816fc27cdc4c6649dd224cd7012e195511b1432ed0962b26d7f
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/rook/rook/\.github/workflows/push-build\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    image:
      repository: ghcr.io/rook/ceph
      tag: v1.21.0@sha256:2c3a65786d3cc85ba15d7f258461c0bf392c6a6ee19dde8011259b8d34eeedd0
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 256Mi
    # nodeSelector:
    #   root-ceph.flux.home.arpa/node.cluster-enabled: "true"
    currentNamespaceOnly: true
    pspEnable: false
    priorityClassName: system-cluster-critical
    obcAllowAdditionalConfigFields: maxObjects,maxSize,bucketMaxObjects,bucketMaxSize,bucketPolicy,bucketLifecycle,bucketOwner
    csi:
      # The chart renders this setting but never defines it, so it reaches the
      # operator as an empty string. Rook only creates the CephConnection and
      # ClientProfile CRs when it is "true".
      createCsiOperatorResources: true
    monitoring:
      enabled: true
    ceph-csi-operator:
      controllerManager:
        manager:
          image:
            repository: quay.io/cephcsi/ceph-csi-operator
            tag: v1.1.0@sha256:c42c95c36fa257266571ff7542c3e350bb93b152f8865538c8929eb2e2dbe7c6
