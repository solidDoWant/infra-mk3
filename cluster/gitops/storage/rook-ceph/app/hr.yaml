---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 1h
  url: oci://ghcr.io/rook/rook-ceph
  ref:
    tag: 1.21.3
    digest: sha256:ffc5eb1170123bcf9deea103b183cc1de49e0f11516e6e5aebfb356ee600b014
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/rook/rook/\.github/workflows/push-build\.yaml@refs/.+$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    image:
      repository: ghcr.io/rook/ceph
      tag: v1.21.3@sha256:3956e9b95a3c1803e5ae5db12d28b61f937faba753fcc50c3d068e08a1f0ecbe
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 256Mi
    # nodeSelector:
    #   root-ceph.flux.home.arpa/node.cluster-enabled: "true"
    currentNamespaceOnly: true
    pspEnable: false
    priorityClassName: system-cluster-critical
    obcAllowAdditionalConfigFields: maxObjects,maxSize,bucketMaxObjects,bucketMaxSize,bucketPolicy,bucketLifecycle,bucketOwner
    csi:
      # The chart renders this setting but never defines it, so it reaches the
      # operator as an empty string. Rook only creates the CephConnection and
      # ClientProfile CRs when it is "true".
      createCsiOperatorResources: true
    monitoring:
      enabled: true
    ceph-csi-operator:
      controllerManager:
        manager:
          image:
            repository: quay.io/cephcsi/ceph-csi-operator
            tag: v1.1.0@sha256:c42c95c36fa257266571ff7542c3e350bb93b152f8865538c8929eb2e2dbe7c6
