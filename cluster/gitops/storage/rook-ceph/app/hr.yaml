---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 5m
  chart:
    spec:
      chart: rook-ceph
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: rook-ceph-charts
      version: v1.21.0
  values:
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 256Mi
    # nodeSelector:
    #   root-ceph.flux.home.arpa/node.cluster-enabled: "true"
    currentNamespaceOnly: true
    pspEnable: false
    priorityClassName: system-cluster-critical
    obcAllowAdditionalConfigFields: maxObjects,maxSize,bucketMaxObjects,bucketMaxSize,bucketPolicy,bucketLifecycle,bucketOwner
    csi:
      # The chart renders this setting but never defines it, so it reaches the
      # operator as an empty string. Rook only creates the CephConnection and
      # ClientProfile CRs when it is "true".
      createCsiOperatorResources: true
    monitoring:
      enabled: true
