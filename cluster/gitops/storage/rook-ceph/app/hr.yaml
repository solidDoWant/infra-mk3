---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 1h
  url: oci://ghcr.io/rook/rook-ceph
  ref:
    tag: 1.21.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 256Mi
    # nodeSelector:
    #   root-ceph.flux.home.arpa/node.cluster-enabled: "true"
    currentNamespaceOnly: true
    pspEnable: false
    priorityClassName: system-cluster-critical
    obcAllowAdditionalConfigFields: maxObjects,maxSize,bucketMaxObjects,bucketMaxSize,bucketPolicy,bucketLifecycle,bucketOwner
    csi:
      # The chart renders this setting but never defines it, so it reaches the
      # operator as an empty string. Rook only creates the CephConnection and
      # ClientProfile CRs when it is "true".
      createCsiOperatorResources: true
    monitoring:
      enabled: true
