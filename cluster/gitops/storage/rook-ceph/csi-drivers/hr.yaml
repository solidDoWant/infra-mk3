---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  # Stop-gap mirror, pruned 6 months after upstream publishes an OCI chart.
  # Switch to the official chart once https://github.com/ceph/ceph-csi-operator/issues/488 lands.
  url: oci://ghcr.io/home-operations/charts-mirror/ceph-csi-drivers
  ref:
    tag: 1.1.0
    digest: sha256:8c9ddb89e991889a41876b4eac85908a04dbe007b3766843bdac5db59ccab2a2
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/.+$
---
# Rook >= 1.20 no longer deploys the CSI drivers. This chart owns the
# OperatorConfig/Driver CRs (adopted from Rook, which pre-labelled them for a
# release named exactly `ceph-csi-drivers`) plus the plugin RBAC.
# The chart version MUST match the ceph-csi-operator subchart bundled by the
# rook-ceph chart (its Chart.yaml dependencies) -- minors add CRD fields.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 5m
  releaseName: ceph-csi-drivers
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  values:
    # Defaults the operator fills into any Driver field left unset
    operatorConfig:
      namespace: storage
      driverSpecDefaults:
        imageSet: &image_set
          name: ceph-csi-image-set
        clusterName: rook-ceph-cluster
        # TODO figure out whether I should encrypt volumes (tradeoffs)
        # encryption:
        #   configMapRef:
        #     name: ...
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
    # Right-sized 2026-08-01 from 14d of metrics: p95 <2m CPU, peak working
    # sets 38-123Mi. Memory request == limit throughout (incompressible: a
    # request below the limit lets the node fill to 100% of requests while pods
    # grow into their limits, and the OOM killer's victim is not necessarily
    # the overcommitter). Values are ~2x the observed peak.
    drivers:
      rbd:
        # Must match the StorageClass/VolumeSnapshotClass provisioner names
        name: storage.rbd.csi.ceph.com
        # Replaces a stale Driver-level ref Rook wrote before the chart took over
        imageSet: *image_set
        grpcTimeout: 150
        # `none` (the chart default) drops the csi-snapshotter sidecar
        snapshotPolicy: volumeSnapshot
        # Rotation writes logs to a hostPath file instead of stdout
        log: &log
          rotation:
            enabled: false
        nodePlugin:
          resources:
            registrar: &resources_64mi
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 64Mi
            plugin:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 256Mi
        controllerPlugin: &controller_plugin
          replicas: 2
          # The pods have a required per-host anti-affinity, so a surge pod
          # can't schedule while a node is out. Replace one at a time instead.
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          resources:
            provisioner: &resources_96mi
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            resizer: *resources_96mi
            attacher: *resources_96mi
            snapshotter: *resources_96mi
            plugin: &resources_128mi
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            omapGenerator: *resources_128mi
      cephfs:
        name: storage.cephfs.csi.ceph.com
        imageSet: *image_set
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log: *log
        nodePlugin:
          resources:
            registrar: *resources_64mi
            plugin: &resources_192mi
              requests:
                cpu: 10m
                memory: 192Mi
              limits:
                memory: 192Mi
        controllerPlugin:
          <<: *controller_plugin
          resources:
            provisioner: *resources_96mi
            resizer: *resources_96mi
            attacher: *resources_96mi
            snapshotter: *resources_96mi
            plugin: *resources_192mi
      nfs:
        enabled: false
      nvmeof:
        enabled: false
