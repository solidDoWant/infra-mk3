---
# Dashboard serving cert (dashboard.sslCertificateRef). The gateway
# re-encrypts to it (BackendTLSPolicy in httproute.yaml) so the dashboard sees
# HTTPS, which its SAML handler needs to build the right URLs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rook-ceph-dashboard
spec:
  dnsNames:
    - rook-ceph-mgr-dashboard.storage.svc
    - rook-ceph-mgr-dashboard.storage.svc.cluster.local
  subject:
    countries:
      - US
    provinces:
      - ${SECRET_STATE}
    organizations:
      - infra-mk3
  usages:
    - server auth
  privateKey:
    algorithm: RSA # The chart documents sslCertificateRef as RSA-only
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: storage-intermediary-ca
  secretName: rook-ceph-dashboard-tls
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: storage-intermediary-ca-rook-ceph-dashboard
spec:
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: storage-intermediary-ca
    namespace:
      matchNames:
        - storage
  allowed:
    dnsNames:
      required: true
      values:
        - rook-ceph-mgr-dashboard.storage.svc
        - rook-ceph-mgr-dashboard.storage.svc.cluster.local
    subject:
      countries:
        required: true
        values:
          - US
      provinces:
        required: true
        values:
          - ${SECRET_STATE}
      organizations:
        required: true
        values:
          - infra-mk3
    usages:
      - server auth
