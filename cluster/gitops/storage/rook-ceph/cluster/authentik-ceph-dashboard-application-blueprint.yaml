      # Application
      - model: authentik_providers_saml.samlprovider
        id: ceph-dashboard-provider
        identifiers:
          name: Ceph dashboard
        attrs:
          name: Ceph dashboard
          authorization_flow:
            !Find [authentik_flows.flow, [slug, implicit-authorization-flow]]
          authentication_flow:
            !Find [authentik_flows.flow, [slug, password-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          # Ceph builds these from the base URL passed to `sso setup saml2`
          acs_url: https://rook.${SECRET_PUBLIC_DOMAIN_NAME}/auth/saml2
          audience: https://rook.${SECRET_PUBLIC_DOMAIN_NAME}/auth/saml2/metadata
          sp_binding: post
          signing_kp:
            !Find [
              authentik_crypto.certificatekeypair,
              [name, authentik Self-signed Certificate],
            ]
          sign_assertion: true
          sign_response: true
          verification_kp: !KeyOf ceph-dashboard-sp-cert
          encryption_kp: !KeyOf ceph-dashboard-sp-cert
          property_mappings:
            - !Find [
                authentik_providers_saml.samlpropertymapping,
                [managed, goauthentik.io/providers/saml/username],
              ]
            - !Find [
                authentik_providers_saml.samlpropertymapping,
                [managed, goauthentik.io/providers/saml/email],
              ]
          name_id_mapping:
            !Find [
              authentik_providers_saml.samlpropertymapping,
              [managed, goauthentik.io/providers/saml/username],
            ]
      - model: authentik_core.application
        id: ceph-dashboard-application
        identifiers:
          slug: ceph-dashboard
        attrs:
          name: Ceph dashboard
          slug: ceph-dashboard
          group: Infra access
          provider: !KeyOf ceph-dashboard-provider
          policy_engine_mode: any
          meta_launch_url: https://rook.${SECRET_PUBLIC_DOMAIN_NAME}
      # Groups
      - model: authentik_core.group
        id: ceph-admins-group
        identifiers:
          name: Ceph admins
        attrs:
          attributes:
            discord_role_id: "${SECRET_AUTHENTIK_CEPH_ADMINS_DISCORD_ROLE_ID}"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          group: !KeyOf ceph-admins-group
          target: !KeyOf ceph-dashboard-application
