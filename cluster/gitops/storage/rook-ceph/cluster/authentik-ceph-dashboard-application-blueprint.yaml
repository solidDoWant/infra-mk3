---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-ceph-dashboard-application-blueprint
  labels:
    k8s-sidecar.home.arpa/application: authentik
type: Opaque
stringData:
  # Must be a Secret (not secretGenerator) so Flux substitution applies inside.
  authentik-ceph-dashboard-application-blueprint.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Ceph dashboard application
      labels:
        blueprints.goauthentik.io/description: Resources for Ceph dashboard SSO
    entries:
      # Dependencies
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Implicit provider authentication
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Password authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Invalidation flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Blueprint library
          required: true
      # The dashboard's SAML SP cert (public half of dashboard-saml-sp.sops.yaml).
      # Authentik verifies the signed AuthnRequests with it and encrypts
      # assertions to it. Ceph only requires signed responses once it has an SP
      # keypair, so this is what keeps unsigned (forged) logins out.
      - model: authentik_crypto.certificatekeypair
        id: ceph-dashboard-sp-cert
        identifiers:
          name: Ceph dashboard SAML SP
        attrs:
          name: Ceph dashboard SAML SP
          certificate_data: |
