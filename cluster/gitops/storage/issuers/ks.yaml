---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: flux-system
  name: &app_name storage-namespace-issuer
spec:
  targetNamespace: &namespace storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app_name
  interval: 5m
  path: /cluster/gitops/storage/issuers/namespace
  postBuild:
    substitute:
      NAMESPACE: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-mk3
  wait: true
  dependsOn:
    - name: cluster-issuers
