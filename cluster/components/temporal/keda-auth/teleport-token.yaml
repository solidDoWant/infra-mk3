---
apiVersion: resources.teleport.dev/v2
kind: TeleportProvisionToken
metadata:
  name: ${NAMESPACE}-temporal-keda-auth
spec:
  roles:
    - Bot
  bot_name: ${NAMESPACE}-temporal-keda-auth
  join_method: kubernetes
  kubernetes:
    type: in_cluster
    allow:
      - service_account: ${NAMESPACE}:${NAMESPACE}-temporal-keda-auth
