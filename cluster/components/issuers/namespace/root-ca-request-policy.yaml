---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policy.cert-manager.io/certificaterequestpolicy_v1alpha1.json
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: root-ca-issuer-${NAMESPACE}-intermediary-ca
spec:
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: root-ca
    namespace:
      matchNames:
        - ${NAMESPACE}
  allowed:
    isCA: true
    commonName:
      required: true
      value: infra-mk3 ${NAMESPACE} Intermediary Certificate Authority
    dnsNames:
      required: true
      values:
        - ${NAMESPACE}.svc
        - ${NAMESPACE}.svc.cluster.local
    subject:
      countries:
        required: true
        values:
          - US
      provinces:
        required: true
        values:
          - ${SECRET_STATE}
      organizations:
        required: true
        values:
          - infra-mk3
      organizationalUnits:
        required: true
        values:
          - ${NAMESPACE}
    usages:
      - cert sign
      - crl sign
