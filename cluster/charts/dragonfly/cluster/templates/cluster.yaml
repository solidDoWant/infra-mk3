---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: {{ include "cluster-resource-name" . }}
spec:
  # Pinned so operator bumps don't change the server version
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  replicas: {{ .Values.instances }}
  args:
    - --proactor_threads={{ .Values.proactorThreads }}
    - --version_check=false
    {{- with .Values.args }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  authentication:
    clientCaCertSecret:
      key: ca.crt
      name: {{ include "auth.ca-secret-name" . }}
  tlsSecretRef:
    name: {{ include "serving-cert-name" . }}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      labelSelector:
        matchLabels: {{ include "pod-selector-labels" . | nindent 10 }}
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
  resources: {{ .Values.resources | toYaml | nindent 4 }}
