---
apiVersion: v1
kind: LimitRange
metadata:
  name: builds
  namespace: {{ include "ci-project.namespace" . }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.defaultResources.cpu }}
        memory: {{ .Values.defaultResources.memory }}
      default:
        memory: {{ .Values.defaultResources.memory }}
