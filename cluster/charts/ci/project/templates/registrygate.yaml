{{- $rg := .Values.docker.registrygate }}
{{- if $rg.intercept }}
{{- $ns := include "ci-project.namespace" . }}
{{- $admin := .Release.Namespace }}
{{- $secrets := list }}
{{- $harborHost := required "docker.registrygate.harborHost is required with intercept: set it in the project's HelmRelease to harbor.${SECRET_PUBLIC_DOMAIN_NAME}" $rg.harborHost }}
{{- range $rg.mirrors }}
{{- $cache := printf "%s-%s-cache" $.Values.name .upstream }}
---
# The project's own pull-through cache of {{ .upstream }} in Harbor, so its
# cached images count against its own quota and retention. Public content
# only: the HarborRegistry has no upstream credential.
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborProject
metadata:
  name: {{ $cache }}
  namespace: {{ $ns }}
spec:
  connectionRef:
    namespace: {{ $.Values.harbor.connection.namespace }}
    name: {{ $.Values.harbor.connection.name }}
  public: false
  storageQuota: {{ $rg.mirrorCache.storageQuota }}
  proxyCache:
    registryRef:
      namespace: {{ $.Values.harbor.connection.namespace }}
      name: {{ .harborRegistry }}
---
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborRetentionPolicy
metadata:
  name: {{ $cache }}
  namespace: {{ $ns }}
spec:
  projectRef:
    name: {{ $cache }}
  schedule: {{ $rg.mirrorCache.retention.schedule | quote }}
  rules:
    - template: nDaysSinceLastPull
      count: {{ $rg.mirrorCache.retention.keepPulledWithinDays }}
      repositories:
        decoration: repoMatches
        pattern: "**"
      tags:
        decoration: matches
        pattern: "**"
---
# registrygate's credential for the cache (pull only, public content).
apiVersion: harbor.soliddowant.dev/v1alpha1
kind: HarborProjectRobot
metadata:
  name: {{ .upstream }}-cache
  namespace: {{ $ns }}
spec:
  projectRef:
    name: {{ $cache }}
  description: registrygate pulls through the {{ $.Values.name }} {{ .upstream }} cache
  permissions:
    - resource: repository
      action: pull
  secret:
    dockerConfigJSON:
      enabled: false
    opaque:
      enabled: true
---
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: RegistryMirror
metadata:
  name: {{ .upstream }}
  namespace: {{ $ns }}
spec:
  upstreamRef:
    namespace: {{ $admin }}
    name: {{ .upstream }}
  url: {{ $rg.harborURL }}
  pathPrefix: {{ $cache }}
  secretRef:
    name: {{ .upstream }}-cache-credentials
  # Harbor names itself in token realms and Locations by the host it was
  # reached by (its Service, with https) or by its externalURL; both are sent
  # to url.
  aliasHosts:
    - {{ $harborHost }}
    - {{ (urlParse $rg.harborURL).host }}
  fallbackToUpstream: true
{{- $secrets = append $secrets (printf "%s-cache-credentials" .upstream) }}
{{- end }}
{{- if .Values.harbor.enabled }}
{{- $project := .Values.harbor.projectName | default .Values.name }}
---
# Pushes to (and pulls from) the project's Harbor project, with the project's
# push robot (harbor.yaml).
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: UpstreamCredential
metadata:
  name: harbor
  namespace: {{ $ns }}
spec:
  upstreamRef:
    namespace: {{ $admin }}
    name: harbor
  secretRef:
    name: {{ .Values.harbor.pushCredentialsSecretName }}
  ceiling:
    - repositories:
        - {{ $project }}
        - {{ $project }}/**
      actions:
        - pull
        - push
{{- $secrets = append $secrets .Values.harbor.pushCredentialsSecretName }}
{{- end }}
---
# registrygate reads only these Secrets in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registrygate-credentials
  namespace: {{ $ns }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range $secrets }}
      - {{ . }}
      {{- end }}
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registrygate-credentials
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registrygate-credentials
subjects:
  - kind: ServiceAccount
    namespace: {{ $rg.serviceAccount.namespace }}
    name: {{ $rg.serviceAccount.name }}
{{- range $policy := list (dict "name" "builds" "account" "ci-build" "actions" (list "pull")) (dict "name" "releases" "account" "ci-release" "actions" (list "pull" "push")) }}
---
{{- if eq $policy.name "builds" }}
# What the project's builds (the ci-build ServiceAccount) get from registrygate:
# public pulls through the caches, and pulls of the project's own images. No
# pushes: those are the releases policy's, below.
{{- else }}
# What the project's publishing runs (the ci-release ServiceAccount, allowed
# only for push events on release.refs by the ci-release-runs admission
# policy) get: the same, plus pushes.
{{- end }}
apiVersion: registrygate.soliddowant.dev/v1alpha1
kind: RegistryAccessPolicy
metadata:
  name: {{ $policy.name }}
  namespace: {{ $ns }}
spec:
  serviceAccounts:
    - {{ $policy.account }}
  rules:
    {{- range $rg.mirrors }}
    # Pulls of public {{ .upstream }} images, through the project's cache
    - name: {{ .upstream }}-mirror
      mirrorRef:
        name: {{ .upstream }}
      repositories:
        - "**"
      actions:
        - pull
    {{- end }}
    {{- if $rg.ghcrPush.enabled }}
    # The project's own ghcr.io repositories, with the account's PAT
    # (ci/ghcr-push)
    - name: ghcr-push
      credentialRef:
        namespace: {{ $admin }}
        name: ghcr-push
      repositories:
        {{- range ($rg.ghcrPush.repositories | default (list (printf "soliddowant/%s" (lower $.Values.name)) (printf "soliddowant/%s/**" (lower $.Values.name)))) }}
        - {{ . | quote }}
        {{- end }}
      actions:
        {{- range $policy.actions }}
        - {{ . }}
        {{- end }}
    {{- end }}
    {{- if $.Values.harbor.enabled }}
    {{- $project := $.Values.harbor.projectName | default $.Values.name }}
    # The project's own Harbor project
    - name: harbor-project
      credentialRef:
        name: harbor
      repositories:
        - {{ $project }}
        - {{ $project }}/**
      actions:
        {{- range $policy.actions }}
        - {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
