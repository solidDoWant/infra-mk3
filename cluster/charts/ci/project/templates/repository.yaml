---
# Pipelines run from the .tekton/ directory of the event's commit. Which pull
# requests, pushes and comment commands get here at all is limited by the
# external gateway's WAF (networking/gateways/ingress/base/coraza-waf.yaml).
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "ci-project.namespace" . }}
spec:
  url: https://github.com/solidDoWant/{{ .Values.name }}
  concurrency_limit: {{ .Values.concurrencyLimit }}
  {{- with .Values.docker.registrygate.harborHost }}
  # Values pipelines can't hold in the (public) repository, as
  # Pipelines-as-Code parameters: "{{`{{ harbor_host }}`}}" in a PipelineRun.
  params:
    - name: harbor_host
      value: {{ . }}
  {{- end }}
