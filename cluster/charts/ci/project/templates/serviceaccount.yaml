---
# The ServiceAccount builds run as (TektonConfig default-service-account, in
# ci/tekton/app/tektonconfig.yaml). It has no API access; registrygate's
# RegistryAccessPolicy names it, and the docker Task projects a token for
# registrygate itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build
  namespace: {{ include "ci-project.namespace" . }}
automountServiceAccountToken: false
