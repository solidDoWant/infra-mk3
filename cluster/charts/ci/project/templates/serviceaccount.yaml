---
# The ServiceAccount builds run as (TektonConfig default-service-account, in
# ci/tekton/app/tektonconfig.yaml). It has no API access; registrygate's
# RegistryAccessPolicy names it, and the docker Task projects a token for
# registrygate itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build
  namespace: {{ include "ci-project.namespace" . }}
automountServiceAccountToken: false
---
# The ServiceAccount publishing runs (releases, image pushes from the default
# branch) run as. Only it gets registrygate's push rules
# (registrygate.yaml), and the ci-release-runs admission policy
# (ci/tekton/app/release-run-policy.yaml) lets a PipelineRun use it only for a
# push whose ref matches release.refs. A pipeline picks it with
# `taskRunTemplate.serviceAccountName: ci-release`. No API access either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-release
  namespace: {{ include "ci-project.namespace" . }}
automountServiceAccountToken: false
---
# The ServiceAccount the pipelines' reporting tasks run as: the test guard's
# label read and the report task's `stage:` check runs. Neither runs code from
# the repository. Its githubgate policy (githubgate.yaml) gives it check runs
# and read access to PR labels, which replaces PaC's per-run git token. No
# API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-report
  namespace: {{ include "ci-project.namespace" . }}
automountServiceAccountToken: false
