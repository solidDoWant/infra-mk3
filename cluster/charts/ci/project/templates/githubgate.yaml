{{- if .Values.githubgate.enabled }}
{{- $repository := .Values.githubgate.repository | default .Values.name }}
{{- range $serviceAccount, $access := .Values.githubgate.serviceAccounts }}
{{- if $access }}
{{- $token := and $access.token $access.token.enabled }}
{{- $proxy := and $access.proxy $access.proxy.enabled }}
{{- if not (or $token $proxy) }}
{{- fail (printf "githubgate.serviceAccounts.%s needs token.enabled or proxy.enabled" $serviceAccount) }}
{{- end }}
---
# GitHub access for the {{ $serviceAccount }} ServiceAccount (values.yaml,
# githubgate.serviceAccounts).
apiVersion: githubgate.soliddowant.dev/v1alpha1
kind: GitHubAccessPolicy
metadata:
  name: {{ $serviceAccount }}
  namespace: {{ include "ci-project.namespace" $ }}
spec:
  serviceAccounts:
    - {{ $serviceAccount }}
  rules:
    {{- if $token }}
    - name: token
      installationRef:
        {{- toYaml $.Values.githubgate.installation | nindent 8 }}
      repositories:
        - {{ $repository | quote }}
      permissions:
        {{- toYaml $access.permissions | nindent 8 }}
      token:
        enabled: true
    {{- end }}
    {{- if $proxy }}
    - name: proxy
      installationRef:
        {{- toYaml $.Values.githubgate.installation | nindent 8 }}
      repositories:
        - {{ $repository | quote }}
      permissions:
        {{- toYaml $access.permissions | nindent 8 }}
      proxy:
        {{- toYaml $access.proxy | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
