---
# Lets the Tekton Dashboard (ci-tekton/ci-dashboard) read this namespace's
# runs, pods and logs. Its access to anything else is only CRD reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-dashboard
  namespace: {{ include "ci-project.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-dashboard-view
subjects:
  - kind: ServiceAccount
    name: ci-dashboard
    namespace: ci-tekton
