---
# Uninstalling the release deletes the namespace with everything in it: the
# repository's runs and any secrets put there (which come back from git).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ci-project.namespace" . }}
  labels:
    # Build pods may be privileged (e.g. the docker Task's dockerd sidecar)
    # because they always run in a kata VM: privilege stops at the VM. The
    # ci-build-pods admission policy (ci/tekton/app/build-pod-policy.yaml)
    # enforces kata and blocks what would reach the host from inside it (host
    # namespaces, hostPath volumes, host ports).
    pod-security.kubernetes.io/enforce: privileged
    # Selects project namespaces for the build pod admission policy and the
    # docker cache policy and promoter.
    ci.home.arpa/project: "true"
    {{- if .Values.docker.registrygate.intercept }}
    # docker Task builds go through registrygate for the registries it stands
    # in for (ci/registrygate/config/kyverno.yaml).
    registrygate.home.arpa/client: "true"
    {{- if .Values.docker.registrygate.ghcrPush.enabled }}
    # Admits the namespace to the ci/ghcr-push UpstreamCredential.
    registrygate.home.arpa/ghcr-push: "true"
    {{- end }}
    {{- end }}
    {{- if .Values.githubgate.enabled }}
    # Admits the namespace to githubgate's GitHubInstallation, and its pods to
    # githubgate's token API and proxy (ci/githubgate).
    githubgate.home.arpa/client: "true"
    # githubgate's injection webhook adds its interceptor to every pod here:
    # requests to github.com, api.github.com and uploads.github.com go through
    # githubgate's proxy, decided by the pod's ServiceAccount's proxy rules
    # (githubgate.yaml). Pipelines need no GitHub setup. The webhook fails
    # closed: while githubgate is down, no pod here can be created.
    githubgate.soliddowant.dev/inject: "true"
    {{- end }}
    {{- if or .Values.harbor.enabled (and .Values.docker.registrygate.intercept .Values.docker.registrygate.mirrors) }}
    # Admits this namespace to the harbor-operator connection
    # (development/harbor/operator/config/connection.yaml), for the project's
    # Harbor project or its registrygate mirror caches.
    harbor.soliddowant.dev/ci-project: "true"
    {{- end }}
  annotations:
    # k8tz's timezone mounts break kata pods.
    k8tz.io/inject: "false"
    ci.home.arpa/default-branch: {{ .Values.defaultBranch | quote }}
    {{- if .Values.harbor.enabled }}
    # Read by the ci-release-pods admission policy: the Secrets holding push
    # credentials (harbor.yaml), which only ci-release pods may mount.
    ci.home.arpa/release-secrets: {{ printf "%s,%s" .Values.harbor.pushSecretName .Values.harbor.pushCredentialsSecretName | quote }}
    {{- end }}
    # Read by the ci-release-runs admission policy: the refs runs may publish
    # from as ci-release.
    ci.home.arpa/release-refs: {{ .Values.release.refs | quote }}
    # Read by the ci-docker-cache-golden Kyverno policy.
    ci.home.arpa/docker-cache-size: {{ .Values.docker.cacheVolumeSize | quote }}
