---
# Every build pod in the namespace. Steps run code from the repository (and
# from pull requests), so egress is limited to the internet (by default) and
# what its builds need in the cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: builds
  namespace: {{ include "ci-project.namespace" . }}
specs:
  - description: builds
    endpointSelector: {}
    egress:
      # DNS resolution
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              endpoints.netpols.home.arpa/cluster-dns: "true"
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      {{- if .Values.egress.harbor }}
      # Harbor, via the internal gateway
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: networking
              app.kubernetes.io/name: ingress-gateways
              gateway.networking.k8s.io/gateway-name: internal-gateway
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      {{- end }}
      {{- if .Values.egress.internet }}
      # The internet, for dependencies. The home network is excluded by the
      # egressDeny below.
      - toEntities:
          - world
      {{- end }}
      # GitHub: cloning, and the GitHub API
      - toFQDNs:
          - matchName: github.com
          - matchName: api.github.com
          - matchName: codeload.github.com
          - matchPattern: "**.githubusercontent.com"
          {{- with .Values.egress.fqdns }}
          # Project-specific hosts
          {{- toYaml . | nindent 10 }}
          {{- end }}
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
    {{- if .Values.egress.internet }}
    # Keeps the home network out of reach of the `world` allow above. Deny
    # rules win over allows, so this also overrides any other policy.
    egressDeny:
      - toCIDRSet:
          - cidrGroupRef: intranet
          # The ONT's management address, outside 10.0.0.0/8
          - cidrGroupRef: xgs-pon
    {{- end }}
    # Nothing connects to builds.
    ingress:
      - {}
