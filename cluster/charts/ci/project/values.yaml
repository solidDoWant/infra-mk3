---
# Repository name. Only repositories under github.com/solidDoWant can be
# onboarded, so a typo can't point CI at someone else's repository. Builds run
# in the ci-<name> namespace.
name: ""
# How many of this repository's PipelineRuns may run at once. The rest queue.
concurrencyLimit: 2
# The repository's default branch. Successful push builds on it refresh the
# golden Docker cache (ci/tekton/docker/promoter).
defaultBranch: master
# The shared docker Task (ci/tekton/docker).
docker:
  # Size of each build's local Docker cache volume (the golden cache clone),
  # 60% of which Docker keeps for the build cache. Raising it applies to the
  # next build. Lowering it applies once the golden cache has been replaced by
  # a build at the new size (a clone can't be smaller than its snapshot).
  cacheVolumeSize: 20Gi
  registrygate:
    # Send builds' pulls (and pushes) of the registries registrygate stands
    # in for (ghcr.io, Harbor, ...) through the proxy, authenticated with the
    # build's ci-build ServiceAccount token (ci/registrygate). Turns on the
    # caches, mirrors and Harbor push credential below. On by default; turn it
    # off for a project whose builds need Harbor's own API (/api/v2.0), which
    # the proxy doesn't serve.
    intercept: true
    # Harbor's host name as builds use it. Required with intercept; set it in
    # the project's HelmRelease: harbor.${SECRET_PUBLIC_DOMAIN_NAME}.
    harborHost: ""
    # Harbor core's Service, which registrygate reaches Harbor through.
    harborURL: http://harbor-core.development.svc.cluster.local
    # registrygate's ServiceAccount, which may read the robot Secrets it uses
    # in the project namespace (and nothing else there).
    serviceAccount:
      namespace: ci
      name: registrygate
    # A Harbor proxy-cache project per upstream for this project's pulls,
    # each its own quota: upstream is the UpstreamRegistry (in ci),
    # harborRegistry the HarborRegistry (development/harbor/operator/config).
    # These are Harbor projects of their own, separate from (and not needing)
    # the harbor section below. An empty list makes none.
    mirrors:
      - upstream: ghcr
        harborRegistry: ghcr
      - upstream: quay
        harborRegistry: quay
      - upstream: mirror-gcr
        harborRegistry: mirror-gcr
      - upstream: dockerhub
        harborRegistry: dockerhub
      - upstream: ecr-public
        harborRegistry: ecr-public
    # Pushes to ghcr.io through registrygate, with the account's PAT behind
    # the ci/ghcr-push UpstreamCredential (ci/registrygate/config), so builds
    # never hold it. Needs intercept.
    ghcrPush:
      enabled: false
      # Repositories (globs, under the account) the builds may push and pull
      # with it. Empty means the project's own: soliddowant/<name> and
      # soliddowant/<name>/**. Pulls of these skip the ghcr.io mirror cache,
      # which can't hold private images.
      repositories: []
    # The mirror caches' Harbor projects (each mirror gets this quota).
    mirrorCache:
      storageQuota: 20Gi
      retention:
        # Drop cached images not pulled for this many days. Harbor cron
        # (with seconds).
        keepPulledWithinDays: 30
        schedule: "0 0 3 * * *"
# Publishing runs: only the ci-release ServiceAccount may push through
# registrygate (images to ghcr.io with ghcrPush, and to the project's Harbor
# project), and the ci-release-runs admission policy
# (ci/tekton/app/release-run-policy.yaml) lets a PipelineRun run as it only for
# a push event whose ref matches refs. The ref is what Pipelines-as-Code records
# on the PipelineRun, which a repository's .tekton/ can't override: the branch
# name for a branch push ("master"), "refs/tags/<tag>" for a tag. Pull requests,
# comment re-runs (/retest) and other branches never qualify.
# GitHub access through githubgate (ci/githubgate), by ServiceAccount: a step
# mounts a projected token with audience githubgate and asks githubgate's token
# API for a short-lived installation token. No GitHub credential is stored in
# the namespace.
githubgate:
  enabled: true
  # The GitHubInstallation (ci/githubgate/config/app.yaml) whose ceiling caps
  # these policies.
  installation:
    namespace: ci
    name: soliddowant
  # The repository the policies cover. Empty means the release name (`name`).
  repository: ""
  # PR and default-branch builds (ci-build): read the repository.
  build:
    permissions:
      contents: read
  # Publishing runs (ci-release, only on release.refs; see serviceaccount.yaml):
  # also create tags and GitHub releases.
  release:
    permissions:
      contents: write
  # The pipelines' own reporting tasks (ci-report: the test guard's label read
  # and the report task's `stage:` check runs). They run no repository code.
  report:
    permissions:
      checks: write
      pull_requests: read
      issues: read
release:
  # A regular expression (RE2, as CEL's matches()). The default is version tags.
  refs: '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
# Defaults for build containers that set no resources of their own (Tekton
# applies these to every step). The memory request equals the limit.
defaultResources:
  cpu: 100m
  memory: 1Gi
# Caps on what the repository's builds can use at once.
quota:
  pods: 10
  memory: 16Gi
egress:
  # Any IPv4 address outside the private ranges, on any port, for pulling in
  # dependencies. Cluster pods and services are only reachable as allowed
  # below.
  internet: true
  # Harbor, via the internal gateway
  harbor: true
  # With internet disabled: extra hosts builds may reach on 443, as
  # CiliumNetworkPolicy toFQDNs selectors (matchName or matchPattern). GitHub
  # is always allowed.
  fqdns: []
# A Harbor project for the repository's images, and a robot account that CI
# pushes with (harbor-operator).
harbor:
  enabled: true
  # The HarborConnection to use (namespace/name).
  connection:
    namespace: development
    name: harbor
  # Harbor project name. Defaults to the repository name.
  projectName: ""
  public: false
  storageQuota: 20Gi
  vulnerability:
    preventVulnerableImages: true
    severity: high
    scanOnPush: true
  # Namespaces outside ci-<name> that may create robots for the project, such
  # as one for a workload that pulls its images.
  allowedNamespaces: []
  # Secret in ci-<name> holding the robot's credentials as a
  # kubernetes.io/dockerconfigjson for the registry host. Pipelines mount it
  # to push.
  pushSecretName: harbor-push
  # The same robot's credentials as a Secret with username and password keys,
  # which registrygate pushes and pulls with. Only made when
  # docker.registrygate.intercept is on.
  pushCredentialsSecretName: harbor-push-credentials
  # Keep the 10 most recently pushed tags of each repository, and anything
  # pulled in the last 30 days. Harbor cron (with seconds).
  retention:
    keepLatestPushed: 10
    keepPulledWithinDays: 30
    schedule: "0 0 3 * * *"
