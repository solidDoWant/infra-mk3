---
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: {{ include "ca-secret-generator-policy-name" . }}
spec:
  rules:
    # Trigger on change of any of these resources
    - name: {{ include "ca-secret-generator-policy-name" . }}
      match:
        any:
          - resources:
              kinds:
                - Secret
              name: {{ include "ca-cert-name" . }}
      skipBackgroundRequests: true
      context:
        - name: postgresAuthCa
          apiCall:
            method: GET
            urlPath: /api/v1/namespaces/{{ .Release.Namespace }}/secrets/{{ include "ca-cert-name" . }}
            jmesPath: data."ca.crt" | base64_decode(@)
        # Unless optional, an unavailable entry fails the rule, so the
        # generated secret keeps its last good bundle.
        - name: {{ ternary "teleportAuthCaGlobal" "teleportAuthCa" .Values.teleportCa.optional }}
          globalReference:
            name: {{ .Values.teleportCa.globalContextEntry }}.pem
        {{- if .Values.teleportCa.optional }}
        # Avoids a circular dependency for databases Teleport itself needs,
        # which must come up before the CA endpoint exists.
        - name: teleportAuthCa
          variable:
            jmesPath: teleportAuthCaGlobal
            default: ""
        {{- end }}
      # Create a new "secret" with only the CA certificates
      generate:
        generateExisting: true
        synchronize: true
        # Rule specs are immutable, so changing the context means deleting and
        # recreating this policy. Keep the CA bundle in place when that happens.
        orphanDownstreamOnPolicyDelete: true
        apiVersion: v1
        kind: Secret
        name: {{ include "ca-secret-name" . }}
        namespace: {{ .Release.Namespace }}
        data:
          metadata: {{ include "cnpg-labels" . | nindent 12 }}
          type: Opaque
          stringData:
            ca.crt: |-
              {{ printf "{{ postgresAuthCa }}{{ teleportAuthCa }}" }}
