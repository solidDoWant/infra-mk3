---
- name: Configure PDU
  hosts: power:&mpr3141
  gather_facts: false

  tasks:
    - name: Run setup commands
      vars:
        command: "{{ item }}"
      ansible.builtin.include_role:
        name: run-command
      loop:
        - network hostname {{ hostname }}
        - time zone {{ local_timezone_id }}
        - system name {{ hostname }}

    # Percent of rated input current, as high_critical:high_warn[:low_critical]
    # (low must be "0", not "00").
    # The 45:40 defaults sit at the rack's normal ~6.2 A of a 16 A rating and
    # flap PDUStatusDegraded. Alarm-only: swocp (outlet cut-off) is disabled.
    - name: Set input current thresholds
      vars:
        command: "{{ item }}"
      ansible.builtin.include_role:
        name: run-command
      loop:
        - current threshold 1 L1 90:80:0
        - current threshold 1 N 90:80

    - name: Configure SNMPv3 read-only user
      vars:
        command: "{{ item }}"
      ansible.builtin.include_role:
        name: run-command
        apply:
          no_log: true
      no_log: true
      loop:
        - snmp v3 access username 1 {{ snmp_v3_username }}
        - snmp v3 access authtype 1 SHA
        - snmp v3 access authsecret 1 {{ snmp_v3_auth_secret }}
        - snmp v3 access privacy 1 AES
        - snmp v3 access privacysecret 1 {{ snmp_v3_privacy_secret }}
        - snmp v3 access type 1 ReadOnly
        # Blank source denies all requests with authorizationError
        - snmp v3 access source 1 0.0.0.0
        - snmp v3 access userenable 1 enable
        - snmp v3 enable
        # v1/v2 communities grant write access (outlet control) from any address
        - snmp v1v2 disable

    - name: Restart the RPC2 card to apply settings
      vars:
        command: reboot
        # Confirmation prompt, only shown on a TTY. Restarts the RPC2 card, not the outlets.
        input: "Y"
      ansible.builtin.include_role:
        name: run-command
        # The card restarts but never closes the SSH session
        apply:
          timeout: 60
          ignore_errors: true
