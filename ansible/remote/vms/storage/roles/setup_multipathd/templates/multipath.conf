blacklist {
    wwid .*
}

blacklist_exceptions {
{% for wwn in drive_wwns %}
    wwid "3{{ wwn }}"
{% endfor %}
}

defaults {
    polling_interval        2
    find_multipaths         yes
    path_selector           "service-time 0"
    path_grouping_policy    multibus
    uid_attribute           ID_SERIAL
    failback                immediate
    # Every device this config manages is a bulk-pool-01 vdev (the blacklist
    # above admits only `drive_wwns`), so the pool's raidz2 redundancy -- not
    # dm-multipath -- is what rides out a dead drive. `queue` would defeat
    # that: with no path left it queues I/O forever instead of returning EIO,
    # so ZFS never sees an error, never faults the vdev, and blocks in
    # zio_wait indefinitely. On 2026-09-05 one drive (mpathb) lost both SAS
    # ports at once and that hung every nfsd thread on the host for ~7h --
    # a total NFS outage from a failure raidz2 was built to absorb. Recovery
    # needed `multipathd disablequeueing map mpathb` by hand.
    # A bounded retry keeps transient both-path flaps (expander reset,
    # firmware reload) from reaching ZFS as spurious errors, while capping the
    # stall: 12 * polling_interval 2s = ~24s, well inside the 30s SCSI command
    # timeout and far short of the 300s zfs_deadman_ziotime_ms. After that the
    # I/O errors out, ZFS faults the disk, and the pool degrades and keeps
    # serving.
    no_path_retry           12
    user_friendly_names     yes
}
