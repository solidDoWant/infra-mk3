---
# cspell:words anongid anonuid keyformat keylocation sharenfs
- name: Check if the dataset already exists
  ansible.builtin.command: zfs list {{ pool_name }}/{{ dataset_name }}
  ignore_errors: true
  changed_when: false
  register: zfs_list

- name: Create the dataset
  ansible.builtin.shell: >-
    echo "dummy passphrase, not used" | zfs create
    {{ pool_name }}/{{ dataset_name }}
    {%- if share_with_nfs %}
    -o sharenfs='all_squash,anonuid={{ nfs_user_id }},anongid={{ nfs_group_id }},{{ nfs_subnets | map("regex_replace", "^(.*)$", "rw=@\1") | join(",") }}'
    {%- endif %}
    {%- if encrypt %}
    -o encryption=aes-256-gcm -o keylocation=prompt -o keyformat=passphrase
    {%- endif %}
    {%- for key, value in properties.items() %}
    -o {{ key }}={{ value | quote }}
    {%- endfor %}
  when: zfs_list.rc != 0

# Set locally on this dataset only (children inherit, but consumers such as
# tape-archiver's zfsProperty source match local values only). Changing
# recordsize on an existing dataset only affects newly written blocks.
- name: Read current properties
  ansible.builtin.command: >-
    zfs get -H -s local -o property,value
    {{ properties.keys() | join(',') }}
    {{ pool_name }}/{{ dataset_name }}
  changed_when: false
  register: zfs_properties
  when: properties | length > 0

- name: Set properties
  vars:
    current: "{{ dict(zfs_properties.stdout_lines | map('split', '\t')) }}"
  ansible.builtin.command: zfs set {{ item.key }}={{ item.value | quote }} {{ pool_name }}/{{ dataset_name }}
  loop: "{{ properties | dict2items }}"
  when: current[item.key] | default(none) != item.value
