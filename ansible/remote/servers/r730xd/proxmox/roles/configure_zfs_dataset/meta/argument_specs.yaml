---
argument_specs:
  main:
    options:
      pool_name:
        type: str
        required: true
      dataset_name:
        type: str
        required: true
      share_with_nfs:
        type: bool
        default: false
      nfs_subnets:
        type: list
        elements: str
        default:
          - 10.0.0.0/8
      nfs_user_id:
        type: int
        required: true
      nfs_group_id:
        type: int
        required: true
      encrypt:
        type: bool
        default: false
      properties:
        type: dict
        default: {}
        description: >-
          ZFS properties, native (e.g. `recordsize`, `sync`) or user
          (`namespace:name`), to set locally on the dataset. Values must be in
          the form `zfs get` prints (e.g. `4M`, not `4194304`).
