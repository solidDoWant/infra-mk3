---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

vars:
  TALOS_BOOTSTRAP_NODE_IP: 10.3.1.1
env:
  TALOSCONFIG: "{{ .ROOT_DIR }}/talos/talosconfig"
  TOPFCONFIG: "{{ .ROOT_DIR }}/talos/topf.yaml"

tasks:
  download-iso:
    silent: true
    desc: Downloads each node's boot ISO from the image factory
    vars:
      OUTPUT_DIR:
        ref: default .USER_WORKING_DIR .OUTPUT_DIR
    dir: "{{ .ROOT_DIR }}/talos"
    cmd: |
      TALOS_VERSION="$(yq -r '.talosVersion' topf.yaml)"

      yq -r '.nodes[] | .host + " " + .ip' topf.yaml |
      while read -r NODE_HOST NODE_IP; do
        FILE_PATH={{ shellQuote .OUTPUT_DIR }}/"${NODE_HOST}.iso"
        [ -f "${FILE_PATH}" ] && continue

        SCHEMATIC_ID="$(
          NODE_HOST="${NODE_HOST}" NODE_IP="${NODE_IP}" \
            yq eval-all \
              '. as $d ireduce ({}; . * $d) | ... comments="" | (.. | select(tag == "!!str")) |= envsubst(nu,ne)' \
              schematic.yaml iso-schematic.yaml |
          curl -fsSL -X POST --data-binary @- https://factory.talos.dev/schematics |
          jq -r .id
        )"

        echo "Downloading ${NODE_HOST}.iso (schematic ${SCHEMATIC_ID})..."
        curl -fsSL -o "${FILE_PATH}" \
          "https://factory.talos.dev/image/${SCHEMATIC_ID}/${TALOS_VERSION}/metal-amd64-secureboot.iso" &
      done

      wait
      echo "Completed"

  diff-config:
    silent: true
    desc: Shows the config changes `apply-config` would make (exit code 2 = changes)
    dir: "{{ .ROOT_DIR }}/talos"
    cmd: topf apply --dry-run {{ .CLI_ARGS }}

  apply-config:
    silent: true
    desc: Applies topf.yaml and patch changes to all nodes, one at a time
    dir: "{{ .ROOT_DIR }}/talos"
    cmd: topf apply {{ .CLI_ARGS }}

  generate-talosconfig:
    silent: true
    desc: Regenerates the talosctl client config from the secrets bundle
    dir: "{{ .ROOT_DIR }}/talos"
    cmd: topf talosconfig > talosconfig

  download-kubeconfig:
    silent: true
    cmd: talosctl kubeconfig -n {{ shellQuote .TALOS_BOOTSTRAP_NODE_IP }} -f

  apply-helmfile:
    silent: true
    dir: "{{ .ROOT_DIR }}/cluster/bootstrap"
    cmd: helmfile apply --file helmfile.yaml --skip-diff-on-install --suppress-diff

  bootstrap:
    silent: true
    dir: "{{ .ROOT_DIR }}/talos"
    cmds:
      - task: generate-talosconfig
      - topf apply --auto-bootstrap
      - task: download-kubeconfig
      - task: apply-helmfile
      - echo "Bootstrap complete"
